# ============================================================================
# satu-kata — MIRRORED pipeline on GitLab CI (second devops/CI, free).
# LIMITED USE: GitLab Free has only ~400 minutes/month, so it does NOT run on every
# push. It only runs when you set a weekly "Pipeline schedule" in the GitLab UI
# (Build → Pipeline schedules) and acts as a BACKUP to the GitHub Actions cron.
# It does NOT change the manifest on GitHub (source of truth = GitHub).
#
# SET UP in GitLab: Settings → CI/CD → Variables
#   CLOUDFLARE_API_TOKEN (masked)  CLOUDFLARE_ACCOUNT_ID
# Deploy to a SEPARATE Pages project (…-mirror) so it does not clash with GitHub.
# ============================================================================
stages: [generate, deploy]

satu-kata-mirror:
  stage: generate
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'   # weekly schedule only
  before_script:
    - apk add --no-cache git
  script:
    - node scripts/satu-kata/generate.mjs            # auto-pick word (read-only, no push)
    - ls -R generated/public | head -40
  artifacts:
    paths: [generated/]
    expire_in: 1 week

deploy-pages-mirror:
  stage: deploy
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual                                # deploy mirror only when needed (save minutes)
    - when: never
  needs: [satu-kata-mirror]
  script:
    - npx --yes wrangler@latest pages project create tukuk-satu-kata-mirror --production-branch main || true
    - npx --yes wrangler@latest pages deploy generated/public --project-name tukuk-satu-kata-mirror --branch main
  environment:
    name: satu-kata-mirror
