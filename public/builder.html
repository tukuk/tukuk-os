<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tukuk Studio — Pembina Aplikasi (No-Code) — Tukuk-OS</title>
<meta name="description" content="Bina aplikasi/web kecil tanpa kod: seret widget, pratonton langsung pada bingkai telefon, lalu eksport satu fail HTML berdiri sendiri. 100% dalam pelayar, tanpa pendaftaran.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tukuk-OS">
<meta property="og:title" content="Tukuk Studio — Pembina Aplikasi No-Code">
<meta property="og:description" content="Reka aplikasi kecil secara visual dan eksport HTML siap guna. Percuma & privasi 100%.">
<link rel="canonical" href="https://tukuk.org/builder">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  :root { --bg:#090c15; --panel:rgba(18,24,38,.72); --line:rgba(255,255,255,.1); --acc:#4c8dff; --fg:#eaf0ff; --muted:#8b99b5; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at 50% 0,#151d33,#090c15 70%); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header .logo { font-weight:800; letter-spacing:.3px; }
  header input.name { background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--fg); padding:7px 10px; border-radius:9px; min-width:160px; }
  .sp { flex:1; }
  button, .btn { cursor:pointer; border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--fg); padding:8px 12px; border-radius:10px; font:inherit; }
  button:hover { background:rgba(255,255,255,.12); }
  button.primary { background:var(--acc); border-color:transparent; color:#04101f; font-weight:700; }
  button.ghost.active { outline:2px solid var(--acc); }
  .grid3 { display:grid; grid-template-columns:220px 1fr 300px; flex:1; min-height:0; }
  .col { overflow:auto; padding:12px; }
  .col.left { border-right:1px solid var(--line); background:rgba(255,255,255,.02); }
  .col.right { border-left:1px solid var(--line); background:rgba(255,255,255,.02); }
  h4 { margin:6px 0 10px; font-size:12px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); }
  .palette { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pal { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border-radius:10px; font-size:12px; background:rgba(255,255,255,.05); border:1px solid var(--line); }
  .pal .ic { font-size:20px; }
  .stage { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .devs { display:flex; gap:6px; }
  .frame { width:390px; max-width:96%; background:#fff; border-radius:28px; padding:14px; color:#111; box-shadow:0 20px 60px rgba(0,0,0,.5); transition:width .2s; min-height:60vh; overflow:auto; }
  .frame.tablet { width:700px; } .frame.desktop { width:960px; border-radius:14px; }
  .frame .appbar { font-weight:800; font-size:18px; margin-bottom:4px; }
  .frame .sub { color:#666; font-size:13px; margin-bottom:14px; }
  .w { position:relative; border:1.5px dashed transparent; border-radius:10px; margin:6px 0; padding:2px; }
  body.edit .w:hover { border-color:#b9c7ff; }
  body.edit .w.sel { border-color:#4c8dff; background:rgba(76,141,255,.06); }
  .w .tag { display:none; position:absolute; top:-9px; right:6px; font-size:10px; background:#4c8dff; color:#04101f; padding:1px 7px; border-radius:8px; font-weight:700; }
  body.edit .w.sel .tag { display:inline-block; }
  body.edit .w [data-interactive] { pointer-events:none; }
  .empty { color:#999; text-align:center; padding:40px 10px; border:2px dashed #ccc; border-radius:14px; }
  /* props */
  .fld { margin-bottom:10px; }
  .fld label { display:block; font-size:11px; color:var(--muted); margin-bottom:3px; }
  .fld input, .fld select, .fld textarea { width:100%; background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:7px 8px; font:inherit; }
  .fld textarea { min-height:64px; resize:vertical; }
  .row2 { display:flex; gap:8px; } .row2 > * { flex:1; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button.on { background:var(--acc); color:#04101f; }
  .insp-actions { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#0b0f1a; border:1px solid var(--acc); padding:10px 16px; border-radius:12px; opacity:0; transition:.25s; pointer-events:none; z-index:20; }
  .toast.show { opacity:1; }
  .hint { font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5; }
  .swatch { width:34px; height:34px; padding:0; border:1px solid var(--line); border-radius:8px; }
  .movedis { display:flex; gap:4px; }
  @media (max-width:900px){ .grid3{grid-template-columns:1fr; height:auto;} body{height:auto;} .col.left,.col.right{border:none;} }
  /* ── Paparan KOD (editor + pratonton langsung, tanpa AI) ── */
  body.code .col.left, body.code .col.right { display:none; }
  body.code .grid3 { grid-template-columns:1fr; }
  body.code .devs, body.code #frame, body.code #modeBtn { display:none; }
  #codeView { display:none; flex-direction:column; gap:10px; align-self:stretch; width:100%; flex:1; min-height:0; }
  body.code #codeView { display:flex; }
  .codebar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .codebar label { font-size:12px; color:var(--muted); display:flex; gap:4px; align-items:center; }
  .codetabs { display:flex; gap:4px; margin-right:6px; }
  .codetabs button { padding:6px 14px; font-weight:700; }
  .codetabs button.on { background:var(--acc); color:#04101f; }
  .codesplit { display:flex; gap:10px; flex:1; min-height:0; }
  .edWrap { position:relative; flex:1; min-width:0; background:#0b0f1a; border:1px solid var(--line); border-radius:12px; display:flex; overflow:hidden; }
  .gutter { width:40px; flex:none; padding:12px 8px 12px 0; text-align:right; color:#4a5570; background:rgba(255,255,255,.03); font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; white-space:pre; overflow:hidden; user-select:none; }
  .edWrap pre, .edWrap textarea { margin:0; border:0; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; white-space:pre; tab-size:2; }
  .edWrap pre { position:relative; flex:1; padding:12px; overflow:auto; color:#cdd6ea; background:transparent; pointer-events:none; }
  .edWrap textarea { position:absolute; top:0; left:40px; right:0; bottom:0; padding:12px; overflow:auto; background:transparent; color:transparent; caret-color:#fff; resize:none; outline:none; white-space:pre; }
  #edPre .c { color:#5f6b85; font-style:italic; } #edPre .s { color:#9ce6a0; } #edPre .t { color:#7cc4ff; } #edPre .k { color:#ff9ecd; }
  #edPreview { flex:1; min-width:0; border:1px solid var(--line); border-radius:12px; background:#fff; width:100%; height:100%; }
  @media (max-width:1000px){ .codesplit{ flex-direction:column; } }
  /* ── Kemudahan: selit, sunting terus, modals, penunjuk simpan, amaran ── */
  .insrow { display:flex; justify-content:center; height:0; overflow:visible; }
  .insrow select { opacity:0; height:20px; font-size:11px; font-weight:700; padding:0 12px; border-radius:999px; border:1px solid rgba(76,141,255,.45); background:rgba(76,141,255,.12); color:var(--acc); cursor:pointer; transition:opacity .15s; width:auto; }
  .frame:hover .insrow select { opacity:.5; }
  .insrow select:hover { opacity:1 !important; }
  body.edit .w [data-edit] { outline:1px dashed rgba(76,141,255,.5); outline-offset:2px; border-radius:4px; cursor:text; }
  body.edit .w [data-edit]:focus { outline:2px solid var(--acc); }
  .w .wb { display:none; position:absolute; top:-8px; left:6px; font-size:11px; background:#ffcf5c; color:#3a2b00; border-radius:8px; padding:0 6px; font-weight:800; font-style:normal; cursor:help; }
  body.edit .w.warn .wb { display:inline-block; }
  .saveState { font-size:11px; color:var(--muted); align-self:center; min-width:74px; text-align:right; }
  .modal { position:fixed; inset:0; background:rgba(4,8,18,.6); display:none; align-items:center; justify-content:center; z-index:30; }
  .modal.show { display:flex; }
  .mcard { background:#0e1424; border:1px solid var(--line); border-radius:16px; width:min(520px,92vw); max-height:80vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .mh { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); font-weight:800; }
  .mx { padding:2px 10px; }
  .mb { padding:14px 16px; font-size:13px; line-height:1.6; }
  .mb .kb { display:inline-block; min-width:34px; text-align:center; background:rgba(255,255,255,.08); border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:1px 7px; font-family:ui-monospace,monospace; font-size:12px; }
  .mb .ai { padding:8px 10px; border:1px solid var(--line); border-radius:10px; margin-bottom:6px; cursor:pointer; }
  .mb .ai:hover { background:rgba(255,255,255,.06); }
  .mb .ar { display:flex; justify-content:space-between; gap:12px; padding:4px 0; border-bottom:1px dashed var(--line); }
  .socialcard { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; color:#111; }
  .socialcard .sc-img { background:linear-gradient(135deg,var(--acc),#7cc4ff); color:#fff; padding:20px; font-weight:800; font-size:14px; }
  .socialcard .sc-body { padding:10px 12px; }
  .socialcard .sc-dom { font-size:11px; color:#888; text-transform:uppercase; }
  .socialcard .sc-t { font-weight:700; font-size:14px; margin:2px 0; }
  .socialcard .sc-d { font-size:12px; color:#555; }
</style>
</head>
<body class="edit">
<header>
  <span class="logo">🧩 Tukuk Studio · Pembina Aplikasi</span>
  <input id="appName" class="name" placeholder="Nama aplikasi" value="Aplikasi Saya">
  <div class="sp"></div>
  <select id="tpl" class="name" title="Muat templat awal"><option value="">🗂 Templat…</option></select>
  <button id="modeBtn" class="ghost active" title="Tukar antara menyunting & mencuba interaktif">✏️ Edit</button>
  <button id="viewDesign" class="ghost active" title="Paparan blok visual">🧱 Rekaan</button>
  <button id="viewCode" class="ghost" title="Editor Kod + pratonton langsung (tanpa AI)">&lt;/&gt; Kod</button>
  <button id="undo" title="Undo">↶</button>
  <button id="redo" title="Redo">↷</button>
  <button id="shareBtn" title="Jana pautan kongsi (projek tersimpan dalam URL)">🔗 Kongsi</button>
  <button id="auditBtn" title="Semak aksesibiliti / kontras / pautan">🩺 Semak</button>
  <button id="keysBtn" title="Pintasan papan kekunci (?)">⌨️ Pintasan</button>
  <button id="openBtn" title="Buka projek .json">📂 Buka</button>
  <button id="saveBtn" title="Simpan projek .json">💾 JSON</button>
  <button id="exportBtn" class="primary" title="Eksport HTML berdiri sendiri">⬇️ Eksport HTML</button>
  <button id="zipBtn" class="primary" title="Muat turun ZIP (index.html + projek + README)">🗜 ZIP</button>
  <input id="pubSlug" title="Pilih pautan pendek (pilihan): /a/nama-anda" placeholder="🔗 slug" maxlength="40" autocomplete="off" spellcheck="false" style="width:96px;padding:6px 8px;border:1px solid #262b36;border-radius:8px;background:#0b0f1a;color:#e6e9ef;font-size:13px">
  <button id="pubBtn" class="primary" title="Terbitkan ke pautan awam tukuk.org/a/…">🚀 Terbitkan</button>
  <button id="myBtn" title="Urus aplikasi yang anda terbitkan (kemas kini / buang)">📦 Aplikasi Saya</button>
  <button id="galBtn" title="Lihat aplikasi komuniti yang diterbitkan">🌐 Pameran</button>
  <span id="saveState" class="saveState" title="Status jimat automatik"></span>
</header>

<div class="grid3">
  <div class="col left">
    <div class="genbar" style="display:flex;gap:6px;margin:0 0 6px">
      <textarea id="genIdea" rows="2" placeholder="✨ Taip idea / huraian app atau game… (Ctrl+Enter untuk jana)" maxlength="160" style="flex:1;min-width:0;padding:8px 10px;border:1px solid #2a3040;border-radius:9px;background:transparent;color:inherit;resize:vertical;font:inherit"></textarea>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button id="genBtn" class="primary" title="Jana aplikasi + game automatik" style="padding:8px 12px;border-radius:9px;white-space:nowrap">✨ Jana</button>
        <button id="genDice" class="ghost" title="Isi idea rawak" style="padding:6px 12px;border-radius:9px;white-space:nowrap">🎲 Rambang</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin:0 0 6px;flex-wrap:wrap">
      <input id="genStyle" list="genStyleList" placeholder="Gaya (bebas)… cth neon/retro" maxlength="40" style="flex:1;min-width:120px;padding:6px 8px;border:1px solid #2a3040;border-radius:8px;background:transparent;color:inherit">
      <datalist id="genStyleList"><option value="minimalis"></option><option value="cerah"></option><option value="gelap"></option><option value="neon"></option><option value="retro"></option><option value="pastel"></option></datalist>
      <input type="color" id="genColor" title="Warna utama" value="#4c8dff" style="width:34px;height:30px;border:1px solid #2a3040;border-radius:8px;background:transparent;padding:2px;cursor:pointer">
      <select id="genLang" title="Bahasa kandungan" style="padding:6px 8px;border:1px solid #2a3040;border-radius:8px;background:transparent;color:inherit">
        <option value="">Bahasa: auto</option><option value="Melayu">Melayu</option><option value="English">English</option><option value="Indonesia">Indonesia</option>
      </select>
    </div>
    <div id="genSug" style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px"></div>
    <div style="display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap">
      <span id="genTags" style="display:flex;gap:4px;flex-wrap:wrap"></span>
      <label title="Pakai calon AI (jika ada) &amp; buka semak slug/nama sebelum terbit" style="margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px;color:#9aa3b2;cursor:pointer"><input type="checkbox" id="genAutoPub"> Auto-terbit</label>
    </div>
    <h4>Tambah widget</h4>
    <div class="palette" id="palette"></div>
    <div class="hint">Klik untuk tambah ke bawah. Seret blok pada kanvas untuk susun semula. Guna <b>Mod Cuba</b> untuk uji interaksi.</div>
  </div>

  <div class="col stage">
    <div class="devs">
      <button data-dev="phone" class="ghost active">📱 Telefon</button>
      <button data-dev="tablet" class="ghost">📟 Tablet</button>
      <button data-dev="desktop" class="ghost">🖥 Desktop</button>
    </div>
    <div class="frame" id="frame"></div>
    <div id="codeView">
      <div class="codebar">
        <div class="codetabs">
          <button data-ctab="html" class="on">HTML</button>
          <button data-ctab="css">CSS</button>
          <button data-ctab="js">JS</button>
        </div>
        <button id="codeRegen" title="Jana semula kod daripada blok Rekaan">↺ Jana dari Rekaan</button>
        <button id="codeFmt" title="Format / indent kod">✨ Format</button>
        <button id="codeCopy" title="Salin tab aktif ke papan klip">📋 Salin</button>
        <button id="codeDl" title="Muat turun HTML penuh">⬇️ Muat turun</button>
        <button id="codeRun" title="Jalankan pratonton">▶️ Jalankan</button>
        <label><input type="checkbox" id="codeRunChk" checked> Auto</label>
        <span class="hint" style="margin:0">Tiga tab HTML/CSS/JS — pratonton menggabungkan semuanya. Suntingan manual terpakai untuk pratonton/muat turun/eksport sahaja.</span>
      </div>
      <div class="codesplit">
        <div class="edWrap">
          <div class="gutter" id="edGutter">1</div>
          <pre id="edPre"><code id="edCode"></code></pre>
          <textarea id="edTA" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        </div>
        <iframe id="edPreview" title="Pratonton kod" sandbox="allow-scripts allow-forms allow-popups"></iframe>
      </div>
    </div>
  </div>

  <div class="col right">
    <div class="tabs">
      <button id="tabWidget" class="on">Widget</button>
      <button id="tabTheme">Tema</button>
    </div>
    <div id="insp"></div>
  </div>
</div>

<input type="file" id="fileIn" accept="application/json" hidden>
<input type="file" id="imgIn" accept="image/*" hidden>
<div class="toast" id="toast"></div>
<div id="modal" class="modal"><div class="mcard"><div class="mh"><span class="mt"></span><button class="mx ghost" title="Tutup (Esc)">✕</button></div><div class="mb"></div></div></div>

<script>
'use strict';
// ── Model & util ────────────────────────────────────────────────────────────
let uid = 1;
const DEF_THEME = { accent:'#4c8dff', bg:'#ffffff', fg:'#16181d', dark:false, radius:14, font:"system-ui, Segoe UI, Roboto, sans-serif", sub:'Dibina dengan Tukuk Studio', desc:'Aplikasi kecil yang dibina dengan Tukuk Studio.' };
let theme = { ...DEF_THEME };
let widgets = [];           // [{id,type,...props}]
let selId = null;
let mode = 'edit';          // edit | preview
let device = 'phone';
let history = [], future = [];

const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $ = (id) => document.getElementById(id);
const byId = (id) => widgets.find((w) => w.id === id) || null;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

const TYPES = {
  heading:{ ic:'🅃', name:'Tajuk', make:()=>({type:'heading', text:'Tajuk Aplikasi', level:2, align:'left'}) },
  text:{ ic:'¶', name:'Teks', make:()=>({type:'text', text:'Letakkan penerangan atau isi here di sini.', align:'left'}) },
  button:{ ic:'🔘', name:'Butang', make:()=>({type:'button', label:'Klik saya', href:'', variant:'primary', fullWidth:false}) },
  image:{ ic:'🖼️', name:'Imej', make:()=>({type:'image', src:'', alt:'gambar', radius:12, caption:''}) },
  input:{ ic:'⌨️', name:'Input', make:()=>({type:'input', label:'Nama', placeholder:'Taip di sini…', kind:'text'}) },
  counter:{ ic:'➕', name:'Kaunter', make:()=>({type:'counter', label:'Bilangan', value:0, step:1}) },
  toggle:{ ic:'🔀', name:'Togol', make:()=>({type:'toggle', label:'Aktifkan', on:false}) },
  list:{ ic:'📝', name:'Senarai', make:()=>({type:'list', items:['Beli barang','Buang sampah'], allowAdd:true}) },
  card:{ ic:'🗃️', name:'Kad', make:()=>({type:'card', title:'Nota', body:'Kandungan ringkas dalam kad.'}) },
  divider:{ ic:'➖', name:'Pemisah', make:()=>({type:'divider'}) },
  spacer:{ ic:'↕️', name:'Ruang', make:()=>({type:'spacer', height:24}) },
  faq:{ ic:'❓', name:'FAQ', make:()=>({type:'faq', items:[{q:'Ini soalan?',a:'Ini jawapan.'},{q:'Satu lagi?',a:'Baik, ini contoh.'}]}) },
  steps:{ ic:'🔢', name:'Cara-cara', make:()=>({type:'steps', title:'Langkah', items:['Buka aplikasi','Pilih pilihan','Selesai']}) },
  quiz:{ ic:'🎯', name:'Kuiz', make:()=>({type:'quiz', q:'Ibukota Malaysia?', options:['Kuala Lumpur','Singapura','Bangkok'], answer:0}) },
  ttt:{ ic:'⭕', name:'Tic-Tac-Toe', make:()=>({type:'ttt'}) },
  memory:{ ic:'🧠', name:'Padanan Memori', make:()=>({type:'memory', pairs:6}) },
  mole:{ ic:'🐹', name:'Tikus Pukul', make:()=>({type:'mole', duration:20}) },
  rps:{ ic:'✊', name:'Batu-Kertas-Gunting', make:()=>({type:'rps'}) },
  reaction:{ ic:'⚡', name:'Masa Tindak Balas', make:()=>({type:'reaction'}) },
  guess:{ ic:'🔢', name:'Teka Nombor', make:()=>({type:'guess', max:100}) },
  br:{ ic:'🔫', name:'Battle Royale', make:()=>({type:'br', enemies:5, zoneSpeed:10, mapSize:600}) },
  fps:{ ic:'🕹️', name:'FPS Arena 3D', make:()=>({type:'fps', enemies:4, zoneSpeed:25}) },
  runner:{ ic:'🏃', name:'Lari Tanpa Hujung', make:()=>({type:'runner'}) },
  s2048:{ ic:'🔢', name:'2048', make:()=>({type:'s2048'}) },
  snake:{ ic:'🐍', name:'Ular', make:()=>({type:'snake', speed:1}) },
  breakout:{ ic:'🧱', name:'Breakout', make:()=>({type:'breakout', rows:5}) },
  blox:{ ic:'🧩', name:'Blok Jatuh', make:()=>({type:'blox'}) },
  astro:{ ic:'☄️', name:'Asteroid', make:()=>({type:'astro'}) },
  mines:{ ic:'💣', name:'Rambang', make:()=>({type:'mines'}) }
};

// Templat awal — setiap satu muat set widget + tema + nama (id dijana semasa dimuat).
const TEMPLATES = {
  todo:{ label:'✅ To-Do', appName:'Senarai Tugas', theme:{accent:'#30d158'}, widgets:[
    {type:'heading', text:'Tugasan Hari Ini', level:2, align:'left'},
    {type:'list', items:['Semak e-mel','Mesyuarat 10:00','Beli barang'], allowAdd:true},
    {type:'text', text:'Guna Mod Cuba untuk tambah item baharu.', align:'left'}

<script>
'use strict';
// ── Enjin permainan (tanpa AI). widgetMarkup hasilkan 'shell'; initGames bina UI & logik.
// Fungsi yang sama dipakai untuk pratonton (renderStage panggil initGames) dan eksport
// (runtimeJS menyertai initGames.toString()). Maka tiada pendua logik. ────────────────
function gameBox(kind,label,w,extra){ return `<div data-game="${kind}" data-acc="${esc(theme.accent)}"${extra||''}><div style="border:2px dashed #ccc;border-radius:12px;padding:18px;text-align:center;color:#888">${esc(label)} — tukar ke <b>Mod Cuba</b> untuk main</div></div>`; }

function initGames(root){
  var _lb={}; // papan pendahulu mesti wujud sebelum game boot — draw() pertama ialah sinkron (dalam forEach).
  root = root || document;
  var boxes = root.querySelectorAll('[data-game]');
  Array.prototype.forEach.call(boxes, function(box){
    if(box.__g) return; box.__g = true;
    var acc = box.getAttribute('data-acc') || '#4c8dff';
    var kind = box.getAttribute('data-game');
    setFav(kind); // favicon ikut game — tab buku tanda & skrin utama boleh bezakan game
    try{
      if(kind==='ttt') gTTT(box,acc);
      else if(kind==='memory') gMemory(box,acc);
      else if(kind==='mole') gMole(box,acc);
      else if(kind==='rps') gRPS(box,acc);
      else if(kind==='reaction') gReaction(box,acc);
      else if(kind==='guess') gGuess(box,acc);
      else if(kind==='br') gBR(box,acc);
      else if(kind==='fps') gFPS(box,acc);
      else if(kind==='runner') gRunner(box,acc);
      else if(kind==='s2048') g2048(box,acc);
      else if(kind==='snake') gSnake(box,acc);
      else if(kind==='breakout') gBreakout(box,acc);
      else if(kind==='blox') gBlox(box,acc);
      else if(kind==='astro') gAstro(box,acc);
      else if(kind==='mines') gMines(box,acc);
    }catch(err){ if(window.console) console.warn('game', err); }
  });

  function el(tag,css,txt){ var e=document.createElement(tag); if(css)e.style.cssText=css; if(txt!=null)e.textContent=txt; return e; }

  // Favicon data-URI berasaskan emoji game — berfungsi luar tali daring & tanpa fail tambahan.
  function setFav(kind){
    try{
      var ic = (typeof TYPES !== 'undefined' && TYPES[kind]) ? TYPES[kind].ic : '🎮';
      var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">' + ic + '</text></svg>';
      var l = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
      if (!l) { l = document.createElement('link'); l.rel = 'icon'; l.type = 'image/svg+xml'; document.head.appendChild(l); }
      l.href = 'data:image/svg+xml,' + encodeURIComponent(s);
    }catch(e){}
  }

  // Bunyi (Web Audio, tanpa fail). AudioContext dibuka pada gesture pertama.
  function makeSfx(){
    var a=null;
    function ensure(){ if(!a){ try{ a=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(a&&a.state==='suspended')a.resume(); return a; }
    function tone(f,d,type,v,slide){ var A=ensure(); if(!A)return; try{ var o=A.createOscillator(),g=A.createGain(); o.type=type||'square'; o.frequency.value=f; if(slide)o.frequency.linearRampToValueAtTime(slide,A.currentTime+d); g.gain.value=v||0.06; g.gain.setValueAtTime(g.gain.value,A.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+d); o.connect(g); g.connect(A.destination); o.start(); o.stop(A.currentTime+d); }catch(e){} }
    return { resume:ensure,
      shoot:function(){ tone(300,0.09,'square',0.05,120); },
      hit:function(){ tone(520,0.05,'sawtooth',0.05,200); },
      kill:function(){ tone(300,0.14,'triangle',0.06,720); },
      hurt:function(){ tone(150,0.2,'sawtooth',0.08,70); },
      win:function(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f,0.16,'square',0.06); },i*120); }); },
      lose:function(){ [440,330,220,130].forEach(function(f,i){ setTimeout(function(){ tone(f,0.22,'sawtooth',0.07); },i*140); }); }
    };
  }

  // Kawalan sentuh: separuh kiri = joystik gerak, separuh kanan = aim/tembak (BR) atau belok/tembak (FPS).
  function attachTouch(cvs,ctrl){
    ctrl.mvx=0;ctrl.mvy=0;ctrl.rightDown=false;ctrl.rx=0;ctrl.ry=0;ctrl.rdx=0;ctrl.touched=false;
    var W=cvs.width,H=cvs.height,lId=null,ox=0,oy=0,rId=null,rox=0;
    function pt(t){ var r=cvs.getBoundingClientRect(); return {x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)}; }
    function ts(e){ e.preventDefault(); ctrl.touched=true; if(ctrl.wake)ctrl.wake();
      for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i],p=pt(t);
        if(p.x<W/2&&lId==null){ lId=t.identifier;ox=p.x;oy=p.y; }
        else if(p.x>=W/2&&rId==null){ rId=t.identifier;rox=p.x;ctrl.rightDown=true;ctrl.rx=p.x;ctrl.ry=p.y; }
      } }
    function tm(e){ e.preventDefault();
      for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i],p=pt(t);
        if(t.identifier===lId){ var dx=p.x-ox,dy=p.y-oy,m=Math.hypot(dx,dy),R=Math.min(m,30)/30; ctrl.mvx=(m?dx/m:0)*R; ctrl.mvy=(m?dy/m:0)*R; }
        else if(t.identifier===rId){ ctrl.rdx+=(p.x-rox);rox=p.x;ctrl.rx=p.x;ctrl.ry=p.y; }
      } }
    function te(e){ for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i];
        if(t.identifier===lId){ lId=null;ctrl.mvx=0;ctrl.mvy=0; }
        if(t.identifier===rId){ rId=null;ctrl.rightDown=false; }
      } }
    cvs.style.touchAction='none';
    cvs.addEventListener('touchstart',ts,{passive:false});
    cvs.addEventListener('touchmove',tm,{passive:false});
    cvs.addEventListener('touchend',te);
    cvs.addEventListener('touchcancel',te);
  }

  // Lukis joystik + butang tembak di kanvas (hanya selepas sentuhan pertama).
  function drawTouch(ctx,ctrl,W,H){
    if(!ctrl.touched)return;
    var jx=W*0.22,jy=H*0.78,fx=W*0.8,fy=H*0.8;
    ctx.save();ctx.globalAlpha=0.5;ctx.lineWidth=2;
    ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(jx,jy,30,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.arc(jx+ctrl.mvx*22,jy+ctrl.mvy*22,14,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=ctrl.rightDown?'#ff6b6b':'#fff';ctx.beginPath();ctx.arc(fx,fy,26,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=ctrl.rightDown?'rgba(255,107,107,0.5)':'rgba(255,255,255,0.22)';ctx.beginPath();ctx.arc(fx,fy,26,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Skor terbaik (localStorage). Selamat dalam sandbox opaque-origin → degredasi senyap.
  function ls(){ try{ return window.localStorage; }catch(e){ return null; } }
  function getBest(k){ var s=ls(); if(!s)return null; try{ var v=s.getItem('tukuk-best-'+k); return v==null?null:Number(v); }catch(e){ return null; } }
  function setBest(k,val){ var s=ls(); if(!s||!isFinite(val))return false; try{ var c=getBest(k); if(c==null||val>c){ s.setItem('tukuk-best-'+k,String(val)); return true; } }catch(e){} return false; }

  // Papan pendahulu komuniti (hanya bila rangkaian boleh; senyap jika CSP/sandbox menyekat).
  function playerName(){ var s=ls(); var n=null; try{ if(s)n=s.getItem('tukuk-name'); }catch(e){} if(n==null){ n=(String(window.prompt('Nama untuk papan pendahulu:')||'').trim().slice(0,20))||'Anon'; try{ if(s)s.setItem('tukuk-name',n); }catch(e){} } return n; }
  function lbSubmit(game,score){ try{ if(!isFinite(score)||score<=0)return; var u='/api/score?g='+encodeURIComponent(game)+'&n='+encodeURIComponent(playerName())+'&s='+Math.round(score); fetch(u,{cache:'no-store',mode:'no-cors'}); }catch(e){} }
  function lbTop(game,force){ if(!force&&_lb[game]!=null)return; _lb[game]=_lb[game]||[]; try{ fetch('/api/scores?g='+encodeURIComponent(game)+'&limit=5',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){ _lb[game]=(d&&d.items)||[]; }).catch(function(){}); }catch(e){} }
  function drawLb(ctx,game,cx,y){ var arr=_lb[game]; if(!arr||!arr.length)return; var ta=ctx.textAlign; ctx.textAlign='center'; ctx.font='bold 11px system-ui'; ctx.fillStyle='#7fb2ff'; ctx.fillText('🌐 Papan pendahulu',cx,y); ctx.font='11px system-ui'; ctx.fillStyle='#cfe1ff'; for(var i=0;i<Math.min(5,arr.length);i++){ ctx.fillText((i+1)+'. '+arr[i].n+' — '+arr[i].s,cx,y+13+i*13); } ctx.textAlign=ta; }

  function gTTT(box,acc){
    box.innerHTML='';
    var cells=[], b=Array(9).fill(''), turn='X', over=false, sfx=makeSfx();
    var stat=el('div','font-size:13px;color:#666','Giliran: X');
    var grid=el('div','display:grid;grid-template-columns:repeat(3,58px);gap:6px;margin:8px 0');
    function win(a){ var L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for(var k=0;k<L.length;k++){ var x=L[k]; if(a[x[0]]&&a[x[0]]===a[x[1]]&&a[x[1]]===a[x[2]]) return true; } return false; }
    for(var i=0;i<9;i++){ (function(idx){ var c=el('button','width:58px;height:58px;font-size:26px;font-weight:800;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer','');
      c.onclick=function(){ if(over||b[idx])return; b[idx]=turn; c.textContent=turn; c.style.color=turn==='X'?acc:'#e5484d'; sfx.shoot();
        if(win(b)){ over=true; stat.textContent='Menang: '+turn+' 🎉'; sfx.win(); } else if(b.every(function(x){return x;})){ over=true; stat.textContent='Seri!'; } else { turn=turn==='X'?'O':'X'; stat.textContent='Giliran: '+turn; } };
      grid.appendChild(c); cells.push(c); })(i); }
    var rst=el('button','padding:6px 12px;border:1px solid #ccc;border-radius:8px;background:#f3f5fb;cursor:pointer','Reset');
    rst.onclick=function(){ b=Array(9).fill(''); turn='X'; over=false; cells.forEach(function(x){ x.textContent=''; x.style.color=''; }); stat.textContent='Giliran: X'; };
    box.appendChild(el('div','font-size:13px;color:#666','Dua pemain. Jajaran 3 menang.'));
    box.appendChild(grid); box.appendChild(stat); box.appendChild(rst);
  }

  function gMemory(box,acc){
    var pairs=Number(box.getAttribute('data-pairs'))||6;
    var set=['🍎','🍌','🍇','🍒','🍊','🍉','🥝','🍍','📷','🚗','⭐','🔥'];
    var chosen=set.slice(0,Math.min(pairs,set.length)); var deck=[]; chosen.forEach(function(em){ deck.push(em,em); });
    for(var i=deck.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
    box.innerHTML=''; var open=[], matched=0, moves=0, lock=false, sfx=makeSfx();
    var stat=el('div','font-size:13px;color:#666');
    var grid=el('div','display:grid;grid-template-columns:repeat(4,52px);gap:6px;margin:8px 0');
    deck.forEach(function(em){ var c=el('button','width:52px;height:52px;font-size:22px;border:1px solid #ccc;border-radius:8px;cursor:pointer','?'); c.style.background=acc; c.style.color=acc;
      c.onclick=function(){ if(lock||c.__o||c.__d)return; c.textContent=em; c.style.background='#fff'; c.style.color='#111'; c.__o=true; open.push({c:c,em:em});
        if(open.length===2){ moves++; lock=true; var a=open[0], bb=open[1];
          setTimeout(function(){ if(a.em===bb.em){ a.c.__d=1; bb.c.__d=1; a.c.style.background='#d7f7dd'; bb.c.style.background='#d7f7dd'; matched++; sfx.kill(); if(matched===chosen.length)sfx.win(); stat.textContent='Gerak: '+moves+'  •  Padan: '+matched+'/'+chosen.length+(matched===chosen.length?'  ✅ Selesai!':''); } else { sfx.hurt(); [a,bb].forEach(function(o){ o.c.textContent='?'; o.c.style.background=acc; o.c.style.color=acc; }); stat.textContent='Gerak: '+moves+'  •  Padan: '+matched+'/'+chosen.length; } open=[]; lock=false; }, 550); } };
      grid.appendChild(c); });
    box.appendChild(el('div','font-size:13px;color:#666','Cari pasangan yang sama.'));
    box.appendChild(grid); box.appendChild(stat); stat.textContent='Gerak: 0  •  Padan: 0/'+chosen.length;
  }

  function gMole(box,acc){
    box.innerHTML=''; var cells=[], score=0, left=0, playing=false, spawn=null, tick=null, sfx=makeSfx();
    var stat=el('div','font-size:13px;color:#666','Skor: 0');
    var grid=el('div','display:grid;grid-template-columns:repeat(3,60px);gap:8px;margin:8px 0');
    function pop(){ if(!playing)return; cells.forEach(function(c){ c.__m=false; c.textContent=''; }); var m=cells[Math.floor(Math.random()*cells.length)]; m.__m=true; m.textContent='🐹'; }
    for(var i=0;i<9;i++){ (function(){ var h=el('div','width:60px;height:60px;border-radius:50%;background:#e7e0d6;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer','');
      h.onclick=function(){ if(playing&&h.__m){ score++; sfx.hit(); h.__m=false; h.textContent=''; stat.textContent='Skor: '+score+'  •  Masa: '+left+'s'; } }; grid.appendChild(h); cells.push(h); })(); }
    var start=el('button','padding:6px 14px;background:'+acc+';color:#fff;border:none;border-radius:8px;cursor:pointer','Mula');
    start.onclick=function(){ if(playing)return; sfx.shoot(); playing=true; score=0; left=Number(box.getAttribute('data-duration'))||20; stat.textContent='Skor: 0  •  Masa: '+left+'s'; pop();

  // ── 2048 (grid DOM, gabung nombor, papan pendahulu) ─────────────────────

    function reset(){ ship={x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2,inv:60}; bs=[];rocks=[];sc=0;lives=3;wave=1;state='play';record=false;spawnWave(); }
    function fire(){ if(state!=='play'||bs.length>=6)return; bs.push({x:ship.x+Math.cos(ship.a)*13,y:ship.y+Math.sin(ship.a)*13,vx:Math.cos(ship.a)*7.5+ship.vx,vy:Math.sin(ship.a)*7.5+ship.vy,l:55}); sfx.shoot(); }
    function wrap(o){ if(o.x<-12)o.x=W+11; if(o.x>W+12)o.x=-11; if(o.y<-12)o.y=H+11; if(o.y>H+12)o.y=-11; }
    function upd(dt){
      if(keys.ArrowLeft||keys.KeyA)ship.a-=0.06*dt; if(keys.ArrowRight||keys.KeyD)ship.a+=0.06*dt;
      if(keys.ArrowUp||keys.KeyW){ ship.vx+=Math.cos(ship.a)*0.1*dt; ship.vy+=Math.sin(ship.a)*0.1*dt; }
      ship.vx*=Math.pow(0.994,dt); ship.vy*=Math.pow(0.994,dt);
      var sp=Math.hypot(ship.vx,ship.vy); if(sp>5.4){ ship.vx*=5.4/sp; ship.vy*=5.4/sp; }
      ship.x+=ship.vx*dt; ship.y+=ship.vy*dt; wrap(ship); if(ship.inv>0)ship.inv-=dt;
      for(var k=bs.length-1;k>=0;k--){ var b=bs[k]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.l-=dt; wrap(b); if(b.l<=0)bs.splice(k,1); }
      for(var i=rocks.length-1;i>=0;i--){ var r=rocks[i]; r.x+=r.vx*dt; r.y+=r.vy*dt; r.a+=r.va*dt; wrap(r);
        for(var j=0;j<bs.length;j++){ var bb=bs[j]; if(Math.hypot(bb.x-r.x,bb.y-r.y)<r.r){ bs.splice(j,1);
          sc+= r.r>20?50:r.r>12?25:10; sfx.kill();
          if(r.r>20){ rocks.push(mkRock(r.x,r.y,2)); rocks.push(mkRock(r.x,r.y,2)); }
          else if(r.r>12){ rocks.push(mkRock(r.x,r.y,1)); rocks.push(mkRock(r.x,r.y,1)); }
          rocks.splice(i,1); break; } } }
      if(!rocks.length){ wave++; spawnWave(); sfx.win(); }
      if(ship.inv<=0)for(var m=0;m<rocks.length;m++){ var rr=rocks[m];
        if(Math.hypot(ship.x-rr.x,ship.y-rr.y)<rr.r+9){ lives--; sfx.hurt(); rocks.splice(m,1);
          ship={x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2,inv:120};
          if(lives<=0){ state='lose'; if(setBest('astro',sc))record=true; lbSubmit('astro',sc); lbTop('astro',true); sfx.lose(); }
          break; } } }
    function render(){
      ctx.fillStyle='#05070d';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(255,255,255,0.45)';stars.forEach(function(st){ctx.fillRect(st.x,st.y,st.r,st.r);});
      ctx.strokeStyle='#9fb4d8';ctx.lineWidth=1.3;
      (rocks||[]).forEach(function(r){ ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.a);ctx.beginPath();
        r.pts.forEach(function(p,i){ var ang=i/r.pts.length*Math.PI*2,rr=r.r*p;
          if(i)ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr); else ctx.moveTo(Math.cos(ang)*rr,Math.sin(ang)*rr); });
        ctx.closePath();ctx.stroke();ctx.restore(); });
      ctx.fillStyle='#fff';(bs||[]).forEach(function(b){ ctx.fillRect(b.x-1,b.y-1,3,3); });
      if(ship){ ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a);
        if(!(ship.inv>0&&(((Date.now()/90)|0)%2))){ ctx.strokeStyle=acc;ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-8,8);ctx.lineTo(-4,0);ctx.lineTo(-8,-8);ctx.closePath();ctx.stroke(); }
        if(keys.ArrowUp&&state==='play'){ ctx.strokeStyle='#ff9f43';ctx.beginPath();ctx.moveTo(-6,4);ctx.lineTo(-13-((Math.random()*5)|0),0);ctx.lineTo(-6,-4);ctx.stroke(); }
        ctx.restore(); }
      ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,22);ctx.font='bold 12px system-ui';ctx.textBaseline='middle';
      ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText('Skor: '+(sc||0),8,12); ctx.textAlign='center';ctx.fillStyle='#8fa3c8';ctx.fillText('Gelombang '+(wave||1),W/2,12);
      ctx.textAlign='right';ctx.fillStyle='#ff8585';ctx.fillText('♥'.repeat(Math.max(0,lives==null?3:lives)),W-8,12);ctx.textBaseline='alphabetic';ctx.textAlign='left';
      if(state!=='play'){ ctx.textAlign='center';ctx.fillStyle='rgba(2,4,9,0.8)';ctx.fillRect(0,0,W,H);
        if(state==='menu'){ ctx.font='bold 22px system-ui';ctx.fillStyle='#fff';ctx.fillText('☄️ Asteroid',W/2,H/2-10);ctx.font='12px system-ui';ctx.fillStyle='#ccc';ctx.fillText('←→ pusing · ↑ pecut · Space tembak · klik untuk mula',W/2,H/2+14); lbTop('astro'); drawLb(ctx,'astro',W/2,H/2+36); }
        else { ctx.font='bold 22px system-ui';ctx.fillStyle='#e5484d';ctx.fillText('💀 Hancur!',W/2,H/2-26-(record?14:0));ctx.font='13px system-ui';ctx.fillStyle='#fff';ctx.fillText('Skor: '+sc+' · Gelombang '+wave,W/2,H/2); if(record){ctx.fillStyle='#ffd700';ctx.fillText('🏆 Rekod baru!',W/2,H/2+16);} ctx.fillStyle='#ccc';ctx.font='12px system-ui';ctx.fillText('Klik untuk main lagi',W/2,H/2+(record?36:22)); drawLb(ctx,'astro',W/2,H/2+(record?54:42)); }
        ctx.textAlign='left'; } }
    box.addEventListener('keydown',function(e){ if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code)>=0)e.preventDefault();
      sfx.resume(); if(e.code==='Space'){ if(state!=='play'){reset();return;} fire(); } if(state==='play')keys[e.code]=true; });
    box.addEventListener('keyup',function(e){ keys[e.code]=false; });
    cvs.addEventListener('mousedown',function(){ sfx.resume(); if(state!=='play')reset(); });
    var ctl=el('div','display:flex;gap:5px;margin-top:6px');
    function hbtn(lbl,code){ var b=el('button','flex:1;height:42px;border:1px solid #ccc;border-radius:8px;background:#f3f5fb;font-size:15px;cursor:pointer;touch-action:none',lbl);
      b.addEventListener('pointerdown',function(e){ e.preventDefault(); sfx.resume(); if(state!=='play'){reset();return;} keys[code]=true; });
      addEventListener('pointerup',function(){ keys[code]=false; });
      return b; }
    ctl.appendChild(hbtn('↺','ArrowLeft')); ctl.appendChild(hbtn('↻','ArrowRight')); ctl.appendChild(hbtn('▲','ArrowUp'));
    var fb=el('button','flex:1;height:42px;border:1px solid #ccc;border-radius:8px;background:#f3f5fb;font-size:15px;cursor:pointer','🔥');
    fb.onclick=function(){ sfx.resume(); if(state!=='play'){reset();return;} fire(); }; ctl.appendChild(fb);
    box.appendChild(ctl); box.appendChild(el('div','font-size:12px;color:#888;margin-top:4px','←→ pusing · ↑ pecut · Space/click tembak · asteroid besar berpecah dua.'));
    ship={x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2,inv:0}; bs=[];rocks=[];sc=0;lives=3;wave=1;
    lbTop('astro'); render();
    var lastT=0;
    (function loop(ts){ if(!lastT)lastT=ts; var dt=Math.min((ts-lastT)/16.67,3);lastT=ts; if(state==='play')upd(dt); render(); requestAnimationFrame(loop); })(0);
  }

  // ── Rambang (minesweeper DOM: first-click selamat, bendera, pemasa) ─────
  function gMines(box,acc){
    box.innerHTML='';
    var N=9,M=10,cells=[],mine,rev,flag,started=false,over=false,t0=0,tk=null,secs=0,flagN=0,opened=0,sfx=makeSfx(),fm=false,lt=null;
    var head=el('div','display:flex;gap:12px;align-items:center;font-size:14px;margin:4px 0;flex-wrap:wrap');
    var face=el('button','width:42px;height:42px;font-size:22px;border:1px solid #ccc;border-radius:8px;background:#f3f5fb;cursor:pointer','😎');
    var cMine=el('span','','💣 '+M), cTime=el('span','','⏱ 0s');
    var fmBtn=el('button','padding:6px 10px;border:1px solid #ccc;border-radius:8px;background:#f3f5fb;cursor:pointer;font:inherit;font-size:13px','🚩 Bendera: Off');
    fmBtn.onclick=function(){ fm=!fm; fmBtn.textContent='🚩 Bendera: '+(fm?'On':'Off'); fmBtn.style.borderColor=fm?'#e5484d':'#ccc'; };
    head.appendChild(face);head.appendChild(cMine);head.appendChild(cTime);head.appendChild(fmBtn);
    var grid=el('div','display:grid;grid-template-columns:repeat('+N+',34px);gap:3px;margin:8px 0');
    function nb(i){ var x=i%N,y=(i/N)|0,out=[]; for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){ if(!dx&&!dy)continue;
      var nx=x+dx,ny=y+dy; if(nx>=0&&ny>=0&&nx<N&&ny<N)out.push(ny*N+nx); } return out; }
    function place(skip){ mine=Array(N*N).fill(0); var pool=[]; var near=nb(skip); near.push(skip);
      for(var i=0;i<N*N;i++)if(near.indexOf(i)<0)pool.push(i);
      for(var k=0;k<M&&pool.length;k++){ var j=(Math.random()*pool.length)|0; mine[pool[j]]=1; pool.splice(j,1); } }
    function cnt(i){ return nb(i).reduce(function(a,j){ return a+(mine[j]?1:0); },0); }
    var NUM=['','#3f7bff','#30d158','#ff9f43','#e5484d','#a259ff','#26c6da','#888','#666'];
    function reveal(i){ if(over||rev[i]||(flag&&flag[i]))return;
      if(!started){ started=true; place(i); t0=Date.now(); tk=setInterval(function(){ if(!over){ secs=Math.round((Date.now()-t0)/1000); cTime.textContent='⏱ '+secs+'s'; } },1000); }
      if(mine[i]){ lose(i); return; }
      var st=[i]; while(st.length){ var j=st.pop(); if(rev[j]||flag[j])continue; rev[j]=1; opened++;
        cells[j].textContent=''; cells[j].style.background='#eef1f8'; cells[j].style.borderColor='#d5d9e6';
        var c=cnt(j); if(c){ cells[j].textContent=c; cells[j].style.color=NUM[c]; } else nb(j).forEach(function(q){ if(!rev[q])st.push(q); }); }
      if(opened===N*N-M)winGame(); updHead(); }
    function toggleFlag(i){ if(over||rev[i])return; flag[i]=!flag[i]; cells[i].textContent=flag[i]?'🚩':''; flagN+=flag[i]?1:-1; updHead(); }
    function updHead(){ cMine.textContent='💣 '+Math.max(0,M-flagN); }
    function lose(hit){ over=true; clearInterval(tk); face.textContent='😵'; sfx.lose();
      for(var i=0;i<N*N;i++)if(mine[i]&&!flag[i]){ cells[i].textContent='💣'; cells[i].style.background=i===hit?'#f8c6c6':'#e89090'; } }
    function winGame(){ over=true; clearInterval(tk); face.textContent='😎'; sfx.win();
      for(var i=0;i<N*N;i++)if(mine[i]&&!flag[i]){ flag[i]=1; flagN++; cells[i].textContent='🚩'; }
      updHead(); var pts=Math.max(50,800-secs*10); if(setBest('mines',pts))cTime.textContent='⏱ '+secs+'s 🏆'; lbSubmit('mines',pts); }
    function reset(){ clearInterval(tk); mine=Array(N*N).fill(0); rev=Array(N*N).fill(0); flag=Array(N*N).fill(0);
      started=false;over=false;flagN=0;opened=0;secs=0; face.textContent='😎'; cMine.textContent='💣 '+M; cTime.textContent='⏱ 0s';
      cells.forEach(function(c){ c.textContent=''; c.style.background='#d9deec'; c.style.borderColor='#b9c0d4'; c.style.color=''; }); }
    for(var i=0;i<N*N;i++){ (function(idx){ var c=el('button','width:34px;height:34px;font-size:14px;font-weight:800;border:1px solid #b9c0d4;border-radius:5px;background:#d9deec;cursor:pointer','');
      c.addEventListener('click',function(){ sfx.resume(); if(fm)toggleFlag(idx); else reveal(idx); });
      c.addEventListener('contextmenu',function(e){ e.preventDefault(); toggleFlag(idx); });
      c.addEventListener('touchstart',function(){ lt=setTimeout(function(){ lt=null; toggleFlag(idx); },450); },{passive:true});
      c.addEventListener('touchend',function(){ if(lt){ clearTimeout(lt); lt=null; } });
      grid.appendChild(c); cells.push(c); })(i); }
    face.onclick=function(){ sfx.resume(); reset(); };
    box.appendChild(el('div','font-size:13px;color:#666','Buka semua sel tanpa ranjau. Klik-kanan / butang 🚩 / tahan lama = bendera.'));
    box.appendChild(head); box.appendChild(grid);
    reset();
  }
}
</script>

<script>
'use strict';
// ── Render kanvas ───────────────────────────────────────────────────────────
function widgetMarkup(w){
  const t = theme;
  switch(w.type){
    case 'heading': return `<h${w.level||2} data-edit="text" style="text-align:${w.align};margin:.3em 0">${esc(w.text)}</h${w.level||2}>`;
    case 'text': return `<p data-edit="text" style="text-align:${w.align};margin:.3em 0;line-height:1.5">${esc(w.text)}</p>`;
    case 'button': {
      const css=`display:inline-block;background:${t.accent};color:#fff;border:none;padding:10px 16px;border-radius:${t.radius}px;font:inherit;font-weight:700;${w.fullWidth?'display:block;text-align:center;width:100%':''}`;
      return w.href
        ? `<a href="${esc(w.href)}" target="_blank" rel="noopener" style="${css}">${esc(w.label)}</a>`
        : `<button data-interactive data-act="noop" style="${css}">${esc(w.label)}</button>`;
    }
    case 'image': return w.src
      ? `<figure style="margin:0"><img src="${esc(w.src)}" alt="${esc(w.alt)}" style="width:100%;display:block;border-radius:${w.radius}px"><figcaption data-edit="caption" style="font-size:12px;color:#777;margin-top:4px">${esc(w.caption)}</figcaption></figure>`
      : `<div style="border:2px dashed #bbb;border-radius:${w.radius}px;padding:22px;text-align:center;color:#999">Imej (belum dipilih)</div>`;
    case 'input': return `<label style="display:block;font-size:13px;margin-bottom:8px">${esc(w.label)}<input data-interactive type="${w.kind}" placeholder="${esc(w.placeholder)}" style="width:100%;margin-top:4px;padding:9px 10px;border:1px solid #ccd;border-radius:${w.type==='input'?8:8}px;font:inherit"></label>`;
    case 'counter': return `<div data-interactive data-w="${w.id}" data-step="${Number(w.step)||1}" style="display:flex;align-items:center;gap:12px"><span>${esc(w.label)}</span><button data-act="dec" style="width:36px;height:36px;border-radius:10px;border:1px solid #ccc;background:#f3f5fb;font-size:18px">−</button><b data-val style="min-width:24px;text-align:center;font-size:18px">${Number(w.value)||0}</b><button data-act="inc" style="width:36px;height:36px;border-radius:10px;border:1px solid #ccc;background:#f3f5fb;font-size:18px">+</button></div>`;
    case 'toggle': return `<label data-interactive style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" ${w.on?'checked':''} style="width:20px;height:20px">${esc(w.label)}</label>`;
    case 'list': {
      const lis=(w.items||[]).map((it,i)=>`<li data-i="${i}" style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee"><span style="flex:1">${esc(it)}</span><button data-interactive data-act="listdel" data-i="${i}" style="border:none;background:none;color:#e5484d;cursor:pointer">✕</button></li>`).join('');
      const add=w.allowAdd?`<form data-interactive data-list style="display:flex;gap:6px;margin-top:8px"><input placeholder="Tambah…" style="flex:1;padding:8px;border:1px solid #ccd;border-radius:8px"><button class="ladd" style="background:${theme.accent};color:#fff;border:none;border-radius:8px;padding:8px 12px">Tambah</button></form>`:'';
      return `<ul style="list-style:none;margin:0;padding:0">${lis||'<li style="color:#999">Kosong</li>'}</ul>${add}`;
    }
    case 'card': return `<div style="background:#f5f7fb;border:1px solid #e6e9f2;border-radius:${theme.radius}px;padding:14px"><h4 data-edit="title" style="margin:0 0 6px">${esc(w.title)}</h4><p data-edit="body" style="margin:0;color:#444;line-height:1.5">${esc(w.body)}</p></div>`;
    case 'divider': return `<hr style="border:none;border-top:1px solid #e3e3e3;margin:14px 0">`;
    case 'spacer': return `<div style="height:${Number(w.height)||24}px"></div>`;
    case 'faq': {
      const one=(f)=>`<div style="border-bottom:1px solid #eee;padding:6px 0"><button data-interactive data-act="faq" style="width:100%;text-align:left;background:none;border:none;font:inherit;font-weight:700;cursor:pointer;padding:0">▸ ${esc(f.q)}</button><div class="ans" style="display:none;padding:6px 0;color:#555;line-height:1.5">${esc(f.a)}</div></div>`;
      return (w.items||[]).map(one).join('') || `<div style="color:#999">Tiada FAQ</div>`;
    }
    case 'steps': {
      const title=w.title?`<h4 style="margin:.3em 0">${esc(w.title)}</h4>`:'';
      const lis=(w.items||[]).map((it)=>`<li style="margin:6px 0;line-height:1.5">${esc(it)}</li>`).join('');
      return `${title}<ol style="padding-left:22px;margin:0">${lis}</ol>`;
    }
    case 'quiz': {
      const opts=(w.options||[]).map((o,i)=>`<button data-interactive data-act="quiz" data-i="${i}" style="display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid #ccd;border-radius:${theme.radius}px;background:#fff;color:#111;font:inherit;cursor:pointer">${esc(o)}</button>`).join('');
      return `<p style="font-weight:700;margin:.3em 0">${esc(w.q)}</p><div data-interactive data-quiz data-answer="${Number(w.answer)||0}">${opts}</div>`;
    }
    case 'ttt': return gameBox('ttt','⭕ Tic-Tac-Toe', w, '');
    case 'memory': return gameBox('memory','🧠 Padanan Memori', w, ' data-pairs="'+(Number(w.pairs)||6)+'"');
    case 'mole': return gameBox('mole','🐹 Tikus Pukul', w, ' data-duration="'+(Number(w.duration)||20)+'"');
    case 'rps': return gameBox('rps','✊ Batu-Kertas-Gunting', w, '');
    case 'reaction': return gameBox('reaction','⚡ Masa Tindak Balas', w, '');
    case 'guess': return gameBox('guess','🔢 Teka Nombor', w, ' data-max="'+(Number(w.max)||100)+'"');
    case 'br': return gameBox('br','🔫 Battle Royale', w, ' data-enemies="'+(Number(w.enemies)||5)+'" data-zonespeed="'+(Number(w.zoneSpeed)||10)+'" data-mapsize="'+(Number(w.mapSize)||600)+'"');
    case 'fps': return gameBox('fps','🕹️ FPS Arena', w, ' data-enemies="'+(Number(w.enemies)||4)+'" data-zonespeed="'+(Number(w.zoneSpeed)||25)+'"');
    case 'runner': return gameBox('runner','🏃 Lari Tanpa Hujung', w, '');
    case 's2048': return gameBox('s2048','🔢 2048', w, '');
    case 'snake': return gameBox('snake','🐍 Ular', w, ' data-speed="'+(Number(w.speed)||1)+'"');
    case 'breakout': return gameBox('breakout','🧱 Breakout', w, ' data-rows="'+(Number(w.rows)||5)+'"');
    case 'blox': return gameBox('blox','🧩 Blok Jatuh', w, '');
    case 'astro': return gameBox('astro','☄️ Asteroid', w, '');
    case 'mines': return gameBox('mines','💣 Rambang', w, '');
    default: return '';
  }
}

function renderStage(){
  const f = $('frame');
  f.className = 'frame' + (device==='tablet'?' tablet':device==='desktop'?' desktop':'');
  let warnIds = {};
  if(mode==='edit'){ try{ (typeof checkProject==='function'?checkProject(widgets,theme,$('appName').value):[]).forEach((x)=>{ if(x.id) warnIds[x.id]=x.msg; }); }catch(e){} }
  const block = (w)=>`<div class="w${w.id===selId?' sel':''}${warnIds[w.id]?' warn':''}" data-id="${w.id}" draggable="${mode==='edit'}"><span class="tag">${(TYPES[w.type]||{}).name||w.type}</span>${warnIds[w.id]?`<i class="wb" title="${esc(warnIds[w.id])}">⚠</i>`:''}${widgetMarkup(w)}</div>`;
  const insrow = (i)=>`<div class="insrow"><select class="insSel" data-ins="${i}" tabindex="-1">${insertOptions()}</select></div>`;
  let inner;
  if(!widgets.length){ inner = (mode==='edit'?insrow(0):'') + `<div class="empty">Belum ada widget.<br>Klik <b>＋ tambah</b>, pilih dari panel kiri, atau muat <b>templat</b>.</div>`; }
  else { inner = (mode==='edit'?insrow(0):'') + widgets.map((w,idx)=>block(w)+(mode==='edit'?insrow(idx+1):'')).join(''); }
  f.innerHTML = `<div class="appbar" style="color:${theme.accent}">${esc($('appName').value||'Aplikasi')}</div><div class="sub">${esc(theme.sub||'')}</div><div>${inner}</div>`;
  if(mode==='edit'){ Array.prototype.forEach.call(f.querySelectorAll('[data-edit]'),function(el){ el.setAttribute('contenteditable','true'); el.setAttribute('spellcheck','false'); }); }
  if(mode==='preview' && typeof initGames==='function'){ try{ initGames(f); }catch(err){} }
  try{ if(typeof autoSave==='function') autoSave(); }catch{}
}
function insertOptions(){ return '<option value="">＋ Tambah</option>' + Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.ic} ${v.name}</option>`).join(''); }

// ── Selection + properties ──────────────────────────────────────────────────
function select(id){ selId=id; renderStage(); renderInspector(); }

function field(label, el){ return `<div class="fld"><label>${esc(label)}</label>${el}</div>`; }
function inTxt(key,val){ return `<input data-key="${key}" value="${esc(val==null?'':val)}">`; }
function inArea(key,val){ return `<textarea data-key="${key}">${esc(val==null?'':val)}</textarea>`; }
function inNum(key,val,min,max,step){ return `<input type="number" data-key="${key}" value="${val}" min="${min}" max="${max}" step="${step||1}">`; }
function inSel(key,val,opts){ return `<select data-key="${key}">${opts.map(o=>`<option value="${o[0]}" ${String(val)===String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select>`; }
function inChk(key,val){ return `<input type="checkbox" data-key="${key}" ${val?'checked':''}>`; }
function inColor(key,val){ return `<input class="swatch" type="color" data-key="${key}" value="${val}">`; }
function inBtn(key,label){ return `<button data-act="${key}" class="btn" style="width:100%">${label}</button>`; }

function widgetFields(w){
  const F=[];
  switch(w.type){
    case 'heading': F.push(field('Teks',inArea('text',w.text))); F.push(field('Tahap',inSel('level',w.level,[[1,'H1'],[2,'H2'],[3,'H3']]))); F.push(field('Jajar',alignSel(w.align))); break;
    case 'text': F.push(field('Teks',inArea('text',w.text))); F.push(field('Jajar',alignSel(w.align))); break;
    case 'button': F.push(field('Label',inTxt('label',w.label))); F.push(field('Pautan (optional, kosong=interaktif)',inTxt('href',w.href))); F.push(field('Gaya',inSel('variant',w.variant,[['primary','Utama'],['ghost','Kosong']]))); F.push(field('',inChk('fullWidth',w.fullWidth)+' <span style="font-size:12px">Lebar penuh</span>')); break;
    case 'image': F.push(field('Alt',inTxt('alt',w.alt))); F.push(field('Keterangan',inTxt('caption',w.caption))); F.push(field('Bulat',inNum('radius',w.radius,0,50))); F.push(field('',inBtn('pickimg', w.src?'🖼️ Tukar imej':'⬆️ Muat naik imej'))); if(w.src) F.push(field('',inBtn('clearimg','🗑 Kosongkan imej'))); break;
    case 'input': F.push(field('Label',inTxt('label',w.label))); F.push(field('Placeholder',inTxt('placeholder',w.placeholder))); F.push(field('Jenis',inSel('kind',w.kind,[['text','Teks'],['number','Nombor'],['email','E-mel'],['tel','Tel'],['date','Tarikh']]))); break;
    case 'counter': F.push(field('Label',inTxt('label',w.label))); F.push(field('Nilai mula',inNum('value',w.value,-100000,100000))); F.push(field('Langkah',inNum('step',w.step,1,1000))); break;
    case 'toggle': F.push(field('Label',inTxt('label',w.label))); F.push(field('',inChk('on',w.on)+' <span style="font-size:12px">Mula ON</span>')); break;
    case 'list': F.push(field('Item (satu per baris)',`<textarea data-key="__items" rows="4">${esc((w.items||[]).join('\n'))}</textarea>`)); F.push(field('',inChk('allowAdd',w.allowAdd)+' <span style="font-size:12px">Benar tambah</span>')); break;
    case 'card': F.push(field('Tajuk',inTxt('title',w.title))); F.push(field('Isi',inArea('body',w.body))); break;
    case 'spacer': F.push(field('Tinggi (px)',inNum('height',w.height,4,200))); break;
    case 'faq': F.push(field('Soalan :: Jawapan (satu per baris)',`<textarea data-key="__faq" rows="5">${esc((w.items||[]).map((x)=>x.q+' :: '+x.a).join('\n'))}</textarea>`)); break;
    case 'steps': F.push(field('Tajuk (optional)',inTxt('title',w.title))); F.push(field('Langkah (satu per baris)',`<textarea data-key="__items" rows="4">${esc((w.items||[]).join('\n'))}</textarea>`)); break;
    case 'quiz': F.push(field('Soalan',inTxt('q',w.q))); F.push(field('Pilihan (satu per baris)',`<textarea data-key="__options" rows="4">${esc((w.options||[]).join('\n'))}</textarea>`)); F.push(field('Jawapan betul',inSel('answer',w.answer,(w.options||[]).map((o,i)=>[i,(i+1)+'. '+o])))); break;
    case 'divider': break;
    case 'ttt': F.push(field('','<div class="hint" style="margin:0">Tiada tetapan. Tukar ke <b>Mod Cuba</b> untuk main dua pemain.</div>')); break;
    case 'rps': F.push(field('','<div class="hint" style="margin:0">Tiada tetapan. Main lawan komputer.</div>')); break;
    case 'reaction': F.push(field('','<div class="hint" style="margin:0">Tiada tetapan. Uji masa tindak balas.</div>')); break;
    case 'memory': F.push(field('Bilangan pasangan',inNum('pairs',w.pairs,2,12))); break;
    case 'mole': F.push(field('Tempoh (saat)',inNum('duration',w.duration,5,60))); break;
    case 'guess': F.push(field('Nombor maksimum',inNum('max',w.max,1,9999))); break;
    case 'br': F.push(field('Musuh AI (1-15)',inNum('enemies',w.enemies,1,15))); F.push(field('Tempoh zone (5-60s)',inNum('zoneSpeed',w.zoneSpeed,5,60))); F.push(field('Saiz peta (200-1400)',inNum('mapSize',w.mapSize,200,1400))); break;
    case 'fps': F.push(field('Musuh AI (1-10)',inNum('enemies',w.enemies,1,10))); F.push(field('Tempoh zone (10-60s)',inNum('zoneSpeed',w.zoneSpeed,10,60))); break;
    case 'runner': F.push(field('','<div class="hint" style="margin:0">Tiada tetapan. Klik / Sentuh / Space untuk lompat. Skor = jarak.</div>')); break;
    case 's2048': F.push(field('','<div class="hint" style="margin:0">Tiada tetapan. Anak panah / leret / butang untuk gabung nombor.</div>')); break;
    case 'snake': F.push(field('Kelajuan (×)',inNum('speed',w.speed,0.5,3,0.5))); break;
    case 'breakout': F.push(field('Baris batu bata (3-7)',inNum('rows',w.rows,3,7))); break;
    case 'blox': F.push(field('','<div class="hint" style="margin:0">Tiada tetapan. ←→ gerak · ↑ pusing · ↓ turun · Space jatuh.</div>')); break;
    case 'astro': F.push(field('','<div class="hint" style="margin:0">Tiada tetapan. ←→ pusing · ↑ pecut · Space tembak.</div>')); break;
    case 'mines': F.push(field('','<div class="hint" style="margin:0">Tiada tetapan. 9×9 dengan 10 ranjau — klik-kanan/tahan lama untuk bendera.</div>')); break;
  }
  return F.join('');
}
function alignSel(a){ return inSel('align',a,[['left','Kiri'],['center','Tengah'],['right','Kanan']]); }

let tab='widget';
function renderInspector(){
  const host=$('insp');
  $('tabWidget').classList.toggle('on',tab==='widget');
  $('tabTheme').classList.toggle('on',tab==='theme');
  if(tab==='theme'){ host.innerHTML = themeFields(); return; }
  const w=byId(selId);
  if(!w){ host.innerHTML='<div class="hint">Pilih satu widget pada kanvas untuk menyunting propertinya, atau tambah daripada panel kiri.</div>'; return; }
  const idx=widgets.indexOf(w);
  host.innerHTML = `<h4>${(TYPES[w.type]||{}).ic||''} ${(TYPES[w.type]||{}).name||w.type}</h4>${widgetFields(w)}
    <div class="insp-actions">
      <div class="movedis"><button data-act="up" ${idx<=0?'disabled':''}>▲</button><button data-act="down" ${idx>=widgets.length-1?'disabled':''}>▼</button></div>
      <button data-act="dup">⧉ Duplikasi</button>
      <button data-act="del" style="color:#e5484d">🗑 Buang</button>
    </div>`;
}

function themeFields(){
  return `<h4>🎨 Tema aplikasi</h4>`+
    field('Aksen',inColor('accent',theme.accent))+
    field('Warna latar',inColor('bg',theme.bg))+
    field('Warna teks',inColor('fg',theme.fg))+
    field('Bulat (radius)',inNum('radius',theme.radius,0,28))+
    field('Sub-tajuk',inTxt('sub',theme.sub))+
    field('',inChk('dark',theme.dark)+' <span style="font-size:12px">Mod gelap</span>')+
    field('Huruf',inSel('font',theme.font,[["system-ui, Segoe UI, Roboto, sans-serif","Sistem"],["Georgia, serif","Serif"],["Courier New, monospace","Monospace"],["Impact, sans-serif","Impact"]]))+
    field('Penerangan (SEO / kongsi sosial)',`<textarea data-key="desc" rows="2">${esc(theme.desc||'')}</textarea>`)+
    socialPreview();
}
function socialPreview(){
  const name=esc($('appName').value||'Aplikasi'); const d=esc((theme.desc||'').slice(0,140)||'—');
  return `<h4 style="margin-top:14px">Pratonton bila dikongsi</h4><div class="socialcard"><div class="sc-img">${name}</div><div class="sc-body"><div class="sc-dom">tukuk.org</div><div class="sc-t">${name}</div><div class="sc-d">${d}</div></div></div>`;
}

function applyTheme(){
  const f=$('frame');
  f.style.background = theme.bg; f.style.color = theme.fg; f.style.fontFamily = theme.font;
  document.documentElement.style.setProperty('--acc', theme.accent);
}
</script>

<script>
'use strict';
// ── Sejarah (undo/redo) ─────────────────────────────────────────────────────
function snapshot(){ return JSON.stringify({ widgets, theme, appName: $('appName').value }); }
function pushH(){ const s=snapshot(); if(history.length && history[history.length-1]===s) return; history.push(s); if(history.length>60) history.shift(); future.length=0; }
function restore(s){ const o=JSON.parse(s); widgets=o.widgets; theme=o.theme; $('appName').value=o.appName; if(!byId(selId)) selId=null; renderStage(); applyTheme(); renderInspector(); }
function undo(){ if(history.length<=1) return; future.push(history.pop()); restore(history[history.length-1]); }
function redo(){ if(!future.length) return; const s=future.pop(); history.push(s); restore(s); }
function commit(){ pushH(); renderStage(); applyTheme(); renderInspector(); }

// ── Tambah / ubah widget ────────────────────────────────────────────────────
function addWidget(type){ pushH(); const w={ id:'w'+(uid++), ...TYPES[type].make() }; widgets.push(w); selId=w.id; renderStage(); renderInspector(); }
function setProp(key,val){ const w=byId(selId); if(!w) return;
  if(key==='__items'){ w.items=String(val).split('\n'); }
  else if(key==='__options'){ w.options=String(val).split('\n').map((s)=>s.trim()).filter(Boolean); if((Number(w.answer)||0)>=w.options.length) w.answer=0; }
  else if(key==='__faq'){ w.items=String(val).split('\n').map((l)=>{ const p=l.split('::'); return {q:(p[0]||'').trim(), a:(p[1]||'').trim()}; }).filter((o)=>o.q||o.a); }
  else w[key]=val;
  renderStage();
}

// ── Interaksi kanvas (delegasi) ─────────────────────────────────────────────
$('frame').addEventListener('click',(e)=>{
  const wEl=e.target.closest('.w'); if(!wEl) return;
  if(mode==='edit'){ const id=wEl.dataset.id; if(e.target.closest('[data-edit]') && id===selId) return; if(id) select(id); e.preventDefault(); return; }
  // preview: jalankan tindakan interaktif
  const act=e.target.closest('[data-act]'); if(!act) return;
  const a=act.dataset.act;
  if(a==='inc'||a==='dec'){ const box=act.closest('[data-w]'); const w=byId(box.dataset.w); if(!w)return; const step=Number(w.step)||1; w.value=(Number(w.value)||0)+(a==='inc'?step:-step); const v=box.querySelector('[data-val]'); if(v) v.textContent=w.value; e.preventDefault(); }
  if(a==='noop'){ toast('Butang contoh ✨'); e.preventDefault(); }
  if(a==='faq'){ const ans=act.parentElement.querySelector('.ans'); if(ans){ const open=ans.style.display!=='none'; ans.style.display=open?'none':'block'; act.textContent=(open?'▸ ':'▾ ')+act.textContent.replace(/^[▸▾]\s/,''); } e.preventDefault(); }
  if(a==='quiz'){ const box=act.closest('[data-quiz]'); const correct=Number(box.dataset.answer); const os=box.querySelectorAll('[data-act="quiz"]'); os.forEach((o)=>{ o.style.background='#fff'; o.style.borderColor='#ccd'; }); const ok=Number(act.dataset.i)===correct; act.style.background=ok?'#d7f7dd':'#fde0e0'; act.style.borderColor=ok?'#30d158':'#e5484d'; e.preventDefault(); }
});
$('frame').addEventListener('submit',(e)=>{
  if(mode!=='preview') return;
  const f=e.target.closest('[data-list]'); if(!f) return; e.preventDefault();
  const box=f.closest('.w'); const w=byId(box.dataset.w); if(!w)return;
  const inp=f.querySelector('input'); const val=(inp.value||'').trim(); if(!val)return;
  w.items=(w.items||[]).concat([val]); inp.value=''; renderStage();
});
$('frame').addEventListener('click',(e)=>{
  if(mode!=='preview') return; const d=e.target.closest('[data-act="listdel"]'); if(!d)return; const box=d.closest('.w'); const w=byId(box.dataset.w); if(!w)return; w.items.splice(Number(d.dataset.i),1); renderStage(); e.preventDefault();
});

// ── Inspector (delegasi) ────────────────────────────────────────────────────
function applyField(k,el){ const val=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value; if(tab==='theme'){ theme[k]=val; applyTheme(); renderStage(); } else setProp(k,val); }
$('insp').addEventListener('input',(e)=>{ const k=e.target.dataset.key; if(k) applyField(k,e.target); });
$('insp').addEventListener('change',(e)=>{ const k=e.target.dataset.key; if(k){ applyField(k,e.target); if(tab==='theme') commit(); } });
$('insp').addEventListener('blur',(e)=>{ if(e.target.dataset.key) commit(); }, true);
$('insp').addEventListener('click',(e)=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act; const w=byId(selId); const idx=w?widgets.indexOf(w):-1;
  if(a==='up'&&idx>0){ pushH(); widgets.splice(idx-1,0,widgets.splice(idx,1)[0]); commit(); }
  if(a==='down'&&idx>=0&&idx<widgets.length-1){ pushH(); widgets.splice(idx+1,0,widgets.splice(idx,1)[0]); commit(); }
  if(a==='dup'&&w){ pushH(); const c=JSON.parse(JSON.stringify(w)); c.id='w'+(uid++); widgets.splice(idx+1,0,c); selId=c.id; commit(); }
  if(a==='del'&&w){ pushH(); widgets=widgets.filter(x=>x.id!==w.id); selId=null; commit(); toast('Widget dibuang.'); }
  if(a==='pickimg'){ $('imgIn').dataset.for=w.id; $('imgIn').click(); }
  if(a==='clearimg'&&w){ pushH(); w.src=''; commit(); }
});

// ── Muat naik imej → dataURL (mandiri dalam eksport) ────────────────────────
$('imgIn').addEventListener('change',(e)=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ const w=byId($('imgIn').dataset.for); if(w){ pushH(); w.src=r.result; commit(); toast('Imej dimuat naik.'); } };
  r.readAsDataURL(f); e.target.value='';
});

// ── Drag & drop susun semula (mod edit) ─────────────────────────────────────
let dragId=null;
$('frame').addEventListener('dragstart',(e)=>{ const el=e.target.closest('.w'); if(!el||mode!=='edit'){ e.preventDefault(); return; } dragId=el.dataset.id; });
$('frame').addEventListener('dragover',(e)=>{ if(mode!=='edit')return; e.preventDefault(); const over=e.target.closest('.w'); if(!over||!dragId||over.dataset.id===dragId)return; const from=widgets.findIndex(w=>w.id===dragId); const to=widgets.findIndex(w=>w.id===over.dataset.id); if(from<0||to<0)return; const [m]=widgets.splice(from,1); widgets.splice(to,0,m); if(from!==to) renderStage(); });
$('frame').addEventListener('dragend',()=>{ if(dragId){ pushH(); dragId=null; renderStage(); } });

// ── Sunting teks terus pada kanvas (contenteditable, tanpa panel) ──
$('frame').addEventListener('focusout',(e)=>{
  if(mode!=='edit') return; const el=e.target.closest('[data-edit]'); if(!el) return;
  const wEl=el.closest('.w'); const w=byId(wEl&&wEl.dataset.id); if(!w) return;
  const key=el.dataset.edit; const val=el.textContent;
  if(String(w[key]||'')!==val){ pushH(); w[key]=val; renderStage(); renderInspector(); }
});
// ── Selit widget pada kedudukan (＋ tambah di sini) ──
function insertWidgetAt(type,idx){ pushH(); const w={ id:'w'+(uid++), ...(TYPES[type]||{make:()=>({type})}).make() }; idx=Math.max(0,Math.min(idx,widgets.length)); widgets.splice(idx,0,w); selId=w.id; commit(); }
$('frame').addEventListener('change',(e)=>{ if(mode!=='edit') return; const sel=e.target.closest('.insSel'); if(!sel||!sel.value) return; insertWidgetAt(sel.value, Number(sel.dataset.ins)); });
</script>

<script>
'use strict';
// ── Toolbar & mod ───────────────────────────────────────────────────────────
$('palette').innerHTML = Object.entries(TYPES).map(([k,v])=>`<button class="pal" data-add="${k}"><span class="ic">${v.ic}</span>${v.name}</button>`).join('');
$('palette').addEventListener('click',(e)=>{ const b=e.target.closest('[data-add]'); if(b) addWidget(b.dataset.add); });

// Templat awal: populasikan dropdown + muat apabila dipilih.
$('tpl').innerHTML = '<option value="">🗂 Templat…</option>' + Object.entries(TEMPLATES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
$('tpl').addEventListener('change',(e)=>{ const v=e.target.value; if(v) loadTemplate(v); e.target.value=''; });
function loadTemplate(name){ const t=TEMPLATES[name]; if(!t) return; pushH(); $('appName').value=t.appName||'Aplikasi'; theme=Object.assign({},DEF_THEME,t.theme||{}); widgets=(t.widgets||[]).map((r)=>Object.assign({id:'w'+(uid++)},r)); selId=null; renderStage(); applyTheme(); renderInspector(); toast('🗂 Templat dimuat: '+t.label); }

// ── ✨ Jana auto: idea → app + game (AI bila tersedia, heuristik sebagai fallback) ──
const GAME_SET = ['ttt','memory','mole','rps','reaction','guess','br','fps','runner'];
// Pratonton MINI statik (tanpa JS/skrip) bagi satu calon — pakai penanda sebenar widgetMarkup.
function miniDoc(app){
  const th = Object.assign({}, DEF_THEME, app.theme || {});
  const _t = theme; theme = th;
  let body = ''; try { body = (app.widgets || []).map(widgetMarkup).join('\n'); } finally { theme = _t; }
  const css = ':root{color-scheme:' + (th.dark ? 'dark' : 'light') + '}*{box-sizing:border-box}body{margin:0;background:' + th.bg + ';color:' + th.fg + ';font-family:' + th.font + ';padding:12px;max-width:420px;margin:0 auto;line-height:1.5}h1,h2,h3{margin:.3em 0}a{text-decoration:none}button,.btn{font:inherit}.appbar{font-weight:800;font-size:18px;color:' + th.accent + ';margin-bottom:8px}';
  return '<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + css + '</style></head><body><div class="appbar">' + esc(app.appName || 'Aplikasi') + '</div>' + body + '</body></html>';
}
function genCardHtml(a, i){
  const th = a.theme || {}; const bg = esc(th.bg || '#0f1116'); const acc = esc(th.accent || '#4c8dff');
  const game = (a.widgets || []).find((w) => GAME_SET.includes(w.type));
  const gic = game ? ((TYPES[game.type] && TYPES[game.type].ic) || '🎮') : '—';
  const chips = (a.widgets || []).slice(0, 7).map((w) => (TYPES[w.type] && TYPES[w.type].ic) || '•').join(' ');
  const badge = a._src === 'ai' ? '<span style="background:' + acc + ';color:#041024;border-radius:6px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:6px">🤖 AI</span>' : '';
  return `<div class="gencard" data-i="${i}" style="border:1px solid #262b36;border-radius:12px;padding:12px;margin:8px 0"><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:34px;border-radius:9px;flex:none;background:${bg};border:2px solid ${acc};display:inline-block"></span><div style="flex:1;min-width:0"><b style="color:${acc}">${esc(a.appName || 'Aplikasi')}</b>${badge}<div style="font-size:12px;color:#88909f">${esc(chips)} · 🎮 ${esc(gic)}</div></div></div><iframe class="gpre" data-i="${i}" sandbox="" title="Pratonton" style="width:100%;height:170px;border:1px solid #262b36;border-radius:8px;background:#0b0f1a;margin:10px 0 0"></iframe><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" data-gact="use" data-i="${i}">📥 Pakai</button><button class="btn primary" data-gact="pub" data-i="${i}">🚀 Pakai &amp; Terbitkan</button><button class="btn ghost" data-gact="cmp" data-i="${i}" title="Tandakan untuk bandingkan">🆚<span class="cmpmk" style="display:none">✓</span></button><button class="btn ghost" data-gact="full" data-i="${i}" title="Buka pratonton penuh">🔍</button></div></div>`;
}
function applyGenerated(a, source){
  if(!a || !Array.isArray(a.widgets)) return;
  pushH();
  $('appName').value = a.appName || 'Aplikasi';
  theme = Object.assign({}, DEF_THEME, a.theme || {});
  widgets = a.widgets.filter((w) => w && TYPES[w.type]).map((w) => Object.assign({ id: 'w' + (uid++) }, w));
  selId = null; renderStage(); applyTheme(); renderInspector();
  toast((source === 'ai' ? '🤖 Dijana AI · ' : '✨ Dijana auto · ') + widgets.length + ' widget — sunting & terbitkan.');
}
// Idea rawak untuk 🎲 Rambang.
const RANDOM_IDEAS = ['resepi nasi lemak','penjejak kewangan','kad ucapan hari jadi','kuiz sejarah melayu','tugas harian','pembelalah haiwan peliharaan','teka kata','kad perniagaan','kalendar solat','pemasa tomato','panduan melancong','arked retro','kuiz sains','senarai buku','resipi smoothie','penjejak hujan'];
let genState = { idea:'', apps:[], src:'', seed:0 };
let genCompare = new Set();
// Pratonton INTERAKTIF — doc penuh + runtimeJS (game jalan). Hanya dimuat bila kad kelihatan.
function liveDoc(app){
  const th = Object.assign({}, DEF_THEME, app.theme || {});
  const _t = theme; theme = th;
  let body = ''; try { body = (app.widgets || []).map(widgetMarkup).join('\n'); } finally { theme = _t; }
  const css = ':root{color-scheme:' + (th.dark ? 'dark' : 'light') + '}*{box-sizing:border-box}body{margin:0;background:' + th.bg + ';color:' + th.fg + ';font-family:' + th.font + ';padding:12px;max-width:420px;margin:0 auto;line-height:1.5}h1,h2,h3{margin:.3em 0}a{text-decoration:none}button,.btn{font:inherit}.appbar{font-weight:800;font-size:18px;color:' + th.accent + ';margin-bottom:8px}';
  return '<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + css + '</style></head><body><div class="appbar">' + esc(app.appName || 'Aplikasi') + '</div>' + body + '<scr' + 'ipt>' + runtimeJS() + '</scr' + 'ipt></body></html>';
}
let genIO = null;
function disconnectIO(){ if(genIO){ try { genIO.disconnect(); } catch (e) {} genIO = null; } }
// Lazy: statik sebagai placeholder; tukar ke interaktif hanya bila iframe >=50% kelihatan, dan mati semula bila keluar skrin (elak 3 rAF serentak).
function mountPreviews(apps){
  const frames = Array.prototype.slice.call($('modal').querySelectorAll('iframe.gpre'));
  const safeMini = (a) => { try { return miniDoc(a); } catch (e) { return ''; } };
  const safeLive = (a) => { try { return liveDoc(a); } catch (e) { return safeMini(a); } };
  frames.forEach((f) => { const idx = Number(f.getAttribute('data-i')); f.setAttribute('sandbox', ''); f.srcdoc = safeMini(apps[idx]); f.__live = false; });
  disconnectIO();
  if(!('IntersectionObserver' in window) || !frames.length) return;
  const root = $('modal').querySelector('.glist') || null;
  const ratio = new Map();
  const setLive = (f, on) => { const a = apps[Number(f.getAttribute('data-i'))]; if(!a) return; if(!!f.__live === !!on) return; f.__live = !!on; if(on){ f.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups'); f.srcdoc = safeLive(a); } else { f.setAttribute('sandbox', ''); f.srcdoc = safeMini(a); } };
  // Hanya satu kad 'live' pada satu masa — yang paling nampak (ratio≥0.5, maksimum); yang lain statik.
  const pick = () => { let best = null, bv = 0.5; frames.forEach((f) => { const r = ratio.get(f) || 0; if(r >= bv){ bv = r; best = f; } }); frames.forEach((f) => setLive(f, f === best)); };
  genIO = new IntersectionObserver((entries) => { entries.forEach((e) => ratio.set(e.target, e.isIntersecting ? e.intersectionRatio : 0)); pick(); }, { root: root, threshold: [0, 0.5, 1] });
  frames.forEach((f) => genIO.observe(f));
}

  mountPreviews(apps);

function runGenerate(idea, seed){

  if(!idea){ toast('Taip satu idea/kata dahulu.'); $('genIdea').focus(); return; }

  const color = ($('genColor') && $('genColor').value) || '';
  const lang = ($('genLang') && $('genLang').value) || '';
  const useSeed = Math.max(0, Math.floor(Number(seed) || 0));
  const b = $('genBtn'); const old = b.textContent; b.disabled = true; b.textContent = '⏳ Menjana…';
  fetch('/api/builder/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idea, style, seed: useSeed, color, lang }) })
    .then((r) => r.json().then((j) => ({ ok: r.ok, j })).catch(() => ({ ok: false, j: { error: 'Respons bukan JSON' } })))
    .then((res) => {
      if(!res.ok || !res.j) throw new Error((res.j && res.j.error) || 'tiada hasil');
      const apps = Array.isArray(res.j.apps) ? res.j.apps : (res.j.app ? [res.j.app] : []);
      if(!apps.length) throw new Error('tiada hasil');
      const src = res.j.source;
      genState = { idea: idea, apps: apps, src: src, seed: useSeed };
      if($('genAutoPub') && $('genAutoPub').checked){ const pick = apps.find((a) => a._src === 'ai') || apps[0]; applyGenerated(pick, pick._src || src); toast('🔁 Auto-terbit — sahkan slug…'); reviewAndPublish(pick); return; }
      renderCandidates(idea, apps, src);
    })
    .catch((err) => toast('⚠ Jana gagal: ' + ((err && err.message) || err)))
    .then(() => { b.disabled = false; b.textContent = old; });
}

// ── ZIP (kaedah STORE, tanpa perpustakaan luar) ──
function crc32(bytes){ var t=[],c,n,k; for(n=0;n<256;n++){ c=n; for(k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c; } var crc=0xFFFFFFFF; for(n=0;n<bytes.length;n++) crc=t[(crc^bytes[n])&0xFF]^(crc>>>8); return (crc^0xFFFFFFFF)>>>0; }
function buildZip(entries){
  var enc=new TextEncoder(); var parts=[]; var central=[]; var off=0;
  function u16(x){ return [x&255,(x>>>8)&255]; }
  function u32(x){ return [x&255,(x>>>8)&255,(x>>>16)&255,(x>>>24)&255]; }
  entries.forEach(function(en){
    var nb=enc.encode(en.name); var db=(en.data instanceof Uint8Array)?en.data:enc.encode(String(en.data));
    var crc=crc32(db); var sz=db.length;
    var head=[0x50,0x4b,0x03,0x04].concat(u16(20),u16(0),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nb.length),u16(0));
    var hb=new Uint8Array(head); parts.push(hb, nb, db);
    var co=off; off+=hb.length+nb.length+db.length;
    var cd=[0x50,0x4b,0x01,0x02].concat(u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nb.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(co));
    central.push(new Uint8Array(cd), nb);
  });
  var cstart=off, csize=0; central.forEach(function(c){ csize+=c.length; parts.push(c); });
  var eocd=[0x50,0x4b,0x05,0x06].concat(u16(0),u16(0),u16(entries.length),u16(entries.length),u32(csize),u32(cstart),u16(0));
  parts.push(new Uint8Array(eocd));
  var total=0; parts.forEach(function(p){ total+=p.length; });
  var out=new Uint8Array(total); var p=0; parts.forEach(function(x){ out.set(x,p); p+=x.length; });
  return out;
}

    .then((r)=> r.json().then((j)=>({ ok:r.ok, j })).catch(()=>({ ok:false, j:{ error:'Respons bukan JSON' } })) )
    .then((res)=>{
      if(!res.ok||!res.j||!res.j.url){ toast('⚠ Kemas kini gagal: '+((res.j&&res.j.error)||'pautan lama mungkin telah dibuang')); return; }
      app.title=$('appName').value||app.title; if(!app.url)app.url=res.j.url; addMyApp(app);
      toast('🔄 Dikemas kini '+res.j.url); if(done)done();
    })
    .catch((err)=>toast('⚠ '+((err&&err.message)?err.message:'Gagal kemas kini')));
}
function doDelete(app, done){

  fetch('/api/publish/delete',{ method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ slug:app.slug, editKey:app.editKey }) })

}
