// ── Pemeriksaan automatik (aksesibiliti / kontras / pautan) ──
function hexLum(hex){ let m=String(hex||'').replace('#','').trim(); if(/^[0-9a-fA-F]{3}$/.test(m)) m=m.split('').map((c)=>c+c).join(''); if(!/^[0-9a-fA-F]{6}$/.test(m)) return 0; const r=parseInt(m.substr(0,2),16)/255,g=parseInt(m.substr(2,2),16)/255,b=parseInt(m.substr(4,2),16)/255; const f=(c)=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4); return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b); }
function contrast(a,b){ const L1=hexLum(a),L2=hexLum(b); const hi=Math.max(L1,L2),lo=Math.min(L1,L2); return (hi+0.05)/(lo+0.05); }
function checkProject(ws, th, appName){
  const out=[]; const list=Array.isArray(ws)?ws:[]; const t=th||{};
  if(!appName || !String(appName).trim()) out.push({ id:null, msg:'Nama aplikasi kosong — tajuk & pautan jadi umum.' });
  const ratio=contrast(t.bg||'#ffffff', t.fg||'#000000');
  if(ratio < 4.5) out.push({ id:null, msg:'Kontras teks/latar rendah ('+ratio.toFixed(1)+':1) — sukar dibaca.' });
  list.forEach((w)=>{
    if(w.type==='image'){ if(!w.src||!String(w.src).trim()) out.push({ id:w.id, msg:'Imej belum ada sumber (placeholder sahaja).' }); else if(!w.alt||!String(w.alt).trim()) out.push({ id:w.id, msg:'Imej tiada teks alt (aksesibiliti).' }); }
    if((w.type==='heading'||w.type==='text') && (!w.text||!String(w.text).trim())) out.push({ id:w.id, msg:'Teks widget ini kosong.' });
    if(w.type==='button' && w.href && !/^(https?:|mailto:|tel:|#|\/)/.test(w.href)) out.push({ id:w.id, msg:'Pautan butang mungkin tak sah: '+w.href });
  });
  return out;
}

function decodeProj(s){ return JSON.parse(decodeURIComponent(escape(atob(s)))); }
function copyText(text, okmsg){ const done=()=>toast(okmsg||'📋 Disalin ke papan klip'); function fb(){ const ta2=document.createElement('textarea'); ta2.value=text; document.body.appendChild(ta2); ta2.select(); try{ document.execCommand('copy'); }catch(err){} ta2.remove(); done(); } try{ navigator.clipboard.writeText(text).then(done,fb); }catch(err){ fb(); } }

  const tag=(e.target.tagName||'').toLowerCase();
  const typing = tag==='input'||tag==='textarea'||tag==='select'|| e.target.isContentEditable;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(typing) return;
  if($('modal').classList.contains('show')){ if(e.key==='Escape') closeModal(); return; }

  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){ if(w){ pushH(); const c=JSON.parse(JSON.stringify(w)); c.id='w'+(uid++); widgets.splice(widgets.indexOf(w)+1,0,c); selId=c.id; commit(); toast('⧉ Widget diduplikasi.'); } e.preventDefault(); return; }
  if(e.key==='Escape'){ if(selId){ selId=null; renderStage(); renderInspector(); } return; }
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){ if(w){ const i=widgets.indexOf(w); const j=e.key==='ArrowUp'?i-1:i+1; if(j>=0&&j<widgets.length){ pushH(); widgets.splice(j,0,widgets.splice(i,1)[0]); commit(); } } e.preventDefault(); return; }
  if(e.key==='?'){ toggleHelp(); e.preventDefault(); }

<script>
'use strict';
// ── Paparan KOD: editor HTML bersorak + pratonton langsung (gaya "coder", tanpa AI) ──
(function(){
  const ta=$('edTA'), codeEl=$('edCode'), preWrap=$('edPre'), gutter=$('edGutter'), preview=$('edPreview');
  const escHtml=(s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Sorak sintaks ringan: komen, rentetan, tag HTML, kata kunci JS. Selamat (keluar di-escape).
  function highlight(c){
    let out='',last=0,m;
    const re=/(<!--[\s\S]*?-->|\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:[^"\\]|\\.)*?"|'(?:[^'\\]|\\.)*?')|(<\/?[A-Za-z][^>]*>?)|(\b(?:function|return|if|else|for|while|var|let|const|new|document|window)\b)/g;
    while((m=re.exec(c))){
      out+=escHtml(c.slice(last,m.index));
      const cls=m[1]?'c':m[2]?'s':m[3]?'t':'k';
      out+='<span class="'+cls+'">'+escHtml(m[0])+'</span>';
      last=m.index+m[0].length;
    }
    return out+escHtml(c.slice(last));
  }
  // ── Tiga tab: setiap satu menyimpan buffer sendiri; pratonton gabungkan semua ──
  const panes={ html:'', css:'', js:'' };
  let codeTab='html';
  function regen(){ panes.html=exportBody(); panes.css=exportCSS(); panes.js=runtimeJS(); }
  function assemble(){ return buildDoc(panes.html, panes.css, panes.js, $('appName').value||'Aplikasi'); }
  function commit(){ panes[codeTab]=ta.value; }
  function load(){ ta.value=panes[codeTab]; document.querySelectorAll('.codetabs [data-ctab]').forEach((b)=>b.classList.toggle('on', b.dataset.ctab===codeTab)); renderEditor(); }
  function setTab(t){ commit(); codeTab=t; load(); runPreview(); }
  function renderEditor(){ const v=ta.value; codeEl.innerHTML=highlight(v)+'\n'; let g=''; const n=v.split('\n').length; for(let i=1;i<=n;i++) g+=i+'\n'; gutter.textContent=g; syncScroll(); }
  function syncScroll(){ preWrap.scrollTop=ta.scrollTop; preWrap.scrollLeft=ta.scrollLeft; gutter.scrollTop=ta.scrollTop; }
  function runPreview(){ preview.srcdoc=assemble(); }
  let rt; function autoRun(){ clearTimeout(rt); rt=setTimeout(runPreview,400); }
  function refresh(){ commit(); renderEditor(); if($('codeRunChk').checked) autoRun(); }
  function setView(v){ const code=v==='code'; document.body.classList.toggle('code',code); $('viewCode').classList.toggle('active',code); $('viewDesign').classList.toggle('active',!code); }
  function toCode(){ regen(); codeTab='html'; setView('code'); load(); runPreview(); }
  // Format/indent ringkas ikut tab: sisip baris baru selepas tag/}/;.
  function formatCode(){
    let v=ta.value;
    if(codeTab==='css') v=v.replace(/\}/g,'}\n');
    else if(codeTab==='html') v=v.replace(/(<\/(?:div|p|h1|h2|h3|section|ul|figure|label|form)>)/g,'$1\n');
    else if(codeTab==='js') v=v.replace(/;\s*/g,';\n');
    { const NL=String.fromCharCode(10); const out=[]; for(const raw of v.split(NL)){ const l=raw.replace(/ +$/,''); if(l===''&&(!out.length||out[out.length-1]==='')) continue; out.push(l); } v=out.join(NL).trim(); }
    ta.value=v; refresh(); runPreview(); toast('✨ Kod diformat');
  }
  // Auto-lengkap pasangan kurung/tanda petik/tag + Enter ber-indent + Backspace padam pasangan.
  function applyKey(text,s,e,key){
    const PAIRS={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`','<':'>'};
    const CLOSERS={')':'(',']':'[','}':'{','"':'"',"'":"'",'`':'`','>':'<'};
    const VOID=['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'];
    if(PAIRS[key] && e>s){ const inner=text.slice(s,e); const nt=text.slice(0,s)+key+inner+PAIRS[key]+text.slice(e); return {text:nt, caret:s+1, selEnd:s+1+inner.length}; }
    if(PAIRS[key]){ const nt=text.slice(0,s)+key+PAIRS[key]+text.slice(e); return {text:nt, caret:s+1, selEnd:s+1}; }
    if(CLOSERS[key] && e===s && text[s]===key){ return {text, caret:s+1, selEnd:s+1}; }
    if(key==='>' && e===s){ const before=text.slice(0,s); const m=before.match(/<([a-zA-Z][\w-]*)((?:"[^"]*"|'[^']*'|[^>])*)$/); if(m && !/\/\s*$/.test(m[2]) && VOID.indexOf(m[1].toLowerCase())<0){ const tag=m[1]; const nt=before+'>'+('</'+tag+'>')+text.slice(e); const c=s+1; return {text:nt, caret:c, selEnd:c}; } }
    if(key==='Enter'){
      const before=text.slice(0,s), after=text.slice(e), prev=before.slice(-1), next=after.slice(0,1);
      const indent=(before.match(/[^\n]*$/)||[''])[0].match(/^\s*/)[0];
      if(prev==='{' && next==='}'){ const nt=before+'\n'+indent+'  \n'+indent+after; const c=before.length+1+indent.length+2; return {text:nt, caret:c, selEnd:c}; }
      const OB=String.fromCharCode(123); const extra=prev===OB?'  ':''; const nt=before+'\n'+indent+extra+after; const c=before.length+1+indent.length+extra.length; return {text:nt, caret:c, selEnd:c};
    }
    if(key==='Backspace'){
      if(e===s && s>0){ const p=text[s-1], n=text[s]; for(const o in PAIRS){ if(o===p && PAIRS[o]===n) return {text:text.slice(0,s-1)+text.slice(s+1), caret:s-1, selEnd:s-1}; } }
      return null;
    }
    return null;
  }
  window.builderApplyKey=applyKey;

  $('viewCode').onclick=toCode;
  $('viewDesign').onclick=()=>setView('design');
  document.querySelectorAll('.codetabs [data-ctab]').forEach((b)=>b.onclick=()=>setTab(b.dataset.ctab));
  $('codeRegen').onclick=()=>{ regen(); load(); runPreview(); toast('↺ Kod dijana semula daripada Rekaan'); };
  $('codeFmt').onclick=formatCode;
  $('codeRun').onclick=()=>{ runPreview(); toast('▶️ Pratonton disegar semula'); };
  $('codeDl').onclick=()=>{ download(assemble(), safe($('appName').value)+'.html','text/html'); toast('⬇️ HTML dimuat turun'); };
  $('codeCopy').onclick=()=>{ const ok=()=>toast('📋 '+codeTab.toUpperCase()+' disalin'); function fb(){ ta.focus(); ta.select(); try{ document.execCommand('copy'); }catch{} ok(); } try{ navigator.clipboard.writeText(ta.value).then(ok,fb); }catch{ fb(); } };

  ta.addEventListener('input',refresh);
  ta.addEventListener('scroll',syncScroll);
  // Auto-lengkap pasangan + Enter indent + Backspace padam pasangan (gaya IDE).
  ta.addEventListener('keydown',(e)=>{
    if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd; ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+2; refresh(); return; }
    const r=applyKey(ta.value, ta.selectionStart, ta.selectionEnd, e.key);
    if(r){ e.preventDefault(); ta.value=r.text; ta.selectionStart=r.caret; ta.selectionEnd=(r.selEnd==null?r.caret:r.selEnd); refresh(); }
  });

  // Eksport menghormati mod: dalam Kod → gabung ketiga-tiga tab (termasuk suntingan manual).
  $('exportBtn').onclick=()=>{ const code=document.body.classList.contains('code'); download(code?assemble():buildExport(), safe($('appName').value)+'.html','text/html'); toast('📦 HTML dieksport'+(code?' (kod)':'')+' — buka di mana-mana.'); };

  window.builderCodeOpen=()=>document.body.classList.contains('code');
  window.builderAssemble=assemble;   // dokumen penuh dari 3 tab (dipakai Terbitan)
})();
</script>
