<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator — Tukuk Apps — Tukuk-OS</title>
<meta name="description" content="A fast calculator that runs in your browser — basic and scientific mode, keyboard support, parentheses and history. No uploads.">
<link rel="canonical" href="https://tukuk.org/apps/calc">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  header .spacer { flex:1; }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .toggle button { background:var(--panel); border:0; color:var(--muted); padding:6px 12px; font-size:.82rem; cursor:pointer; }
  .toggle button.active { background:var(--accent); color:#fff; }
  .wrap { max-width:460px; margin:0 auto; padding:16px; }
  .display { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; text-align:right; margin-bottom:14px; }
  .display .expr { color:var(--muted); font-size:.9rem; min-height:1.2em; word-break:break-all; }
  .display .out { font-size:2.2rem; font-weight:600; word-break:break-all; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .keys.sci { grid-template-columns:repeat(5,1fr); }
  .key { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 0; font-size:1.15rem; cursor:pointer; color:var(--text); user-select:none; transition:background .1s; }
  .key:hover { background:var(--bg); }
  .key.op { color:var(--accent); font-weight:700; }
  .key.eq { background:var(--accent); color:#fff; border-color:var(--accent); }
  .key.fn { font-size:.95rem; color:var(--muted); }
  .key.clear { color:#e03030; }
  .hist { margin-top:16px; font-size:.86rem; }
  .hist h3 { margin:0 0 8px; color:var(--muted); font-size:.82rem; font-weight:600; }
  .hist .row { display:flex; justify-content:space-between; gap:10px; padding:6px 8px; border-radius:6px; cursor:pointer; color:var(--muted); }
  .hist .row:hover { background:var(--panel); color:var(--text); }
  .hist .row .r { font-variant-numeric:tabular-nums; }
  .hint { color:var(--muted); font-size:.78rem; margin-top:10px; text-align:center; }
</style>
</head>
<body>
<header>
  <a class="back" href="/apps">← Apps</a>
  <h1>🧮 Calculator</h1>
  <span class="spacer"></span>
  <span class="toggle"><button id="btnBasic" class="active" onclick="setMode('basic')">Basic</button><button id="btnSci" onclick="setMode('sci')">Scientific</button></span>
  <span class="toggle"><button id="btnDeg" class="active" onclick="setAngle('deg')">DEG</button><button id="btnRad" onclick="setAngle('rad')">RAD</button></span>
</header>
<div class="wrap">
  <div class="display">
    <div class="expr" id="expr">&nbsp;</div>
    <div class="out" id="out">0</div>
  </div>
  <div class="keys" id="keys"></div>
  <div class="hist" id="histBox"><h3>History</h3><div id="hist"></div></div>
  <p class="hint">Tip: use your keyboard — digits, <code>+ - * / ( )</code>, <code>^</code>, Enter to equal, Backspace, Esc to clear.</p>
</div>

<script>
const BASIC = ['C','⌫','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.', '^','π','='];
const SCI = ['C','⌫','(',')','sin','cos','tan','ln','log','√','^','π','e','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.',',','%','='];
let mode = 'basic', angle = 'deg', cur = '', hist = [];
const exprEl = document.getElementById('expr'), outEl = document.getElementById('out');

// ——— Safe recursive-descent parser (no eval) ———
function tokenize(s) {
  const t = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9.]/.test(c)) { let n=''; while (i<s.length && /[0-9.]/.test(s[i])) n+=s[i++]; t.push({k:'num',v:parseFloat(n)}); continue; }
    if (/[a-zA-Z]/.test(c)) { let a=''; while (i<s.length && /[a-zA-Z]/.test(s[i])) a+=s[i++]; t.push({k:'id',v:a.toLowerCase()}); continue; }
    if ('+-*/^(),%'.includes(c)) { t.push({k:'op',v:c}); i++; continue; }
    throw new Error('unexpected '+c);
  }
  return t;
}
function toStar(s){ return s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/,/g,''); }
function parser(tokens){ let p=0; const peek=()=>tokens[p], eat=()=>tokens[p++];
  function expr(){ let l=term(); while(peek()&&peek().k==='op'&&(peek().v==='+'||peek().v==='-')){ const o=eat().v; const r=term(); l=o==='+'?l+r:l-r; } return l; }
  function term(){ let l=unary(); while(peek()&&peek().k==='op'&&(peek().v==='*'||peek().v==='/')){ const o=eat().v; const r=unary(); l=o==='*'?l*r:l/r; } return l; }
  function unary(){ if(peek()&&peek().k==='op'&&peek().v==='-'){ eat(); return -unary(); } if(peek()&&peek().k==='op'&&peek().v==='+'){ eat(); return unary(); } return power(); }
  function power(){ let b=atom(); if(peek()&&peek().k==='op'&&peek().v==='^'){ eat(); const e=unary(); return Math.pow(b,e); } return b; }
  function atom(){ const tk=peek(); if(!tk) throw new Error('unexpected end');
    if(tk.k==='num'){ eat(); return tk.v; }
    if(tk.k==='id'){ eat();
      if(tk.v==='pi') return Math.PI; if(tk.v==='e') return Math.E;
      const fn=tk.v; if(peek()&&peek().k==='op'&&peek().v==='('){ eat(); const a=expr(); if(!peek()||peek().v!==')') throw new Error('missing )'); eat(); return applyFn(fn,a); }
      throw new Error('unknown '+fn);
    }
    if(tk.k==='op'&&tk.v==='('){ eat(); const a=expr(); if(!peek()||peek().v!==')') throw new Error('missing )'); eat(); return a; }
    throw new Error('unexpected token');
  }
  return expr;
}
function applyFn(f,x){ const r=angle==='deg'?x*Math.PI/180:x;
  switch(f){ case 'sin':return Math.sin(r); case 'cos':return Math.cos(r); case 'tan':return Math.tan(r);
    case 'asin':return (angle==='deg'?Math.asin(x)*180/Math.PI:Math.asin(x)); case 'acos':return (angle==='deg'?Math.acos(x)*180/Math.PI:Math.acos(x));
    case 'atan':return (angle==='deg'?Math.atan(x)*180/Math.PI:Math.atan(x)); case 'ln':return Math.log(x); case 'log':return Math.log10(x);
    case 'sqrt': if(x<0) throw new Error('√ negative'); return Math.sqrt(x); case 'exp':return Math.exp(x); case 'abs':return Math.abs(x); default: throw new Error('fn '+f); }
}
function evaluate(s){ const toks=tokenize(toStar(s)); return parser(toks); }

function fmt(n){ if(!isFinite(n)) throw new Error('undefined result'); const r=Math.round(n*1e10)/1e10; return Number.isInteger(r)?String(r):String(parseFloat(r.toPrecision(12))); }

function press(v){
  if(v==='C'){ cur=''; render('',cur); return; }
  if(v==='⌫'){ cur=cur.slice(0,-1); render('',cur); return; }
  if(v==='='){ doEquals(); return; }
  cur += v; render('',cur);
}
function doEquals(){
  if(!cur) return;
  try { const val=evaluate(cur); const res=fmt(val); pushHist(cur,res); exprEl.textContent=cur+' ='; outEl.textContent=res; cur=res; }
  catch(e){ outEl.textContent='Error'; exprEl.textContent=e.message||'Invalid'; setTimeout(()=>render('',cur),1400); }
}
function render(e,o){ exprEl.innerHTML=e||'&nbsp;'; outEl.textContent=o||'0'; }

function buildKeys(){
  const list = mode==='sci'?SCI:BASIC; const box=document.getElementById('keys'); box.className='keys'+(mode==='sci'?' sci':''); box.innerHTML='';
  for(const k of list){
    const b=document.createElement('button'); b.textContent=k; b.className='key';
    if('÷×−+^%'.includes(k)) b.classList.add('op');
    if(k==='=') b.classList.add('eq');
    if(k==='C'||k==='⌫') b.classList.add('clear');
    if(/[a-z√π]/.test(k)&&k!=='C'&&k!=='⌫') b.classList.add('fn');
    b.onclick=()=>press(k==='÷'? '÷':k==='×'?'×':k==='−'?'−':k);
    box.appendChild(b);
  }
}
function setMode(m){ mode=m; document.getElementById('btnBasic').classList.toggle('active',m==='basic'); document.getElementById('btnSci').classList.toggle('active',m==='sci'); buildKeys(); }
function setAngle(a){ angle=a; document.getElementById('btnDeg').classList.toggle('active',a==='deg'); document.getElementById('btnRad').classList.toggle('active',a==='rad'); }

function pushHist(e,r){ hist.unshift({e,r}); if(hist.length>25) hist.pop(); localStorage.setItem('tukuk_calc_hist',JSON.stringify(hist)); renderHist(); }
function renderHist(){ try{ hist=JSON.parse(localStorage.getItem('tukuk_calc_hist')||'[]'); }catch{ hist=[]; }
  document.getElementById('hist').innerHTML = hist.length ? hist.map((h,i)=>`<div class="row" data-i="${i}"><span class="e">${h.e}</span><span class="r">= ${h.r}</span></div>`).join('') : '<div style="color:var(--muted)">Nothing yet.</div>';
  document.querySelectorAll('.hist .row').forEach(row=>row.onclick=()=>{ const h=hist[+row.dataset.i]; cur=h.r; render('',cur); });
}

document.addEventListener('keydown',ev=>{
  const k=ev.key;
  if(/^[0-9.+\-*/^()%]$/.test(k)){ ev.preventDefault(); press(k); }
  else if(k==='Enter'||k==='='){ ev.preventDefault(); doEquals(); }
  else if(k==='Backspace'){ ev.preventDefault(); press('⌫'); }
  else if(k==='Escape'){ ev.preventDefault(); press('C'); }
  else if(k==='('||k===')'){ ev.preventDefault(); press(k); }
});

buildKeys(); renderHist(); render('',cur);
</script>
</body>
</html>
