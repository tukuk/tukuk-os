<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="Flip and match all eight emoji pairs. Track your moves and beat your best time on the 4×4 board.">
<link rel="canonical" href="https://tukuk.org/apps/memory">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:420px; margin:0 auto; padding:12px; text-align:center; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:12px; font-size:.82rem; }
  .hud .stat { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.66rem; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; width:min(340px, 90vw); margin:0 auto; }
  .card { aspect-ratio:3/4; display:flex; align-items:center; justify-content:center; font-size:2rem; border-radius:10px; background:var(--panel); border:1px solid var(--line); cursor:pointer; user-select:none; }
  .card.hide { color:transparent; background:var(--accent); opacity:.85; }
  .card.gone { opacity:.35; pointer-events:none; }
  #new { margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:11px 26px; font-weight:700; cursor:pointer; font:inherit; }
  .hint { color:var(--muted); font-size:.78rem; margin-top:8px; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🧠 Memory Match</h1></header>
<main class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Moves</span><b id="hM">0</b></div>
    <div class="stat"><span class="lab">Pairs</span><b id="hP">0/8</b></div>
    <div class="stat"><span class="lab">Best</span><b id="hB">—</b></div>
  </div>
  <div class="grid" id="grid"></div>
  <button id="new">New game</button>
  <p class="hint">Tap two cards to flip them. Match every pair in as few moves as you can.</p>
</main>
<script>
(function () {
  'use strict';
  var EMO = ['🍎','🚀','🐱','🎸','⚽','🌵','🍩','👑'];
  var grid = document.getElementById('grid'), open = [], lock = false, moves = 0, pairs = 0;
  var best = localStorage.getItem('tkmem-best'); if (best) document.getElementById('hB').textContent = best;

  function deal() {
    var deck = EMO.concat(EMO).sort(function () { return Math.random() - 0.5; });
    grid.innerHTML = ''; open = []; lock = false; moves = 0; pairs = 0;
    document.getElementById('hM').textContent = 0; document.getElementById('hP').textContent = '0/8';
    deck.forEach(function (e) {
      var d = document.createElement('div');
      d.className = 'card hide'; d.textContent = e; d.dataset.e = e;
      d.addEventListener('click', function () { flip(d); });
      grid.appendChild(d);
    });
  }
  function flip(d) {
    if (lock || !d.classList.contains('hide') || d.classList.contains('gone')) return;
    d.classList.remove('hide'); open.push(d);
    if (open.length < 2) return;
    moves++; document.getElementById('hM').textContent = moves;
    lock = true;
    setTimeout(function () {
      if (open[0].dataset.e === open[1].dataset.e) {
        open.forEach(function (c) { c.classList.add('gone'); });
        pairs++; document.getElementById('hP').textContent = pairs + '/8';
        if (pairs === 8) {
          if (!best || moves < +best) { best = moves; localStorage.setItem('tkmem-best', best); document.getElementById('hB').textContent = best; }
          setTimeout(function () { alert('All matched in ' + moves + ' moves! 🎉'); }, 200);
        }
      } else open.forEach(function (c) { c.classList.add('hide'); });
      open = []; lock = false;
    }, 640);
  }
  document.getElementById('new').addEventListener('click', deal);
  deal();
})();
</script>
</body>
</html>
