<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do — Tukuk Apps — Tukuk-OS</title>
<meta name="description" content="Senarai tugas dengan keutamaan, penapis dan penyimpanan lokal — semua kekal dalam pelayar anda.">
<link rel="canonical" href="https://tukuk.org/apps/todo">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  .addrow { display:flex; gap:8px; margin-bottom:14px; }
  .addrow input[type=text] { flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--text); font-size:.95rem; outline:none; }
  .addrow input:focus { border-color:var(--accent); }
  .addrow select, .addrow button { border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--text); padding:0 12px; font-size:.88rem; cursor:pointer; }
  .addrow button { background:var(--accent); color:#fff; border:0; font-weight:700; padding:11px 16px; }
  .filters { display:flex; gap:8px; margin-bottom:12px; }
  .filters button { background:var(--panel); border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:6px 13px; font-size:.82rem; cursor:pointer; font-weight:600; }
  .filters button.on { border-color:var(--accent); color:var(--accent); }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:8px; }
  li input[type=checkbox] { width:19px; height:19px; accent-color:var(--accent); cursor:pointer; flex:none; }
  li .t { flex:1; word-break:break-word; font-size:.94rem; }
  li.done .t { text-decoration:line-through; color:var(--muted); }
  li .p { font-size:.68rem; font-weight:800; padding:2px 8px; border-radius:10px; flex:none; }
  li .p.tinggi { background:rgba(255,59,129,.15); color:#ff85b3; }
  li .p.rendah { background:rgba(48,209,88,.15); color:#7ce898; }
  li .x { background:none; border:0; color:var(--muted); font-size:1rem; cursor:pointer; flex:none; }
  li .x:hover { color:#ff5b7f; }
  .stat { color:var(--muted); font-size:.82rem; margin:12px 2px; display:flex; justify-content:space-between; }
  .stat button { background:none; border:0; color:var(--accent); cursor:pointer; font-size:.82rem; }
</style>
</head>
<body>
<header><a class="back" href="/apps">← Apps</a><h1>✅ To-Do</h1></header>
<div class="wrap">
  <div class="addrow">
    <input type="text" id="txt" placeholder="Tugasan baharu…" maxlength="160">
    <select id="pri"><option value="rendah">Rendah</option><option value="tinggi">Tinggi</option></select>
    <button id="add">Tambah</button>
  </div>
  <div class="filters" id="filters">
    <button data-f="all" class="on">Semua</button><button data-f="open">Belum</button><button data-f="done">Selesai</button>
  </div>
  <ul id="list"></ul>
  <div class="stat"><span id="count"></span><button id="clearDone">Buang yang selesai</button></div>
</div>
<script>
(() => {
  const KEY='tukuk-todo-v1';
  let items=[]; try{ items=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ items=[]; }
  let filter='all';
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(items)); }catch(e){} };
  const $=(s)=>document.querySelector(s);
  const esc=(s)=>String(s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(){
    const list=$('#list');
    list.innerHTML=(filter==='all'?items:items.filter((x)=>filter==='open'?!x.d:x.d)).map((x)=>{
      const i=items.indexOf(x);
      return `<li class="${x.d?'done':''}"><input type="checkbox" data-i="${i}" ${x.d?'checked':''}><span class="t">${esc(x.t)}</span><span class="p ${x.p}">${x.p}</span><button class="x" data-d="${i}" title="Padam">✕</button></li>`;
    }).join('')||'<p style="color:var(--muted);text-align:center;padding:24px 0">Tiada tugas di sini. Tambah satu! 🎉</p>';
    const done=items.filter((x)=>x.d).length;
    $('#count').textContent=`${items.length} jumlah · ${done} selesai · ${items.length-done} aktif`;
  }
  $('#add').onclick=()=>{ const t=$('#txt').value.trim(); if(!t)return; items.unshift({t,p:$('#pri').value,d:false}); $('#txt').value=''; save(); render(); };
  $('#txt').addEventListener('keydown',(e)=>{ if(e.key==='Enter')$('#add').click(); });
  $('#list').addEventListener('click',(e)=>{
    const c=e.target.closest('input[data-i]'), d=e.target.closest('button[data-d]');
    if(c){ items[+c.dataset.i].d=c.checked; save(); render(); }
    if(d){ items.splice(+d.dataset.d,1); save(); render(); }
  });
  $('#filters').addEventListener('click',(e)=>{ const b=e.target.closest('button[data-f]'); if(!b)return; filter=b.dataset.f; $('#filters').querySelectorAll('button').forEach((x)=>x.classList.toggle('on',x===b)); render(); });
  $('#clearDone').onclick=()=>{ items=items.filter((x)=>!x.d); save(); render(); };
  render();
})();
</script>
</body>
</html>
