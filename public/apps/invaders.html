<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Invaders — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="The arcade shooter legend: slide your cannon, blast the descending alien formation and dodge their bombs. Survive the waves and chase a high score.">
<link rel="canonical" href="https://tukuk.org/apps/invaders">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:480px; margin:0 auto; padding:12px; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:10px; font-size:.82rem; }
  .hud .stat { flex:1; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.66rem; text-transform:uppercase; }
  canvas { display:block; width:100%; border-radius:10px; background:#05070d; touch-action:none; }
  .ctrls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .ctrls button { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:16px 0; font-size:1.4rem; cursor:pointer; }
  .ctrls button:active { background:var(--accent); color:#fff; }
  #start { margin-top:8px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px; font-weight:700; cursor:pointer; font:inherit; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>👾 Space Invaders</h1></header>
<div class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Score</span><b id="score">0</b></div>
    <div class="stat"><span class="lab">Lives</span><b id="lives">3</b></div>
    <div class="stat"><span class="lab">Wave</span><b id="wave">1</b></div>
  </div>
  <canvas id="cv" width="440" height="480"></canvas>
  <div class="ctrls"><button id="bl">◀</button><button id="br">▶</button></div>
  <button id="start">Start / Fire (tap board also fires)</button>
</div>
<script>
(() => {
  const W = 440, H = 480, cv = document.getElementById('cv'), g = cv.getContext('2d');
  let ship, bullets, bombs, foes, fx = 1, score = 0, lives = 3, wave = 1, running = false, cool = 0, keys = {};

  function newWave() {
    foes = [];
    const cols = 8, rows = Math.min(3 + wave, 5);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      foes.push({ x: 40 + c * 44, y: 40 + r * 34, alive: true, t: r % 3 });
    fx = 1;
  }
  function reset() { ship = { x: W / 2, y: H - 26, w: 30 }; bullets = []; bombs = []; score = 0; lives = 3; wave = 1; cool = 0; newWave(); updateHud(); }
  function fire() { if (cool > 0 || !running) return; bullets.push({ x: ship.x, y: ship.y - 12 }); cool = 12; }

  function step() {
    if (keys.l) ship.x -= 6; if (keys.r) ship.x += 6;
    ship.x = Math.max(16, Math.min(W - 16, ship.x));
    if (cool) cool--;
    bullets.forEach((b) => b.y -= 8); bullets = bullets.filter((b) => b.y > 0);
    bombs.forEach((b) => b.y += 4 + wave * 0.3); bombs = bombs.filter((b) => b.y < H);
    // foes march
    let minX = W, maxX = 0, lowest = 0;
    const speed = 0.6 + wave * 0.25;
    foes.forEach((f) => { if (!f.alive) return; f.x += fx * speed; minX = Math.min(minX, f.x); maxX = Math.max(maxX, f.x); lowest = Math.max(lowest, f.y); });
    if (maxX > W - 20 || minX < 20) { fx *= -1; foes.forEach((f) => { if (f.alive) f.y += 14; }); }
    // enemy fire
    if (Math.random() < 0.02 + wave * 0.005) { const live = foes.filter((f) => f.alive); if (live.length) { const s = live[Math.floor(Math.random() * live.length)]; bombs.push({ x: s.x, y: s.y + 12 }); } }
    // collisions bullet→foe
    for (const b of bullets) for (const f of foes) {
      if (f.alive && Math.abs(b.x - f.x) < 16 && Math.abs(b.y - f.y) < 14) { f.alive = false; b.y = -99; score += 10 + f.t * 5; updateHud(); break; }
    }
    // bomb→ship
    for (const b of bombs) if (Math.abs(b.x - ship.x) < 16 && Math.abs(b.y - ship.y) < 14) { b.y = H + 99; lives--; updateHud(); if (lives <= 0) return gameOver(); }
    bullets = bullets.filter((b) => b.y > -50); bombs = bombs.filter((b) => b.y < H + 50);
    if (foes.every((f) => !f.alive)) { wave++; newWave(); updateHud(); }
    if (lowest > H - 60) return gameOver();
  }
  function gameOver() { running = false; draw(); banner('Invaded! ' + score + ' pts'); }
  function banner(t) { g.fillStyle = 'rgba(0,0,0,.72)'; g.fillRect(0, H / 2 - 30, W, 60); g.fillStyle = '#fff'; g.font = 'bold 22px system-ui'; g.textAlign = 'center'; g.fillText(t, W / 2, H / 2 + 8); }
  const FCOL = ['#69f0ae','#ffd54a','#ff6ec7'];
  function draw() {
    g.clearRect(0, 0, W, H);
    for (const f of foes) if (f.alive) { g.fillStyle = FCOL[f.t]; g.fillRect(f.x - 12, f.y - 8, 24, 16); g.fillStyle = '#05070d'; g.fillRect(f.x - 6, f.y - 3, 3, 3); g.fillRect(f.x + 3, f.y - 3, 3, 3); }
    g.fillStyle = '#4c8dff'; g.fillRect(ship.x - 15, ship.y - 8, 30, 12); g.fillRect(ship.x - 3, ship.y - 14, 6, 8);
    g.fillStyle = '#fff'; bullets.forEach((b) => g.fillRect(b.x - 1.5, b.y, 3, 8));
    g.fillStyle = '#ff5252'; bombs.forEach((b) => g.fillRect(b.x - 2, b.y, 4, 10));
  }
  function updateHud() { document.getElementById('score').textContent = score; document.getElementById('lives').textContent = lives; document.getElementById('wave').textContent = wave; }
  function loop() { if (!running) return; step(); if (running) draw(); requestAnimationFrame(loop); }
  function start() { if (running) { fire(); return; } reset(); running = true; requestAnimationFrame(loop); }

  const hold = (id, on, off) => { const e = document.getElementById(id); e.addEventListener('pointerdown', (ev) => { ev.preventDefault(); on(); }); ['pointerup','pointerleave','pointercancel'].forEach((t) => e.addEventListener(t, off)); };
  hold('bl', () => keys.l = 1, () => keys.l = 0);
  hold('br', () => keys.r = 1, () => keys.r = 0);
  cv.addEventListener('pointerdown', (e) => { const rect = cv.getBoundingClientRect(); ship.x = (e.clientX - rect.left) * (W / rect.width); fire(); });
  document.getElementById('start').addEventListener('click', start);
  window.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') keys.l = 1; else if (e.key === 'ArrowRight') keys.r = 1; else if (e.key === ' ') { if (running) fire(); else start(); } });
  window.addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft') keys.l = 0; else if (e.key === 'ArrowRight') keys.r = 0; });
  reset(); draw();
})();
</script>
</body>
</html>
