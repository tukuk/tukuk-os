<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breakout — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="The original brick-breaker: bounce the ball off your paddle and smash every coloured block. Three lives, faster levels — how far can you clear?">
<link rel="canonical" href="https://tukuk.org/apps/breakout">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:480px; margin:0 auto; padding:12px; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:10px; font-size:.82rem; }
  .hud .stat { flex:1; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.66rem; text-transform:uppercase; }
  canvas { display:block; width:100%; border-radius:10px; background:#0c0f16; touch-action:none; cursor:none; }
  #start { margin-top:12px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px; font-weight:700; cursor:pointer; font:inherit; }
  .hint { text-align:center; color:var(--muted); font-size:.78rem; margin-top:8px; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🧱 Breakout</h1></header>
<div class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Score</span><b id="score">0</b></div>
    <div class="stat"><span class="lab">Lives</span><b id="lives">3</b></div>
    <div class="stat"><span class="lab">Level</span><b id="level">1</b></div>
  </div>
  <canvas id="cv" width="440" height="520"></canvas>
  <button id="start">Start</button>
  <p class="hint">Move your finger or the mouse to slide the paddle. Don't let the ball fall.</p>
</div>
<script>
(() => {
  const W = 440, H = 520, cv = document.getElementById('cv'), g = cv.getContext('2d');
  const COLORS = ['#ff5252','#ffb300','#4c8dff','#69f0ae','#b388ff','#ff6ec7'];
  let paddle, ball, bricks, score = 0, lives = 3, level = 1, running = false, launched = false;

  function buildLevel() {
    bricks = [];
    const cols = 8, rows = Math.min(4 + level, 7), bw = (W - 20) / cols, bh = 20, gapTop = 40;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      bricks.push({ x: 10 + c * bw, y: gapTop + r * (bh + 6), w: bw - 4, h: bh, color: COLORS[r % COLORS.length], alive: true });
  }
  function resetBall() { launched = false; paddle = { w: 84, x: W / 2 - 42 }; ball = { x: W / 2, y: H - 40, vx: 0, vy: 0, r: 7 }; }
  function newGame() { score = 0; lives = 3; level = 1; buildLevel(); resetBall(); updateHud(); }
  function nextLevel() { level++; buildLevel(); resetBall(); updateHud(); }
  const speed = () => 4 + (level - 1) * 0.6;

  function launch() { const a = -Math.PI / 2 + (Math.random() * 0.8 - 0.4); ball.vx = Math.cos(a) * speed(); ball.vy = Math.sin(a) * speed(); launched = true; }

  function step() {
    if (!launched) { ball.x = paddle.x + paddle.w / 2; ball.y = H - 40; return; }
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.x < ball.r || ball.x > W - ball.r) ball.vx *= -1;
    if (ball.y < ball.r) ball.vy *= -1;
    // paddle
    if (ball.vy > 0 && ball.y + ball.r >= H - 20 && ball.y < H - 10 && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
      const rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const a = rel * 1.1 - Math.PI / 2;
      const s = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.cos(a) * s; ball.vy = Math.sin(a) * s;
    }
    // bricks
    for (const br of bricks) {
      if (!br.alive) continue;
      if (ball.x > br.x && ball.x < br.x + br.w && ball.y - ball.r < br.y + br.h && ball.y + ball.r > br.y) {
        br.alive = false; ball.vy *= -1; score += 10; updateHud(); break;
      }
    }
    if (bricks.every((b) => !b.alive)) { nextLevel(); return; }
    if (ball.y - ball.r > H) { lives--; updateHud(); if (lives <= 0) return gameOver(); resetBall(); }
  }
  function gameOver() { running = false; launched = false; draw(); banner('Game over — ' + score + ' pts'); }
  function banner(t) { g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(0, H / 2 - 30, W, 60); g.fillStyle = '#fff'; g.font = 'bold 22px system-ui'; g.textAlign = 'center'; g.fillText(t, W / 2, H / 2 + 8); }
  function draw() {
    g.clearRect(0, 0, W, H);
    for (const br of bricks) if (br.alive) { g.fillStyle = br.color; g.fillRect(br.x, br.y, br.w, br.h); g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(br.x, br.y, br.w, 4); }
    g.fillStyle = '#e6e9ef'; g.fillRect(paddle.x, H - 18, paddle.w, 10);
    g.beginPath(); g.arc(ball.x, ball.y, ball.r, 0, 7); g.fillStyle = '#ffd54a'; g.fill();
  }
  function updateHud() {
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives;
    document.getElementById('level').textContent = level;
  }
  function loop() { if (!running) return; step(); draw(); requestAnimationFrame(loop); }
  function start() { if (running) return; newGame(); running = true; requestAnimationFrame(loop); }

  function moveTo(clientX) {
    const rect = cv.getBoundingClientRect();
    const x = (clientX - rect.left) * (W / rect.width);
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  }
  cv.addEventListener('pointermove', (e) => { if (paddle) moveTo(e.clientX); });
  cv.addEventListener('pointerdown', (e) => { moveTo(e.clientX); if (running && !launched) launch(); });
  window.addEventListener('keydown', (e) => { if (running && e.key === ' ' && !launched) launch(); });
  document.getElementById('start').addEventListener('click', start);
  resetBall(); buildLevel(); draw();
})();
</script>
</body>
</html>
