<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator Orbit — Tukuk Apps — Tukuk-OS</title>
<meta name="description" content="Simulator graviti N-jasad dalam pelayar: seret untuk melancarkan planet, orbit mengelilingi bintang, perlanggaran bergabung — dengan jejak, preset & kawalan masa.">
<link rel="canonical" href="https://tukuk.org/apps/orbit">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icons/apps/orbit.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  #cv { display:block; width:100%; border:1px solid var(--line); border-radius:14px; background:#04060d; touch-action:none; cursor:crosshair; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; font-size:.84rem; }
  .bar button, .bar select { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:7px 11px; font:inherit; font-size:.84rem; cursor:pointer; }
  .bar button.on { border-color:var(--accent); color:var(--accent); font-weight:700; }
  .bar label { display:flex; gap:6px; align-items:center; color:var(--muted); }
  input[type=range] { accent-color:var(--accent); width:110px; }
  .stat { color:var(--muted); font-size:.78rem; margin-top:10px; text-align:center; }
</style>
  <link rel="manifest" href="/manifest-orbit.json">
</head>
<body>
<header><a class="back" href="/apps">← Apps</a><h1>🪐 Simulator Orbit</h1></header>
<div class="wrap">
  <canvas id="cv" width="688" height="460"></canvas>
  <div class="bar">
    <select id="mass"><option value="1">Planet kecil</option><option value="4" selected>Planet</option><option value="14">Gergasi</option><option value="60">Bintang</option></select>
    <button id="pause">⏸ Jeda</button>
    <button id="trail" class="on">✨ Jejak: On</button>
    <button id="clear">🗑 Kosong</button>
    <select id="preset">
      <option value="">🌌 Preset…</option>
      <option value="sys">Sistem (1 bintang, 4 planet)</option>
      <option value="bin">Dwibintang + planet</option>
      <option value="tan">Tandem (2 planet, 1 orbit)</option>
      <option value="chaos">Kacau-bilah (12)</option>
    </select>
    <label>G <input type="range" id="G" min="20" max="300" value="150"></label>
    <button id="png">⬇ PNG</button>
  </div>
  <div class="stat" id="stat"></div>
  <p class="stat">Tekan & seret dari titik baru → anak panah menunjukkan halaju luncuran. Lepas untuk melancarkan. Fisik: graviti Newton + pemelunan lembut, perlanggaran bergabung (momentum dikekalkan).</p>
</div>
<script>
(() => {
  const $ = (s) => document.getElementById(s);
  const cv = $('cv'), cx = cv.getContext('2d'), W = cv.width, H = cv.height;
  let bodies = [], G = 150, paused = false, trailOn = true, uidc = 0;
  const SOFT = 8; // pelunak Plummer — hadakan daya apabila jarak menghampiri sifar
  let drag = null; // {x,y,vx,vy} semasa seret
  const COL = ['#ffd166','#ef476f','#06d6a0','#4cc9f0','#f78c6b','#b891ff','#a7f070','#ff85b3'];
  function add(x, y, vx, vy, m, fix) {
    bodies.push({ x, y, vx, vy, m, fix: !!fix, r: Math.max(3, 3.4 * Math.cbrt(m)), c: COL[(uidc++) % COL.length], tr: [] });
  }
  function orbit(cx0, cy0, R, m, dir, starM) { // letak jasad pada lintasan bulat (halaju tangen)
    const v = Math.sqrt(G * (starM || 220) / R);
    add(cx0 + R, cy0, 0, v * dir, m);
  }
  function preset(k) {
    bodies = []; uidc = 0;
    if (k === 'sys') { add(W/2, H/2, 0, 0, 220, true); orbit(W/2,H/2,65,0.05,1); orbit(W/2,H/2,110,0.08,1); orbit(W/2,H/2,160,0.06,1); orbit(W/2,H/2,210,0.1,-1); }
    else if (k === 'bin') { const vb = Math.sqrt(G * 120 / (2 * 56)); // halaju bulat dwibintang: v² = G·m/(2d)
      add(W/2-28, H/2, 0, -vb, 120); add(W/2+28, H/2, 0, vb, 120); orbit(W/2,H/2,170,0.5,1,240); }
    else if (k === 'tan') { // konfigurasi pusat bertentangan — dua planet sama jisim berkongsi satu orbit 180° (penyelesaian tepat)
      const R = 140, m = 4, v = Math.sqrt(G * 220 * R * R / Math.pow(R*R + SOFT, 1.5) + G * m / (4 * R));
      add(W/2, H/2, 0, 0, 220, true);
      add(W/2 - R, H/2, 0, -v, m); add(W/2 + R, H/2, 0, v, m);
    }
    else if (k === 'chaos') { add(W/2, H/2, 0, 0, 200, true); for (let i = 0; i < 11; i++) { const a = Math.random()*Math.PI*2, R = 55 + Math.random()*160, v = Math.sqrt(G*210/R)*(0.85 + Math.random()*0.3); add(W/2 + Math.cos(a)*R, H/2 + Math.sin(a)*R, -Math.sin(a)*v, Math.cos(a)*v, 0.4 + Math.random()*1.6); } }
    paused = false; $('pause').textContent = '⏸ Jeda'; draw();
  }
  // Integrator leapfrog (kick–drift–kick) — bertenaga orbit kekal jauh lebih baik dari Euler
  function kick(dt) {
    for (let i = 0; i < bodies.length; i++) { const a = bodies[i];
      for (let j = i + 1; j < bodies.length; j++) { const b = bodies[j];
        let dx = b.x - a.x, dy = b.y - a.y, d2 = dx*dx + dy*dy + SOFT, d = Math.sqrt(d2);
        const f = G * dt / (d2 * d); // daya tarik → a pecut ke arah b, b ke arah a
        if (!a.fix) { a.vx += f * b.m * dx; a.vy += f * b.m * dy; }
        if (!b.fix) { b.vx -= f * a.m * dx; b.vy -= f * a.m * dy; } } } }
  function step(dt) {
    kick(dt / 2);
    for (const b of bodies) if (!b.fix) { b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -400 || b.x > W + 400 || b.y < -400 || b.y > H + 400) b.dead = true; }
    kick(dt / 2);
    // perlanggaran → gabung, momentum dikekalkan
    for (let i = 0; i < bodies.length; i++) for (let j = i + 1; j < bodies.length; j++) {
      const a = bodies[i], b = bodies[j]; if (a.dead || b.dead) continue;
      if (Math.hypot(a.x - b.x, a.y - b.y) < (a.r + b.r) * 0.45) {
        const m = a.m + b.m;
        a.vx = (a.vx * a.m + b.vx * b.m) / m; a.vy = (a.vy * a.m + b.vy * b.m) / m;
        a.x = (a.x * a.m + b.x * b.m) / m; a.y = (a.y * a.m + b.y * b.m) / m;
        a.m = m; a.r = Math.max(3, 3.4 * Math.cbrt(m)); a.fix = a.fix || b.fix; b.dead = true; } }
    bodies = bodies.filter((b) => !b.dead);
  }
  function draw() {
    if (trailOn) { cx.fillStyle = 'rgba(4,6,13,0.34)'; } else { cx.fillStyle = '#04060d'; } // jejak pudar / kosong
    cx.fillRect(0, 0, W, H);
    for (const b of bodies) {
      cx.beginPath(); cx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      cx.fillStyle = b.c; cx.shadowColor = b.c; cx.shadowBlur = b.m > 50 ? 26 : 8; cx.fill(); cx.shadowBlur = 0;
      if (b.m > 50) { cx.strokeStyle = 'rgba(255,255,255,0.25)'; cx.stroke(); } }
    if (drag) {
      cx.strokeStyle = 'rgba(255,255,255,0.6)'; cx.setLineDash([4, 4]);
      cx.beginPath(); cx.moveTo(drag.x, drag.y); cx.lineTo(drag.cx, drag.cy); cx.stroke(); cx.setLineDash([]);
      cx.beginPath(); cx.arc(drag.x, drag.y, 3.4 * Math.cbrt(Number($('mass').value)), 0, Math.PI * 2); cx.fillStyle = '#fff'; cx.fill(); }
    $('stat').textContent = bodies.length + ' jasad · G = ' + G + (paused ? ' · JEDA' : '');
  }
  // Gelung masa — 20 sub-langkah halus per bingkaikan (1 unit masa/bingkai) supaya orbit kekal terikat
  function loop() { if (!paused) { for (let i = 0; i < 20; i++) step(0.05); } draw(); requestAnimationFrame(loop); }
  // Interaksi seret-luncur
  function pos(e) { const r = cv.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
    return { x: (t.clientX - r.left) * (W / r.width), y: (t.clientY - r.top) * (H / r.height) }; }
  cv.addEventListener('mousedown', (e) => { const p = pos(e); drag = { x: p.x, y: p.y, cx: p.x, cy: p.y }; });
  cv.addEventListener('mousemove', (e) => { if (drag) { const p = pos(e); drag.cx = p.x; drag.cy = p.y; } });
  addEventListener('mouseup', (e) => { if (!drag) return; const p = pos(e);
    add(drag.x, drag.y, (drag.x - p.x) / 34, (drag.y - p.y) / 34, Number($('mass').value)); drag = null; });
  cv.addEventListener('touchstart', (e) => { e.preventDefault(); const p = pos(e); drag = { x: p.x, y: p.y, cx: p.x, cy: p.y }; }, { passive: false });
  cv.addEventListener('touchmove', (e) => { e.preventDefault(); if (drag) { const p = pos(e); drag.cx = p.x; drag.cy = p.y; } }, { passive: false });
  cv.addEventListener('touchend', (e) => { if (!drag) return; const t = e.changedTouches[0], r = cv.getBoundingClientRect();
    const x = (t.clientX - r.left) * (W / r.width), y = (t.clientY - r.top) * (H / r.height);
    add(drag.x, drag.y, (drag.x - x) / 34, (drag.y - y) / 34, Number($('mass').value)); drag = null; });
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? '▶ Teruskan' : '⏸ Jeda'; };
  $('trail').onclick = () => { trailOn = !trailOn; $('trail').classList.toggle('on', trailOn); $('trail').textContent = '✨ Jejak: ' + (trailOn ? 'On' : 'Off');
    if (!trailOn) { cx.fillStyle = '#04060d'; cx.fillRect(0, 0, W, H); } };
  $('clear').onclick = () => { bodies = []; cx.fillStyle = '#04060d'; cx.fillRect(0, 0, W, H); };
  $('G').oninput = (e) => { G = Number(e.target.value); };
  $('preset').onchange = (e) => { if (e.target.value) preset(e.target.value); e.target.value = ''; };
  $('png').onclick = () => { const a = document.createElement('a'); a.download = 'orbit-' + Date.now() + '.png'; a.href = cv.toDataURL('image/png'); a.click(); };
  preset('sys'); requestAnimationFrame(loop);
})();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});</script>
</body>
</html>
