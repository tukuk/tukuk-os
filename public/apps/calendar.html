<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar — Tukuk Apps — Tukuk-OS</title>
<meta name="description" content="A clean month calendar with today highlighted, week numbers, and quick month hopping — works fully offline.">
<link rel="canonical" href="https://tukuk.org/apps/calendar">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:460px; margin:0 auto; padding:16px; }
  .bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .bar b { font-size:1.15rem; }
  .nav { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 13px; font-size:1rem; cursor:pointer; }
  .today { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:7px 13px; cursor:pointer; font:inherit; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; }
  .dow { text-align:center; font-size:.68rem; color:var(--muted); text-transform:uppercase; padding:4px 0; }
  .d { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; background:var(--panel); border:1px solid var(--line); font-size:.92rem; }
  .d.dim { opacity:.25; }
  .d.now { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:800; }
  .d .wk { font-size:.56rem; opacity:.6; }
  .info { margin-top:12px; text-align:center; color:var(--muted); font-size:.82rem; }
</style>
</head>
<body>
<header><a class="back" href="/apps">← Apps</a><h1>📅 Calendar</h1></header>
<main class="wrap">
  <div class="bar">
    <button class="nav" id="prev" aria-label="Previous month">‹</button>
    <b id="hMon">—</b>
    <button class="nav" id="next" aria-label="Next month">›</button>
    <button class="today" id="now">Today</button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="info" id="info"></p>
</main>
<script>
(function () {
  'use strict';
  var view = new Date(), grid = document.getElementById('grid'), hMon = document.getElementById('hMon');
  var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil((((t - y0) / 86400000) + 1) / 7);
  }
  function render() {
    var now = new Date();
    hMon.textContent = MON[view.getMonth()] + ' ' + view.getFullYear();
    grid.innerHTML = '';
    DOW.forEach(function (d) { var e = document.createElement('div'); e.className = 'dow'; e.textContent = d; grid.appendChild(e); });
    var first = new Date(view.getFullYear(), view.getMonth(), 1);
    var lead = (first.getDay() + 6) % 7; // Monday-first
    var days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    var prevDays = new Date(view.getFullYear(), view.getMonth(), 0).getDate();
    for (var i = 0; i < 42; i++) {
      var e = document.createElement('div'); e.className = 'd';
      var dn, m = view.getMonth(), y = view.getFullYear(), isDim = false;
      if (i < lead) { dn = prevDays - lead + 1 + i; isDim = true; }
      else if (i - lead < days) { dn = i - lead + 1; }
      else { dn = i - lead - days + 1; isDim = true; }
      var dateObj = new Date(y, m - (i < lead ? 1 : i - lead >= days ? -1 : 0), dn);
      var isToday = !isDim && dn === now.getDate() && view.getMonth() === now.getMonth() && view.getFullYear() === now.getFullYear();
      if (isToday) e.classList.add('now');
      if (isDim) e.classList.add('dim');
      e.innerHTML = '<span>' + dn + '</span><span class="wk">W' + isoWeek(dateObj) + '</span>';
      grid.appendChild(e);
    }
    var dayOfYear = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(now.getFullYear(), 0, 0)) / 86400000);
    var y = now.getFullYear(), leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
    document.getElementById('info').textContent = 'Today: ' + DOW[(now.getDay() + 6) % 7] + ' · day ' + dayOfYear + '/' + (leap ? 366 : 365) + ' · week ' + isoWeek(now);
  }
  document.getElementById('prev').addEventListener('click', function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); });
  document.getElementById('next').addEventListener('click', function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); });
  document.getElementById('now').addEventListener('click', function () { view = new Date(); render(); });
  render();
})();
</script>
</body>
</html>
