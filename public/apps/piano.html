<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Sintetis — Tukuk Apps — Tukuk-OS</title>
<meta name="description" content="Piano 2 oktaf dalam pelayar: 4 bentuk gelombang, gema delay, main dengan papan kekunci atau sentuhan, dan rakam audio ke fail WebM.">
<link rel="canonical" href="https://tukuk.org/apps/piano">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icons/apps/piano.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:680px; margin:0 auto; padding:16px; }
  .ctl { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; font-size:.85rem; }
  .ctl select, .ctl button { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:7px 10px; font:inherit; font-size:.85rem; cursor:pointer; }
  .ctl button.on { border-color:var(--accent); color:var(--accent); font-weight:700; }
  .piano { position:relative; height:190px; user-select:none; touch-action:none; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--panel); }
  .wk { position:absolute; top:0; bottom:0; width:calc(100%/14); background:#f6f7fb; border-right:1px solid #c9ccd6; box-sizing:border-box; cursor:pointer; }
  .wk:last-of-type { border-right:0; }
  .wk.on { background:var(--accent); }
  .bk { position:absolute; top:0; height:60%; width:calc(100%/22); background:#16181d; border-radius:0 0 5px 5px; cursor:pointer; z-index:2; }
  .bk.on { background:var(--accent); }
  .lbl { position:absolute; bottom:6px; left:0; right:0; text-align:center; font-size:.66rem; color:#888; }
  .rec { color:var(--muted); font-size:.8rem; margin-top:10px; text-align:center; }
  a.down { color:var(--accent); }
  .note { color:var(--muted); font-size:.78rem; margin-top:8px; text-align:center; }
</style>
</head>
<body>
<header><a class="back" href="/apps">← Apps</a><h1>🎹 Piano Sintetis</h1></header>
<div class="wrap">
  <div class="ctl">
    <select id="wave"><option value="triangle">Lembut (triangle)</option><option value="sine">Bulat (sine)</option><option value="square">Retro (square)</option><option value="sawtooth">Terang (saw)</option></select>
    <button id="echoBtn">🔁 Gema: Off</button>
    <label>Vol <input type="range" id="vol" min="0" max="100" value="60"></label>
    <button id="sustainBtn">🎴 Sustain: Off</button>
    <button id="recBtn">⏺ Rakam</button>
    <span id="dl"></span>
  </div>
  <div class="piano" id="piano"></div>
  <div class="rec" id="recstat"></div>
  <p class="note">Papan kekunci: <b>A W S E D F T G Y H U J K O L P ;</b> (C4→E5) · <b>]</b> oktaf atas · <b>[</b> oktaf bawah · sentuh/klik terus pada tuts.</p>
</div>
<script>
(() => {
  const KEYMAP = { a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12, o:13, l:14, p:15, ';':16 };
  let oct = 0; // anjakan oktaf (0 = C4.., +1 oktaf atas)
  let A = null, master, fxSend = null, echoOn = false, susOn = false, rec = null, chunks = [], actx;
  const voices = new Map(); // idx (nombor nota mutlak dari C4) → {osc,g}
  const $ = (s) => document.getElementById(s);
  function ctx(){ if (!A) { actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.4; master.connect(actx.destination); }
    if (actx.state === 'suspended') actx.resume(); return actx; }
  function freq(idx){ const midi = 60 + idx + oct * 12; return 440 * Math.pow(2, (midi - 69) / 12); } // idx 0 = C4 (midi 60)
  function press(idx){ if (voices.has(idx)) return; const c = ctx();
    const o = c.createOscillator(), g = c.createGain(); o.type = $('wave').value; o.frequency.value = freq(idx);
    g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(0.5, c.currentTime + 0.012);
    o.connect(g); g.connect(master);
    if (echoOn && fxSend) g.connect(fxSend);
    o.start(); voices.set(idx, { o, g }); paintKey(idx, true); }
  function release(idx){ if (susOn) return; stopVoice(idx); }
  function stopVoice(idx){ const v = voices.get(idx); if (!v) return; const c = ctx();
    v.g.gain.cancelScheduledValues(c.currentTime); v.g.gain.setValueAtTime(v.g.gain.value, c.currentTime);
    v.g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.18); v.o.stop(c.currentTime + 0.22);
    voices.delete(idx); paintKey(idx, false); }
  // Bina visual piano: 2 oktaf (C4–B5) = 24 tuts, 14 putih
  const piano = $('piano');
  for (let i = 0; i < 24; i++) {
    const isBlack = i % 12 in { 1:1, 3:1, 6:1, 8:1, 10:1 };
    const d = document.createElement('div');
    if (!isBlack) { d.className = 'wk'; d.style.left = (whitePos(i) * 100 / 14) + '%'; d.innerHTML = `<span class="lbl">${i === 0 ? 'C4' : i === 12 ? 'C5' : ''}</span>`; }
    else { d.className = 'bk'; d.style.left = ((whitePos(i) - 0.31) * 100 / 14) + '%'; }
    d.dataset.i = i; d.style.height = isBlack ? '60%' : '100%';
    piano.appendChild(d);
  }
  function whitePos(i){ let w = 0; for (let k = 0; k < i; k++) if (!(k % 12 in { 1:1, 3:1, 6:1, 8:1, 10:1 })) w++; return w; }
  function paintKey(idx, on){ const el = piano.querySelector(`[data-i="${idx}"]`); if (el) el.classList.toggle('on', on); }
  // Interaksi pointer (glide dibenarkan — seperti organ)
  let held = null;
  piano.addEventListener('pointerdown', (e) => { const t = e.target.closest('[data-i]'); if (!t) return;
    e.preventDefault(); held = t; press(Number(t.dataset.i)); piano.setPointerCapture(e.pointerId); });
  piano.addEventListener('pointermove', (e) => { const t = document.elementFromPoint(e.clientX, e.clientY); if (!t || !t.closest || t === held) return;
    const el = t.closest('[data-i]'); if (!el) return; if (held) release(Number(held.dataset.i)); held = el; press(Number(el.dataset.i)); });
  addEventListener('pointerup', () => { if (held) release(Number(held.dataset.i)); held = null; });
  // Papan kekunci fizikal
  const kd = new Set();
  addEventListener('keydown', (e) => { const k = e.key.toLowerCase();
    if (k === ']') { oct = Math.min(2, oct + 1); return; } if (k === '[') { oct = Math.max(-1, oct - 1); return; }
    if (k === ' ') { toggleSustain(); e.preventDefault(); return; }
    const idx = KEYMAP[k]; if (idx == null || kd.has(k)) return; kd.add(k); press(idx); });
  addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); const idx = KEYMAP[k]; if (idx == null) return; kd.delete(k); release(idx); });
  function toggleSustain(){ susOn = !susOn; $('sustainBtn').classList.toggle('on', susOn); $('sustainBtn').textContent = '🎴 Sustain: ' + (susOn ? 'On' : 'Off');
    if (!susOn) voices.forEach((_, idx) => { if (!Object.keys(KEYMAP).some((k) => KEYMAP[k] === idx) || !kd.has(Object.keys(KEYMAP).find((k) => KEYMAP[k] === idx))) release(idx); }); }
  $('sustainBtn').onclick = toggleSustain;
  // Gema (delay feedback)
  $('echoBtn').onclick = () => { const c = ctx(); echoOn = !echoOn; $('echoBtn').classList.toggle('on', echoOn); $('echoBtn').textContent = '🔁 Gema: ' + (echoOn ? 'On' : 'Off');
    if (echoOn && !fxSend) { const dl = c.createDelay(1), fb = c.createGain(), wet = c.createGain();
      dl.delayTime.value = 0.28; fb.gain.value = 0.38; wet.gain.value = 0.4;
      fxSend = c.createGain(); fxSend.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(c.destination); } };
  $('vol').oninput = (e) => { if (master) master.gain.value = e.target.value / 150; };
  // Rakam audio → WebM
  $('recBtn').onclick = () => { const c = ctx();
    if (rec) { rec.stop(); rec = null; $('recBtn').classList.remove('on'); $('recBtn').textContent = '⏺ Rakam'; $('recstat').textContent = 'Sedang memproses…'; return; }
    const dest = c.createMediaStreamDestination(); master.connect(dest);
    chunks = []; try { rec = new MediaRecorder(dest.stream); } catch (e) { $('recstat').textContent = 'Pelayar anda tidak menyokong rakaman.'; return; }
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => { const blob = new Blob(chunks, { type: 'audio/webm' }); const url = URL.createObjectURL(blob);
      $('dl').innerHTML = `<a class="down" href="${url}" download="piano-${Date.now()}.webm">⬇ Muat turun rakaman</a>`;
      $('recstat').textContent = ''; };
    rec.start(); $('recBtn').classList.add('on'); $('recBtn').textContent = '⏹ Stop';
    $('recstat').textContent = '🔴 Merekam — main melodi anda, kemudian tekan Stop.'; };
  $('wave').addEventListener('change', () => { const w = $('wave').value; voices.forEach((v) => { v.o.type = w; }); });
  ctx();
})();
</script>
</body>
</html>
