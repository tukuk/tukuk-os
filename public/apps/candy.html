<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candy Blast — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="The classic match-3 candy puzzle: swap adjacent sweets, break lines of three or more, chain cascades for combos. Endless levels, touch & mouse.">
<link rel="canonical" href="https://tukuk.org/apps/candy">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:520px; margin:0 auto; padding:14px; }
  .hud { display:flex; gap:10px; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:.9rem; }
  .hud b { font-size:1.05rem; }
  .hud .lab { color:var(--muted); font-size:.72rem; display:block; }
  .stat { flex:1; text-align:center; }
  canvas { display:block; width:100%; border-radius:12px; background:#141926; touch-action:none; }
  .hint { color:var(--muted); font-size:.78rem; margin-top:10px; text-align:center; }
  .combo { position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); font-size:2rem; font-weight:800;
    color:#ffd54a; text-shadow:0 2px 14px rgba(0,0,0,.6); pointer-events:none; opacity:0; transition:opacity .2s; }
  .combo.on { opacity:1; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🍬 Candy Blast</h1></header>
<div class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Score</span><b id="score">0</b></div>
    <div class="stat"><span class="lab">Moves</span><b id="moves">0</b></div>
    <div class="stat"><span class="lab">Best</span><b id="best">0</b></div>
  </div>
  <canvas id="cv" width="480" height="480"></canvas>
  <div class="combo" id="combo"></div>
  <p class="hint">Drag a candy onto a neighbour to swap — match 3 or more of the same sweet. Cascades multiply your score.</p>
</div>
<script>
(() => {
  const N = 8, CELL = 60, cv = document.getElementById('cv'), g = cv.getContext('2d');
  const COLORS = ['#ff5252', '#ffb300', '#4c8dff', '#69f0ae', '#b388ff', '#ff6ec7'];
  const SHAPES = ['●', '◆', '▲', '★', '⬢', '♥'];
  let board = [], sel = null, dragFrom = null, busy = false;
  let score = 0, moves = 0, best = Number(localStorage.getItem('candy-best') || 0);
  const falls = []; // animation queue: {c, r, from, color, t}

  function rnd() { return Math.floor(Math.random() * COLORS.length); }
  function newBoard() {
    board = [];
    for (let c = 0; c < N; c++) {
      board[c] = [];
      for (let r = 0; r < N; r++) {
        let v;
        do { v = rnd(); } while (
          (c >= 2 && board[c-1][r] === v && board[c-2][r] === v) ||
          (r >= 2 && board[c][r-1] === v && board[c][r-2] === v));
        board[c][r] = v;
      }
    }
  }
  function findMatches() {
    const mark = new Set();
    for (let r = 0; r < N; r++) {          // horizontal runs
      let run = 1;
      for (let c = 1; c <= N; c++) {
        if (c < N && board[c][r] === board[c-1][r] && board[c][r] >= 0) run++;
        else { if (run >= 3) for (let k = c - run; k < c; k++) mark.add(k + ',' + r); run = 1; }
      }
    }
    for (let c = 0; c < N; c++) {          // vertical runs
      let run = 1;
      for (let r = 1; r <= N; r++) {
        if (r < N && board[c][r] === board[c-1][r] && board[c][r] >= 0) run++;
        else { if (run >= 3) for (let k = r - run; k < r; k++) mark.add(c + ',' + k); run = 1; }
      }
    }
    return mark;
  }
  function hasPossibleMove() {
    for (let c = 0; c < N; c++) for (let r = 0; r < N; r++) {
      if (c + 1 < N) { swapTry(c, r, c + 1, r); const ok = findMatches().size > 0; swapTry(c, r, c + 1, r); if (ok) return true; }
      if (r + 1 < N) { swapTry(c, r, c, r + 1); const ok = findMatches().size > 0; swapTry(c, r, c, r + 1); if (ok) return true; }
    }
    return false;
  }
  function swapTry(c1, r1, c2, r2) { const t = board[c1][r1]; board[c1][r1] = board[c2][r2]; board[c2][r2] = t; return true; }

  function resolve() {
    const mark = findMatches();
    if (!mark.size) {
      busy = false;
      if (!hasPossibleMove()) { shuffleMsg(); do { newBoard(); } while (findMatches().size); draw(); }
      return;
    }
    const combo = Math.min(8, 1 + Math.floor(mark.size / 3));
    score += mark.size * 10 * combo;
    if (combo > 1) showCombo('x' + combo + ' COMBO! +' + mark.size * 10 * combo);
    updateHud();
    mark.forEach((key) => { const [c, r] = key.split(',').map(Number); falls.push({ c, r, from: r - 1 - Math.random() * 2, color: board[c][r], t: 0 }); board[c][r] = -1; });
    // gravity: compact each column downward
    for (let c = 0; c < N; c++) {
      let write = N - 1;
      for (let r = N - 1; r >= 0; r--) if (board[c][r] >= 0) { if (write !== r) { board[c][write] = board[c][r]; board[c][r] = -1; } write--; }
      for (let r = write; r >= 0; r--) board[c][r] = rnd();
    }
    draw();
    setTimeout(resolve, 240);
  }
  let comboTimer = null;
  function showCombo(txt) {
    const el = document.getElementById('combo');
    el.textContent = txt; el.classList.add('on');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => el.classList.remove('on'), 700);
  }
  function shuffleMsg() { showCombo('No moves — reshuffling!'); }

  function updateHud() {
    document.getElementById('score').textContent = score;
    document.getElementById('moves').textContent = moves;
    if (score > best) { best = score; localStorage.setItem('candy-best', String(best)); }
    document.getElementById('best').textContent = best;
  }

  function cellAt(x, y) {
    const rect = cv.getBoundingClientRect();
    const sx = cv.width / rect.width, sy = cv.height / rect.height;
    const c = Math.floor((x - rect.left) * sx / CELL), r = Math.floor((y - rect.top) * sy / CELL);
    return (c >= 0 && c < N && r >= 0 && r < N) ? { c, r } : null;
  }
  function trySwap(a, b) {
    if (!a || !b || busy) return;
    if (Math.abs(a.c - b.c) + Math.abs(a.r - b.r) !== 1) return;
    busy = true;
    swapTry(a.c, a.r, b.c, b.r);
    if (!findMatches().size) { swapTry(a.c, a.r, b.c, b.r); busy = false; flashInvalid(a); }
    else { moves++; updateHud(); resolve(); }
  }
  function flashInvalid(a) { draw(); ctxRing(a, '#ff5252'); }
  function ctxRing(cell, color) {
    g.strokeStyle = color; g.lineWidth = 3;
    g.strokeRect(cell.c * CELL + 3, cell.r * CELL + 3, CELL - 6, CELL - 6);
  }
  cv.addEventListener('pointerdown', (e) => { if (!busy) { dragFrom = cellAt(e.clientX, e.clientY); sel = dragFrom; draw(); } });
  cv.addEventListener('pointermove', (e) => {
    if (dragFrom && !busy) { const p = cellAt(e.clientX, e.clientY); if (p && (Math.abs(p.c - dragFrom.c) + Math.abs(p.r - dragFrom.r)) === 1) { trySwap(dragFrom, p); dragFrom = null; sel = null; } }
  });
  window.addEventListener('pointerup', (e) => {
    if (dragFrom) { const p = cellAt(e.clientX, e.clientY); if (p && sel) trySwap(sel, p); }
    dragFrom = null;
  });

  function draw() {
    g.clearRect(0, 0, cv.width, cv.height);
    for (let c = 0; c < N; c++) for (let r = 0; r < N; r++) {
      const v = board[c][r];
      if (v < 0) continue;
      drawCandy(c * CELL + CELL / 2, r * CELL + CELL / 2, v);
    }
    if (sel && !busy) ctxRing(sel, '#ffd54a');
  }
  function drawCandy(x, y, v) {
    const col = COLORS[v];
    g.beginPath(); g.arc(x, y, CELL * 0.38, 0, 7);
    g.fillStyle = col; g.fill();
    g.beginPath(); g.arc(x - CELL * 0.12, y - CELL * 0.13, CELL * 0.13, 0, 7);
    g.fillStyle = 'rgba(255,255,255,.45)'; g.fill();
    g.fillStyle = 'rgba(0,0,0,.45)'; g.font = 'bold ' + CELL * 0.34 + 'px system-ui';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(SHAPES[v], x, y + 2);
  }

  newBoard();
  while (findMatches().size) newBoard();
  updateHud();
  draw();
})();
</script>
</body>
</html>
