<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Hop — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="Hop across busy roads and rivers, froggy-style: the endless crossing puzzle made famous on Android. Swipe or arrow keys, local high score.">
<link rel="canonical" href="https://tukuk.org/apps/roadhop">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:460px; margin:0 auto; padding:14px; }
  .hud { display:flex; gap:10px; justify-content:space-between; margin-bottom:8px; font-size:.85rem; color:var(--muted); }
  .hud b { color:var(--text); font-size:1rem; }
  canvas { display:block; width:100%; border-radius:12px; background:#3f8f4d; touch-action:none; }
  .hint { color:var(--muted); font-size:.78rem; margin-top:10px; text-align:center; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🐸 Road Hop</h1></header>
<div class="wrap">
  <div class="hud"><span>Hops <b id="score">0</b></span><span>Best <b id="best">0</b></span><span id="lives">❤️❤️❤️</span></div>
  <canvas id="cv" width="420" height="560"></canvas>
  <p class="hint">Swipe or arrow keys to hop. Dodge the cars, ride the logs across the river, do not fall in the water.</p>
</div>
<script>
(() => {
  const cv = document.getElementById('cv'), g = cv.getContext('2d');
  const W = cv.width, H = cv.height, TILE = 52, COLS = Math.ceil(W / TILE) + 1;
  const BEST_KEY = 'roadhop-best';
  const ROW_COLORS = { grass: ['#4ca15c', '#41914f'], road: ['#5b6472', '#525a67'], water: ['#3d7bd6', '#356fc4'] };
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  let rows, frog, camY, score, lives, mode = 'ready', hopT = 0, lastHit = 0;

  function genRow(y) {
    const prev = rows[y - 1];
    let type = 'grass';
    if (y > 2) {
      const r = Math.random();
      if (prev && prev.type !== 'grass' && r < 0.55) type = prev.type;                 // run of same type
      else if (r < 0.42) type = 'road';
      else if (r < 0.62) type = 'water';
    }
    const row = { y: y, type, items: [], speed: 0 };
    if (type === 'road') {
      row.speed = (0.9 + Math.random() * 1.8) * (Math.random() < 0.5 ? -1 : 1);
      const n = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) row.items.push({ x: Math.random() * (W + 200) - 100, w: 64, col: ['#e53935', '#fbc02d', '#1e88e5', '#eeeeee'][i % 4] });
    }
    if (type === 'water') {
      row.speed = (0.8 + Math.random() * 1.2) * (Math.random() < 0.5 ? -1 : 1);
      const n = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < n; i++) row.items.push({ x: Math.random() * (W + 200) - 100, w: 84 });
    }
    return row;
  }
  function reset() {
    rows = [];
    for (let y = 0; y < 40; y++) rows[y] = genRow(y);
    frog = { col: Math.floor(COLS / 2), y: 0, px: 0, rideX: null };
    camY = 0; score = 0; lives = 3; mode = 'ready'; hud();
  }
  reset();

  function ensure(y) { while (rows.length <= y + 30) rows[rows.length] = genRow(rows.length); }
  function hop(dc, dr) {
    if (mode === 'dead') { reset(); return; }
    if (mode !== 'play') { mode = 'play'; }
    const row = rows[frog.y];
    if (row && row.type === 'water' && frog.rideX != null) frog.rideX += 0; // stay attached until landing
    frog.col = Math.max(0, Math.min(COLS - 1, frog.col + dc));
    frog.y += dr;
    hopT = 1;
    ensure(frog.y);
    if (frog.y > score) { score = frog.y; hud(); }
  }
  function onEdge() {
    if (mode === 'dead') return;
    if (Date.now() - lastHit < 700) return; // short grace so one accident only costs one life
    lastHit = Date.now();
    lives--;
    if (lives <= 0) { mode = 'dead'; if (score > best) { best = score; localStorage.setItem(BEST_KEY, String(best)); } }
    else { frog.col = Math.floor(COLS / 2); frog.y = Math.max(0, camY); }
    hud();
  }

  cv.addEventListener('pointerdown', (e) => {
    const r = cv.getBoundingClientRect();
    cv._sx = e.clientX - r.left; cv._sy = e.clientY - r.top;
    if (mode !== 'play' && mode !== 'swiping') { if (mode === 'dead') { reset(); return; } mode = 'play'; }
  });
  cv.addEventListener('pointerup', (e) => {
    if (cv._sx == null) return;
    const r = cv.getBoundingClientRect();
    const dx = (e.clientX - r.left) - cv._sx, dy = (e.clientY - r.top) - cv._sy;
    cv._sx = null;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) { hop(0, 1); return; } // tap = forward
    if (Math.abs(dx) > Math.abs(dy)) hop(dx > 0 ? 1 : -1, 0);
    else hop(0, dy < 0 ? 1 : -1);
  });
  window.addEventListener('keydown', (e) => {
    const m = { ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0], ArrowUp: [0, 1], w: [0, 1], ' ': [0, 1], ArrowDown: [0, -1], s: [0, -1] }[e.key];
    if (m) { e.preventDefault(); if (mode === 'dead') reset(); else hop(m[0], m[1]); }
  });

  function step() {
    for (let y = camY; y < camY + 14; y++) {
      const row = rows[y]; if (!row) continue;
      if (row.speed) {
        for (const it of row.items) {
          it.x += row.speed;
          if (it.x > W + 120) it.x = -it.w - Math.random() * 160;
          if (it.x + it.w < -120) it.x = W + Math.random() * 160;
        }
      }
    }
    const row = rows[frog.y];
    if (row && row.type === 'water' && row.items.length) {
      const fx = frog.col * TILE + TILE / 2;
      const ride = row.items.find((it) => fx > it.x - 6 && fx < it.x + it.w + 6);
      if (ride) { frog.rideX = fx; if (hopT === 0) frog.px = (frog.px || 0) + row.speed; }
      else if (hopT === 0) { frog.px = frog.px || 0; onEdge(); }
    } else frog.rideX = null;
    if (hopT > 0) hopT = 0;
    // frog x follows lane + ride drift
    const targetX = frog.col * TILE + TILE / 2 + (frog.rideX != null && row && row.type === 'water' ? frog.px : 0);
    frog.dx = targetX;
    if (frog.col <= 0 || frog.col >= COLS - 1) onEdge();
    // car collision on current row
    const r2 = rows[frog.y];
    if (r2 && r2.type === 'road') {
      for (const it of r2.items) {
        const fx = frog.col * TILE + TILE / 2;
        if (fx > it.x - 10 && fx < it.x + it.w + 10) onEdge();
      }
    }
    camY = Math.max(camY, frog.y - 4);
  }

  function hud() {
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
    document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(3 - Math.max(0, lives));
  }

  function draw() {
    g.clearRect(0, 0, W, H);
    const base = camY;
    for (let y = base; y < base + 13; y++) {
      const row = rows[y]; if (!row) continue;
      const sy = H - (y - base) * TILE - TILE;
      const pair = ROW_COLORS[row.type];
      g.fillStyle = y % 2 ? pair[0] : pair[1];
      g.fillRect(0, sy, W, TILE);
      if (row.type === 'road') {
        g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 3; g.setLineDash([14, 14]);
        g.beginPath(); g.moveTo(0, sy + TILE / 2); g.lineTo(W, sy + TILE / 2); g.stroke(); g.setLineDash([]);
        for (const it of row.items) {
          g.fillStyle = it.col; rr(it.x, sy + 10, it.w, TILE - 20, 8);
          g.fillStyle = 'rgba(20,20,30,.7)'; g.fillRect(it.x + (row.speed > 0 ? 4 : it.w - 16), sy + 14, 12, TILE - 28);
        }
      }
      if (row.type === 'water') {
        g.fillStyle = 'rgba(255,255,255,.12)';
        for (let x = ((y * 37) % 40); x < W; x += 64) g.fillRect(x, sy + TILE / 2 - 1, 30, 2);
        for (const it of row.items) { g.fillStyle = '#8d6e63'; rr(it.x, sy + 12, it.w, TILE - 24, 10); g.fillStyle = '#6d4c41'; g.fillRect(it.x + 6, sy + 16, it.w - 12, 4); }
      }
    }
    // frog
    const fy = H - (frog.y - base) * TILE - TILE / 2;
    const fx = frog.dx != null ? frog.dx : frog.col * TILE + TILE / 2;
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(fx, fy + 14, 16, 5, 0, 0, 7); g.fill();
    g.fillStyle = '#2ecc40'; g.beginPath(); g.arc(fx, fy, 15, 0, 7); g.fill();
    g.fillStyle = '#1b9e2c'; g.beginPath(); g.arc(fx - 8, fy - 10, 5, 0, 7); g.arc(fx + 8, fy - 10, 5, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(fx - 8, fy - 11, 2.4, 0, 7); g.arc(fx + 8, fy - 11, 2.4, 0, 7); g.fill();
    if (mode !== 'play') {
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = 'bold 32px system-ui';
      g.fillText(mode === 'ready' ? 'Road Hop' : 'Splat!', W / 2, H / 2 - 50);
      g.font = '19px system-ui'; g.fillStyle = '#bfe8c5';
      g.fillText(mode === 'ready' ? 'Swipe / arrows to hop forward' : 'Hops: ' + score + ' · Best: ' + best, W / 2, H / 2 - 10);
      g.fillText(mode === 'ready' ? 'Tap to start' : 'Tap to try again', W / 2, H / 2 + 34);
    }
  }
  function rr(x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
    g.closePath(); g.fill();
  }

  (function loop() { step(); draw(); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
