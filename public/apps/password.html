<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penjana Kata Laluan — Tukuk Apps — Tukuk-OS</title>
<meta name="description" content="Kata laluan rawak kriptografik dan frasa sukar diteka, dijana setempat dalam pelayar — tiada apa dihantar ke mana-mana.">
<link rel="canonical" href="https://tukuk.org/apps/password">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icons/apps/password.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  .tabs { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:16px; }
  .tabs button { background:var(--panel); border:0; color:var(--muted); padding:9px 18px; font-size:.86rem; cursor:pointer; font-weight:700; }
  .tabs button.on { background:var(--accent); color:#fff; }
  .out { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; font-family:ui-monospace,monospace; font-size:1.15rem; word-break:break-all; min-height:1.6em; margin-bottom:10px; cursor:pointer; }
  .bar { height:7px; border-radius:5px; background:var(--line); overflow:hidden; margin-bottom:6px; }
  .bar i { display:block; height:100%; width:0; transition:width .25s,background .25s; }
  .entropy { color:var(--muted); font-size:.8rem; margin-bottom:16px; }
  .opt { display:flex; align-items:center; gap:10px; padding:9px 4px; font-size:.9rem; }
  .opt input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); }
  .opt input[type=range] { flex:1; accent-color:var(--accent); }
  .go { width:100%; margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:12px; padding:14px; font-size:1rem; font-weight:800; cursor:pointer; }
  .copyrow { display:flex; gap:8px; }
  .copyrow button { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px; cursor:pointer; font-size:.88rem; }
  .copyrow button:hover { border-color:var(--accent); }
</style>
  <link rel="manifest" href="/manifest-password.json">
</head>
<body>
<header><a class="back" href="/apps">← Apps</a><h1>🔐 Penjana Kata Laluan</h1></header>
<div class="wrap">
  <div class="tabs" id="tabs"><button data-m="pw" class="on">Kata Laluan</button><button data-m="pass">Frasa</button></div>
  <div class="out" id="out" title="Klik untuk salin">—</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="entropy" id="entropy"></div>
  <div id="optsPw">
    <div class="opt">Panjang <input type="range" id="len" min="8" max="64" value="16"><b id="lenV">16</b></div>
    <label class="opt"><input type="checkbox" id="up" checked>Huruf besar (A–Z)</label>
    <label class="opt"><input type="checkbox" id="lo" checked>Huruf kecil (a–z)</label>
    <label class="opt"><input type="checkbox" id="nu" checked>Angka (0–9)</label>
    <label class="opt"><input type="checkbox" id="sy" checked>Simbol (!@#$%…)</label>
  </div>
  <div id="optsPass" hidden>
    <div class="opt">Bilangan perkataan <input type="range" id="words" min="3" max="8" value="4"><b id="wordsV">4</b></div>
    <label class="opt"><input type="checkbox" id="capWord" checked>Huruf besar pertama</label>
    <label class="opt"><input type="checkbox" id="numSuffix" checked>Nombor rawak di hujung</label>
  </div>
  <button class="go" id="gen">🔁 Jana Semula</button>
  <div class="copyrow"><button id="cp">📋 Salin</button></div>
</div>
<script>
(() => {
  const $=(s)=>document.querySelector(s);
  const SETS={up:'ABCDEFGHJKLMNPQRSTUVWXYZ',lo:'abcdefghijkmnpqrstuvwxyz',nu:'23456789',sy:'!@#$%^&*()-_=+[]{};:,.<>?'};
  const WORDS=['kopi','awan','roket','buku','ikan','bunga','hujan','payung','ombak','karang','pantai','gunung','lembah','sungai','bulan','bintang','fajar','senja','ribut','petir','daun','akar','batu','pasir','angin','jernih','tinggi','dalam','jauh','cepat','perlahan','melati','cempaka','teratai','layang','meriam','kompas','lampion','pelita','nakhoda','sagu','ketupat','nanas','mangga','durian','cili','gitar','nelayan','kunci','renjatan'];
  let mode='pw', last='';
  function rand(max){ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%max; }
  function pick(str){ return str[rand(str.length)]; }
  function genPw(){
    let pool=''; ['up','lo','nu','sy'].forEach((k)=>{ if($('#'+k).checked)pool+=SETS[k]; });
    if(!pool){ $('#out').textContent='Pilih sekurang-kurangnya satu set!'; return; }
    const n=+$('#len').value; let s=''; for(let i=0;i<n;i++)s+=pick(pool);
    last=s; show(s, Math.round(n*Math.log2(pool.length)));
  }
  function genPass(){
    const n=+$('#words').value, seen=new Set(); const arr=[];
    while(arr.length<n){ const w=WORDS[rand(WORDS.length)]; if(!seen.has(w)){seen.add(w);arr.push(w);} }
    let s=arr.map((w)=>$('#capWord').checked?w[0].toUpperCase()+w.slice(1):w).join('-');
    if($('#numSuffix').checked)s+='-'+String(rand(90)+10);
    last=s; show(s, Math.round(arr.length*10.5+( $('#numSuffix').checked?6.6:0)));
  }
  function show(s,bits){
    $('#out').textContent=s;
    const pct=Math.min(100,Math.round(bits/128*100));
    const col=bits>=80?'#30d158':bits>=50?'#f2c14e':'#ff5b7f';
    const lbl=bits>=80?'Kuat':bits>=50?'Sederhana':'Lemah';
    $('#bar').style.width=pct+'%'; $('#bar').style.background=col;
    $('#entropy').textContent=`±${bits} bit entropi — ${lbl}`;
  }
  function gen(){ mode==='pw'?genPw():genPass(); }
  $('#tabs').addEventListener('click',(e)=>{ const b=e.target.closest('button[data-m]'); if(!b)return; mode=b.dataset.m; $('#tabs').querySelectorAll('button').forEach((x)=>x.classList.toggle('on',x===b)); $('#optsPw').hidden=mode!=='pw'; $('#optsPass').hidden=mode!=='pass'; gen(); });
  $('#gen').onclick=gen;
  $('#len').addEventListener('input',()=>{ $('#lenV').textContent=$('#len').value; if(mode==='pw')genPw(); });
  $('#words').addEventListener('input',()=>{ $('#wordsV').textContent=$('#words').value; if(mode==='pass')genPass(); });
  document.querySelectorAll('#optsPw input[type=checkbox]').forEach((c)=>c.onchange=()=>{ if(mode==='pw')genPw(); });
  document.querySelectorAll('#optsPass input[type=checkbox]').forEach((c)=>c.onchange=()=>{ if(mode==='pass')genPass(); });
  function copyOut(){ if(!last)return; try{ navigator.clipboard.writeText(last); $('#cp').textContent='✓ Disalin'; setTimeout(()=>$('#cp').textContent='📋 Salin',1300); }catch(e){} }
  $('#cp').onclick=copyOut; $('#out').onclick=copyOut;
  gen();
})();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});</script>
</body>
</html>
