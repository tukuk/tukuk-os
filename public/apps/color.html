<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Picker — Tukuk Apps — Tukuk-OS</title>
<meta name="description" content="HEX/RGB/HSL, tints & shades, complementary/triadic palettes and WCAG contrast ratios — all in the browser.">
<link rel="canonical" href="https://tukuk.org/apps/color">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icons/apps/color.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }
  .hero { display:flex; gap:14px; align-items:center; margin-bottom:16px; }
  input[type=color] { width:86px; height:86px; border:1px solid var(--line); border-radius:16px; background:var(--panel); cursor:pointer; padding:4px; }
  .codes { flex:1; display:flex; flex-direction:column; gap:6px; }
  .code { display:flex; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 11px; font-size:.88rem; font-family:ui-monospace,monospace; }
  .code button { margin-left:auto; background:none; border:0; color:var(--muted); cursor:pointer; }
  .code button:hover { color:var(--accent); }
  h3 { font-size:.85rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:20px 0 8px; }
  .row { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; }
  .chip { border-radius:11px; padding:9px 8px; text-align:center; font-family:ui-monospace,monospace; font-size:.68rem; cursor:pointer; border:1px solid var(--line); word-break:break-all; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:.86rem; }
  td { padding:9px 12px; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; font-weight:700; }
  .ok { color:#7ce898; } .no { color:#ff85b3; }
  .note { color:var(--muted); font-size:.78rem; margin-top:10px; }
</style>
  <link rel="manifest" href="/manifest-color.json">
</head>
<body>
<header><a class="back" href="/apps">← Apps</a><h1>🎨 Color Picker</h1></header>
<div class="wrap">
  <div class="hero">
    <input type="color" id="pick" value="#4c8dff">
    <div class="codes">
      <div class="code"><span id="hex"></span><button data-c="hex">📋</button></div>
      <div class="code"><span id="rgb"></span><button data-c="rgb">📋</button></div>
      <div class="code"><span id="hsl"></span><button data-c="hsl">📋</button></div>
    </div>
  </div>
  <h3>Tints &amp; Shades</h3><div class="row" id="tints"></div>
  <h3>Palette</h3><div class="row" id="palette"></div>
  <h3>Contrast Ratio</h3>
  <table><tr><td>vs White #fff</td><td id="cw"></td></tr><tr><td>vs Black #000</td><td id="cb"></td></tr></table>
  <p class="note">Click any code to copy. WCAG: normal text needs ≥ 4.5, large headings ≥ 3.</p>
</div>
<script>
(() => {
  const $=(s)=>document.querySelector(s);
  const hex2=(n)=>n.toString(16).padStart(2,'0');
  function parse(h){ const s=h.replace('#',''); return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]; }
  function toHex(r,g,b){ return '#'+hex2(r)+hex2(g)+hex2(b); }
  function rgb2hsl(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2; let h=0; if(d){ if(mx===r)h=(g-b)/d+(g<b?6:0); else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; } const s=d?(d/(1-Math.abs(2*l-1))):0; return [Math.round(h),Math.round(s*100),Math.round(l*100)]; }
  function hsl2rgb(h,s,l){ s/=100;l/=100; const k=(n)=>(n+h/30)%12, a=s*Math.min(l,1-l); const f=(n)=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))); return [f(0),f(8),f(4)]; }
  function lum(r,g,b){ const f=(v)=>{ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); }; return .2126*f(r)+.7152*f(g)+.0722*f(b); }
  function ratio(c1,c2){ const l1=lum(...parse(c1)),l2=lum(...parse(c2)); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05); }
  function render(){
    const v=$('#pick').value, [r,g,b]=parse(v), [h,s,l]=rgb2hsl(r,g,b);
    $('#hex').textContent=v.toUpperCase(); $('#rgb').textContent=`rgb(${r}, ${g}, ${b})`; $('#hsl').textContent=`hsl(${h}, ${s}%, ${l}%)`;
    $('#tints').innerHTML=[90,80,70,60,40,30,20,10].map((t)=>{ const hx=toHex(...hsl2rgb(h,s,t)); return `<div class="chip" style="background:${hx};color:${t>55?'#000':'#fff'}">${hx}</div>`; }).join('');
    $('#palette').innerHTML=[['Complementary',180],['Triadic A',120],['Triadic B',240],['Analog −30',-30],['Analog +30',30]].map(([n,d])=>{ const hx=toHex(...hsl2rgb((h+d+360)%360,s,l)); return `<div class="chip" style="background:${hx};color:${l>55?'#000':'#fff'}" title="${n}">${hx}</div>`; }).join('');
    const cw=ratio(v,'#ffffff'), cb=ratio(v,'#000000');
    $('#cw').innerHTML=`${cw.toFixed(2)}:1 ${cw>=4.5?'<span class="ok">✓ AA</span>':'<span class="no">✕</span>'}`;
    $('#cb').innerHTML=`${cb.toFixed(2)}:1 ${cb>=4.5?'<span class="ok">✓ AA</span>':'<span class="no">✕</span>'}`;
    document.querySelectorAll('.chip').forEach((c)=>c.onclick=()=>copy(c.textContent.trim()));
  }
  function copy(t){ try{ navigator.clipboard.writeText(t); }catch(e){} }
  $('#pick').addEventListener('input',render);
  document.querySelectorAll('.code button').forEach((btn)=>btn.onclick=()=>copy($('#'+btn.dataset.c).textContent));
  render();
})();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});</script>
</body>
</html>
