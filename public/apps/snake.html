<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="The Nokia-era classic that lives on in every phone: steer the snake, eat the fruit, grow longer and don't crash into yourself. Swipe or use arrow keys.">
<link rel="canonical" href="https://tukuk.org/apps/snake">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:440px; margin:0 auto; padding:12px; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:10px; font-size:.82rem; }
  .hud .stat { flex:1; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.66rem; text-transform:uppercase; }
  canvas { display:block; width:100%; border-radius:10px; background:#0c0f16; touch-action:none; }
  #start { margin-top:12px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px; font-weight:700; cursor:pointer; font:inherit; }
  .hint { text-align:center; color:var(--muted); font-size:.78rem; margin-top:8px; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🐍 Snake</h1></header>
<div class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Score</span><b id="score">0</b></div>
    <div class="stat"><span class="lab">Best</span><b id="best">0</b></div>
    <div class="stat"><span class="lab">Speed</span><b id="spd">1</b></div>
  </div>
  <canvas id="cv" width="400" height="400"></canvas>
  <button id="start">Start</button>
  <p class="hint">Swipe on the board (or arrow keys) to turn. Eat the red fruit — every few bites you speed up.</p>
</div>
<script>
(() => {
  const COLS = 20, cv = document.getElementById('cv'), g = cv.getContext('2d');
  const CELL = cv.width / COLS;
  let snake, dir, nextDir, food, score = 0, best = Number(localStorage.getItem('snake-best') || 0), running = false, over = false, acc = 0, last = 0;
  function speed() { return Math.max(70, 160 - Math.floor(score / 4) * 10); }
  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir; score = 0; over = false; acc = 0;
    placeFood(); updateHud();
  }
  function placeFood() {
    do { food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * COLS) }; }
    while (snake.some((s) => s.x === food.x && s.y === food.y));
  }
  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= COLS || snake.some((s) => s.x === head.x && s.y === head.y)) {
      over = true; running = false; draw(); banner('Crashed! ' + score + ' pts'); return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { score++; placeFood(); updateHud(); }
    else snake.pop();
  }
  function turn(dx, dy) {
    if (dx === -dir.x && dy === -dir.y) return; // no instant reversal
    if (dx === dir.x && dy === dir.y) return;
    nextDir = { x: dx, y: dy };
  }
  function loop(ts) {
    if (!running) return;
    if (!last) last = ts;
    acc += ts - last; last = ts;
    if (acc > speed()) { acc = 0; step(); }
    draw();
    requestAnimationFrame(loop);
  }
  function banner(t) { g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(0, cv.height / 2 - 30, cv.width, 60); g.fillStyle = '#fff'; g.font = 'bold 22px system-ui'; g.textAlign = 'center'; g.fillText(t, cv.width / 2, cv.height / 2 + 8); }
  function draw() {
    g.clearRect(0, 0, cv.width, cv.height);
    g.fillStyle = '#e04c4c';
    g.beginPath(); g.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.38, 0, 7); g.fill();
    snake.forEach((s, i) => {
      g.fillStyle = i === 0 ? '#7CFC9a' : '#3fb85a';
      g.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }
  function updateHud() {
    document.getElementById('score').textContent = score;
    document.getElementById('spd').textContent = 1 + Math.floor(score / 4);
    if (score > best) { best = score; localStorage.setItem('snake-best', String(best)); }
    document.getElementById('best').textContent = best;
  }
  function start() { if (running) return; reset(); running = true; last = 0; acc = 0; requestAnimationFrame(loop); }

  let sx = 0, sy = 0, sw = false;
  cv.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; sw = true; });
  cv.addEventListener('pointerup', (e) => {
    if (!sw) return; sw = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  });
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft') { e.preventDefault(); turn(-1, 0); }
    else if (k === 'ArrowRight') { e.preventDefault(); turn(1, 0); }
    else if (k === 'ArrowUp') { e.preventDefault(); turn(0, -1); }
    else if (k === 'ArrowDown') { e.preventDefault(); turn(0, 1); }
  });
  document.getElementById('start').addEventListener('click', start);
  reset(); draw();
})();
</script>
</body>
</html>
