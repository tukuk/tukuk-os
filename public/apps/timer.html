<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer &amp; Pomodoro — Tukuk Apps — Tukuk-OS</title>
<meta name="description" content="Jam randik dengan pusingan dan pemasa Pomodoro dengan bunyi — berjalan terus walaupun tab di belakang. Tanpa pemasangan.">
<link rel="canonical" href="https://tukuk.org/apps/timer">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icons/apps/timer.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:460px; margin:0 auto; padding:22px 16px; text-align:center; }
  .tabs { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:22px; }
  .tabs button { background:var(--panel); border:0; color:var(--muted); padding:9px 20px; font-size:.88rem; cursor:pointer; font-weight:700; }
  .tabs button.on { background:var(--accent); color:#fff; }
  .clock { font-size:3.6rem; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.02em; margin:10px 0 18px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btns button { border:0; border-radius:11px; padding:12px 22px; font-size:.95rem; font-weight:700; cursor:pointer; background:var(--panel); color:var(--text); border:1px solid var(--line); }
  .btns .go { background:var(--accent); color:#fff; border:0; }
  .btns .danger { color:#ff5b7f; }
  .laps { margin-top:20px; text-align:left; max-height:220px; overflow:auto; }
  .laps div { display:flex; justify-content:space-between; padding:7px 10px; border-bottom:1px solid var(--line); font-size:.86rem; color:var(--muted); }
  .presets { display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
  .presets button { background:var(--panel); border:1px solid var(--line); color:var(--muted); border-radius:9px; padding:6px 13px; font-size:.82rem; cursor:pointer; }
  .presets button.on { border-color:var(--accent); color:var(--accent); }
  .round { color:var(--muted); font-size:.85rem; margin-bottom:4px; }
</style>
</head>
<body>
<header><a class="back" href="/apps">← Apps</a><h1>⏱️ Timer &amp; Pomodoro</h1></header>
<div class="wrap">
  <div class="tabs" id="tabs"><button data-t="sw" class="on">Jam Randik</button><button data-t="pomo">Pomodoro</button></div>

  <div id="sw">
    <div class="clock" id="swFace">00:00.00</div>
    <div class="btns">
      <button class="go" id="swToggle">Mula</button>
      <button id="swLap">Pusingan</button>
      <button class="danger" id="swReset">Set Semula</button>
    </div>
    <div class="laps" id="laps"></div>
  </div>

  <div id="pomo" hidden>
    <div class="presets" id="presets">
      <button data-m="25" class="on">25m fokus</button><button data-m="5">5m rehat</button><button data-m="15">15m rehat panjang</button>
    </div>
    <div class="round" id="pomoRound">Pusingan 1 — fokus</div>
    <div class="clock" id="pomoFace">25:00</div>
    <div class="btns">
      <button class="go" id="pomoToggle">Mula</button>
      <button class="danger" id="pomoReset">Set Semula</button>
    </div>
  </div>
</div>
<script>
(() => {
  const $=(s)=>document.querySelector(s);
  const pad=(n)=>String(n).padStart(2,'0');
  // ── Jam randik ──
  let swRun=false, swBase=0, swAcc=0, laps=[], swTimer=null;
  function swFmt(ms){ const cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000)%60, h=Math.floor(ms/3600000); return (h?pad(h)+':':'')+pad(m)+':'+pad(s)+'.'+pad(cs); }
  function swTick(){ $('#swFace').textContent=swFmt(swAcc+(swRun?Date.now()-swBase:0)); }
  function renderLaps(){ $('#laps').innerHTML=laps.map((l,i)=>`<div><span>Pusingan ${i+1}</span><span>${swFmt(l)}</span></div>`).join(''); }
  $('#swToggle').onclick=()=>{ swRun=!swRun; swBase=Date.now(); $('#swToggle').textContent=swRun?'Berhenti':'Teruskan'; if(swRun){ swTimer=setInterval(swTick,31); } else { swAcc+=Date.now()-swBase; clearInterval(swTimer); swTick(); } };
  $('#swLap').onclick=()=>{ if(!swRun)return; const tot=swAcc+(Date.now()-swBase); laps.push(tot-laps.reduce((a,b)=>a+b,0)); renderLaps(); };
  $('#swReset').onclick=()=>{ swRun=false; swAcc=0; laps=[]; clearInterval(swTimer); $('#swFace').textContent='00:00.00'; $('#swToggle').textContent='Mula'; renderLaps(); };
  // ── Pomodoro ──
  let dur=25*60, left=dur, running=false, tickT=null, round=1, fokus=true;
  function pomoFmt(s){ return pad(Math.floor(s/60))+':'+pad(s%60); }
  function label(){ $('#pomoFace').textContent=pomoFmt(left); $('#pomoRound').textContent=`Pusingan ${round} — ${fokus?'fokus':'rehat'}`; }
  function beep(){ try{ const C=window.AudioContext||window.webkitAudioContext; const ac=new C(); [0,.18,.36].forEach((d)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.18,ac.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d+.14); o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.15); }); }catch(e){} }
  $('#pomoToggle').onclick=()=>{ running=!running; $('#pomoToggle').textContent=running?'Berhenti':'Teruskan'; if(running){ tickT=setInterval(()=>{ if(left>0){ left--; label(); if(document.title!=='⏰ '+pomoFmt(left))document.title='⏰ '+pomoFmt(left)+' — Pomodoro'; } else { clearInterval(tickT); running=false; beep(); left=0; label(); document.title='Pomodoro selesai! 🍅'; } },1000); } else { clearInterval(tickT); } };
  $('#pomoReset').onclick=()=>{ running=false; clearInterval(tickT); left=dur; $('#pomoToggle').textContent='Mula'; label(); };
  $('#presets').addEventListener('click',(e)=>{ const b=e.target.closest('button[data-m]'); if(!b)return; dur=b.dataset.m*60; left=dur; running=false; clearInterval(tickT); $('#pomoToggle').textContent='Mula'; fokus=b.dataset.m==='25'; label(); $('#presets').querySelectorAll('button').forEach((x)=>x.classList.toggle('on',x===b)); });
  // ── Tab ──
  $('#tabs').addEventListener('click',(e)=>{ const b=e.target.closest('button[data-t]'); if(!b)return; const t=b.dataset.t; $('#tabs').querySelectorAll('button').forEach((x)=>x.classList.toggle('on',x===b)); $('#sw').hidden=t!=='sw'; $('#pomo').hidden=t!=='pomo'; });
  label();
})();
</script>
</body>
</html>
