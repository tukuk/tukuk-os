name = "tukuk-www-worker"
main = "index.js"
compatibility_date = "2026-10-08"

# FULLY WORKERLESS — tukuk.org & www.tukuk.org now resolve straight to the
# Cloudflare Tunnel (CNAME → …cfargotunnel.com) → nginx → Node. No Worker routes.
#
# Why: the apex Worker route fetched() the SAME zone (url.hostname = tukuk.org),
# so every page doubled the zone request count and tripped Cloudflare's zone
# rate-limit → a site-wide 429 "error code: 1027" for ALL visitors. The www was
# a Worker Custom Domain whose edge path blocked the same way. Both now live on
# the tunnel; the www→apex 301 is served by Node's canonical middleware. If you
# re-enable a route here, the same-zone subrequest WILL re-trigger the 429.
routes = []

# Observability — pinned OFF at the file level, mirroring the dashboard toggle the
# owner set on 1 Nov 2026. Persisted invocation logs/traces are the metered part;
# keeping them off keeps this worker inside the FREE plan forever. It lives HERE
# because a re-deploy without the block silently re-enables what the dashboard turned off.
observability = { enabled = false, head_sampling_rate = 1, redact_query_string = false, logs = { enabled = false, invocation_logs = true, persist = false }, traces = { enabled = false, persist = false }, issues = { enabled = true } }

# Site snapshot bucket — when the origin is down, the worker serves files from here.
[[r2_buckets]]
binding = "BACKUP"
bucket_name = "tukuk-fallback"

# Analytics Engine (free, ~5 million rows/month) — records edge requests,
# /search query keywords, and WHEN the fallback (R2) mode is used.
[[analytics_engine_datasets]]
binding = "TUKUK_ENGINE"
dataset = "tukuk-os"
