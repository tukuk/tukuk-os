name = "tukuk-www-worker"
main = "index.js"
compatibility_date = "2026-10-08"

routes = [
  { pattern = "tukuk.org/*", zone_name = "tukuk.org" },
  { pattern = "www.tukuk.org/*", zone_name = "tukuk.org" }
]

# Bucket snapshot laman — bila origin mati, worker hidang fail dari sini.
[[r2_buckets]]
binding = "BACKUP"
bucket_name = "tukuk-fallback"

# Analytics Engine (percuma, ~5 juta baris/bulan) — rekod permintaan tepi,
# kata kunci carian /search, dan BILA mod sandaran (R2) digunakan.
[[analytics_engine_datasets]]
binding = "TUKUK_ENGINE"
dataset = "tukuk-os"
