# Dependabot — automatic PRs for vulnerable/typosquatted dependencies.
# Set for safe fluidity: only patch/minor are grouped (major needs a manual review),
# PR count is limited, and npm + Actions are watched. `audit-check` adds security alerts.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:45"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/cloudflare-worker/tukuk-fallback"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:45"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:45"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 5
