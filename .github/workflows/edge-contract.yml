name: Edge contract

# The canary asks "is the site up". This lane asks "is the site still the site":
# the public contract a crawler, a browser or a search engine sees — robots.txt
# advertising the sitemap, the sitemap carrying /books/, a real shelf answering
# 200 as html, an invented shelf answering a true 404, compressed html, HSTS,
# and /health talking even when degraded. Every one of those was verified by
# hand during the 2 Nov audit; hand-verified facts rot exactly like untested
# code, and the failure mode (a silently deindexed books cluster) shows up
# months later in analytics, not in any error log.
#
# scripts/edge-connect.js owns the checks and their exit codes; this file only
# routes them into issues. rc 3 = the edge is challenging GitHub runner IPs
# (the canary's BLOCKED case, same zone, same rule): green with a warning,
# because a blind monitor must not train anyone to ignore red.
on:
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: edge-contract
  cancel-in-progress: false

jobs:
  contract:
    name: tukuk.org keeps its public shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # The rotating shelf probe reads SUBJECTS from src/books.js, which needs
      # its one production http dependency; same --omit=dev install as test.yml.
      - name: Install
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Check the contract
        id: edge
        run: |
          node scripts/edge-connect.js | tee edge.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload edge log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-contract-log
          path: edge.log
          retention-days: 14

      - name: Open or close the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC: ${{ steps.edge.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          CONTRACT_TITLE="edge: the public contract of tukuk.org broke"

          find_open() { gh issue list --state open --search "\"$1\" in:title" --json number \
                        --jq '.[0].number // empty'; }

          # Explicit if/fi everywhere: GitHub runs this under bash -e, and a bare
          # `[ -n "$X" ] && ...` kills the step when the test is false (documented
          # in the canary, where that shape hid an outage).
          if [ "${RC:-1}" = "3" ]; then
            echo "::warning title=edge contract is blind::Cloudflare is challenging this runner; the contract was not observed"
            exit 0
          fi

          if [ "${RC:-1}" = "0" ]; then
            N="$(find_open "$CONTRACT_TITLE")"
            if [ -n "$N" ]; then
              gh issue close "$N" --comment "The contract holds again: $RUN_URL"
            fi
            echo "edge contract holds"
            exit 0
          fi

          STAMP="$(date -u +%FT%TZ)"
          BODY="$(printf 'Verdict: contract broken at %s\n\n```\n%s\n```\n\nRun: %s' \
                   "$STAMP" "$(cat edge.log)" "$RUN_URL")"
          NUM="$(find_open "$CONTRACT_TITLE")"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$CONTRACT_TITLE" --body "$BODY"
          fi
          echo "edge contract failed — issue $NUM"
          exit 1
