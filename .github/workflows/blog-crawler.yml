name: Blog Content Auto-Upgrade

on:
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  crawl:
    name: Blog Crawler
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Blog Crawler
        run: python3 scripts/blog_crawler.py

      - name: Commit and Push Updates
        env:
          GIT_AUTHOR_NAME: tukuk-os bot
          GIT_AUTHOR_EMAIL: bot@tukuk.org
          GIT_COMMITTER_NAME: tukuk-os bot
          GIT_COMMITTER_EMAIL: bot@tukuk.org
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          # Check if there are any changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Add all changed files
          git add content/blog/

          # Commit with timestamp
          git commit -m "chore: auto-upgrade blog content — added missing content to reach 1000+ words [skip ci]"

          # Push changes
          git push origin main