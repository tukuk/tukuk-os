name: Public canary

# The watchdog on the VPS can only report failures it survives. This one runs on
# GitHub's infrastructure, so a dead box, a dead tunnel and a dead datacentre all look
# the same from here: a red run and an open issue. Half-hourly is deliberate — the
# 31 Oct 2026 outage sat unnoticed for hours because nothing outside the machine was
# looking. Roughly 24 runner-minutes a day; if that ever matters, raise the interval.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: public-canary
  cancel-in-progress: false

jobs:
  canary:
    name: tukuk.org is reachable and honest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The probe's exit status is the whole point, and `| tee` hands the step's status to tee,
      # so rc is recorded explicitly. That record replaces a real bug: this workflow used to read
      # steps.probe.outcome with continue-on-error:true, and a step that exits 2 under
      # continue-on-error reports outcome=success. The canary that found the edge down printed
      # "canary passed", closed its own issue, and stayed green — the same shape as the on-box
      # watchdog dying on an unbound variable instead of reporting the outage.
      - name: Probe the public surface
        id: probe
        run: |
          bash scripts/public-canary.sh | tee canary.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload canary log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-log
          path: canary.log
          retention-days: 7

      - name: Open or close the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC: ${{ steps.probe.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE="canary: the public site is not healthy"
          # rc 2 = the edge itself never reached the origin; rc 1 = the origin answered and is
          # wrong. Say which, because only one of them can be fixed by deploying.
          case "${RC:-1}" in
            0) VERDICT=OK ;;
            2) VERDICT=EDGE_DOWN ;;
            *) VERDICT=DEGRADED ;; esac
          NUM="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number \
                 --jq '.[0].number // empty')"

          if [ "$VERDICT" = "OK" ]; then
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "Recovered — the canary passes again: $RUN_URL"
            fi
            echo "canary passed"
            exit 0
          fi

          BODY="$(printf 'Verdict: %s at %s\n\n```\n%s\n```\n\nRun: %s' \
                   "$VERDICT" "$(date -u +%FT%TZ)" "$(cat canary.log)" "$RUN_URL")"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          echo "canary failed — issue $NUM updated"
          exit 1
