name: Public canary

# The watchdog on the VPS can only report failures it survives. This one runs on
# GitHub's infrastructure, so a dead box, a dead tunnel and a dead datacentre all look
# the same from here: a red run and an open issue. Half-hourly is deliberate — the
# 31 Oct 2026 outage sat unnoticed for hours because nothing outside the machine was
# looking. Roughly 24 runner-minutes a day; if that ever matters, raise the interval.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: public-canary
  cancel-in-progress: false

jobs:
  canary:
    name: tukuk.org is reachable and honest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The probe's exit status is the whole point, and `| tee` hands the step's status to tee,
      # so rc is recorded explicitly. That record replaces a real bug: this workflow used to read
      # steps.probe.outcome with continue-on-error:true, and a step that exits 2 under
      # continue-on-error reports outcome=success. The canary that found the edge down printed
      # "canary passed", closed its own issue, and stayed green — the same shape as the on-box
      # watchdog dying on an unbound variable instead of reporting the outage.
      - name: Probe the public surface
        id: probe
        run: |
          bash scripts/public-canary.sh | tee canary.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload canary log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canary-log
          path: canary.log
          retention-days: 7

      - name: Open or close the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC: ${{ steps.probe.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          UNHEALTHY_TITLE="canary: the public site is not healthy"
          BLIND_TITLE="canary: the edge is challenging this runner, so the monitor is blind"
          # rc 2 = the edge never reached the origin; rc 3 = the edge is alive and refusing this
          # client (fix the security rule, do not redeploy); rc 1 = the origin answered and is
          # wrong. Three different faults, and only two of them are fixable by deploying.
          case "${RC:-1}" in
            0) VERDICT=OK ;;
            2) VERDICT=EDGE_DOWN ;;
            3) VERDICT=BLOCKED ;;
            *) VERDICT=DEGRADED ;; esac

          find_open() { gh issue list --state open --search "\"$1\" in:title" --json number \
                        --jq '.[0].number // empty'; }

          # NOTE on shape: GitHub runs run: under `bash -e`, so nothing here may be a bare
          # `[ -n "$X" ] && do_thing` — that returns 1 when the test is false and aborts the step
          # before it prints anything. Every conditional is an explicit if/fi.
          if [ "$VERDICT" = "OK" ]; then
            for T in "$UNHEALTHY_TITLE" "$BLIND_TITLE"; do
              N="$(find_open "$T")"
              if [ -n "$N" ]; then
                gh issue close "$N" --comment "Recovered — the canary passes again: $RUN_URL"
              fi
            done
            echo "canary passed"
            exit 0
          fi

          STAMP="$(date -u +%FT%TZ)"

          # A challenged runner is not an outage. Cloudflare answers 403 with cf-mitigated:challenge
          # to datacenter IPs on this zone, so the site can be perfectly healthy for every real
          # visitor while this job cannot see it at all. That gets its own issue, opened once and
          # left open, and the run stays GREEN: a job that is red every 30 minutes forever teaches
          # nobody to look at red, and red must keep meaning "the site is broken". It is still
          # reported, because a blind monitor cannot promise the site is up — and the same rule may
          # be serving that challenge to Googlebot, which is how a site vanishes from search.
          if [ "$VERDICT" = "BLOCKED" ]; then
            if [ -z "$(find_open "$BLIND_TITLE")" ]; then
              gh issue create --title "$BLIND_TITLE" --body "$(printf 'Verdict: BLOCKED at %s\n\nEvery probe returns cf-mitigated:challenge (the "Just a moment..." page), so this canary cannot see tukuk.org from GitHub runner IPs at all. Real visitors may be fine; a blind monitor cannot promise that. Exempt the runner in the zone security rules, or move the probe to a residential vantage point.\n\nCheck separately whether crawlers get the same challenge — that is a deindexing event, not an uptime event.\n\n```\n%s\n```\n\nRun: %s' "$STAMP" "$(cat canary.log)" "$RUN_URL")"
            fi
            echo "::warning title=canary is blind::the edge is challenging this runner; see the open tracking issue"
            exit 0
          fi

          BODY="$(printf 'Verdict: %s at %s\n\n```\n%s\n```\n\nRun: %s' \
                   "$VERDICT" "$STAMP" "$(cat canary.log)" "$RUN_URL")"
          NUM="$(find_open "$UNHEALTHY_TITLE")"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$UNHEALTHY_TITLE" --body "$BODY"
          fi
          echo "canary failed — verdict $VERDICT, issue $NUM"
          exit 1
