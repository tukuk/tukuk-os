name: Public canary

# The watchdog on the VPS can only report failures it survives. This one runs on
# GitHub's infrastructure, so a dead box, a dead tunnel and a dead datacentre all look
# the same from here: a red run and an open issue. Half-hourly is deliberate — the
# 31 Oct 2026 outage sat unnoticed for hours because nothing outside the machine was
# looking. Roughly 24 runner-minutes a day; if that ever matters, raise the interval.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: public-canary
  cancel-in-progress: false

jobs:
  canary:
    name: tukuk.org is reachable and honest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # continue-on-error so the reporting step below always runs: a red run with no
      # issue is only half a monitor.
      - name: Probe the public surface
        id: probe
        continue-on-error: true
        run: bash scripts/public-canary.sh | tee canary.log

      - name: Upload canary log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-log
          path: canary.log
          retention-days: 7

      - name: Open or close the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.probe.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE="canary: the public site is not healthy"
          NUM="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number \
                 --jq '.[0].number // empty')"

          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "Recovered — the canary passes again: $RUN_URL"
            fi
            echo "canary passed"
            exit 0
          fi

          BODY="$(printf 'Canary failed at %s\n\n```\n%s\n```\n\nRun: %s' \
                   "$(date -u +%FT%TZ)" "$(cat canary.log)" "$RUN_URL")"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          echo "canary failed — issue $NUM updated"
          exit 1
