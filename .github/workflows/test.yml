name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pinned explicitly (test/ops-hygiene.test.js now enforces it for every workflow):
# a test job has no reason to hold a writable token, and the repo-wide default is a
# setting someone can change without touching this file.
permissions:
  contents: read

jobs:
  test:
    name: Unit (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Only production dependencies are needed by the tests (node:test is built
      # in). --omit=dev skips electron/electron-builder/sharp (heavy).
      # The postinstall setup-all.sh --from-npm exits early (exit 0) on non-servers.
      - name: Install
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Lint (syntax check)
        run: npm run lint

      - name: Test
        run: npm test
