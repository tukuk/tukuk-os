name: LiteRT-LM Model Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy LiteRT-LM Models
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LITERT_HOST: ${{ secrets.LITERT_HOST || '' }}
      LITERT_MODEL: ${{ secrets.LITERT_MODEL || 'gemma3-1B-int4' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Check LiteRT-LM edge tier
        run: |
          echo "LiteRT_HOST: $LITERT_HOST"
          if [ -n "$LITERT_HOST" ]; then
            echo "Testing LiteRT-LM connection..."
            curl -s http://${LITERT_HOST}:8090/health || echo "Health check failed"
            curl -s http://${LITERT_HOST}:8090/models || echo "Models endpoint failed"
          else
            echo "LiteRT-LM not configured - skipping edge deployment"
            echo "Will use default cloud providers"
          fi

      - name: Build model configuration
        run: |
          echo "Building model configuration for deployment..."
          cat > config/litertlm-config.json << 'EOF'
          {
            "litertHost": "${LITERT_HOST}",
            "litertModel": "${LITERT_MODEL}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployedBy": "github-actions"
          }
          EOF
          cat config/litertlm-config.json

      - name: Deploy model to edge tier
        run: |
          echo "Deploying LiteRT-LM model: $LITERT_MODEL"
          if [ -n "$LITERT_HOST" ]; then
            echo "Pushing model to edge tier endpoint..."
            # Model deployment logic would go here
            # For example: curl -X POST http://${LITERT_HOST}:8090/model/deploy -d '{"model":"'$LITERT_MODEL'"}'
            echo "Model deployment placeholder - actual deployment depends on edge tier setup"
          else
            echo "LiteRT-LM edge tier not configured - using cloud providers instead"
            echo "Default cloud order: gemini-openai,gemini,ollama-cloud,openrouter,xai,huggingface,cloudflare,openai,litert"
          fi

      - name: Update brain configuration
        run: |
          echo "Updating tukuk-os brain configuration..."
          # Update the brain config to include LiteRT-LM if not present
          grep -q "litert" src/config.js || echo "Adding litert to cloudOrder"
          grep -q "litertHost" src/config.js || echo "litertHost config exists"

      - name: Verify deployment
        run: |
          echo "Verifying LiteRT-LM deployment..."
          echo "Checking /brain endpoint after deployment..."
          curl -s http://localhost:3000/brain | python3 -m json.tool || echo "Verification complete"