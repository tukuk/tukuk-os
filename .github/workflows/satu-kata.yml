# ============================================================================
# satu-kata — CI/CD PERCUMA, VPS tidak dibebani.
# GitHub Actions jadi "otak": setiap hari satu kata → jana app+game → deploy
# ke Cloudflare Pages → commit semula manifest supaya esok kata seterusnya.
# GitLab CI (.gitlab-ci.yml) = mirror mingguan. Tiada apa-apa berjalan di VPS.
#
# RAHSIA PERLU DITETAP di repo → Settings → Secrets → Actions:
#   CLOUDFLARE_API_TOKEN   (token dengan keizinan Workers/Pages — ada dlm .env anda)
#   CLOUDFLARE_ACCOUNT_ID  (391d9aa59cfcc5ec44c3d25c855c45cb — lihat .kilo/agent/cloudflare.md)
# GITHUB_TOKEN (bawaan) digunakan utk push manifest semula → perlu permit
#   Settings → Actions → General → Workflow permissions = "Read and write".
# ============================================================================
name: satu-kata

on:
  schedule:
    - cron: '15 18 * * *'   # 03:15 Malaysia (UTC+8) setiap hari — 1 hari 1 app+game
  workflow_dispatch:        # trigger manual; boleh isi satu kata
    inputs:
      word:
        description: 'Kata untuk dijana (kosong = auto-pilih kata seterusnya)'
        required: false
        type: string
      unity:
        description: 'Sertakan scaffold Unity (opt-in)'
        required: false
        type: boolean
        default: false

concurrency:
  group: satu-kata
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-deploy:
    runs-on: ubuntu-latest        # runner percuma GitHub — bukan VPS anda
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Jana app + game
        env:
          SATU_KATA_WORD: ${{ inputs.word || '' }}
        run: |
          ARGS=""
          if [ -n "${SATU_KATA_WORD}" ]; then ARGS="${SATU_KATA_WORD}"; fi
          if [ "${{ inputs.unity }}" = "true" ]; then ARGS="$ARGS --unity"; fi
          node scripts/satu-kata/generate.mjs $ARGS
          echo "### Hub" >> "$GITHUB_STEP_SUMMARY"
          node -e "const m=require('./generated/manifest.json');console.log(m.entries.length+' hasil · terkini: '+m.entries[m.entries.length-1].word)" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy ke Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages project create tukuk-satu-kata --production-branch main || true
          npx --yes wrangler@latest pages deploy generated/public --project-name tukuk-satu-kata --branch main

      - name: Commit manifest + keluaran (kanan untuk cron hari esok)
        run: |
          git config user.name  "tukuk-satu-kata[bot]"
          git config user.email "bot@tukuk.org"
          git add generated/ || true
          if ! git diff --cached --quiet; then
            git commit -m "satu-kata: jana $(date -u +%F) [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "Tiada perubahan untuk di-commit."
          fi
