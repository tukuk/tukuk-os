# ==============================================================================
# Cloudflared config untuk Tukuk-OS — salin ke /etc/cloudflared/config.yml
#
#   sudo mkdir -p /etc/cloudflared
#   sudo cp deploy/cloudflared/config.yml /etc/cloudflared/config.yml
#   sudo cp ~/.cloudflared/<TUNNEL_ID>.json /etc/cloudflared/
#   sudo cloudflared service install
#
# PENTING (kesilapan biasa):
#   1. `tunnel:` mesti TUNNEL ID (UUID), bukan nama — atau nama boleh tapi
#      credentials-file mesti wujud & betul. Jangan tinggal <TUNNEL_ID>.json.
#   2. `sudo cloudflared service install` berjalan sebagai root, jadi ia HANYA
#      cari config di /etc/cloudflared — bukan di ~/.cloudflared anda.
#   3. Credentials JSON ialah rahsia — chmod 600, jangan commit ke git.
# ==============================================================================

# Tunnel "tukuk-os" (guna UUID tunnel baru anda; mod token = dashboard, bukan fail ini):
tunnel: 168a53af-7e70-460f-b697-2190ec0f28ba
credentials-file: /etc/cloudflared/168a53af-7e70-460f-b697-2190ec0f28ba.json

ingress:
  # Enjin carian + panel admin Tukuk-OS (node index.js, port 3000)
  - hostname: tukuk.org
    service: http://localhost:3000
  - hostname: www.tukuk.org
    service: http://localhost:3000
  - hostname: dashboard.tukuk.org
    service: http://localhost:3000
  # Wajib: rule padanan terakhir
  - service: http_status:404
