# ==============================================================================
# Templat Cloudflared config untuk Tukuk-OS.
# setup-all.sh menyalin fail ini ke /etc/cloudflared/config.yml dan mengganti
# <TUNNEL_ID> dengan UUID tunnel anda.
#
#   MOD TOKEN (disyorkan, portabel): setup-all menukar baris `credentials-file:`
#     kepada `token: <CF_TUNNEL_TOKEN>` — TIADA fail .json diperlukan, jadi
#     pelayan baru cukup CF_TUNNEL_TOKEN + CF_TUNNEL_ID dalam .env → terus hidup.
#     ⚠ PENTING: dalam mod TOKEN, cloudflared MENGABAIKAN seksyen `ingress:`
#     setempat — laluan hostname dibaca dari dashboard Cloudflare. Untuk tambah
#     hostname baru (cth. tchat.tukuk.org), buka Zero Trust → Networks → Routes
#     → Add public hostname, atau pakai API dengan token yang ada lesen Tunnel.
#   MOD JSON (fallback): <TUNNEL_ID>.json mesti wujud di /etc/cloudflared/.
#
# PENTING (kesilapan biasa):
#   1. `tunnel:` mesti TUNNEL ID (UUID). setup-all isi automatik dari CF_TUNNEL_ID.
#   2. `sudo cloudflared service install` berjalan sebagai root — ia HANYA baca
#      /etc/cloudflared/config.yml, bukan ~/.cloudflared anda.
#   3. Token/credentials ialah RAHSIA — config.yml yang mengandungi token
#      di-chmod 600; jangan tampal token terus ke dalam fail templat ini.
# ==============================================================================

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  # Enjin carian + panel admin Tukuk-OS (node index.js, port 3000)
  - hostname: tukuk.org
    service: http://localhost:3000
  - hostname: www.tukuk.org
    service: http://localhost:3000
  - hostname: dashboard.tukuk.org
    service: http://localhost:3000
  # Ruang khas T Chat (pelayan sama, host berbeza — src/server.js gate TCHAT_HOST).
  - hostname: tchat.tukuk.org
    service: http://localhost:3000
  # Wajib: rule padanan terakhir
  - service: http_status:404
