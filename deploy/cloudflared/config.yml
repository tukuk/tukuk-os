# ==============================================================================
# Cloudflared config template for Tukuk-OS.
# setup-all.sh copies this file to /etc/cloudflared/config.yml and replaces
# <TUNNEL_ID> with your tunnel UUID.
#
#   TOKEN mode (recommended, portable): setup-all changes the `credentials-file:`
#     line to `token: <CF_TUNNEL_TOKEN>` — NO .json file needed, so a
#     new server only needs CF_TUNNEL_TOKEN + CF_TUNNEL_ID in .env → comes right up.
#     ⚠ IMPORTANT: in TOKEN mode, cloudflared IGNORES the local `ingress:`
#     section — hostname routes are read from the Cloudflare dashboard. To add
#     a new hostname (e.g. tchat.tukuk.org), open Zero Trust → Networks → Routes
#     → Add public hostname, or use the API with a token that has Tunnel license.
#   JSON mode (fallback): <TUNNEL_ID>.json must exist in /etc/cloudflared/.
#
# IMPORTANT (common mistake):
#   1. `tunnel:` must be the TUNNEL ID (UUID). setup-all fills it from CF_TUNNEL_ID.
#   2. `sudo cloudflared service install` runs as root — it ONLY reads
#      /etc/cloudflared/config.yml, not your ~/.cloudflared.
#   3. Token/credentials are a SECRET — a config.yml containing the token
#      is chmod 600; do not paste a token straight into this template file.
# ==============================================================================

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  # THE TARGET IS ALWAYS :3000 — it is Node before the front-proxy cut-over and nginx
  # afterwards (deploy/nginx/install-tukuk-front.sh cut moves Node to :3001 and hands
  # :3000 to nginx). That is deliberate: the tunnel never has to be touched, and the
  # cache can be installed or rolled back without a single visitor seeing a dead port.
  # Every hostname points at the same target: nginx answers any Host and the app decides
  # what each hostname may serve. A hostname pointed anywhere else (the :8080 verify port
  # is the usual accident) answers "error code: 502" from cloudflared.
  # Tukuk-OS search engine + admin panel
  - hostname: tukuk.org
    service: http://localhost:3000
  # www no longer needs the box: in the dashboard it is a zone-level redirect to the apex
  # (`curl -o /dev/null -w '%{http_code} %{redirect_url}' https://www.tukuk.org/` →
  #   `301 https://tukuk.org/`; note HEAD returns nothing here, use GET), and the
  # independent backup copy lives on Cloud Run, reached through the brain Worker — see
  # deploy/GCP-FAILOVER.md. This route is therefore dead weight, kept only as a safety net
  # if the redirect is ever removed. In TOKEN mode cloudflared ignores this file anyway,
  # so deleting the entry here changes nothing until the dashboard route goes too.
  - hostname: www.tukuk.org
    service: http://localhost:3000
  # Same app, used for the admin panel. Keep this route alive or delete it everywhere:
  # WEBAUTHN_ORIGIN advertises it, so a 502 here looks like a broken login page.
  - hostname: dashboard.tukuk.org
    service: http://localhost:3000
  # Dedicated T Chat space (same server, different host — src/server.js TCHAT_HOST gate).
  - hostname: tchat.tukuk.org
    service: http://localhost:3000
  # Tukuk Agent (code-server editor + AI build-agent). A DIFFERENT server
  # (tukuk-agent.service, port 8443). A separate hostname avoids CSP/route collisions
  # with the main tukuk.org app. In TOKEN mode, this route must ALSO
  # be added in the Cloudflare dashboard (Zero Trust → Networks → Routes) —
  # cloudflared in token mode IGNORES the local ingress section.
  - hostname: agent.tukuk.org
    service: http://127.0.0.1:8443
  # Tukuk Strike HD — the Godot web build. Same target as the rest (:3000/nginx);
  # nginx routes this Host to its OWN server block (deploy/nginx/tukuk-play.conf) which
  # serves static files with the COOP/COEP headers a threaded Godot export needs. This
  # origin is deliberately cross-origin-ISOLATED and separate, so it cannot share the
  # tukuk.org host (site-wide COEP would break GTM/AdSense/Clarity + cross-subdomain assets).
  # In TOKEN mode this route must ALSO be added in the dashboard, plus a DNS record.
  - hostname: play.tukuk.org
    service: http://localhost:3000
  # Required: catch-all rule last
  - service: http_status:404
