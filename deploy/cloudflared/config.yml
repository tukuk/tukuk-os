# ==============================================================================
# Cloudflared config template for Tukuk-OS — ONE tunnel, ONE connector.
# setup-all.sh copies this file to /etc/cloudflared/config.yml and fills in the
# tunnel UUID from CF_TUNNEL_ID.
#
# THE RULE (on this box): exactly one tunnel (c1d8ea0f = `tukuk-tunnel`), exactly one unit
# (cloudflared.service). Every hostname below is a route ON THAT TUNNEL. If a new
# entry point is needed, add a hostname here and in the dashboard — never stand up a
# second connector. A second tunnel means a second credential file, a second unit to
# forget on a rebuild, and a hostname that 530s when only the first one is running.
# The legacy `build-tukuk` tunnel (a3af5bb4) existed only because of the token-mode
# limitation below; it is retired, and so is the tunnel it replaced on 31 Oct 2026
# (`tukuk-os-v2` / 87e7e77f, which lived in the previous owner's account and does not
# exist here). (gcp-config.yml is the one other file here and it is
# a different machine on purpose — the GCP failover mirror; it is never installed here.)
#
#   TOKEN mode (what this box runs): setup-all replaces the `credentials-file:` line
#     with `token: <CF_TUNNEL_TOKEN>`, so no .json is needed and a new server comes up
#     from .env alone. ⚠ IMPORTANT: in TOKEN mode cloudflared IGNORES the local
#     `ingress:` section — hostnames are read from the Cloudflare dashboard
#     (Zero Trust → Networks → Routes → Add public hostname, connector c1d8ea0f).
#     The list below is therefore the CANONICAL LIST, not the live source of truth:
#     the dashboard is. Keep the two in step; `node scripts/cloudflared-audit.js`
#     compares them.
#   JSON mode (fallback): <TUNNEL_ID>.json must exist in /etc/cloudflared/, and then
#     this file IS the source of truth, which is the reason it must stay complete.
#
# IMPORTANT (common mistake):
#   1. `tunnel:` must be the TUNNEL ID (UUID). setup-all fills it from CF_TUNNEL_ID.
#   2. `sudo cloudflared service install` runs as root — it ONLY reads
#      /etc/cloudflared/config.yml, not your ~/.cloudflared.
#   3. Token/credentials are a SECRET — a config.yml containing the token
#      is chmod 600; do not paste a token straight into this template file.
# ==============================================================================

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  # THE TARGET IS ALWAYS :3000 — it is Node before the front-proxy cut-over and nginx
  # afterwards (deploy/nginx/install-tukuk-front.sh cut moves Node to :3001 and hands
  # :3000 to nginx). That is deliberate: the tunnel never has to be touched, and the
  # cache can be installed or rolled back without a single visitor seeing a dead port.
  # Every hostname points at the same target: nginx answers any Host and the app decides
  # what each hostname may serve. A hostname pointed anywhere else (the :8080 verify port
  # is the usual accident) answers "error code: 502" from cloudflared.
  # Tukuk-OS search engine + admin panel
  - hostname: tukuk.org
    service: http://localhost:3000
  # www no longer needs the box: in the dashboard it is a zone-level redirect to the apex
  # (`curl -o /dev/null -w '%{http_code} %{redirect_url}' https://www.tukuk.org/` →
  #   `301 https://tukuk.org/`; note HEAD returns nothing here, use GET), and the
  # independent backup copy lives on Cloud Run, reached through the brain Worker — see
  # deploy/GCP-FAILOVER.md. This route is therefore dead weight, kept only as a safety net
  # if the redirect is ever removed. In TOKEN mode cloudflared ignores this file anyway,
  # so deleting the entry here changes nothing until the dashboard route goes too.
  - hostname: www.tukuk.org
    service: http://localhost:3000
  # dashboard.tukuk.org is RETIRED. The panel was /admin on the apex all along — same app, same
  # port — so the hostname bought nothing and cost a second DNS record, a second WEBAUTHN_ORIGIN,
  # and a login page that could 502 on its own. Do not re-add it: if the panel ever needs its own
  # door, that door is a path, not a hostname. Admin lives at https://tukuk.org/admin.
  # Dedicated T Chat space (same server, different host — src/server.js TCHAT_HOST gate).
  - hostname: tchat.tukuk.org
    service: http://localhost:3000
  # Tukuk Agent (code-server editor + AI build-agent), play (Godot web build) and build
  # (Tukuk Builder wake front door :5174) were carried in this list as an ASPIRATION, but
  # the edge has never routed them (measured by cloudflared-audit 2026-11-01: edge = exactly
  # the three hostnames above, the owner's freeze). An entry here with no dashboard route is
  # a hostname that has never worked — so they are parked as comments. To revive one: add the
  # public hostname in Zero Trust → Networks → Routes (connector c1d8ea0f), uncomment the
  # pair below, and re-run the audit. The local origins stay installed and ready on the box
  # (tukuk-agent.service :8443, nginx play block, tukuk-builder-wake :5174).
  # - hostname: agent.tukuk.org
  #   service: http://127.0.0.1:8443
  # - hostname: play.tukuk.org
  #   service: http://localhost:3000
  # - hostname: build.tukuk.org
  #   service: http://127.0.0.1:5174
  # Required: catch-all rule last
  - service: http_status:404
