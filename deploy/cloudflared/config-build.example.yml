# Template connector KEDUA cloudflared — build.tukuk.org → Tukuk Builder.
#
# KENAPA BERBEZA: tunnel utama (87e7…) berjenis remote-config — Cloudflare edge
# HANYA menghantar hostname yang terdaftar di dashboard; editan ingress lokal
# (config.yml) diabaikan dan hostname baharu dapat 404 di edge. Penyelesaian
# tanpa dashboard: tunnel legacy baru (dicipta `cloudflared tunnel create`,
# auth cert.pem) + connector kedua dengan ingress lokal di bawah.
#
# PROVISION SEKALI (di VPS, user tukuk — cert.pem sudah ada ~/.cloudflared/):
#   cloudflared tunnel create build-tukuk
#   cloudflared tunnel route dns --overwrite-dns <NEW-ID> build.tukuk.org
#   cp ~/.cloudflared/<NEW-ID>.json /tmp && sudo mv ke /etc/cloudflared/ (chmod 600)
#   sudo cp config-build.example.yml → /etc/cloudflared/config-build.yml (isi ID)
#   sudo cp deploy/cloudflared-build.service → /etc/systemd/system/
#   sudo systemctl daemon-reload && sudo systemctl enable --now cloudflared-build
#
# GUNA PLACEHOLDER — jangan commit ID/credentials sebenar ke repo.
tunnel: REPLACE_WITH_NEW_TUNNEL_ID
credentials-file: /etc/cloudflared/REPLACE_WITH_NEW_TUNNEL_ID.json
ingress:
  - hostname: build.tukuk.org
    service: http://localhost:5174
  # Wajib: rule padanan terakhir
  - service: http_status:404
