# ==============================================================================
# Tukuk-OS front proxy — nginx in front of the Node SSR app, with a real cache.
#
# WHY THIS EXISTS
#   Every page here is rendered per request. The app already says which pages a
#   shared cache may hold (src/server.js → CACHE_PUBLIC_HTML: reference content
#   gets `s-maxage=300`, live readings / searches / accounts get no-store), but
#   Cloudflare needs a zone cache rule before it will cache HTML and this
#   project's API token has no Zone scope. So the site had no HTML cache at all:
#   `curl -I https://tukuk.org/bendera` answers `cf-cache-status: DYNAMIC`, and
#   every visitor rebuilt the page on this box.
#
# HOW IT DECIDES WHAT TO CACHE (the important part)
#   nginx is given NO list of paths. The app is the only place that decides
#   cacheability, and it says so with `X-Accel-Expires: 300` on exactly the pages
#   it already marks `s-maxage=300`. `proxy_ignore_headers Cache-Control Expires`
#   is here because the browser-facing policy on those pages is deliberately
#   `max-age=0` (a visitor must always revalidate a view) — nginx would otherwise
#   read that 0 and refuse to store anything. Since `proxy_cache_valid` is NOT
#   set, a response without X-Accel-Expires has no caching time at all and is
#   never stored: no-store routes, plain JSON with no headers, /health, /api/* and
#   anything a future route forgets to mark all stay uncached by construction.
#   The two layers therefore cannot drift apart — if the app stops sending the
#   header, the cache stops caching.
#
# WHY IT LISTENS ON 8080 IN THE REPO
#   The shipped state is the verification port. cloudflared's origin is
#   http://localhost:3000 and it may be configured remotely (token mode), which
#   this project cannot edit — so the cutover does NOT touch the tunnel: Node
#   moves to 127.0.0.1:3001 and install-tukuk-front.sh changes this one listen
#   line to 3000. A fresh `git pull` therefore cannot accidentally put nginx in
#   front of production; only the script can, and it rolls back in one command.
#
# INSTALL / CUT OVER / ROLL BACK
#   sudo bash /opt/tukuk-os/deploy/nginx/install-tukuk-front.sh verify
#   sudo bash /opt/tukuk-os/deploy/nginx/install-tukuk-front.sh cut
#   sudo bash /opt/tukuk-os/deploy/nginx/install-tukuk-front.sh rollback
# ==============================================================================

# The cache itself. 200 MB is nothing against the free disk and it is capped, so
# a busy day cannot fill the box; `inactive=10m` drops anything the app only
# leases for 5 minutes. `use_temp_path=off` writes straight into the cache dir —
# one copy instead of two, and no cross-filesystem rename.
proxy_cache_path /var/cache/nginx/tukuk levels=1:2 keys_zone=tukuk_html:20m
                 max_size=200m inactive=10m use_temp_path=off;

# WebSockets: /agent/... upgrades are handled by Node's own http server
# (src/agent-editor.js attachUpgrade), so the Upgrade handshake has to survive
# this hop. Ordinary requests get `Connection: close`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Node reads X-Forwarded-Proto to decide whether to send HSTS (src/server.js),
# and cloudflared sets it to https. Pass it through untouched; anything arriving
# without it came from the loopback, and the only public path to the app is the
# tunnel — so treat it as https rather than silently dropping HSTS.
map $http_x_forwarded_proto $real_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

# An Authorization header or a Cookie must never be answered from, or written to,
# the shared cache — whatever the upstream headers say. proxy_cache_bypass and
# proxy_no_cache both take a list: one non-zero value is enough to skip the cache.
map $http_authorization $bypass_auth {
    default 1;
    ''      0;
}
map $http_cookie $bypass_cookie {
    default 1;
    ''      0;
}

# Cache outcome per request, in the log and in a response header, so "is it
# working?" is always answerable from the outside instead of from memory.
log_format tukuk_front '$remote_addr [$time_iso8601] "$request_method $uri" host=$host '
                       'status=$status cache=$upstream_cache_status '
                       'origin=$upstream_status rt=$request_time upstream_rt=$upstream_response_time';

upstream tukuk_origin {
    # 3001 = where Node lives after the cutover. Before it, install-tukuk-front.sh
    # points this at 3000 for the verification pass.
    server 127.0.0.1:3001;
}

server {
    listen 127.0.0.1:8080;
    listen [::1]:8080;
    server_name _;

    access_log /var/log/nginx/tukuk-front.log tukuk_front;
    error_log  /var/log/nginx/tukuk-front-error.log warn;

    # A public response saying "nginx" is an invitation to try nginx-specific things.
    server_tokens off;

    # /api/publish accepts a ~4 MB single-file app body (src/server.js installs a
    # 6mb JSON parser for it). A too-small limit here would surface as 413 on the
    # builder, which is exactly the kind of breakage this layer must not cause.
    client_max_body_size 16m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $real_proto;
    proxy_set_header X-Real-IP         $remote_addr;
    # The tunnel's own headers: the real visitor IP and the country signal.
    proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
    proxy_set_header CF-Ray            $http_cf_ray;
    proxy_set_header CF-IPCountry      $http_cf_ipcountry;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout    120s;
    proxy_read_timeout    600s;   # local-model answers can take minutes

    # Never retry against the origin: one server in the pool, but a retry would
    # replay a POST body, and the publish/chat routes are not idempotent.
    proxy_next_upstream off;

    # Do not let nginx replace an error page with its own — the app's 503 fallbacks
    # ("T Chat cannot load right now", the APOD retry page) are what users should see.
    proxy_intercept_errors off;

    # When nginx issues one of its own canonical 301s it builds an ABSOLUTE URL
    # from this listener — scheme http and the local port — so a redirect would
    # leak "http://tukuk.org:3000/..." to the browser: wrong scheme, internal
    # port, and the edge https URL is lost. Keep every such Location relative
    # and let the visitor's own URL (https, no port) fill in the rest.
    absolute_redirect off;
    port_in_redirect off;

    # ── HTML + everything public ────────────────────────────────────────────
    location / {
        proxy_pass http://tukuk_origin;
        proxy_cache tukuk_html;
        proxy_cache_key "$scheme$host$request_uri";   # $host: tchat/dashboard share this box
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_lock on;                 # a burst of misses = ONE render on Node
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;    # stale + refresh in background = the SWR the app asks for
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate off;          # SSR pages carry no ETag, so revalidation cannot work
        proxy_cache_bypass $bypass_auth $bypass_cookie;
        proxy_no_cache $bypass_auth $bypass_cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # The watchdog reads this to decide whether Node is alive (scripts/watchdog.sh).
    # A cached "ok" would hide a broken app for five minutes, so this one is explicit.
    location = /health {
        proxy_pass http://tukuk_origin;
        proxy_cache off;
        add_header X-Cache-Status BYPASS always;
    }

    # ── Streams, WebSockets, and anything that must not be buffered ──────────
    # /api/chat/stream is SSE; buffering would hold frames back. /api also carries
    # long model answers and the big publish bodies, and nothing under it is
    # cacheable today — so it skips the cache as a layer, not by trusting headers.
    location /api/ {
        proxy_pass http://tukuk_origin;
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        add_header X-Cache-Status BYPASS always;
    }

    # The radio SEARCH endpoint is exactly `/radio?q=...` (no slash). nginx
    # treats a bare `/radio` as the "parent directory" of the `/radio/` block
    # below and answers 301 -> /radio/ itself, never reaching Node — which broke
    # the homepage radio tab (the browser followed to a leaked http://:3000 URL
    # and CSP killed the fetch). Pin the exact URI to the origin instead.
    location = /radio {
        proxy_pass http://tukuk_origin;
        proxy_cache off;
        add_header X-Cache-Status BYPASS always;
    }

    # /radio/stream pipes somebody else's audio through us for as long as the
    # listener stays (Node marks it `X-Accel-Buffering: no` for exactly this).
    # Without this block nginx buffers and the stream stalls — and cloudflared
    # already logs "stream canceled by remote" on it today.
    location /radio/ {
        proxy_pass http://tukuk_origin;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header X-Cache-Status BYPASS always;
    }

    # The code-server editor: a long-lived WebSocket, no cache, no buffering.
    location /agent/ {
        proxy_pass http://tukuk_origin;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header X-Cache-Status BYPASS always;
    }
}
