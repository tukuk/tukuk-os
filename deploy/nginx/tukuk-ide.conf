# ==============================================================================
# ide.tukuk.org — the browser door to the remote-IDE stack (deploy/ide/).
#
# WHAT THIS IS
#   A reverse proxy in front of websockify (127.0.0.1:6080), which is itself only
#   ever bound to loopback (see deploy/ide/remote-ide-web.service). The noVNC
#   client files and the RFB-over-WebSocket bridge both live on that one port, so
#   this server block has exactly one upstream and one job: get bytes to and from
#   it without breaking the upgrade handshake.
#
# WHY IT STILL NEEDS A CHECK OF ITS OWN
#   Cloudflare Access on ide.tukuk.org is the real gate and is configured in the
#   dashboard (see deploy/ide/README.md, "DASHBOARD SIDE"). This block cannot
#   verify the Cf-Access-Jwt-Assertion itself -- validating that JWT needs the
#   team domain's JWKS and a signature check, which is what the Access edge does,
#   not nginx. What nginx CAN do is refuse a request that carries no assertion
#   header at all: that catches the one failure mode this box has actually hit
#   before -- a hostname getting wired to the wrong tunnel, or someone adding a
#   public :3000 ingress by accident, so the origin is reachable without ever
#   passing the edge. A request that never touched Access has no header, and this
#   file sends it away. A forged header still passes this layer -- which is
#   precisely why layer 3 (x11vnc's own RFB password) exists and is not optional.
#
# INSTALL (root, on the box) -- done for you by deploy/ide/install-remote-ide.sh,
# this section is only what that script does, written out:
#   sudo cp /opt/tukuk-os/deploy/nginx/tukuk-ide.conf /etc/nginx/conf.d/tukuk-ide.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
#   Then the tunnel side: ide.tukuk.org -> http://127.0.0.1:3000 must be added to
#   the NAMED build tunnel's ingress (deploy/cloudflared/config-build.example.yml),
#   the same one that carries play.tukuk.org. The main tunnel is token/remote
#   config and ignores local ingress files entirely.
# ==============================================================================

# NOTE: `map $http_upgrade $connection_upgrade` is already declared at http level
# by deploy/nginx/tukuk-front.conf, and every file in /etc/nginx/conf.d is included
# into the same http block. Declaring it again here fails `nginx -t` with
# "directive map is duplicate" -- so this file only ever reads $connection_upgrade.

server {
    # Same listener as play.tukuk.org and the front proxy: nginx picks the block by
    # Host, so this only takes effect for requests that arrive with Host:
    # ide.tukuk.org. Everything else still falls through to `server_name _`.
    listen 127.0.0.1:3000;
    listen [::1]:3000;
    server_name ide.tukuk.org;

    server_tokens off;

    # Layer 2 of three (README.md). `$http_cf_access_jwt_assertion` is set by
    # Cloudflare only after Access has accepted the visitor; it is absent on a
    # direct-to-origin request. This `if` sits at server level and its body is a
    # bare `return`, which is the documented-safe use of the directive -- no
    # location is entered, nothing is rewritten, so the usual "if is evil"
    # inheritance trap cannot occur here.
    if ($http_cf_access_jwt_assertion = "") {
        return 403;
    }

    # A VNC session is one long-lived WebSocket plus a burst of static files at
    # the start. Everything that matters about this proxy is timeouts and
    # buffering; there is no caching to get wrong (a stale noVNC bundle would
    # just show a blank viewer, and the file is small enough that always going
    # upstream is cheaper than reasoning about it).
    location / {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # An RFB frame rate is driven by what the screen does, not by a timer:
        # buffering turns "dragged a window" into "the window moved a second after
        # I let go". Off on both directions -- nginx must not hold partial frames.
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        # websockify sends its own --heartbeat=15 ping (see
        # remote-ide-web.service); this read timeout only has to be comfortably
        # longer than that gap, so a healthy session is never killed for being
        # briefly quiet, and a dead one still gets reaped within a few minutes
        # instead of holding a tunnel connection open forever.
        proxy_connect_timeout 5s;
        proxy_send_timeout    90s;
        proxy_read_timeout    120s;

        # Never retry: a second upstream connection for the same client would open
        # a second VNC session behind the one the operator is looking at.
        proxy_next_upstream off;

        # 403 is generated here (the Access check above) and must survive to the
        # browser as-is rather than get replaced by the site's maintenance page
        # from tukuk-front.conf -- they live in different server blocks, so this
        # is only belt-and-braces against a future copy/paste that merges them.
        proxy_intercept_errors off;
    }
}
