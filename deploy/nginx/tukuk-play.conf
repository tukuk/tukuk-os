# ==============================================================================
# play.tukuk.org — the isolated origin for the Godot (Tukuk Strike HD) web build.
#
# WHY A WHOLE SUBDOMAIN INSTEAD OF A PATH ON tukuk.org
#   The game needs a browsing context of its own and must never inherit the main
#   site's headers; the main site must never inherit the game's. A path on
#   tukuk.org cannot give two different header sets to one origin.
#
#   A *threaded* Godot 4 export would additionally need SharedArrayBuffer, which
#   browsers only expose when the document is CROSS-ORIGIN ISOLATED, i.e. served
#   with COOP "same-origin" plus COEP "require-corp". This build ships with
#   thread_support=false, so isolation is not required, and COEP is deliberately
#   NOT sent: Cloudflare injects its own helpers into the HTML at the edge (a
#   <link> to /cdn-cgi/content?id=... and /.webmcp/bridge.js), and require-corp
#   makes the browser refuse them -- which shows up as a page error in every
#   playtest while breaking nothing. If threads are ever enabled, restore COEP
#   here and in the two locations below, and accept that error as the cost.
#
#   COEP on tukuk.org itself was never an option anyway: it would make the
#   browser refuse every cross-origin resource that does not opt in with
#   CORP/CORS, which is exactly GTM, AdSense, Clarity, the external fonts and the
#   cross-subdomain images. Site-wide COEP = a silently broken, unmonetised
#   homepage. Whatever is set here stays scoped to THIS origin.
#
# WHY NOT AN <iframe> ON tukuk.org
#   crossOriginIsolated is only true for a frame when EVERY ancestor is isolated
#   too. The main site is deliberately not isolated, so an embedded Godot canvas
#   would see crossOriginIsolated=false and fail to boot. The launcher
#   (public/games/tukuk-strike-godot/index.html) opens this origin TOP-LEVEL in
#   its own tab instead, which is the one arrangement that actually works.
#
# INSTALL (root, on the VPS) — after the front proxy is cut over (nginx on 3000)
#   sudo cp /opt/tukuk-os/deploy/nginx/tukuk-play.conf /etc/nginx/conf.d/tukuk-play.conf
#   sudo mkdir -p /opt/tukuk-os/apps/play      # then upload the 4 exported files here
#   sudo nginx -t && sudo systemctl reload nginx
#
#   The build files come from `tps-demo/export_presets.cfg` (see its header for the
#   headless export command). Upload index.html / index.js / index.wasm / index.pck
#   into /opt/tukuk-os/apps/play/. They are large and are NOT kept in git.
#
#   That path is inside the ONE folder (see deploy/paths.sh). This block used to serve
#   /var/www/tukuk-play; scripts/consolidate-layout.sh moves the files under
#   /opt/tukuk-os/apps/play and leaves /var/www/tukuk-play as a symlink, so an nginx
#   config installed before the move keeps working until it is reinstalled.
#
#   Routing: the MAIN tunnel is token/remote-config, and that kind of tunnel serves ONLY
#   hostnames registered in the Cloudflare dashboard, so editing its local ingress does
#   nothing. play.tukuk.org is a route ON THAT ONE TUNNEL — not a reason for a second one:
#     1. Zero Trust → Networks → Routes → Add public hostname
#          play.tukuk.org  →  HTTP  localhost:3000   (connector 87e7e77f)
#     2. wait 1–2 minutes, then check build + tchat + play = 200
#   deploy/cloudflared-build.service and config-build.example.yml were deleted: a second
#   connector was a second unit to forget on a rebuild, and this hostname does not need one.
#   Verify with `curl -4`: this box has no IPv6 egress, so a
#   plain curl of a fresh Cloudflare hostname fails on its AAAA record alone.
#
#   STILL MISSING (dashboard; the API token has no Zone:Rules scope): a Cache
#   Rule making .pck/.wasm cacheable by extension. It is no longer required --
#   both heavy artifacts are published under `.zip` aliases below, which the
#   edge does cache (measured MISS then HIT). The rule would only be needed to
#   cache the bare extensions in place, and nothing asks for those any more.
#
#   The bare /index.pck and /index.wasm URLs are deliberately closed: they can
#   only ever be served DYNAMIC, i.e. streamed through the tunnel from this box,
#   so leaving them reachable is a 500 MB door with no upside. A build whose
#   alias rewrite failed now fails loudly on a 404 instead of quietly burning
#   egress for every player.
# ==============================================================================

server {
    # Same port the front proxy listens on post-cut-over. nginx picks the block by
    # Host; everything else still falls through to the `server_name _` default proxy.
    listen 127.0.0.1:3000;
    listen [::1]:3000;
    server_name play.tukuk.org;

    root /opt/tukuk-os/apps/play;
    index index.html;
    server_tokens off;

    # Kept on every response from this origin. `always` so they survive error
    # pages too (a 404 without them would be a confusing "works in one tab, not
    # the next" debugging trap). COEP is intentionally absent; see the header.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Ubuntu mime.types (http level) already maps application/wasm. Do NOT add a
    # server-level types{} block: it REPLACES the inherited map instead of extending
    # it, so html, js and png fall back to default_type and the engine refuses to run
    # a script it is handed as octet-stream. nginx -t is silent about that; the only
    # symptom is a game that never boots. The per-location default_type lines below
    # set one type for one URL, which does not touch the inherited map at all.

    location / {
        try_files $uri $uri/ =404;
    }

    # The re-persist worker: it holds the hash-versioned artifacts in Cache Storage so a
    # returning visitor does not re-pull 500 MB once the browser has evicted its HTTP
    # cache. It must always be revalidated -- the regex .js block below would otherwise
    # hand it a week of `immutable`, and a worker that cannot be replaced is a worker
    # whose bugs are permanent. Exact locations win over regex ones, so this is the only
    # .js URL that is not cached; the engine js keeps its hashed, immutable treatment.
    location = /sw.js {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files /sw.js =404;
    }

    # The heavy, content-addressed-ish payloads: cache hard at the edge/browser so
    # a repeat visit does not re-pull 100 MB+ from origin. add_header in a regex
    # location does NOT inherit the server-level ones, so re-declare the pair here.
    location ~* \.(wasm|pck|js)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # The splash and the icons are small, but they are requested on every boot and
    # the export regenerates them, so the publish path version-stamps nothing here --
    # a week of `immutable` on a 21 KB png is the worst case, and it costs a revisit
    # nothing. Same add_header inheritance rule as above.
    location ~* \.(png|ico|jpg)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Cloudflare Free decides cacheability by URL extension, not by what we send:
    # measured, `.pck` and `.wasm` are DYNAMIC -> DYNAMIC whatever Cache-Control
    # says, while `.zip` goes MISS -> HIT. So both are also published under aliased
    # `.zip` URLs with the content hash in the query string (?v=pck<hash> /
    # ?v=wasm<hash>), which the shell and the engine js are rewritten to ask for.
    # The cache key includes the query (also measured), so a republish is a
    # brand-new object and the year of `immutable` can never serve a stale artifact;
    # old URLs age out on their own. The bytes on disk do not move.
    location = /index.pck.zip {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        default_type application/octet-stream;
        try_files /index.pck =404;
    }

    # application/wasm, not octet-stream: WebAssembly.instantiateStreaming refuses any
    # other type. The engine re-wraps the preloaded response with that header itself, so
    # this is the belt to that braces -- the non-preloaded path goes straight to the URL.
    location = /index.wasm.zip {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        default_type application/wasm;
        try_files /index.wasm =404;
    }

    # Nothing should ask for these two any more; anything that does is a build whose
    # alias rewrite failed, and a 404 is the answer it deserves.
    location = /index.pck  { return 404; }
    location = /index.wasm { return 404; }

    # The shell itself must be revalidated so an updated build takes effect. The
    # server-level add_header does NOT reach a location that declares its own, so
    # CORP is repeated -- without it the document came back with COOP but no CORP.
    location = /index.html {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
    }
}
