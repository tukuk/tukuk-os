# ==============================================================================
# play.tukuk.org — the isolated origin for the Godot (Tukuk Strike HD) web build.
#
# WHY A WHOLE SUBDOMAIN INSTEAD OF A PATH ON tukuk.org
#   A Godot 4 *threaded* web export needs SharedArrayBuffer, and browsers only
#   expose that when the document is CROSS-ORIGIN ISOLATED, i.e. served with:
#       Cross-Origin-Opener-Policy: same-origin
#       Cross-Origin-Embedder-Policy: require-corp
#   Those headers applied to tukuk.org would make the browser REFUSE every
#   cross-origin resource that does not itself opt in with CORP/CORS — which is
#   exactly GTM, AdSense, Clarity, the external fonts and the cross-subdomain
#   images. Site-wide COEP therefore = a silently broken, unmonetised homepage.
#   The isolation is scoped to THIS origin only; the main site stays untouched.
#
# WHY NOT AN <iframe> ON tukuk.org
#   crossOriginIsolated is only true for a frame when EVERY ancestor is isolated
#   too. The main site is deliberately not isolated, so an embedded Godot canvas
#   would see crossOriginIsolated=false and fail to boot. The launcher
#   (public/games/tukuk-strike-godot/index.html) opens this origin TOP-LEVEL in
#   its own tab instead, which is the one arrangement that actually works.
#
# INSTALL (root, on the VPS) — after the front proxy is cut over (nginx on 3000)
#   sudo cp /opt/tukuk-os/deploy/nginx/tukuk-play.conf /etc/nginx/conf.d/tukuk-play.conf
#   sudo mkdir -p /var/www/tukuk-play          # then upload the 4 exported files here
#   sudo nginx -t && sudo systemctl reload nginx
#
#   The build files come from `tps-demo/export_presets.cfg` (see its header for the
#   headless export command). Upload index.html / index.js / index.wasm / index.pck
#   into /var/www/tukuk-play/. They are large and are NOT kept in git.
#
#   Finally point the hostname at the tunnel (Cloudflare dashboard, TOKEN mode):
#   Zero Trust → Networks → Routes → Add: play.tukuk.org → http://localhost:3000
#   ...and give play.tukuk.org a DNS record for the tunnel. See
#   deploy/cloudflared/config.yml for the JSON-mode ingress equivalent.
# ==============================================================================

server {
    # Same port the front proxy listens on post-cut-over. nginx picks the block by
    # Host; everything else still falls through to the `server_name _` default proxy.
    listen 127.0.0.1:3000;
    listen [::1]:3000;
    server_name play.tukuk.org;

    root /var/www/tukuk-play;
    index index.html;
    server_tokens off;

    # The isolation pair, on every response from this origin. `always` so they
    # survive error pages too (a 404 without COOP/COEP would be a confusing
    # "works in one tab, not the next" debugging trap).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Ubuntu mime.types (http level) already maps application/wasm. Do NOT add a
    # server-level types{} block: it REPLACES the inherited map and serves html/js as

    location / {
        try_files $uri $uri/ =404;
    }

    # The heavy, content-addressed-ish payloads: cache hard at the edge/browser so
    # a repeat visit does not re-pull 100 MB+. add_header in a regex location does
    # NOT inherit the server-level ones, so re-declare the isolation pair here.
    location ~* \.(wasm|pck|js)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # The shell itself must be revalidated so an updated build takes effect.
    location = /index.html {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache" always;
    }
}
