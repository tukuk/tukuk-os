# nginx for the Cloud Run mirror. Cloud Run routes to $PORT, which we pin to 8080 in
# cloudrun-mirror-rebuild.sh. Pulled pages land as files (about.html, learn/index.html),
# so the file candidates must come before $uri — $uri matches an existing directory and
# would 301 /learn to /learn/ before any file was tried.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The marker the failover drill asserts on: any page carrying it came from GCP.
    add_header x-mirror "gcp-run" always;

    location / {
        add_header x-mirror "gcp-run" always;
        add_header Cache-Control "public, max-age=60";
        try_files $uri.html $uri/index.html $uri $uri/ =404;
    }
}
