<!-- ── Tukuk Strike HD boot overlay ──────────────────────────────────────────
     Injected into the export shell through the Web preset's
     html/custom_html_shell -- Godot 4.7 silently ignores html/head_include --
     and is spliced in by tools/build-web.sh. The stock shell draws
     <progress id="status-progress">
     but prints no numbers: on a pack this large a visitor cannot tell a working
     download from a hung page and just closes the tab. This adds a byte readout
     (downloaded MB / total MB + percent) under the bar and hides it again when
     the engine swaps the status overlay out.

     It is a separate file on purpose: index.html is regenerated by every
     export, so edits made there vanish silently on the next build.
────────────────────────────────────────────────────────────────────────── -->
<style>
  #tb-bytes {
    display: block;
    margin: 6px auto 0;
    max-width: 92%;
    font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #d7dde8;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .75);
    text-align: center;
    white-space: nowrap;
  }
</style>
<script>
(function () {
  'use strict';
  var MB = 1048576;

  function mb(bytes) {
    return (bytes / MB).toFixed(bytes >= 100 * MB ? 0 : 1) + ' MB';
  }

  function attach() {
    var bar = document.getElementById('status-progress');
    if (!bar) {
      // The shell is parsed after this fragment in <head>; retry until it exists.
      setTimeout(attach, 150);
      return;
    }

    var label = document.getElementById('tb-bytes');
    if (!label) {
      label = document.createElement('span');
      label.id = 'tb-bytes';
      bar.insertAdjacentElement('afterend', label);
    }

    // Fall back to the manifest sizes the export writes into GODOT_CONFIG, for
    // the phase before the loader knows the pack length.
    var manifest = 0;
    try {
      for (var key in GODOT_CONFIG.fileSizes) {
        manifest += GODOT_CONFIG.fileSizes[key];
      }
    } catch (ignored) {
      manifest = 0;
    }

    function paint() {
      // The shell toggles the bar with an inline display when it leaves
      // 'progress' mode; mirror it so the readout never outlives the bar.
      if (bar.style.display === 'none') {
        label.style.display = 'none';
        return;
      }
      label.style.display = 'block';
      // onProgress hands the shell byte counts, but it drops both attributes
      // while the total is unknown, and a bare <progress> then reports
      // max == 1. Anything below a megabyte is not a real byte total, so
      // prefer the export manifest over that placeholder.
      var value = bar.value || 0;
      var max = bar.max || 0;
      if (max < MB) {
        max = manifest;
      }
      if (!max) {
        label.textContent = 'Starting engine…';
        return;
      }
      var pct = Math.min(100, Math.round((value / max) * 100));
      label.textContent = 'Downloading ' + mb(value) + ' / ' + mb(max) + ' (' + pct + '%)';
    }

    new MutationObserver(paint).observe(bar, {
      attributes: true,
      attributeFilter: ['value', 'max', 'style'],
    });
    paint();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach);
  } else {
    attach();
  }
})();
</script>
