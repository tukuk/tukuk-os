# coturn (TURN relay) untuk panggilan WebRTC T Chat — RUJUKAN, belum dipasang.
#
# BILA DIPERLUKAN: panggilan gagal tersambung pada NAT ketat/simetri (4G tertentu,
# WiFi pejabat). Tukuk-os kini STUN-sahaja; TURN melalukan media melalui pelayan ini
# sebagai pilihan terakhir supaya P2P yang gagal tetap boleh bersambung.
#
# SYARIT WAJIB (sebab itu belum aktif di VPS semasa — tiada IP awam, hanya LAN):
#   1) Hos dengan IP AWAM tetap (UDP 3478 + julat UDP relay terbuka).
#   2) apt install coturn  (dan TURN=1 dalam /etc/default/coturn).
#   3) Pasang fail ini di /etc/turnserver.conf, aktifkan use-auth-secret.
#   4) Set dalam .env tukuk-os: TURN_HOST=<IP awam>, TURN_SECRET=<rahsia sama>,
#      TURN_PORT=3478, TURN_TTL=3600. Tukuk-os kemudiannya hidang kredensial
#      sah-terhad (/api/chat/ice) kepada klien; tanpa env itu ia kekal STUN.
#
# Mekanisme kredential: REST API / "use-auth-secret". username = "<unix-expiry>:<id>",
# credential = base64(HMAC-SHA1(secret, username)) — dijana oleh src/chat.js.

listening-port=3478
tls-listening-port=5349

# IP awam pelayan ini (ganti <IP_AWAM>). external-ip=<IP_AWAM>
# forwarding / no-loop: halang berputus pada rangkaian dalaman.
# listening-ip=0.0.0.0
# relay-ip=0.0.0.0

use-auth-secret
static-auth-secret=<TAMPIL_SAMA_DGN_TURN_SECRET_DLM_ENV>

realm=turn.tukuk.org
min-port=49152
max-port=49999

# Had supaya tidak jadi open relay / dilampis.
denied-peer-ip=0.0.0.0-255.255.255.255
# Benarkan semula jika perlu uji; idealnya hadkan pada subnet klien.

fingerprint
no-tls
no-dtls
# (Untuk TLS/TURNS 5349, sila nyatakan cert=/path/fullchain.pem private-key=/path/priv.pem)

no-multicast-port
# Log ringkas
log-file=/var/log/turnserver.log
simple-log
