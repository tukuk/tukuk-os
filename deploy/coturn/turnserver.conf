# coturn (TURN relay) for T Chat WebRTC calls — REFERENCE, not yet installed.
#
# WHEN NEEDED: calls fail to connect on strict/symmetric NAT (certain 4G,
# office WiFi). Tukuk-os is STUN-only today; TURN relays media through this server
# as a last resort so a failed P2P can still connect.
#
# HARD REQUIREMENTS (why it is not active on the current VPS — no public IP, LAN only):
#   1) A host with a FIXED PUBLIC IP (UDP 3478 + an open UDP relay range).
#   2) apt install coturn  (and TURN=1 in /etc/default/coturn).
#   3) Install this file at /etc/turnserver.conf, enable use-auth-secret.
#   4) Set in tukuk-os .env: TURN_HOST=<public IP>, TURN_SECRET=<same secret>,
#      TURN_PORT=3478, TURN_TTL=3600. Tukuk-os then serves time-limited
#      credentials (/api/chat/ice) to clients; without that env it stays STUN.
#
# Credential mechanism: REST API / "use-auth-secret". username = "<unix-expiry>:<id>",
# credential = base64(HMAC-SHA1(secret, username)) — generated by src/chat.js.

listening-port=3478
tls-listening-port=5349

# This server's public IP (replace <PUBLIC_IP>). external-ip=<PUBLIC_IP>
# forwarding / no-loop: prevent looping on internal networks.
# listening-ip=0.0.0.0
# relay-ip=0.0.0.0

use-auth-secret
static-auth-secret=<SAME_AS_TURN_SECRET_IN_ENV>

realm=turn.tukuk.org
min-port=49152
max-port=49999

# Limits so it does not become an open relay / get abused.
denied-peer-ip=0.0.0.0-255.255.255.255
# Re-enable only if you need to test; ideally restrict to the client subnet.

fingerprint
no-tls
no-dtls
# (For TLS/TURNS 5349, specify cert=/path/fullchain.pem private-key=/path/priv.pem)

no-multicast-port
# Concise log
log-file=/var/log/turnserver.log
simple-log
