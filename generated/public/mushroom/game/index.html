<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mushroom Game — Tukuk Satu Kata</title>
<meta name="description" content="The «mushroom» game — free, right in the browser. Generated by Tukuk Satu Kata.">
<style>
  body{margin:0;color:#fff;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;min-height:100dvh}
  .wrap{text-align:center;padding:12px}
  #game{border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #0008}
  #game canvas{display:block;margin:0 auto}
  .hud{margin:8px 0;font-weight:700;font-size:14px}
  .hud b{color:var(--accent,#a78bfa)}
  a{color:var(--accent,#a78bfa)}
  small{opacity:.75}
  #mute{position:fixed;top:10px;right:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<button id="mute" title="Sound on/mute">🔊</button>
<div class="wrap">
  <div class="hud"><span>Score <b id="score">0</b></span> · <span>Best <b id="best">0</b></span> · <span>❤️ <b id="lives">3</b></span> · <em id="label"></em> — <a href="../../">hub</a> · <a href="../app/">app</a></div>
  <div id="game"></div>
  <small id="hint"></small>
</div>
<script>var CFG = {"word":"mushroom","slug":"mushroom","emoji":"🍄","tagline":"Collect mushrooms, avoid the poisonous ones.","genre":"memory","palette":{"name":"ungu","bg":"#12081f","fg":"#ede9fe","accent":"#a78bfa","soft":"#2a1650"}};</script>
<script>(function(){try{var l=document.createElement('link');l.rel='icon';l.type='image/svg+xml';l.href='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="'+CFG.palette.soft+'"/><text y=".9em" font-size="82" x="50" text-anchor="middle">'+CFG.emoji+'</text></svg>');document.head.appendChild(l);}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
// ── Bunyi (WebAudio, tanpa fail) — satu konteks, resume pada gesture pertama. ──
var SFX = (function(){
  var a = null, muted = false;
  try { muted = localStorage.getItem('sk-mute') === '1'; } catch(e){}
  function ensure(){ if(!a){ try{ a = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(a && a.state==='suspended') a.resume(); return a; }
  function tone(f, d, type, v, slide){ if(muted) return; var A = ensure(); if(!A) return; try{
    var o = A.createOscillator(), g = A.createGain();
    o.type = type||'square'; o.frequency.value = f;
    if(slide) o.frequency.linearRampToValueAtTime(slide, A.currentTime + d);
    g.gain.value = v||0.06; g.gain.setValueAtTime(g.gain.value, A.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, A.currentTime + d);
    o.connect(g); g.connect(A.destination); o.start(); o.stop(A.currentTime + d);
  }catch(e){} }
  var btn = document.getElementById('mute');
  function paint(){ btn.textContent = muted ? '🔇' : '🔊'; }
  btn.onclick = function(){ muted = !muted; try{ localStorage.setItem('sk-mute', muted ? '1' : '0'); }catch(e){} paint(); if(!muted) tone(660, 0.08, 'square', 0.05); };
  paint();
  return {
    wake: ensure,
    good: function(n){ tone(440 + Math.min((n||0)*20, 400), 0.09, 'square', 0.05, 700); },
    bad:  function(){ tone(180, 0.22, 'sawtooth', 0.07, 80); },
    flip: function(){ tone(320, 0.05, 'triangle', 0.05); },
    jump: function(){ tone(280, 0.12, 'square', 0.05, 520); },
    win:  function(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f,0.16,'square',0.06); }, i*120); }); },
    over: function(){ [440,330,220,130].forEach(function(f,i){ setTimeout(function(){ tone(f,0.22,'sawtooth',0.07); }, i*140); }); }
  };
})();

document.body.style.background = CFG.palette.bg;
document.getElementById('label').textContent = CFG.word + ' (' + CFG.genre + ')';
var W = 380, H = 560, EMOJI = CFG.emoji;
var BEST_KEY = 'sk-best-' + CFG.slug;
function readBest(){ try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch(e){ return 0; } }
function writeBest(n){ try { localStorage.setItem(BEST_KEY, String(n)); } catch(e){} }
var elScore = document.getElementById('score'), elBest = document.getElementById('best'), elLives = document.getElementById('lives');
elBest.textContent = String(readBest());

var HINTS = {
  catch:  'Move the 🧺: drag / ← → · catch ' + EMOJI + ', dodge ❌',
  tap:    'Tap ' + EMOJI + ' as fast as you can before it disappears!',
  memory: 'Tap the cards, match all pairs — in as few moves as possible.',
  runner: 'Click / Space to jump — dodge obstacles, run as far as you can!'
};
document.getElementById('hint').textContent = HINTS[CFG.genre] || HINTS.catch;

// Skor/nyai dikongsi setiap scene; scene reset dalam create().
function Hud(scene){
  var s = this;
  this.score = 0; this.lives = 3; this.over = false;
  this.set = function(score, lives){
    s.score = score; if (lives !== undefined) s.lives = lives;
    elScore.textContent = String(s.score);
    elLives.textContent = String(s.lives);
    elBest.textContent = String(scene.genre === 'memory' ? readBest() : Math.max(readBest(), s.score));
  };
  this.gameOver = function(win){
    if (s.over) return; s.over = true;
    if (win) SFX.win(); else SFX.over();
    var best = readBest();
    var isMin = scene.genre === 'memory';
    if (isMin ? (scene.moves < best || !best) : (s.score > best)) writeBest(isMin ? scene.moves : s.score);
    elBest.textContent = String(readBest());
    var t = scene.add.text(W/2, H/2, (win ? '🎉 Great job!\n' : '💥 Game over!\n') + (isMin ? scene.moves + ' moves' : 'Score: ' + s.score) + '\nBest: ' + readBest() + '\n\nClick to play again')
      .setOrigin(0.5).setAlign('center').setFontSize(26).setColor(CFG.palette.fg).setStroke('#000', 4);
    t.setAlpha(0); scene.tweens.add({ targets: t, alpha: 1, duration: 250 });
    scene.input.once('pointerdown', function(){ scene.scene.restart(); });
    scene.input.keyboard.once('keydown-ENTER', function(){ scene.scene.restart(); });
  };
}

// ── CATCH — tangkap item jatuh, 3 nyawa, kelajuan naik ikut skor ──
class CatchScene extends Phaser.Scene {
  constructor(){ super('play'); this.genre = 'catch'; }
  create(){
    this.hud = new Hud(this); this.hud.set(0, 3);
    this.items = this.add.group(); this.falling = [];
    this.cameras.main.setBackgroundColor(CFG.palette.soft);
    this.player = this.add.text(W/2, H-42, '🧺', { fontSize: '44px' }).setOrigin(0.5);
    this.keys = this.input.keyboard.createCursorKeys();
    this.input.on('pointerdown', SFX.wake);
    this.input.on('pointermove', function(p){ this.player.x = Phaser.Math.Clamp(p.x, 24, W-24); }, this);
    this.spawnLoop();
  }
  spawnLoop(){
    if (this.hud.over) return;
    var gap = Math.max(320, 850 - this.hud.score * 12);
    this.time.delayedCall(gap, function(){
      var bad = Math.random() < 0.22;
      var it = this.add.text(Phaser.Math.Between(20, W-20), -22, bad ? '❌' : EMOJI, { fontSize: '34px' }).setOrigin(0.5);
      it.bad = bad; it.vy = 2 + Math.min(6, this.hud.score * 0.06) + Math.random() * 1.6;
      this.items.add(it); this.falling.push(it);
      this.spawnLoop();
    }, [], this);
  }
  update(){
    if (this.hud.over) return;
    if (this.keys.left.isDown) this.player.x -= 6;
    if (this.keys.right.isDown) this.player.x += 6;
    this.player.x = Phaser.Math.Clamp(this.player.x, 24, W-24);
    var s = this.hud, lives = s.lives, score = s.score, died = false;
    for (var i = this.falling.length - 1; i >= 0; i--) {
      var it = this.falling[i];
      it.y += it.vy;
      if (Math.abs(it.y - this.player.y) < 30 && Math.abs(it.x - this.player.x) < 34) {
        if (it.bad) { lives--; SFX.bad(); this.cameras.main.shake(120, 0.02); }
        else { score++; SFX.good(score); this.pop(it.x, it.y, '+1'); }
        it.destroy(); this.falling.splice(i, 1);
      } else if (it.y > H + 24) {
        if (!it.bad) { lives--; SFX.bad(); this.cameras.main.shake(120, 0.015); }
        it.destroy(); this.falling.splice(i, 1);
      }
    }
    s.set(score, lives);
    if (lives <= 0) { died = true; }
    if (died) s.gameOver(false);
  }
  pop(x, y, txt){
    var t = this.add.text(x, y - 20, txt, { fontSize: '20px', color: CFG.palette.accent }).setOrigin(0.5);
    this.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 500, onComplete: function(){ t.destroy(); } });
  }
}

// ── TAP — item muncul & luput; hayat makin pendek, makin laju ──
class TapScene extends Phaser.Scene {
  constructor(){ super('play'); this.genre = 'tap'; }
  create(){
    this.hud = new Hud(this); this.hud.set(0, 3);
    this.cameras.main.setBackgroundColor(CFG.palette.soft);
    this.input.on('pointerdown', SFX.wake);
    this.spawn();
  }
  spawn(){
    if (this.hud.over) return;
    var life = Math.max(500, 1300 - this.hud.score * 30);
    var it = this.add.text(Phaser.Math.Between(30, W-30), Phaser.Math.Between(60, H-80), EMOJI, { fontSize: '38px' })
      .setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.tweens.add({ targets: it, scale: 1.25, duration: life / 2, yoyo: true, repeat: 1 });
    var self = this;
    it.once('pointerdown', function(){
      if (!it.active) return;
      var score = self.hud.score + 1;
      self.hud.set(score);
      SFX.good(score);
      var t = self.add.text(it.x, it.y - 24, '+1', { fontSize: '20px', color: CFG.palette.accent }).setOrigin(0.5);
      self.tweens.add({ targets: t, y: it.y - 64, alpha: 0, duration: 450, onComplete: function(){ t.destroy(); } });
      it.destroy(); self.spawn();
    });
    this.time.delayedCall(life, function(){
      if (!it.active) return;
      it.destroy();
      var lives = self.hud.lives - 1;
      SFX.bad(); self.cameras.main.shake(120, 0.02);
      self.hud.set(self.hud.score, lives);
      if (lives <= 0) self.hud.gameOver(false); else self.spawn();
    }, [], this);
  }
}

// ── MEMORY — 4×4 kad, 8 pasangan; skor = gerakan (lebih rendah lebih baik) ──
class MemoryScene extends Phaser.Scene {
  constructor(){ super('play'); this.genre = 'memory'; }
  create(){
    this.hud = new Hud(this); this.moves = 0;
    elScore.textContent = '0'; elLives.textContent = '∞';
    this.cameras.main.setBackgroundColor(CFG.palette.bg);
    var vals = [EMOJI, '⭐', '🌙', '🔥', '💧', '🍀', '⚡', '💎'];
    var deck = Phaser.Utils.Array.Shuffle(vals.concat(vals));
    this.open = []; this.lock = false; this.matched = 0;
    var self = this, gx = 22, gy = 40, cw = (W - 44) / 4, ch = (H - 100) / 4;
    this.input.on('pointerdown', SFX.wake);
    for (var i = 0; i < 16; i++) {
      var cx = gx + (i % 4) * cw, cy = gy + Math.floor(i / 4) * ch;
      var back = this.add.rectangle(cx + cw/2, cy + ch/2, cw - 12, ch - 12, 0x1e293b).setStrokeStyle(2, parseInt(CFG.palette.accent.slice(1), 16) || 0x4c8dff);
      var face = this.add.text(cx + cw/2, cy + ch/2, deck[i], { fontSize: '30px' }).setOrigin(0.5).setVisible(false);
      var q = this.add.text(cx + cw/2, cy + ch/2, '?', { fontSize: '24px', color: CFG.palette.fg }).setOrigin(0.5);
      var card = { i: i, val: deck[i], back: back, face: face, q: q };
      back.setInteractive({ useHandCursor: true }).on('pointerdown', function(){ self.flip(card); });
    }
  }
  flip(card){
    if (this.lock || this.hud.over || card.face.visible) return;
    SFX.flip();
    card.q.setVisible(false); card.face.setVisible(true);
    this.tweens.add({ targets: card.back, scaleX: { from: 1, to: 0.2 }, duration: 120, yoyo: true });
    this.open.push(card);
    if (this.open.length === 2) {
      this.moves++; elScore.textContent = String(this.moves);
      var a = this.open[0], b = this.open[1], self = this;
      this.lock = true;
      if (a.val === b.val) {
        this.time.delayedCall(260, function(){
          a.back.setFillStyle(0x0b3b2e); b.back.setFillStyle(0x0b3b2e);
          self.matched++; SFX.good(self.matched); self.open = []; self.lock = false;
          if (self.matched === 8) self.hud.gameOver(true);
        }, [], this);
      } else {
        this.time.delayedCall(650, function(){
          [a, b].forEach(function(c){ c.face.setVisible(false); c.q.setVisible(true); });
          self.cameras.main.shake(90, 0.012); SFX.bad();
          self.open = []; self.lock = false;
        }, [], this);
      }
    }
  }
}

// ── RUNNER — lompat halangan, kelajuan naik tanpa henti ──
class RunnerScene extends Phaser.Scene {
  constructor(){ super('play'); this.genre = 'runner'; }
  create(){
    this.hud = new Hud(this); this.hud.set(0, 3);
    this.cameras.main.setBackgroundColor(CFG.palette.soft);
    this.ground = H - 60;
    this.add.rectangle(W/2, this.ground + 26, W, 4, 0x000000, 0.35);
    this.player = this.add.text(90, this.ground - 26, EMOJI, { fontSize: '40px' }).setOrigin(0.5);
    this.vy = 0; this.onGround = true;
    this.obs = []; this.speed = 3;
    this.keys = this.input.keyboard.createCursorKeys();
    this.input.on('pointerdown', this.jump, this);
    this.input.keyboard.on('keydown-SPACE', this.jump, this);
    this.input.keyboard.on('keydown-UP', this.jump, this);
    this.spawnLoop();
  }
  jump(){ SFX.wake(); if (this.onGround && !this.hud.over) { this.vy = -11; this.onGround = false; SFX.jump(); } }
  spawnLoop(){
    if (this.hud.over) return;
    var gap = Math.max(550, 1400 - this.hud.score * 20);
    var self = this;
    this.time.delayedCall(Phaser.Math.Between(gap, gap + 500), function(){
      var o = self.add.text(W + 30, self.ground - 20, Math.random() < 0.3 ? '🌵' : '❌', { fontSize: '34px' }).setOrigin(0.5);
      o.passed = false; self.obs.push(o);
      self.spawnLoop();
    }, [], this);
  }
  update(){
    if (this.hud.over) return;
    this.vy += 0.65; this.player.y += this.vy;
    if (this.player.y >= this.ground - 26) { this.player.y = this.ground - 26; this.vy = 0; this.onGround = true; }
    var speed = 3 + Math.min(6, this.hud.score * 0.12);
    var score = this.hud.score, lives = this.hud.lives;
    for (var i = this.obs.length - 1; i >= 0; i--) {
      var o = this.obs[i];
      o.x -= speed;
      if (!o.passed && o.x < this.player.x - 24) { o.passed = true; score++; SFX.good(score); }
      if (Math.abs(o.x - this.player.x) < 26 && Math.abs(o.y - this.player.y) < 26 && this.onGround) {
        lives--; SFX.bad(); this.cameras.main.shake(140, 0.025);
        o.destroy(); this.obs.splice(i, 1);
      } else if (o.x < -40) { o.destroy(); this.obs.splice(i, 1); }
    }
    this.hud.set(score, lives);
    if (lives <= 0) this.hud.gameOver(false);
  }
}

var SCENES = { catch: CatchScene, tap: TapScene, memory: MemoryScene, runner: RunnerScene };
new Phaser.Game({
  type: Phaser.AUTO, width: W, height: H, parent: 'game',
  backgroundColor: CFG.palette.bg,
  scene: SCENES[CFG.genre] || CatchScene
});
</script>
</body>
