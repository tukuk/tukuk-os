<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes — Tukuk Apps — Tukuk-OS</title>
<meta name="description" content="A local-first notes app in your browser. Write, autosave, tag and search. Nothing is uploaded.">
<link rel="canonical" href="https://tukuk.org/apps/notes">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icons/apps/notes.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .app { display:grid; grid-template-columns:260px 1fr; height:calc(100vh - 57px); }
  @media (max-width:640px){ .app{grid-template-columns:1fr; grid-template-rows:auto 1fr;} .sidebar{height:40vh;} }
  .sidebar { border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
  .sidebar .top { padding:12px; border-bottom:1px solid var(--line); display:flex; gap:8px; }
  .sidebar .top button { flex:1; }
  .sidebar .search { padding:10px 12px; border-bottom:1px solid var(--line); }
  .sidebar input { width:100%; box-sizing:border-box; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  .note-list { overflow-y:auto; flex:1; }
  .note-item { padding:12px; cursor:pointer; border-bottom:1px solid var(--line); }
  .note-item:hover { background:var(--panel); }
  .note-item.active { background:var(--panel); border-left:3px solid var(--accent); }
  .note-item .t { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .note-item .p { font-size:.82rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .note-item .d { font-size:.75rem; color:var(--muted); }
  .editor { display:flex; flex-direction:column; padding:16px; gap:10px; }
  .editor input, .editor textarea { border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:8px 12px; font:16px/1.6 inherit; }
  .editor input.title { font-size:1.4rem; }
  .editor textarea { flex:1; min-height:0; padding:12px; resize:vertical; font-size:1rem; }
  .editor .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .editor .tag { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:2px 8px; font-size:.8rem; color:var(--muted); }
  .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:.88rem; cursor:pointer; }
  .btn.secondary { background:var(--panel); color:var(--text); border:1px solid var(--line); }
  .btn.danger { background:#e03030; }
  button { cursor:inherit; }
</style>
  <link rel="manifest" href="/manifest-notes.json">
</head>
<body>
<header>
  <a class="back" href="/apps">← Apps</a>
  <h1>📝 Notes</h1>
  <span style="flex:1"></span>
  <span id="countLabel" style="color:var(--muted); font-size:.82rem;"></span>
</header>
<div class="app">
  <aside class="sidebar">
    <div class="top"><button class="btn" onclick="newNote()">＋ New note</button></div>
    <div class="search"><input id="q" placeholder="Search notes…" oninput="filterNotes()"></div>
    <div class="note-list" id="list"></div>
  </aside>
  <main class="editor" id="editor">
    <input id="noteTitle" class="title" placeholder="Note title…" oninput="autosave()">
    <div class="row" id="tags"></div>
    <textarea id="noteBody" placeholder="Start typing…" oninput="autosave()"></textarea>
    <div class="row">
      <input id="noteTags" placeholder="Tags (comma separated)" oninput="autosave()">
      <button class="btn secondary" onclick="exportNote()">Export .txt</button>
      <button class="btn danger" onclick="deleteNote()">Delete</button>
    </div>
  </main>
</div>
<script>
const KEY = 'tukuk_notes';
let notes = [];
let activeId = null;

function load() { try { notes = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { notes = []; } }
function persist() { localStorage.setItem(KEY, JSON.stringify(notes)); updateCount(); renderList(); }
function updateCount() { document.getElementById('countLabel').textContent = `${notes.length} note${notes.length !== 1 ? 's' : ''}`; }

function newNote() {
  activeId = 'n' + Date.now();
  notes.unshift({ id: activeId, title: '', body: '', tags: '', updated: Date.now() });
  persist(); renderEditor(); document.getElementById('noteTitle').focus();
}

function autosave() {
  const note = notes.find(n => n.id === activeId);
  if (!note) return;
  note.title = document.getElementById('noteTitle').value;
  note.body = document.getElementById('noteBody').value;
  note.tags = document.getElementById('noteTags').value;
  note.updated = Date.now();
  persist(); renderEditor();
}

function deleteNote() {
  if (!activeId) return;
  if (!confirm('Delete this note?')) return;
  notes = notes.filter(n => n.id !== activeId);
  activeId = notes[0]?.id || null;
  persist(); renderEditor();
}

function exportNote() {
  const n = notes.find(x => x.id === activeId);
  if (!n) return;
  const blob = new Blob([`${n.title}\n${'='.repeat(n.title.length || 3)}\n\n${n.body}`], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${(n.title || 'note').replace(/\W+/g, '-').toLowerCase()}.txt`;
  a.click();
}

function selectNote(id) { activeId = id; renderList(); renderEditor(); }

function filterNotes() {
  const q = document.getElementById('q').value.toLowerCase().trim();
  renderList(q);
}

function renderList(query) {
  query = query || document.getElementById('q').value.toLowerCase();
  let html = '';
  for (const n of notes) {
    const preview = (n.body || '').replace(/\n/g, ' ').slice(0, 60);
    const tags = (n.tags || '').split(',').map(s => s.trim()).filter(Boolean).map(s => `<span class="tag">#${esc(s)}</span>`).join(' ');
    const search = `${n.title} ${n.body} ${n.tags}`.toLowerCase();
    if (query && !search.includes(query)) continue;
    html += `<div class="note-item${n.id === activeId ? ' active' : ''}" onclick="selectNote('${n.id}')">
      <div class="t">${esc(n.title || 'Untitled')}</div>
      <div class="p">${esc(preview || 'No content')}</div>
      <div class="d">${new Date(n.updated).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' })}</div>
      ${tags ? `<div class="row" style="margin-top:4px;">${tags}</div>` : ''}
    </div>`;
  }
  if (!html) html = `<div style="padding:20px; color:var(--muted); text-align:center;">No notes. Click "＋ New note" to start.</div>`;
  document.getElementById('list').innerHTML = html;
}

function renderEditor() {
  const n = notes.find(x => x.id === activeId);
  if (!n) { activeId = notes[0]?.id || null; if (!activeId) { document.getElementById('noteTitle').value = ''; document.getElementById('noteBody').value = ''; document.getElementById('noteTags').value = ''; return; } renderEditor(); return; }
  document.getElementById('noteTitle').value = n.title || '';
  document.getElementById('noteBody').value = n.body || '';
  document.getElementById('noteTags').value = n.tags || '';
  const tags = (n.tags || '').split(',').map(s => s.trim()).filter(Boolean);
  document.getElementById('tags').innerHTML = tags.map(t => `<span class="tag">#${esc(t)}</span>`).join(' ');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

load(); updateCount(); renderList(); renderEditor();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});</script>
</body>
</html>
