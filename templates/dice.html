<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice & Coin — Tukuk Apps — Tukuk-OS</title>
<meta name="description" content="Roll real random dice (d4–d20), flip a coin and spin a 1–100 decider — cryptographic randomness, no internet needed.">
<link rel="canonical" href="https://tukuk.org/apps/dice">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:440px; margin:0 auto; padding:16px; text-align:center; }
  .out { min-height:120px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; font-size:3rem; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; }
  .pip { width:64px; height:64px; border-radius:12px; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:2rem; }
  .num { font-size:2.4rem; font-weight:900; color:var(--accent); }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:10px; }
  button { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button.big { background:var(--accent); color:#fff; border:0; font-weight:800; padding:12px 26px; }
  .hist { margin-top:14px; font-size:.82rem; color:var(--muted); }
  .spin { animation:sp .35s linear; } @keyframes sp { from { transform:rotate(0) } to { transform:rotate(360deg) } }
</style>
</head>
<body>
<header><a class="back" href="/apps">← Apps</a><h1>🎲 Dice &amp; Coin</h1></header>
<main class="wrap">
  <div class="out" id="out"><span class="num">?</span></div>
  <div class="row">
    <button data-die="4">d4</button><button data-die="6">d6</button>
    <button data-die="8">d8</button><button data-die="12">d12</button><button data-die="20">d20</button>
    <button data-die="100">d100</button>
  </div>
  <div class="row">
    <button id="multi">Roll 3 × d6</button>
    <button id="coin">🪙 Flip coin</button>
    <button id="safe">🛡️ Who pays? (1–N spin)</button>
  </div>
  <div class="row"><button class="big" id="go">Roll!</button></div>
  <p class="hist" id="hist">Uses crypto.getRandomValues — provably fair-ish, fully offline.</p>
</main>
<script>
(function () {
  'use strict';
  var out = document.getElementById('out'), hist = document.getElementById('hist');
  var faces = 6;
  var PIPS = { 1: '⚀', 2: '⚁', 3: '⚂', 4: '⚃', 5: '⚄', 6: '⚅' };
  function rnd(n) {
    var a = new Uint32Array(1);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return a[0] % n + 1;
  }
  function show(vals, label) {
    out.innerHTML = '';
    vals.forEach(function (v) {
      var s = document.createElement('span');
      if (faces === 6 && v >= 1 && v <= 6 && !label) { s.className = 'pip'; s.textContent = PIPS[v]; }
      else { s.className = 'num'; s.textContent = v; }
      out.appendChild(s);
    });
    if (label) { var t = document.createElement('span'); t.className = 'num'; t.textContent = label; out.appendChild(t); }
    out.classList.remove('spin'); void out.offsetWidth; out.classList.add('spin');
  }
  function roll(n, face, label) {
    var vals = []; for (var i = 0; i < n; i++) vals.push(rnd(face));
    faces = face; show(vals, label);
    hist.textContent = 'Last: ' + vals.join(' + ') + (label ? ' → ' + label : ' = ' + vals.reduce(function (a, b) { return a + b; }, 0)) + ' · ' + new Date().toLocaleTimeString();
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-die]'), function (b) {
    b.addEventListener('click', function () { faces = +b.dataset.die; roll(1, faces); });
  });
  document.getElementById('go').addEventListener('click', function () { roll(1, faces); });
  document.getElementById('multi').addEventListener('click', function () { roll(3, 6); });
  document.getElementById('coin').addEventListener('click', function () {
    var v = rnd(2); faces = 2; show([v], v === 1 ? '🅷 HEADS' : '🆃 TAILS');
    hist.textContent = 'Coin: ' + (v === 1 ? 'HEADS' : 'TAILS') + ' · ' + new Date().toLocaleTimeString();
  });
  document.getElementById('safe').addEventListener('click', function () {
    var n = prompt('How many people?', '4');
    n = Math.max(2, Math.min(99, +n || 4));
    roll(1, n, 'of ' + n);
  });
  roll(1, 6);
})();
</script>
</body>
</html>
