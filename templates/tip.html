<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Split — Tukuk Apps — Tukuk-OS</title>
<meta name="description" content="Bill, tip percent and people — instant per-person split with a live receipt view. Works offline at the dinner table.">
<link rel="canonical" href="https://tukuk.org/apps/tip">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:440px; margin:0 auto; padding:16px; }
  label { display:block; font-size:.72rem; color:var(--muted); text-transform:uppercase; margin:14px 0 6px; }
  input[type=number] { width:100%; box-sizing:border-box; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px; font-size:1.1rem; font:inherit; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .pct, .pc { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:8px 14px; cursor:pointer; font:inherit; font-weight:600; }
  .pct.on, .pc.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .res { margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center; }
  .big { font-size:2.2rem; font-weight:900; color:var(--accent); }
  .sub { color:var(--muted); font-size:.84rem; margin-top:6px; }
</style>
</head>
<body>
<header><a class="back" href="/apps">← Apps</a><h1>💵 Tip Split</h1></header>
<main class="wrap">
  <label for="bill">Bill amount</label>
  <input type="number" id="bill" min="0" step="0.01" placeholder="42.00" inputmode="decimal">
  <label>Tip</label>
  <div class="row" id="pcts"></div>
  <label for="people">Split between</label>
  <div class="row" id="pcs"></div>
  <input type="number" id="people" min="1" max="50" value="1" inputmode="numeric" style="margin-top:8px">
  <div class="res">
    <div class="big" id="each">—</div>
    <div class="sub" id="detail">Enter a bill to split.</div>
  </div>
</main>
<script>
(function () {
  'use strict';
  var PCTS = [0, 5, 8, 10, 15, 18, 20], PC = [1, 2, 3, 4, 5, 6, 8];
  var pct = 10, ppl = 1;
  var bill = document.getElementById('bill'), hPcts = document.getElementById('pcts'), hPcs = document.getElementById('pcs');
  var each = document.getElementById('each'), detail = document.getElementById('detail');

  PCTS.forEach(function (p) {
    var b = document.createElement('button'); b.className = 'pct' + (p === pct ? ' on' : ''); b.textContent = p + '%';
    b.addEventListener('click', function () {
      pct = p;
      Array.prototype.forEach.call(hPcts.children, function (c) { c.classList.toggle('on', c.textContent === p + '%'); });
      calc();
    });
    hPcts.appendChild(b);
  });
  PC.forEach(function (n) {
    var b = document.createElement('button'); b.className = 'pc' + (n === ppl ? ' on' : ''); b.textContent = n + '×';
    b.addEventListener('click', function () {
      ppl = n; document.getElementById('people').value = n;
      Array.prototype.forEach.call(hPcs.children, function (c) { c.classList.toggle('on', c.textContent === n + '×'); });
      calc();
    });
    hPcs.appendChild(b);
  });
  document.getElementById('people').addEventListener('input', function () { ppl = Math.max(1, +this.value || 1); calc(); });
  bill.addEventListener('input', calc);

  function money(v) { return v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function calc() {
    var b = parseFloat(bill.value) || 0;
    if (!b) { each.textContent = '—'; detail.textContent = 'Enter a bill to split.'; return; }
    var tip = b * pct / 100, tot = b + tip, per = tot / ppl;
    each.textContent = money(per) + ' / person';
    detail.textContent = 'Bill ' + money(b) + ' + tip ' + money(tip) + ' (' + pct + '%) = ' + money(tot) + ' total ÷ ' + ppl + (ppl === 1 ? ' person' : ' people');
  }
  calc();
})();
</script>
</body>
</html>
