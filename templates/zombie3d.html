<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c0f14">
<title>Zombi 3D Shooter</title>
<style id="tk-theme">:root{--bg:#0c0f14;--surface:#171c24;--text:#e9eef6;--accent:#7cff5a;}</style>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,'Segoe UI',Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .hidden{display:none!important}
  #themeProbe{position:absolute;width:0;height:0;opacity:0}
  #start,#over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:rgba(6,8,12,.82);backdrop-filter:blur(3px)}
  #start h1,#over h1{font-size:clamp(30px,9vw,60px);font-weight:900;letter-spacing:1px}
  #start h1 em{font-style:normal;color:var(--accent)}
  #start p,#over p{max-width:32em;line-height:1.5;opacity:.82;font-size:14px}
  #stats{font-size:clamp(18px,5vw,32px);font-weight:800}
  #stats b{color:var(--accent)}
  .cta{background:var(--accent);color:#08240a;border:none;font:inherit;font-weight:800;font-size:17px;padding:14px 30px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px rgba(124,255,90,.35)}
  .cta:active{transform:translateY(2px)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:30em}
  .chip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
  .badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.6px;font-weight:800;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);z-index:6}
</style>
</head>
<body>
<div id="app">
  <canvas id="screen"></canvas>
  <span id="themeProbe" style="color:var(--accent)"></span>
  <div class="badge">🔫 Zombi 3D Shooter</div>
  <div id="start">
    <h1>ZOMBI <em>3D</em></h1>
    <p>Bertahan daripada gelombang zombi dalam gelap. Puntung, tembak, dan jangan biar mereka sampai padamu. Makin lama, makin laju & ramai.</p>
    <button id="play" class="cta">▶ MAIN</button>
    <div class="chips">
      <span class="chip">Klik = kunci &amp; tembak</span><span class="chip">Mouse = pusing</span>
      <span class="chip">WASD = gerak</span><span class="chip">R = isi peluru</span><span class="chip">Space = tembak</span>
    </div>
  </div>
  <div id="over" class="hidden">
    <h1>🧟 KAMU DIGIGIT</h1>
    <p id="stats"></p>
    <button id="again" class="cta">↻ Cuba Lagi</button>
  </div>
</div>
<script>
(function(){
'use strict';
var canvas = document.getElementById('screen');
var ctx = canvas.getContext('2d');
var W=0, H=0, ang=0, px=12.5, py=8.5;
var COL=24, ROW=16, MAP=[];
var RAYS, FOV=Math.PI/3, half=FOV/2, maxDist=26;
var perCol=new Float64Array(600);
var keys={}, locked=false, firing=false, running=false;
var kills=0, wave=0, health=100, ammo=8, mag=8, reloading=0, muzzle=0, shake=0, lock=null;
var parts=[], zombies=[], stars=[];
var AUDIO=null, noiseBuf=null;

function build(){
  MAP=[];
  for(var y=0;y<ROW;y++){var r=[];for(var x=0;x<COL;x++){
    var edge=(x===0||y===0||x===COL-1||y===ROW-1);
    var pillar=((x%6===3)&&(y%5===2));
    r.push(edge||pillar?1:0);
  }MAP.push(r);}
}
function solid(x,y){var my=Math.floor(y),mx=Math.floor(x);if(my<0||mx<0||my>=ROW||mx>=COL)return true;return MAP[my][mx]===1;}
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,1.5);
  W=canvas.clientWidth; H=canvas.clientHeight;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
  RAYS=Math.max(110,Math.min(340,Math.floor(W/3)));
  perCol=new Float64Array(RAYS);
}
// ── audio (WebAudio, dibuat pada gest pertama) ──
function ac(){if(!AUDIO){try{AUDIO=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AUDIO&&AUDIO.state==='suspended')AUDIO.resume();return AUDIO;}
function getNoise(a){if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*0.35,a.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return noiseBuf;}
function shootSnd(){var a=ac();if(!a)return;var t=a.currentTime;var src=a.createBufferSource();src.buffer=getNoise(a);var f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1300;f.Q.value=0.8;var g=a.createGain();g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);src.connect(f);f.connect(g);g.connect(a.destination);src.start(t);src.stop(t+0.13);}
function groan(){var a=ac();if(!a)return;var t=a.currentTime;var o=a.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(90,t);o.frequency.linearRampToValueAtTime(55,t+0.4);var g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.18,t+0.06);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.52);}
function thud(){var a=ac();if(!a)return;var t=a.currentTime;var o=a.createOscillator();o.type='square';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(50,t+0.14);var g=a.createGain();g.gain.setValueAtTime(0.32,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.17);}
function click(hi){var a=ac();if(!a)return;var t=a.currentTime, o=a.createOscillator();o.type='square';o.frequency.value=hi?820:420;var g=a.createGain();g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.06);}

// ── wave & zombies ──
function spawnWave(){
  wave++;
  var n=4+wave*2; if(n>22)n=22;
  var spd=0.7+Math.min(0.14*wave,1.3);
  for(var i=0;i<n;i++){
    var x,y,tries=0;
    do{x=1+Math.random()*(COL-2);y=1+Math.random()*(ROW-2);tries++;}while((solid(x,y)||Math.hypot(x-px,y-py)<6)&&tries<40);
    zombies.push({x:x,y:y,hp:1,spd:spd*(0.8+Math.random()*0.4),ph:Math.random()*6.28,groan:Math.random()*3,alive:true,hit:0});
  }
}
function burst(x,y,n,rgb,spd){for(var i=0;i<n;i++){var a=Math.random()*6.28,s=(0.5+Math.random())*(spd||5);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,rgb:rgb});}}

function fire(){
  if(!running||reloading>0)return;
  if(ammo<=0){reload();return;}
  ammo--; muzzle=1; shake=Math.max(shake,5); firing=false; shootSnd();
  // hitscan: zombie paling hampir dalam tembereng sudut depan
  var best=null,bd=1e9;
  for(var i=0;i<zombies.length;i++){var z=zombies[i];if(!z.alive)continue;
    var dx=z.x-px,dy=z.y-py,d=Math.hypot(dx,dy);
    var ta=Math.atan2(dy,dx); var diff=ta-ang;
    while(diff>Math.PI)diff-=2*Math.PI; while(diff<-Math.PI)diff+=2*Math.PI;
    var cone=Math.max(0.05, 0.16-Math.min(d,14)*0.008);
    if(Math.abs(diff)<cone && d<16 && blocked(z.x,z.y)===false && d<bd){bd=d;best=z;}
  }
  if(best){best.hp--; best.hit=1;
    burst(best.x,best.y,10,[200,40,40],7);
    if(best.hp<=0){best.alive=false;kills++;thud();shake=Math.max(shake,7);burst(best.x,best.y,16,[120,220,90],9);}
  }
  if(ammo<=0)reload();
}
function reload(){if(reloading>0||ammo===mag)return;reloading=0.9;click(false);}
function blocked(zx,zy){ // adakah dinding antara pemain & sasaran (untuk ketepatan hitscan)
  var dx=zx-px,dy=zy-py,steps=Math.ceil(Math.hypot(dx,dy)*3);
  for(var i=1;i<steps;i++){if(solid(px+dx*i/steps,py+dy*i/steps))return true;}return false;
}

function playerMove(dt){
  var sp=4.2*dt, mvF=0, mvS=0;
  if(keys['KeyW']||keys['ArrowUp'])mvF+=1;
  if(keys['KeyS']||keys['ArrowDown'])mvF-=1;
  if(keys['KeyA'])mvS-=1;
  if(keys['KeyD'])mvS+=1;
  var ca=Math.cos(ang),sa=Math.sin(ang);
  var nx=(ca*mvF-sa*mvS)*sp,ny=(sa*mvF+ca*mvS)*sp;
  var l=lock||{lmx:0,lmy:0};
  if(l&&locked){nx+=-Math.sin(ang)*l.lmx*0.012;ny+=Math.cos(ang)*l.lmx*0.012;}
  if(!solid(px+nx,py))px+=nx;
  if(!solid(px,py+ny))py+=ny;
  if(l){l.lmx=0;l.lmy=0;}
}

var last=0;
function frame(now){
  var dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  if(running){
    playerMove(dt);
    if(muzzle>0)muzzle=Math.max(0,muzzle-dt*8);
    if(reloading>0){reloading-=dt;if(reloading<=0){ammo=mag;click(true);}}
    if(shake>0)shake=Math.max(0,shake-dt*24);
    // zombi
    var aliveN=0;
    for(var i=0;i<zombies.length;i++){var z=zombies[i];if(!z.alive)continue;aliveN++;
      var dx=px-z.x,dy=py-z.y,d=Math.hypot(dx,dy)||1e-6;
      var step=z.spd*dt;
      var nx=z.x+dx/d*step, ny=z.y+dy/d*step;
      if(!solid(nx,z.y))z.x=nx; if(!solid(z.x,ny))z.y=ny;
      z.ph+=dt*6; if(z.hit>0)z.hit-=dt*4;
      z.groan-=dt; if(z.groan<0&&d<9){z.groan=2+Math.random()*3;if(Math.random()<0.5)groan();}
      if(d<0.7){health-=26*dt; shake=Math.max(shake,6); if(health<=0){return over();}}
    }
    if(aliveN===0){ // wave selesai
      if(!zombies.__respawn){zombies.__respawn=1.4;health=Math.min(100,health+22);}
      zombies.__respawn-=dt;
      if(zombies.__respawn<=0){zombies=[];zombies.__respawn=0;spawnWave();}
    } else { zombies.__respawn=0; }
    // particles
    for(var k=parts.length-1;k>=0;k--){var p=parts[k];p.life-=dt*1.8;if(p.life<=0){parts.splice(k,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=dt*8;}
    draw(dt);
  }
  requestAnimationFrame(frame);
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  if(shake>0){ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);}
  ctx.fillStyle='#0c0f14'; ctx.fillRect(-10,-10,W+20,H+20);
  var horizon=H*0.5;
  // langit berbintang pudar
  ctx.fillStyle='#05070b'; ctx.fillRect(-10,-10,W+20,horizon);
  var rayW=W/RAYS, x, y;
  for(var r=0;r<RAYS;r++){
    var ra=ang-half+(r/RAYS)*FOV, rd=dirRay(ra);
    perCol[r]=rd.d;
    var lh=Math.min(H*2.2,(H/rd.d)*1.5);
    var top=horizon-lh/2;
    y=top;
    while(y<top+lh){
      var t=(y-top)/lh, s=(0.5+t);
      var v=Math.pow(1-Math.min(1,rd.d/maxDist),1.4);
      var shade=(rd.side?0.78:1)*v*s;
      ctx.fillStyle='rgb('+((70*shade)|0)+','+((78*shade)|0)+','+((96*shade)|0)+')';
      ctx.fillRect(x=r*rayW,y,rayW+1,2); y+=2;
    }
  }
  // lantai
  y=horizon;
  while(y<H){
    var t2=(y-horizon)/(H-horizon), s2=(0.92-t2)*0.4+0.25, v2=Math.pow(1-Math.min(1,(1-t2)*6),1.3);
    ctx.fillStyle='rgb('+((48*v2*s2)|0)+','+((44*v2*s2)|0)+','+((38*v2*s2)|0)+')';
    ctx.fillRect(-10,y,W+20,2); y+=2;
  }
  // zombi billboard (jauh→dekat)
  var zs=zombies.filter(function(z){return z.alive;}).sort(function(a,b){return dist2(b)-dist2(a);});
  for(var zi=0;zi<zs.length;zi++){
    var z=zs[zi]; var dx=z.x-px,dy=z.y-py; var dist=Math.hypot(dx,dy);
    var za=Math.atan2(dy,dx)-ang; while(za>Math.PI)za-=2*Math.PI; while(za<-Math.PI)za+=2*Math.PI;
    if(Math.abs(za)>half*1.2)continue;
    var sxp=W*0.5+(za/(half*2))*W*-1, spr=Math.min(H*1.8,(H/dist)*0.9), foot=horizon+spr/2, bw=spr*0.42, bh=spr*0.8;
    var col=Math.floor(sxp/rayW);
    if(col<0||col>=RAYS||dist>=perCol[col])continue;
    var left=sxp-bw/2, topF=foot-bh;
    var v=Math.pow(1-Math.min(1,dist/maxDist),1.2), g=Math.floor(150*v), rd2=Math.floor(50*(1-v)+30);
    if(z.hit>0){ctx.fillStyle='#fff';}else{ctx.fillStyle='rgb('+rd2+','+g+','+rd2+')';}
    ctx.fillRect(left,topF,bw,bh); // badan
    ctx.fillStyle=z.hit>0?'#fff':'rgb('+rd2+','+(g+30)+','+rd2+')';
    ctx.fillRect(left+bw*0.28,topF-bh*0.22,bw*0.44,bh*0.26); // kepala
    var sw=Math.sin(z.ph)*bw*0.3;
    ctx.fillRect(left-bw*0.28+sw,topF+bh*0.1,bw*0.28,bh*0.5);  // lengan kiri
    ctx.fillRect(left+bw,topF+bh*0.1-sw,bw*0.28,bh*0.5);       // lengan kanan
    ctx.fillStyle='#ff2a2a';
    ctx.fillRect(left+bw*0.36,topF-bh*0.14,bw*0.08,bh*0.04);
    ctx.fillRect(left+bw*0.56,topF-bh*0.14,bw*0.08,bh*0.04);   // mata
  }
  // particles
  for(var pi=0;pi<parts.length;pi++){var p=parts[pi];var sxp2=W*0.5+Math.atan2(p.y-py,p.x-px)-ang;
    // particles diprojeksimat kasar pada posisi dunia → skrin
    var pa=Math.atan2(p.y-py,p.x-px)-ang; while(pa>Math.PI)pa-=2*Math.PI;while(pa<-Math.PI)pa+=2*Math.PI;
    if(Math.abs(pa)>half)continue;
    var pxs=W*0.5+(pa/(half*2))*W*-1, pys=horizon - (H/Math.max(0.5,Math.hypot(p.x-px,p.y-py)))*0.2;
    ctx.fillStyle='rgba('+p.rgb[0]+','+p.rgb[1]+','+p.rgb[2]+','+Math.max(0,p.life)+')';
    ctx.fillRect(pxs-2,pys-2,4,4);
  }
  // ── HUD & senjata ──
  ctx.setTransform(1,0,0,1,0,0);
  drawWeapon();
  // crosshair
  ctx.strokeStyle=muzzle>0?'#fff':'rgba(255,60,60,.9)'; ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2-9,H/2);ctx.lineTo(W/2-3,H/2);ctx.moveTo(W/2+3,H/2);ctx.lineTo(W/2+9,H/2);ctx.moveTo(W/2,H/2-9);ctx.lineTo(W/2,H/2-3);ctx.moveTo(W/2,H/2+3);ctx.lineTo(W/2,H/2+9);ctx.stroke();
  // health bar
  ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(12,H-30,140,16);
  ctx.fillStyle=health>35?'#7cff5a':'#ff4d5a'; ctx.fillRect(13,H-29,138*(health/100),14);
  ctx.fillStyle='#e9eef6'; ctx.font='800 12px system-ui'; ctx.textAlign='left';
  ctx.fillText('HP '+Math.max(0,Math.ceil(health)),16,H-18);
  ctx.textAlign='right'; ctx.font='900 22px system-ui';
  ctx.fillStyle=ammo<=2?'#ff4d5a':'#e9eef6';
  ctx.fillText(reloading>0?'RELOAD…':(ammo+'/'+mag), W-14, H-18);
  ctx.font='800 13px system-ui'; ctx.fillStyle='#7cff5a';
  ctx.fillText('WAVE '+wave+'   ·   '+kills+' kill', W-14, H-40);
  ctx.textAlign='center';
  if(zombies.__respawn>0){ctx.font='900 clamp(20px,5vw,40px)'; ctx.fillStyle='#7cff5a'; ctx.font='900 34px system-ui'; ctx.fillText('GELOMBANG '+wave+' LEPAS!', W/2, H*0.32);}
}
function dist2(z){return (z.x-px)*(z.x-px)+(z.y-py)*(z.y-py);}
function drawWeapon(){
  var bob=Math.sin(Date.now()/300)*4, rec=muzzle*22;
  var gx=W*0.56, gy=H+rec+bob, s=Math.min(W,H)*0.5;
  if(muzzle>0.5){var g=ctx.createRadialGradient(gx+s*0.1,gy-s*0.35,2,gx+s*0.1,gy-s*0.35,s*0.24);g.addColorStop(0,'rgba(255,240,150,.95)');g.addColorStop(1,'rgba(255,150,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(gx+s*0.1,gy-s*0.35,s*0.24,0,7);ctx.fill();}
  ctx.fillStyle='#161a22';ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+s*0.2,gy-s*0.46);ctx.lineTo(gx+s*0.24,gy-s*0.46);ctx.lineTo(gx+s*0.1,gy);ctx.closePath();ctx.fill();
  ctx.fillStyle='#3d1e16';ctx.beginPath();ctx.moveTo(gx-s*0.02,gy-s*0.2);ctx.lineTo(gx+s*0.26,gy-s*0.2);ctx.lineTo(gx+s*0.24,gy-s*0.44);ctx.lineTo(gx+s*0.04,gy-s*0.44);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#3d1e16';ctx.lineWidth=s*0.14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(gx+s*0.1,gy-s*0.32);ctx.lineTo(gx-s*0.16,gy+s*0.02);ctx.stroke();
}
function dirRay(rayAngle){
  var dx=Math.cos(rayAngle),dy=Math.sin(rayAngle);
  var mapX=Math.floor(px),mapY=Math.floor(py);
  var ddx=Math.abs(1/(dx||1e-9)),ddy=Math.abs(1/(dy||1e-9));
  var stepX,stepY,sdx,sdy;
  if(dx<0){stepX=-1;sdx=(px-mapX)*ddx;}else{stepX=1;sdx=(mapX+1-px)*ddx;}
  if(dy<0){stepY=-1;sdy=(py-mapY)*ddy;}else{stepY=1;sdy=(mapY+1-py)*ddy;}
  var side=0;
  for(var i=0;i<80;i++){
    if(sdx<sdy){sdx+=ddx;mapX+=stepX;side=0;}else{sdy+=ddy;mapY+=stepY;side=1;}
    if(mapX<0||mapY<0||mapX>=COL||mapY>=ROW)break;
    if(MAP[mapY][mapX]===1)break;
  }
  var d=side===0?(sdx-ddx):(sdy-ddy);
  return {d:Math.max(0.05,d),side:side};
}
function play(){
  build(); px=12.5;py=8.5;ang=0; kills=0; wave=0; health=100; ammo=mag; reloading=0; muzzle=0; shake=0;
  parts=[]; zombies=[]; zombies.__respawn=0;
  spawnWave();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  running=true; last=performance.now();
  if(!lock){lock={lmx:0,lmy:0};}
  if(canvas.requestPointerLock&&lock)canvas.requestPointerLock();
  ac();
}
function over(){
  running=false;
  if(document.pointerLockElement)document.exitPointerLock();
  document.getElementById('stats').innerHTML='Kills: <b>'+kills+'</b> &nbsp;·&nbsp; Gelombang: <b>'+wave+'</b>';
  document.getElementById('over').classList.remove('hidden');
  try{fetch('/api/score?g=zombie3d&n='+encodeURIComponent((window.tukGame&&window.tukGame.name)||'Anon')+'&s='+kills,{keepalive:true});}catch(e){}
  if(window.__tkScore)window.__tkScore(kills);
}

// ── input ──
window.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(e.code==='KeyR')reload();
  if(e.code==='Space'){e.preventDefault();fire();}
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
document.addEventListener('pointerlockchange',function(){locked=(document.pointerLockElement===canvas);});
canvas.addEventListener('mousemove',function(e){if(locked&&running){ang+=e.movementX*0.0026;}});
canvas.addEventListener('mousedown',function(){if(running){fire();}else{play();}});
function touchLook(e){if(!running||locked)return;var t=e.touches[0];if(touchLook.px!=null){ang+=(t.clientX-touchLook.px)*0.006;}touchLook.px=t.clientX;}
