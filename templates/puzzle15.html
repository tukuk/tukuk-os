<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide 15 — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="The classic 4×4 sliding tile puzzle: shuffle the numbers, slide them back into order in as few moves as possible.">
<link rel="canonical" href="https://tukuk.org/apps/puzzle15">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:420px; margin:0 auto; padding:12px; text-align:center; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:12px; font-size:.82rem; }
  .hud .stat { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.66rem; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; width:min(340px, 90vw); margin:0 auto; }
  .t { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:800; border-radius:12px; background:var(--panel); border:1px solid var(--line); cursor:pointer; user-select:none; }
  .t.ok { color:#2ecc71; }
  .t.blank { background:transparent; border:0; cursor:default; }
  #shuffle { margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:11px 26px; font-weight:700; cursor:pointer; font:inherit; }
  .hint { color:var(--muted); font-size:.78rem; margin-top:8px; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🔢 Slide 15</h1></header>
<main class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Moves</span><b id="hMoves">0</b></div>
    <div class="stat"><span class="lab">Best</span><b id="hBest">—</b></div>
    <div class="stat"><span class="lab">Status</span><b id="hStat">Solved ✓</b></div>
  </div>
  <div class="grid" id="grid"></div>
  <button id="shuffle">Shuffle</button>
  <p class="hint">Tap a tile next to the gap (or use arrows) to slide it.</p>
</main>
<script>
(function () {
  'use strict';
  var N = 4, cells = [], moves = 0;
  var grid = document.getElementById('grid'), hMoves = document.getElementById('hMoves');
  var hStat = document.getElementById('hStat'), hBest = document.getElementById('hBest');
  var best = localStorage.getItem('tkslide-best'); if (best) hBest.textContent = best;

  function solved() { for (var i = 0; i < 15; i++) if (cells[i] !== i + 1) return false; return true; }
  function render() {
    grid.innerHTML = '';
    cells.forEach(function (v, i) {
      var b = document.createElement('div');
      b.className = 't' + (v === 0 ? ' blank' : (v === i + 1 ? ' ok' : ''));
      b.textContent = v || '';
      b.addEventListener('click', function () { tryMove(i); });
      grid.appendChild(b);
    });
    hStat.textContent = solved() ? 'Solved ✓' : moves + ' moves';
  }
  function tryMove(i) {
    var g = cells.indexOf(0), r = Math.floor(i / N), c = i % N, gr = Math.floor(g / N), gc = g % N;
    if (r === gr && Math.abs(c - gc) === 1 || c === gc && Math.abs(r - gr) === 1) {
      cells[g] = cells[i]; cells[i] = 0; moves++; hMoves.textContent = moves;
      render();
      if (solved()) {
        hStat.textContent = 'Solved ✓ in ' + moves;
        if (!best || moves < +best) { best = moves; localStorage.setItem('tkslide-best', best); hBest.textContent = best; }
      }
    }
  }
  function shuffle() {
    cells = []; for (var i = 1; i < 16; i++) cells.push(i); cells.push(0);
    // walk the blank randomly => always solvable
    var g = 15;
    for (var k = 0; k < 300; k++) {
      var r = Math.floor(g / N), c = g % N, opts = [];
      if (r > 0) opts.push(g - N); if (r < 3) opts.push(g + N);
      if (c > 0) opts.push(g - 1); if (c < 3) opts.push(g + 1);
      var t = opts[Math.floor(Math.random() * opts.length)];
      cells[g] = cells[t]; cells[t] = 0; g = t;
    }
    moves = 0; hMoves.textContent = 0; render();
  }
  addEventListener('keydown', function (e) {
    var g = cells.indexOf(0), r = Math.floor(g / N), c = g % N;
    if (e.key === 'ArrowUp' && r < 3) tryMove(g + N);
    if (e.key === 'ArrowDown' && r > 0) tryMove(g - N);
    if (e.key === 'ArrowLeft' && c < 3) tryMove(g + 1);
    if (e.key === 'ArrowRight' && c > 0) tryMove(g - 1);
  });
  document.getElementById('shuffle').addEventListener('click', shuffle);
  shuffle();
})();
</script>
</body>
</html>
