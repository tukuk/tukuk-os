<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle Jump — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="One of the most-downloaded phone games ever: your little jumper bounces automatically — steer left and right to land on every platform and climb as high as you can.">
<link rel="canonical" href="https://tukuk.org/apps/doodle">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:420px; margin:0 auto; padding:12px; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:10px; font-size:.82rem; }
  .hud .stat { flex:1; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.66rem; text-transform:uppercase; }
  canvas { display:block; width:100%; border-radius:10px; background:linear-gradient(#eaf3ff,#d7e8ff); touch-action:none; }
  .ctrls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .ctrls button { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:16px 0; font-size:1.4rem; cursor:pointer; }
  .ctrls button:active { background:var(--accent); color:#fff; }
  #start { margin-top:8px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px; font-weight:700; cursor:pointer; font:inherit; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🦘 Doodle Jump</h1></header>
<div class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Height</span><b id="score">0</b></div>
    <div class="stat"><span class="lab">Best</span><b id="best">0</b></div>
  </div>
  <canvas id="cv" width="360" height="520"></canvas>
  <div class="ctrls"><button id="bl">◀</button><button id="br">▶</button></div>
  <button id="start">Start</button>
</div>
<script>
(() => {
  const W = 360, H = 520, cv = document.getElementById('cv'), g = cv.getContext('2d');
  const PW = 54, PH = 12, BOUNCE = 11, GRAV = 0.28;
  let player, plats, score = 0, best = Number(localStorage.getItem('doodle-best') || 0), running = false, keys = {};

  function makePlat(y) { return { x: Math.random() * (W - PW), y, broken: false }; }
  function reset() {
    player = { x: W / 2 - 14, y: H - 80, vx: 0, vy: -BOUNCE, w: 28, h: 28 };
    plats = [{ x: W / 2 - PW / 2, y: H - 40 }];
    for (let y = H - 100; y > -40; y -= 62) plats.push(makePlat(y));
    score = 0; running = true; updateHud();
  }
  const gap = () => 58 + Math.min(52, score / 120);
  function step() {
    if (keys.l) player.vx -= 0.6; if (keys.r) player.vx += 0.6;
    player.vx *= 0.92; player.x += player.vx;
    if (player.x > W) player.x = -player.w; if (player.x < -player.w) player.x = W; // wrap
    player.vy += GRAV; player.y += player.vy;
    // land only while falling
    if (player.vy > 0) for (const p of plats) {
      if (!p.broken && player.x + player.w > p.x && player.x < p.x + PW && player.y + player.h > p.y && player.y + player.h < p.y + PH + player.vy) { player.vy = -BOUNCE; break; }
    }
    // camera: move world down when player rises above midline
    if (player.y < H * 0.42) {
      const dy = H * 0.42 - player.y;
      player.y = H * 0.42;
      plats.forEach((p) => p.y += dy);
      score += Math.round(dy);
      plats = plats.filter((p) => p.y < H + 20);
      let top = Math.min(...plats.map((p) => p.y));
      while (top > -20) { top -= gap(); plats.push(makePlat(top)); }
      updateHud();
    }
    if (player.y > H) running = false;
  }
  function banner(t) { g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(0, H / 2 - 30, W, 60); g.fillStyle = '#fff'; g.font = 'bold 22px system-ui'; g.textAlign = 'center'; g.fillText(t, W / 2, H / 2 + 8); }
  function draw() {
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#5bbf5b'; for (const p of plats) { g.beginPath(); g.roundRect ? g.roundRect(p.x, p.y, PW, PH, 6) : g.rect(p.x, p.y, PW, PH); g.fill(); }
    g.fillStyle = '#8d6e63'; g.fillRect(player.x, player.y, player.w, player.h);
    g.fillStyle = '#000'; g.fillRect(player.x + 6, player.y + 8, 4, 4); g.fillRect(player.x + 18, player.y + 8, 4, 4);
    if (!running) banner('Fell! Height ' + score);
  }
  function updateHud() {
    document.getElementById('score').textContent = score;
    if (score > best) { best = score; localStorage.setItem('doodle-best', String(best)); }
    document.getElementById('best').textContent = best;
  }
  function loop() { if (!running) { draw(); return; } step(); draw(); requestAnimationFrame(loop); }
  function start() { reset(); requestAnimationFrame(loop); }

  const hold = (id, on, off) => { const e = document.getElementById(id); e.addEventListener('pointerdown', (ev) => { ev.preventDefault(); on(); }); ['pointerup','pointerleave','pointercancel'].forEach((t) => e.addEventListener(t, off)); };
  hold('bl', () => keys.l = 1, () => keys.l = 0);
  hold('br', () => keys.r = 1, () => keys.r = 0);
  window.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') keys.l = 1; else if (e.key === 'ArrowRight') keys.r = 1; });
  window.addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft') keys.l = 0; else if (e.key === 'ArrowRight') keys.r = 0; });
  document.getElementById('start').addEventListener('click', start);
  // idle preview
  player = { x: W / 2 - 14, y: H - 80, w: 28, h: 28 }; plats = [{ x: W / 2 - PW / 2, y: H - 40 }]; draw();
})();
</script>
</body>
</html>
