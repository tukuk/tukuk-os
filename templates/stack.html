<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Tower — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="The viral one-tap tower game: time each drop, keep the overlap, shave the overhang. How high can you stack?">
<link rel="canonical" href="https://tukuk.org/apps/stack">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:420px; margin:0 auto; padding:12px; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:10px; font-size:.82rem; }
  .hud .stat { flex:1; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.66rem; text-transform:uppercase; }
  canvas { display:block; width:100%; border-radius:10px; background:#0c0f16; touch-action:manipulation; cursor:pointer; }
  .hint { text-align:center; color:var(--muted); font-size:.78rem; margin-top:8px; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🗼 Stack Tower</h1></header>
<main class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Height</span><b id="hScore">0</b></div>
    <div class="stat"><span class="lab">Best</span><b id="hBest">0</b></div>
    <div class="stat"><span class="lab">Perfect</span><b id="hPerf">0</b></div>
  </div>
  <canvas id="cvs" width="360" height="520"></canvas>
  <p class="hint">Tap / click / Space to drop the block. Dead-centre drops a PERFECT and widens it back.</p>
</main>
<script>
(function () {
  'use strict';
  var c = document.getElementById('cvs'), x = c.getContext('2d');
  var W = c.width, H = c.height, BH = 26;
  var best = +(localStorage.getItem('tkstack-best') || 0);
  document.getElementById('hBest').textContent = best;
  var blocks, cur, dir, speed, score, perf, alive, camY;

  function reset() {
    blocks = [{ x: (W - 160) / 2, w: 160, hue: 200 }];
    cur = { x: 20, w: 160, hue: 150 };
    dir = 1; speed = 2.6; score = 0; perf = 0; alive = true; camY = 0;
    document.getElementById('hScore').textContent = 0;
    document.getElementById('hPerf').textContent = 0;
  }
  function topY(i) { return H - 60 - i * BH; }

  function drop() {
    if (!alive) { reset(); return; }
    var prev = blocks[blocks.length - 1];
    var px = prev.x, pw = prev.w;
    var ovL = Math.max(px, cur.x), ovR = Math.min(px + pw, cur.x + cur.w);
    var ov = ovR - ovL;
    if (ov <= 0) { alive = false; if (score > best) { best = score; localStorage.setItem('tkstack-best', best); } document.getElementById('hBest').textContent = best; return; }
    var delta = Math.abs(cur.x - px);
    if (delta < 5) { // perfect: keep width, small bonus
      perf++; document.getElementById('hPerf').textContent = perf;
      cur = { x: px, w: pw, hue: (prev.hue + 18) % 360 };
    } else {
      // shave: block becomes only the overlap; falling piece drawn as debris
      cur = { x: ovL, w: ov, hue: (prev.hue + 18) % 360 };
    }
    blocks.push(cur);
    score = blocks.length - 1;
    document.getElementById('hScore').textContent = score;
    speed = Math.min(7, 2.6 + score * 0.18);
    dir = 1; cur.x = -cur.w; // new block enters from the left
  }
  c.addEventListener('pointerdown', drop);
  addEventListener('keydown', function (e) { if (e.code === 'Space') { e.preventDefault(); drop(); } });

  function step() {
    if (!alive) return;
    cur.x += dir * speed;
    var edge = W - cur.w - 10;
    if (cur.x > edge) dir = -1;
    if (cur.x < 10) dir = 1;
    var targetCam = Math.max(0, (blocks.length - 1) * BH - (H - 160));
    camY += (targetCam - camY) * 0.12;
  }
  function draw() {
    x.clearRect(0, 0, W, H);
    x.save(); x.translate(0, camY);
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i], y = topY(i);
      x.fillStyle = 'hsl(' + b.hue + ',70%,' + (i === blocks.length - 1 && alive ? 62 : 52) + '%)';
      x.fillRect(b.x, y, b.w, BH - 3);
    }
    if (alive) {
      var y = topY(blocks.length) ;
      x.fillStyle = 'hsl(' + cur.hue + ',75%,66%)';
      x.fillRect(cur.x, y, cur.w, BH - 3);
    }
    x.restore();
    if (!alive) {
      x.fillStyle = 'rgba(10,12,18,.72)'; x.fillRect(0, 0, W, H);
      x.fillStyle = '#fff'; x.font = '700 26px system-ui'; x.textAlign = 'center';
      x.fillText('Height ' + score, W / 2, H / 2 - 24);
      x.font = '600 15px system-ui'; x.fillStyle = '#9fd2ff';
      x.fillText('Best ' + best + ' — tap to stack again', W / 2, H / 2 + 8);
    }
  }
  reset();
  (function loop() { step(); draw(); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
