<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Four — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="The beloved drop-disc game: tap a column to drop your red checker, line up four in a row before the computer blocks you and wins with yellow.">
<link rel="canonical" href="https://tukuk.org/apps/connect4">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:440px; margin:0 auto; padding:14px; }
  .turn { text-align:center; font-size:.95rem; margin-bottom:10px; }
  .turn i { display:inline-block; width:14px; height:14px; border-radius:50%; vertical-align:-2px; margin-right:5px; }
  #grid { background:#1565c0; border-radius:12px; padding:8px; display:grid; grid-template-columns:repeat(7,1fr); gap:6px; touch-action:manipulation; }
  .cell { aspect-ratio:1; border-radius:50%; background:var(--bg); box-shadow:inset 0 3px 6px rgba(0,0,0,.4); }
  .cell.r { background:#e53935; }
  .cell.y { background:#fdd835; }
  .cell.win { outline:3px solid #fff; }
  .bar { display:flex; gap:10px; justify-content:center; margin-top:14px; font-size:.9rem; color:var(--muted); }
  .bar button { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 16px; cursor:pointer; font:inherit; }
  .msg { text-align:center; margin-top:10px; min-height:1.3em; font-weight:700; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🔴 Connect Four</h1></header>
<div class="wrap">
  <div class="turn"><i style="background:#e53935"></i>You &nbsp;vs&nbsp; <i style="background:#fdd835"></i>CPU</div>
  <div id="grid"></div>
  <div class="bar"><span>You <b id="sYou">0</b> — CPU <b id="sCpu">0</b></span><button id="reset">New round</button></div>
  <div class="msg" id="msg">Tap a column to drop.</div>
</div>
<script>
(() => {
  const ROWS = 6, COLS = 7;
  const gridEl = document.getElementById('grid'), msgEl = document.getElementById('msg');
  let b, turn, over, tally = { you: 0, cpu: 0 };
  const DIRS = [[0,1],[1,0],[1,1],[1,-1]];

  function newRound() {
    b = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    turn = 1; over = false; msgEl.textContent = 'Your turn — tap a column.';
    gridEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const d = document.createElement('div'); d.className = 'cell'; d.dataset.c = c; gridEl.appendChild(d);
    }
  }
  const el = (r, c) => gridEl.children[r * COLS + c];
  function drop(col, who) {
    for (let r = ROWS - 1; r >= 0; r--) if (!b[r][col]) { b[r][col] = who; return r; }
    return -1;
  }
  function wins(who) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (b[r][c] !== who) continue;
      for (const [dr, dc] of DIRS) {
        const line = [[r, c]];
        for (let k = 1; k < 4; k++) { const nr = r + dr * k, nc = c + dc * k; if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS || b[nr][nc] !== who) break; line.push([nr, nc]); }
        if (line.length === 4) return line;
      }
    }
    return null;
  }
  function validCols() { const v = []; for (let c = 0; c < COLS; c++) if (b[0][c] === 0) v.push(c); return v; }
  function paint(r, c, who) { el(r, c).classList.add(who === 1 ? 'r' : 'y'); }

  function finish(line, who) {
    over = true;
    line.forEach(([r, c]) => el(r, c).classList.add('win'));
    if (who) { tally[who === 1 ? 'you' : 'cpu']++; msgEl.textContent = who === 1 ? '🎉 You connected four!' : '😬 CPU connected four.'; }
    else msgEl.textContent = 'Draw — board full.';
    document.getElementById('sYou').textContent = tally.you;
    document.getElementById('sCpu').textContent = tally.cpu;
  }
  function play(col, who) {
    const r = drop(col, who); if (r < 0) return false;
    paint(r, col, who);
    const w = wins(who); if (w) { finish(w, who); return true; }
    if (!validCols().length) { finish(null, 0); return true; }
    return true;
  }
  // CPU: win > block > centre-ish
  function cpuMove() {
    const cols = validCols();
    for (const c of cols) { const r = dropProbe(c, 2); if (r >= 0 && wouldWin(r, c, 2)) return c; }
    for (const c of cols) { const r = dropProbe(c, 1); if (r >= 0 && wouldWin(r, c, 1)) return c; }
    cols.sort((a, x) => Math.abs(3 - a) - Math.abs(3 - x));
    return cols[0];
  }
  function dropProbe(col, who) { for (let r = ROWS - 1; r >= 0; r--) if (!b[r][col]) return r; return -1; }
  function wouldWin(r, c, who) {
    b[r][c] = who; const w = wins(who); b[r][c] = 0; return !!w;
  }

  gridEl.addEventListener('click', (e) => {
    if (over || turn !== 1) return;
    const c = e.target.dataset.c; if (c == null) return;
    if (!play(Number(c), 1)) return;
    if (over) return;
    turn = 2; msgEl.textContent = 'CPU thinking…';
    setTimeout(() => { if (over) return; play(cpuMove(), 2); if (!over) { turn = 1; msgEl.textContent = 'Your turn — tap a column.'; } }, 480);
  });
  document.getElementById('reset').addEventListener('click', newRound);
  newRound();
})();
</script>
</body>
</html>
