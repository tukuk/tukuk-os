<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ring Flyer 3D — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="A perspective 3D flight game — fly the jet through glowing rings in open sky, no libraries, runs offline. Thread every gate, build a combo and don't clip the ground.">
<link rel="canonical" href="https://tukuk.org/apps/flight3d">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.15rem; }
  header .back { font-size:.86rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:520px; margin:0 auto; padding:10px; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:8px; font-size:.8rem; }
  .hud .stat { flex:1; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.62rem; text-transform:uppercase; }
  canvas { display:block; width:100%; border-radius:10px; background:#0a1622; touch-action:none; }
  .msg { min-height:1.1em; text-align:center; color:var(--muted); font-size:.82rem; margin-top:6px; }
  #start { margin-top:8px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px; font-weight:700; cursor:pointer; font:inherit; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>✈️ Ring Flyer 3D</h1></header>
<div class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Skor</span><b id="sc">0</b></div>
    <div class="stat"><span class="lab">Combo</span><b id="cb">0</b></div>
    <div class="stat"><span class="lab">Nyawa</span><b id="lv">3</b></div>
    <div class="stat"><span class="lab">Laju</span><b id="sp">1</b></div>
  </div>
  <canvas id="cv" width="440" height="340"></canvas>
  <div class="msg" id="msg">Arrow/WASD atau seret untuk belok ke cincin</div>
  <button id="start">Terbang</button>
</div>
<script>
(() => {
  const W = 440, H = 340, cv = document.getElementById('cv'), g = cv.getContext('2d');
  const F = H * 0.9, SPAWN = 46, PASSZ = 2.2;
  let rings, px, py, speed, score, combo, lives, running = false, keys = {}, roll = 0;

  function newRing(z) { return { x: (Math.random() * 2 - 1) * 7, y: (Math.random() * 2 - 1) * 4.5, z, r: 1.7 + Math.random() * 0.8, done: false }; }
  function reset() { px = 0; py = 0; speed = 0.42; score = 0; combo = 0; lives = 3; rings = []; for (let i = 0; i < 5; i++) rings.push(newRing(SPAWN - i * 9)); hud(); }
  function hud() { document.getElementById('sc').textContent = score; document.getElementById('cb').textContent = combo; document.getElementById('lv').textContent = lives; document.getElementById('sp').textContent = Math.round(speed / 0.42 * 10) / 10; }
  function msg(t) { document.getElementById('msg').textContent = t; }

  function step() {
    const sp = 0.16;
    if (keys.l) px -= sp; if (keys.r) px += sp; if (keys.u) py -= sp; if (keys.d) py += sp;
    px = Math.max(-9, Math.min(9, px)); py = Math.max(-6, Math.min(6, py));
    roll += ((keys.r ? 1 : keys.l ? -1 : 0) - roll) * 0.1;
    speed = Math.min(0.9, speed + 0.0002);
    for (const r of rings) r.z -= speed;
    for (const r of rings) {
      if (!r.done && r.z <= PASSZ) {
        r.done = true;
        const d = Math.hypot(r.x - px, r.y - py);
        if (d <= r.r) { combo++; score += 10 * combo; msg('Cincin! +' + (10 * combo)); }
        else { combo = 0; lives--; msg('Lepas cincin (' + lives + ' nyawa)'); if (lives <= 0) return over(); }
        const far = Math.max.apply(null, rings.map((q) => q.z)); r.x = (Math.random() * 2 - 1) * 7; r.y = (Math.random() * 2 - 1) * 4.5; r.r = 1.7 + Math.random() * 0.8; r.z = far + 9; r.done = false;
        hud();
      }
    }
  }
  function proj(r) { const s = F / Math.max(0.5, r.z); return { x: W / 2 + (r.x - px) * s, y: H / 2 + (r.y - py) * s, s }; }
  function draw() {
    const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#0e2233'); sky.addColorStop(0.6, '#15334d'); sky.addColorStop(0.62, '#24512f'); sky.addColorStop(1, '#123018');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    // ground grid moving
    g.strokeStyle = 'rgba(255,255,255,.08)'; const off = (Date.now() / 900 % 1);
    for (let i = 0; i < 7; i++) { const zc = (i + off) / 7 * F; g.beginPath(); g.moveTo(0, H / 2 + (H / 2) * (1 - zc / F * 0.6)); g.lineTo(W, H / 2 + (H / 2) * (1 - zc / F * 0.6)); g.stroke(); }
    // rings far → near
    const sorted = rings.slice().sort((a, b) => b.z - a.z);
    for (const r of sorted) { const p = proj(r); const rad = r.r * p.s; if (rad < 3 || p.y < -100 || p.y > H + 100) continue;
      const fade = Math.max(0.15, Math.min(1, 8 / r.z)); g.lineWidth = Math.max(2, rad * 0.12); g.strokeStyle = r.done ? 'rgba(120,120,120,' + fade + ')' : 'rgba(76,141,255,' + fade + ')';
      g.beginPath(); g.arc(p.x, p.y, rad, 0, 6.283); g.stroke();
      if (!r.done) { g.strokeStyle = 'rgba(255,213,74,' + fade * 0.7 + ')'; g.beginPath(); g.arc(p.x, p.y, rad * 0.7, 0, 6.283); g.stroke(); } }
    // ship (center, tilts with roll)
    g.save(); g.translate(W / 2, H / 2 + 70); g.rotate(roll * 0.4);
    g.fillStyle = '#e6e9ef'; g.beginPath(); g.moveTo(0, -16); g.lineTo(14, 12); g.lineTo(0, 6); g.lineTo(-14, 12); g.closePath(); g.fill();
    g.fillStyle = '#4c8dff'; g.fillRect(-2, -10, 4, 14); g.restore();
    // target reticle showing player world pos
    g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 1; g.beginPath(); g.arc(W / 2, H / 2, 3, 0, 6.283); g.stroke();
  }
  function over() { running = false; if (window.__tkScore) window.__tkScore(score); draw(); msg('Tamat — skor ' + score + '. Tekan Terbang lagi.'); document.getElementById('start').textContent = 'Terbang Semula'; }
  function loop() { if (!running) return; step(); if (running) draw(); requestAnimationFrame(loop); }
  function start() { if (running) return; reset(); running = true; msg('Jaga nyawa — lalu setiap cincin!'); document.getElementById('start').textContent = 'Terbang'; requestAnimationFrame(loop); }
  document.getElementById('start').addEventListener('click', start);

  const KM = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd', KeyA: 'l', KeyD: 'r', KeyW: 'u', KeyS: 'd' };
  window.addEventListener('keydown', (e) => { if (KM[e.code]) { keys[KM[e.code]] = 1; e.preventDefault(); } });
  window.addEventListener('keyup', (e) => { if (KM[e.code]) keys[KM[e.code]] = 0; });
  let tg = null;
  cv.addEventListener('pointerdown', (e) => { tg = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener('pointermove', (e) => { if (!tg || !running) return; const r = cv.getBoundingClientRect(); px = Math.max(-9, Math.min(9, (e.clientX - r.left - r.width / 2) / (r.width / 2) * 9)); py = Math.max(-6, Math.min(6, (e.clientY - r.top - r.height / 2) / (r.height / 2) * 6)); });
  cv.addEventListener('pointerup', () => { tg = null; });
  reset(); draw();
})();
</script>
</body>
</html>
