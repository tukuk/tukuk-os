<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whack-a-Mole — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="25 seconds, nine holes, fast moles and the occasional bomb. Tap what pops up — and learn when to stop.">
<link rel="canonical" href="https://tukuk.org/apps/whack">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:420px; margin:0 auto; padding:12px; text-align:center; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:12px; font-size:.82rem; }
  .hud .stat { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.66rem; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; width:min(340px, 90vw); margin:0 auto; }
  .hole { aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 50% 68%, #2a1d10, #171009 70%); display:flex; align-items:flex-end; justify-content:center; overflow:hidden; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .occ { font-size:2.4rem; transform:translateY(100%); transition:transform .12s ease-out; }
  .hole.up .occ { transform:translateY(8%); }
  #start { margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px 30px; font-weight:700; cursor:pointer; font:inherit; }
  .hint { color:var(--muted); font-size:.78rem; margin-top:8px; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🐹 Whack-a-Mole</h1></header>
<main class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Score</span><b id="hS">0</b></div>
    <div class="stat"><span class="lab">Time</span><b id="hT">25</b></div>
    <div class="stat"><span class="lab">Best</span><b id="hB">0</b></div>
  </div>
  <div class="grid" id="grid"></div>
  <button id="start">Start</button>
  <p class="hint">🐹 +1 · golden 🌟 +3 · 💣 bomb −5 and a shake. Speed rises as the clock falls.</p>
</main>
<script>
(function () {
  'use strict';
  var grid = document.getElementById('grid'), holes = [];
  var score = 0, time = 25, timer = null, popper = null, running = false;
  var best = +(localStorage.getItem('tkwhack-best') || 0);
  document.getElementById('hB').textContent = best;

  for (var i = 0; i < 9; i++) {
    (function () {
      var h = document.createElement('div'); h.className = 'hole';
      var o = document.createElement('div'); o.className = 'occ'; o.textContent = '🐹';
      h.appendChild(o);
      h.addEventListener('pointerdown', function () { whack(h, o); });
      grid.appendChild(h); holes.push({ h: h, o: o, live: false, gold: false, bomb: false });
    })();
  }
  function whack(h, o) {
    if (!running) return;
    var cell = holes.filter(function (c) { return c.h === h; })[0];
    if (!cell.live) return;
    cell.live = false; h.classList.remove('up');
    score += cell.bomb ? -5 : cell.gold ? 3 : 1;
    document.getElementById('hS').textContent = score;
    if (cell.bomb) { document.body.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 180 }); }
  }
  function pop() {
    var free = holes.filter(function (c) { return !c.live; });
    if (!free.length) return;
    var c = free[Math.floor(Math.random() * free.length)];
    c.bomb = Math.random() < 0.16; c.gold = !c.bomb && Math.random() < 0.14;
    c.o.textContent = c.bomb ? '💣' : c.gold ? '🌟' : '🐹';
    c.live = true; c.h.classList.add('up');
    var stay = Math.max(420, 1100 - (25 - time) * 26);
    setTimeout(function () { if (c.live) { c.live = false; c.h.classList.remove('up'); } }, stay);
  }
  function stop() {
    running = false; clearInterval(timer); clearTimeout(popper);
    if (score > best) { best = score; localStorage.setItem('tkwhack-best', best); document.getElementById('hB').textContent = best; }
    document.getElementById('start').textContent = 'Score ' + score + ' — Again';
    holes.forEach(function (c) { c.live = false; c.h.classList.remove('up'); });
  }
  function loop() {
    pop();
    popper = setTimeout(loop, Math.max(280, 700 - (25 - time) * 16));
  }
  document.getElementById('start').addEventListener('click', function () {
    if (running) { stop(); return; }
    score = 0; time = 25; running = true;
    document.getElementById('hS').textContent = 0;
    document.getElementById('hT').textContent = 25;
    this.textContent = 'Stop';
    timer = setInterval(function () {
      time--; document.getElementById('hT').textContent = time;
      if (time <= 0) { stop(); document.getElementById('start').textContent = 'Start'; }
    }, 1000);
    loop();
  });
})();
</script>
</body>
</html>
