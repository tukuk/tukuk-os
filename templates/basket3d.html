<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hoops 3D Shootout — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="A perspective 3D basketball shootout — no libraries, runs offline. Time your release as the marker sweeps across a moving hoop and sink threes on the arcade court.">
<link rel="canonical" href="https://tukuk.org/apps/basket3d">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.15rem; }
  header .back { font-size:.86rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:520px; margin:0 auto; padding:10px; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:8px; font-size:.8rem; }
  .hud .stat { flex:1; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.62rem; text-transform:uppercase; }
  canvas { display:block; width:100%; border-radius:10px; background:#141a24; touch-action:none; }
  .msg { min-height:1.2em; text-align:center; font-weight:700; font-size:1rem; margin-top:8px; color:var(--accent); }
  #start { margin-top:6px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:14px; font-weight:700; cursor:pointer; font:inherit; font-size:1.05rem; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🏀 Hoops 3D Shootout</h1></header>
<div class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Score</span><b id="sc">0</b></div>
    <div class="stat"><span class="lab">Streak</span><b id="st">0</b></div>
    <div class="stat"><span class="lab">Rekod</span><b id="bs">0</b></div>
  </div>
  <canvas id="cv" width="440" height="360"></canvas>
  <div class="msg" id="msg">TAP semasa penunjuk lalu di buaian</div>
  <button id="start">Shoot</button>
</div>
<script>
(() => {
  const W = 440, H = 360, cv = document.getElementById('cv'), g = cv.getContext('2d');
  const hoopY = 96, launchY = H - 46;
  let hoopX, hoopDir = 1, hoopR, aimX, aimDir = 1, score = 0, streak = 0, best = 0, shot = null, running = false, flash = 0, tick = 0;

  function reset() { hoopX = W / 2; hoopR = 30; aimX = W / 2; score = 0; streak = 0; shot = null; hud(); }
  function hud() { document.getElementById('sc').textContent = score; document.getElementById('st').textContent = streak; document.getElementById('bs').textContent = best; }
  function msg(t) { document.getElementById('msg').textContent = t; }

  function tap() {
    if (shot) return;
    const diff = Math.abs(aimX - hoopX);
    let made = 0;
    if (diff <= hoopR * 0.4) made = 3; else if (diff <= hoopR) made = 2;
    flash = 0;
    shot = { fromX: W / 2, toX: aimX, t: 0, dur: 22, made, hoop: hoopX };
    if (made) { score += made; streak++; if (streak > best) best = streak; flash = 10; }
    else { streak = 0; }
    hud();
    if (window.__tkScore) window.__tkScore(score);
  }
  function step() {
    tick++;
    const hs = 0.9 + Math.sin(tick * 0.01) * 0.5;
    hoopX += hoopDir * hs; if (hoopX < 90) hoopDir = 1; if (hoopX > W - 90) hoopDir = -1;
    hoopR = 30 - Math.sin(tick * 0.02) * 8;
    const as = 6 + (score / 60);
    aimX += aimDir * as; if (aimX < 40) aimDir = 1; if (aimX > W - 40) aimDir = -1;
    if (flash) flash--;
    if (shot) { shot.t++; if (shot.t >= shot.dur) shot = null; }
  }
  function draw() {
    const f = g.createLinearGradient(0, 0, 0, H); f.addColorStop(0, '#141a24'); f.addColorStop(1, '#1c2431'); g.fillStyle = f; g.fillRect(0, 0, W, H);
    // court perspective
    g.fillStyle = '#7a4a22'; g.beginPath(); g.moveTo(0, H); g.lineTo(W, H); g.lineTo(W * 0.72, hoopY + 40); g.lineTo(W * 0.28, hoopY + 40); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2;
    for (let i = 1; i < 5; i++) { const t = i / 5, yy = hoopY + 40 + (H - hoopY - 40) * t * t; g.beginPath(); g.moveTo(W / 2 - (120 * (0.3 + t)), yy); g.lineTo(W / 2 + (120 * (0.3 + t)), yy); g.stroke(); }
    // backboard + hoop
    const s = hoopR / 30;
    g.fillStyle = 'rgba(230,233,239,.9)'; g.fillRect(hoopX - 42 * s, hoopY - 52 * s, 84 * s, 40 * s);
    g.strokeStyle = '#c0392b'; g.strokeRect(hoopX - 15 * s, hoopY - 34 * s, 30 * s, 20 * s);
    g.strokeStyle = '#ff8c1a'; g.lineWidth = 4; g.beginPath(); g.ellipse(hoopX, hoopY, hoopR, hoopR * 0.34, 0, 0, 6.283); g.stroke();
    if (flash) { g.strokeStyle = 'rgba(76,217,100,.8)'; g.beginPath(); g.ellipse(hoopX, hoopY, hoopR + 6, hoopR * 0.4, 0, 0, 6.283); g.stroke(); }
    // net
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1; for (let i = -3; i <= 3; i++) { g.beginPath(); g.moveTo(hoopX + i * (hoopR / 3), hoopY); g.lineTo(hoopX + i * (hoopR / 5), hoopY + 22); g.stroke(); }
    // aim marker
    g.strokeStyle = 'rgba(255,82,82,.9)'; g.lineWidth = 2; g.beginPath(); g.moveTo(aimX, H); g.lineTo(aimX, hoopY + 30); g.stroke(); g.beginPath(); g.arc(aimX, hoopY + 30, 6, 0, 6.283); g.stroke();
    // ball (arc)
    let bx = W / 2, by = launchY, r = 13;
    if (shot) { const p = shot.t / shot.dur; bx = shot.fromX + (shot.toX - shot.fromX) * p; by = launchY - (launchY - hoopY) * p - Math.sin(p * Math.PI) * 70; r = 13 - 6 * p; if (shot.made && p > 0.85) { by = hoopY + (p - 0.85) * 200; } }
    g.fillStyle = '#e8892b'; g.beginPath(); g.arc(bx, by, r, 0, 6.283); g.fill(); g.strokeStyle = '#5a2f10'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(bx - r, by); g.lineTo(bx + r, by); g.moveTo(bx, by - r); g.lineTo(bx, by + r); g.stroke();
    if (!running) { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 0, W, H); g.fillStyle = '#fff'; g.font = 'bold 22px system-ui'; g.textAlign = 'center'; g.fillText('🏀 Hoops 3D', W / 2, H / 2 - 10); g.font = '14px system-ui'; g.fillText('Tekan Shoot untuk mula', W / 2, H / 2 + 18); g.textAlign = 'left'; }
  }
  function loop() { if (running) step(); draw(); requestAnimationFrame(loop); }
  function start() { if (running) return; reset(); running = true; msg('Sink it! TAP bila penunjuk atas buaian'); document.getElementById('start').textContent = 'Main Semula'; }

  document.getElementById('start').addEventListener('click', start);
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); if (running) tap(); });
  window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); if (running) tap(); } });
  reset(); loop();
})();
</script>
</body>
</html>
