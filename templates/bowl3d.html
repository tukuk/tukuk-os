<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141024">
<title>Boling 3D Strike</title>
<style id="tk-theme">:root{--bg:#141024;--surface:#1f1838;--text:#f0eaff;--accent:#ffcf3a;}</style>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,'Segoe UI',Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .hidden{display:none!important}
  #themeProbe{position:absolute;width:0;height:0;opacity:0}
  #start,#over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:rgba(10,7,20,.85);backdrop-filter:blur(3px)}
  #start h1,#over h1{font-size:clamp(30px,9vw,58px);font-weight:900;letter-spacing:1px}
  #start h1 em{font-style:normal;color:var(--accent)}
  #start p,#over p{max-width:32em;line-height:1.5;opacity:.82;font-size:14px}
  #stats{font-size:clamp(18px,5vw,30px);font-weight:800}#stats b{color:var(--accent)}
  .cta{background:var(--accent);color:#241a00;border:none;font:inherit;font-weight:800;font-size:17px;padding:14px 30px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px rgba(255,207,58,.35)}
  .cta:active{transform:translateY(2px)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:30em}
  .chip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
  .badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.6px;font-weight:800;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);z-index:6}
  #tap{position:absolute;inset:0;z-index:4;cursor:pointer}
  #prompt{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);z-index:5;font-weight:900;font-size:clamp(18px,5vw,30px);color:var(--accent);text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
  #banner{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);z-index:5;font-weight:900;font-size:clamp(34px,12vw,90px);letter-spacing:2px;opacity:0;pointer-events:none;text-shadow:0 6px 24px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div id="app">
  <canvas id="screen"></canvas>
  <span id="themeProbe" style="color:var(--accent)"></span>
  <div class="badge">🎳 Boling 3D Strike</div>
  <div id="tap"></div>
  <div id="prompt" class="hidden"></div>
  <div id="banner"></div>
  <div id="start">
    <h1>BOLING <em>3D</em></h1>
    <p>Tiga tap untuk setiap balingan: <b>1</b> arahkan (kiri/kanan), <b>2</b> kuasa, <b>3</b> keluk (spin). Lekuk tepat ke poket → <b>STRIKE!</b> 10 frame, skor piawai.</p>
    <button id="play" class="cta">▶ MAIN</button>
    <div class="chips"><span class="chip">Tap = kunci fasa</span><span class="chip">X = strike</span><span class="chip">/ = spare</span></div>
  </div>
  <div id="over" class="hidden">
    <h1 id="overh">🎳 SELESAI</h1>
    <p id="stats"></p>
    <button id="again" class="cta">↻ Main Lagi</button>
  </div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('screen'),g=cv.getContext('2d');
var W=0,H=0,DPR=1;
var BALL_R=0.42,PIN_R=0.26,LANE_X=2.7,START_Y=-6.4,END_Y=2.8;
var RACK=[[0,0],[-0.55,0.95],[0.55,0.95],[-1.1,1.9],[0,1.9],[1.1,1.9],[-1.65,2.85],[-0.55,2.85],[0.55,2.85],[1.65,2.85]];
var state='idle',frame=0,rolls=[],pins=[],ball=null;
var aim=0,power=0,spin=0,marker=0,markerDir=1,settle=0,shake=0;
var running=false,AUDIO=null,pops=[];
function resize(){DPR=Math.min(window.devicePixelRatio||1,1.6);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);g.setTransform(DPR,0,0,DPR,0,0);}
function ac(){if(!AUDIO){try{AUDIO=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AUDIO&&AUDIO.state==='suspended')AUDIO.resume();return AUDIO;}
function tone(f,dur,type,vol){var a=ac();if(!a)return;var t=a.currentTime,o=a.createOscillator(),gn=a.createGain();o.type=type||'sine';o.frequency.value=f;gn.gain.setValueAtTime(vol||0.2,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+dur);}
function clatter(){var a=ac();if(!a)return;var t=a.currentTime,b=a.createBufferSource(),buf=a.createBuffer(1,a.sampleRate*0.25,a.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);b.buffer=buf;var f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2200;f.Q.value=1.2;var gn=a.createGain();gn.gain.value=0.4;b.connect(f);f.connect(gn);gn.connect(a.destination);b.start(t);b.stop(t+0.25);}
function fanfare(){[523,659,784,1046].forEach(function(fr,i){setTimeout(function(){tone(fr,0.25,'square',0.22);},i*90);});}

function resetRack(){pins=[];for(var i=0;i<RACK.length;i++)pins.push({x:RACK[i][0],y:RACK[i][1],ox:RACK[i][0],oy:RACK[i][1],vx:0,vy:0,down:false});}
function standCount(){var c=0;for(var i=0;i<pins.length;i++)if(!pins[i].down)c++;return c;}
function beginRoll(){state='aim';marker=0;markerDir=1;settle=0;ball=null;beforeStanding=standCount();prompt();}

function launch(){
  ball={x:aim*2.0,y:START_Y,vx:0,vy:8+power*10,spin:spin*4.2,gutter:false};
  state='roll';document.getElementById('prompt').classList.add('hidden');
}
function step(dt){
  if(state==='aim'||state==='power'||state==='spin'){
    marker+=markerDir*dt*(state==='power'?1.7:state==='spin'?2.3:1.4);
    if(marker>1){marker=1;markerDir=-1;}if(marker<-1){marker=-1;markerDir=1;}
    return;
  }
  if(state!=='roll'||!ball)return;
  ball.vy*=(1-0.12*dt);ball.vx+=ball.spin*dt;
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(Math.abs(ball.x)>LANE_X&&!ball.gutter){ball.gutter=true;tone(160,0.3,'sawtooth',0.2);}
  if(!ball.gutter){
    for(var i=0;i<pins.length;i++){var p=pins[i];if(p.down)continue;
      var dx=p.x-ball.x,dy=p.y-ball.y,d=Math.hypot(dx,dy);
      if(d<BALL_R+PIN_R){var nx=dx/(d||1e-6),ny=dy/(d||1e-6),sp=Math.hypot(ball.vx,ball.vy);
        p.vx+=nx*sp*0.7+ball.vx*0.25;p.vy+=ny*sp*0.7+ball.vy*0.25;
        ball.vx*=0.72;ball.vy*=0.85;shake=6;clatter();}
    }
  }
  // pin-pin & friction
  for(var a=0;a<pins.length;a++){var pa=pins[a];if(pa.down&&Math.hypot(pa.vx,pa.vy)<0.1)continue;
    pa.x+=pa.vx*dt;pa.y+=pa.vy*dt;pa.vx*=(1-1.6*dt);pa.vy*=(1-1.6*dt);
    if(Math.hypot(pa.x-pa.ox,pa.y-pa.oy)>0.55)pa.down=true;
    for(var b=a+1;b<pins.length;b++){var pb=pins[b];var ddx=pb.x-pa.x,ddy=pb.y-pa.y,dd=Math.hypot(ddx,ddy);
      if(dd<PIN_R*2){var ux=ddx/(dd||1e-6),uy=ddy/(dd||1e-6),rel=(pa.vx-pb.vx)*ux+(pa.vy-pb.vy)*uy;
        if(rel>0){pb.vx+=ux*rel*0.9;pb.vy+=uy*rel*0.9;pa.vx-=ux*rel*0.4;pa.vy-=uy*rel*0.4;}}
    }
  }
  if(shake>0)shake=Math.max(0,shake-dt*30);
  var moving=Math.abs(ball.vy)>0.6||ball.y<END_Y;
  ball.y+=0; // no-op keep structure
  if(ball.y>END_Y+2||Math.hypot(ball.vx,ball.vy)<0.4&&!moving){
    settle+=dt;if(settle>0.6)resolveRoll();
  }
}
// ── logik frame/roll ──
var rollInFrame=0, beforeStanding=10;
function resolveRoll(){
  var knocked=beforeStanding-standCount();
  if(knocked<0)knocked=0;
  rolls.push(knocked);
  if(rollInFrame===0&&knocked===10){banner('STRIKE!','#ff5a5a');fanfare();}
  else if(rollInFrame===1&&standCount()===0){banner('SPARE!','#7cff5a');tone(700,0.3,'triangle',0.25);}
  else if(knocked===0){banner('GUTTER','#8a86a8');tone(140,0.25,'sine',0.16);}
  else tone(440,0.14,'sine',0.16);
  rollInFrame++;
  if(frame<9){ // frame 1..9
    var strike=(rollInFrame===1&&knocked===10);
    if(strike||rollInFrame===2){resetRack();rollInFrame=0;frame++;beginRoll();}
    else beginRoll();
  } else { // frame 10: hingga 3 balingan
    if(rollInFrame===1){if(knocked===10)resetRack();beginRoll();}
    else if(rollInFrame===2){
      var r1=rolls[rolls.length-2],r2=rolls[rolls.length-1];
      if(r1===10||r1+r2===10){resetRack();beginRoll();}
      else finish();
    } else finish();
  }
}
function totalScore(){
  var s=0,i=0;
  while(i<rolls.length){
    if(rolls[i]===10){s+=10+(rolls[i+1]||0)+(rolls[i+2]||0);i+=1;}
    else if((rolls[i]||0)+(rolls[i+1]||0)===10){s+=10+(rolls[i+2]||0);i+=2;}
    else {s+=(rolls[i]||0)+(rolls[i+1]||0);i+=2;}
  }
  return s;
}
function finish(){
  running=false;state='idle';
  var sc=totalScore();
  document.getElementById('overh').textContent=sc>=200?'🏆 LEGEND!':sc>=120?'🎳 Mantap!':'🎳 Selesai';
  document.getElementById('stats').innerHTML='Jumlah skor: <b>'+sc+'</b> / 300';
  document.getElementById('over').classList.remove('hidden');
  document.getElementById('prompt').classList.add('hidden');
  if(window.__tkScore)window.__tkScore(sc);
}
function banner(t,c){var el=document.getElementById('banner');el.textContent=t;el.style.color=c;el.style.transition='none';el.style.opacity='1';el.style.transform='translate(-50%,-50%) scale(1.2)';
  requestAnimationFrame(function(){el.style.transition='opacity 1s ease, transform 1s ease';el.style.opacity='0';el.style.transform='translate(-50%,-50%) scale(1)';});}
function prompt(){var el=document.getElementById('prompt');el.classList.remove('hidden');
  el.textContent=state==='aim'?'TAP: Arahkan':state==='power'?'TAP: Kuasa':state==='spin'?'TAP: Keluk (spin)':'';}

function tap(){
  if(!running)return;
  if(state==='aim'){aim=marker;state='power';prompt();tone(500,0.08,'square',0.14);}
  else if(state==='power'){power=marker;state='spin';prompt();tone(600,0.08,'square',0.14);}
  else if(state==='spin'){spin=marker;launch();tone(300,0.12,'sawtooth',0.18);}
}

// ── render perspektif ──
function depthToY(d){return H*(0.9-d*0.74);}
function halfAt(d){return W*(0.36-(0.36-0.12)*d);}
function mapX(worldX,d){return W/2+(worldX/LANE_X)*halfAt(d);}
function dOfY(y){return Math.max(0,Math.min(1.05,(y-START_Y)/(END_Y-START_Y)));}
function draw(){
  g.setTransform(DPR,0,0,DPR,0,0);
  if(shake>0)g.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  var bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1b1330');bg.addColorStop(1,'#0d0a18');g.fillStyle=bg;g.fillRect(-20,-20,W+40,H+40);
  // lane trapezoid
  var yB=depthToY(0),yT=depthToY(1),hb=halfAt(0),ht=halfAt(1);
  g.fillStyle='#5a3a1c';g.beginPath();g.moveTo(W/2-hb,yB);g.lineTo(W/2+hb,yB);g.lineTo(W/2+ht,yT);g.lineTo(W/2-ht,yT);g.closePath();g.fill();
  // papan kayu jalur
  for(var lk=-2;lk<=2;lk++){var off=lk*0.55;g.strokeStyle='rgba(0,0,0,.18)';g.beginPath();g.moveTo(mapX(off*LANE_X/1.0*0.8,yB*0?0:0)*0+W/2+off*(hb/2.7),yB);g.lineTo(W/2+off*(ht/2.7),yT);g.stroke();}
  // gutter
  g.fillStyle='#241a2e';
  g.beginPath();g.moveTo(W/2-hb,yB);g.lineTo(W/2-hb*1.28,yB);g.lineTo(W/2-ht*1.28,yT);g.lineTo(W/2-ht,yT);g.closePath();g.fill();
  g.beginPath();g.moveTo(W/2+hb,yB);g.lineTo(W/2+hb*1.28,yB);g.lineTo(W/2+ht*1.28,yT);g.lineTo(W/2+ht,yT);g.closePath();g.fill();
  // anak panah panduan
  for(var ar=0;ar<5;ar++){var ax=(ar-2)*0.4,ad=0.42;g.fillStyle='rgba(255,207,58,.25)';g.beginPath();g.moveTo(mapX(ax*LANE_X,ad),depthToY(ad));g.lineTo(mapX(ax*LANE_X,ad)+6,depthToY(ad)+14);g.lineTo(mapX(ax*LANE_X,ad)-6,depthToY(ad)+14);g.closePath();g.fill();}
  // foul line
  g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=3;g.beginPath();g.moveTo(W/2-hb,yB);g.lineTo(W/2+hb,yB);g.stroke();
  // pin
  var ps=pins.map(function(p){return p;}).sort(function(a,b){return a.y-b.y;});
  for(var i=0;i<ps.length;i++){var p=ps[i];if(p.down)continue;var d=dOfY(p.y),rx=mapX(p.x,d),ry=depthToY(d),r=PIN_R*(halfAt(d)/LANE_X)*1.7;
    g.fillStyle='#f6f2ff';g.beginPath();g.ellipse(rx,ry-r*1.4,r*0.5,r*1.5,0,0,7);g.fill();g.fillStyle='#e2453b';g.fillRect(rx-r*0.5,ry-r*1.9,r, r*0.28);}
  // ball
  if(ball){var bd=dOfY(ball.y),bx=mapX(ball.x,bd),by=depthToY(bd),br=BALL_R*(halfAt(bd)/LANE_X)*1.9;
    var grd=g.createRadialGradient(bx-br*0.3,by-br*0.3,br*0.2,bx,by,br);grd.addColorStop(0,'#6a4bff');grd.addColorStop(1,'#180a4a');
    g.fillStyle=grd;g.beginPath();g.arc(bx,by-br*0.2,br,0,7);g.fill();}
  // penanda fasa
  if(state==='aim'||state==='power'||state==='spin'){
    if(state==='aim'){var mx=mapX(marker*2.0,0.02),my=depthToY(0.02);g.fillStyle='#ffcf3a';g.beginPath();g.moveTo(mx,my-10);g.lineTo(mx-9,my+8);g.lineTo(mx+9,my+8);g.closePath();g.fill();}
    var barW=Math.min(320,W*0.7),bx0=W/2-barW/2,by0=H*0.86;
    if(state!=='aim'){
      g.fillStyle='rgba(0,0,0,.4)';g.fillRect(bx0,by0,barW,16);
      var val=marker,col='#7cff5a';g.fillStyle=col;
      if(state==='power')g.fillRect(bx0,by0,barW*(0.5+marker*0.5),16);else g.fillRect(bx0+barW*0.5+marker*barW*0.5-4,by0-4,8,24);
      g.fillStyle='#fff';g.font='700 12px system-ui';g.textAlign='center';g.fillText(state==='power'?'KUASA':'KELUK',W/2,by0-8);
    }
    g.textAlign='left';
  }
  // papan skor ringkas
  g.fillStyle='rgba(0,0,0,.4)';g.fillRect(8,8,Math.min(W-16,360),40);
  g.font='800 13px system-ui';g.textAlign='left';g.fillStyle='#f0eaff';
  var label='Frame '+Math.min(frame+1,10)+'/10   Skor: '+totalScore();
  g.fillText(label,16,33);
  // balingan frame ini
  g.textAlign='right';var last2='';g.fillText(last2,W-16,33);g.textAlign='left';
}
var last=0;
function loop(t){if(!running){return;}var dt=Math.min(0.05,(t-last)/1000||0.016);last=t;step(dt);draw();requestAnimationFrame(loop);}
function play(){
  running=true;state='aim';frame=0;rolls=[];rollInFrame=0;shake=0;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  resetRack();beginRoll();ac();last=performance.now();requestAnimationFrame(loop);
}
document.getElementById('play').addEventListener('click',function(e){e.stopPropagation();play();});
document.getElementById('again').addEventListener('click',function(e){e.stopPropagation();play();});
document.getElementById('tap').addEventListener('pointerdown',function(e){e.preventDefault();tap();});
document.getElementById('tap').addEventListener('keydown',function(){});
window.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();tap();}});
resize();window.addEventListener('resize',resize);
})();
</script>
</body>
</html>
