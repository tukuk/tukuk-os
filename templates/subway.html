<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subway Dash 3D — Endless Runner — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="A premium pseudo-3D 3-lane endless runner: swipe to dodge trains, jump hurdles, slide under signs, grab coin combos, ride hoverboards and jetpacks. Global high-score leaderboard. Plays right in your browser.">
<link rel="canonical" href="https://tukuk.org/apps/subway">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.15rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:460px; margin:0 auto; padding:12px 14px 26px; }
  .hud { display:flex; gap:8px; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:.82rem; color:var(--muted); }
  .hud .stat b { color:var(--text); font-size:1.02rem; }
  .hud .mult { color:#ffd54a; font-weight:700; }
  .hud button { border:1px solid var(--line); background:var(--card,#20263a); color:var(--text); border-radius:8px; padding:4px 9px; font-size:.9rem; cursor:pointer; }
  canvas { display:block; width:100%; border-radius:14px; background:#1a2130; touch-action:none; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .hint { color:var(--muted); font-size:.76rem; margin-top:10px; text-align:center; }
  .lb { margin-top:16px; background:var(--card,#161c2b); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .lb h3 { margin:0 0 8px; font-size:.95rem; display:flex; align-items:center; gap:6px; }
  .lb ol { margin:0; padding-left:22px; color:var(--muted); font-size:.88rem; }
  .lb li b { color:var(--text); }
  .lb .empty { color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🚇 Subway Dash 3D</h1></header>
<div class="wrap">
  <div class="hud">
    <span class="stat">Score <b id="score">0</b></span>
    <span class="stat">Coins <b id="coins">0</b></span>
    <span class="mult" id="mult">×1</span>
    <span class="stat">Best <b id="best">0</b></span>
    <button id="mute" title="Sound on/off">🔊</button>
  </div>
  <canvas id="cv" width="420" height="660"></canvas>
  <p class="hint">Swipe ←/→ change lane · ↑/tap jump · ↓ slide. Dodge trains, hop hurdles, slide under signs. Grab <b>hoverboards 🛹</b>, <b>magnets 🧲</b> & <b>jetpacks 🚀</b>.</p>
  <div class="lb"><h3>🏅 Global Leaderboard</h3><ol id="lboard"></ol><div class="empty" id="lbEmpty">Loading top runners…</div></div>
</div>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const HORIZON = Math.round(H * 0.30), PLAYER_Y = Math.round(H * 0.80);
  const LANE = [-1, 0, 1];
  const LB_GAME = 'subway', BEST_KEY = 'subway-best', NAME_KEY = 'subway-name';
  const $ = (id) => document.getElementById(id);

  // ── pseudo-3D projection: objects start tiny at the horizon, grow toward the player ──
  function proj(laneWorld, p) {                 // p: 0 = far (horizon) … 1 = at player plane
    const q = p * p;                            // ease so near motion reads fast
    const s = 0.14 + 0.86 * q;                  // depth scale
    const y = HORIZON + (PLAYER_Y - HORIZON) * q;
    const x = W / 2 + laneWorld * (10 + 152 * q);
    return { x, y, s };
  }

  let mode = 'ready', dist, coinsN, run, obs, cns, pws, parts, clouds, shake;
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  let mult = 1, combo = 0, last = 0, spawnGap = 0;
  const player = { lane: 1, laneF: 1, jumpT: -1, slideT: -1, shield: 0, magnet: 0, jet: 0 };

  function reset() {
    dist = 0; coinsN = 0; run = 6; mult = 1; combo = 0;
    player.lane = 1; player.laneF = 1; player.jumpT = -1; player.slideT = -1; player.shield = 0; player.magnet = 0; player.jet = 0;
    obs = []; cns = []; pws = []; parts = []; clouds = []; shake = 0; spawnGap = 60;
    for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * (HORIZON - 40), s: 0.4 + Math.random() * 0.8 });
  }
  reset();

  // ── sound (WebAudio, no assets) ──
  let AC = null, muted = localStorage.getItem('subway-mute') === '1';
  $('mute').textContent = muted ? '🔇' : '🔊';
  function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
  function blip(freq, dur, type, vol) {
    if (muted) return; const ac = audio(); if (!ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.value = (vol || 0.14); o.connect(g); g.connect(ac.destination);
      const t = ac.currentTime; o.start(t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.09));
      o.stop(t + (dur || 0.09) + 0.01);
    } catch (e) { /* ignore */ }
  }

  function start() { if (mode === 'dead') reset(); mode = 'play'; audio(); if (AC && AC.state === 'suspended') AC.resume(); blip(520, 0.12, 'triangle', 0.12); }
  function jump() { if (mode === 'play' && player.jumpT < 0 && player.slideT < 0) { player.jumpT = 0; blip(660, 0.08, 'square', 0.1); } }
  function slide() { if (mode === 'play' && player.jumpT < 0) { player.slideT = 0; blip(300, 0.1, 'sawtooth', 0.09); } }
  function moveLane(d) { if (mode === 'play') player.lane = Math.max(0, Math.min(2, player.lane + d)); }

  cv.addEventListener('pointerdown', (e) => {
    if (mode !== 'play') { start(); return; }
    const r = cv.getBoundingClientRect(); cv._sx = e.clientX - r.left; cv._sy = e.clientY - r.top;
  });
  cv.addEventListener('pointerup', (e) => {
    if (cv._sx == null) return;
    const r = cv.getBoundingClientRect();
    const dx = (e.clientX - r.left) - cv._sx, dy = (e.clientY - r.top) - cv._sy; cv._sx = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { jump(); return; }
    if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
    else if (dy < 0) jump(); else slide();
  });
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (mode !== 'play' && (k === ' ' || k === 'Enter')) { start(); return; }
    if (k === 'ArrowLeft' || k === 'a') moveLane(-1);
    else if (k === 'ArrowRight' || k === 'd') moveLane(1);
    else if (k === 'ArrowUp' || k === ' ' || k === 'w') { e.preventDefault(); jump(); }
    else if (k === 'ArrowDown' || k === 's') slide();
  });

  // ── spawning: always leave at least one lane survivable ──
  function spawnRow() {
    const free = Math.floor(Math.random() * 3);
    const kinds = ['train', 'hurdle', 'sign'];
    for (let l = 0; l < 3; l++) {
      if (l === free) continue;
      if (Math.random() < 0.66) obs.push({ lane: l, p: 0, kind: kinds[Math.floor(Math.random() * 3)] });
    }
    if (Math.random() < 0.82) {
      const cl = free, n = 3 + Math.floor(Math.random() * 5);
      for (let i = 0; i < n; i++) cns.push({ lane: cl, p: -i * 0.06, big: Math.random() < 0.12 });
    }
    if (Math.random() < 0.16) {
      const types = ['hover', 'magnet', 'jet'];
      pws.push({ lane: Math.floor(Math.random() * 3), p: 0, kind: types[Math.floor(Math.random() * 3)] });
    }
  }

  function playerJumpY() { return player.jumpT >= 0 ? -Math.sin(player.jumpT / 40 * Math.PI) * 120 : 0; }
  function nearHit(t1, t2, tol) { return t1 > 0.88 && t1 < 1.04 && Math.abs(t2 - player.laneF) < tol; }

  function step(dt) {
    if (mode !== 'play') return;
    const frame = dt / 16.7;
    run = Math.min(16, 6 + dist / 1500);                       // difficulty ramp
    const adv = (run / 1000) * frame;                           // per-frame depth progress
    dist += run * frame;
    mult = 1 + Math.min(4, Math.floor(dist / 1200));            // ×1 … ×5
    spawnGap -= adv * 100; if (spawnGap <= 0) { spawnRow(); spawnGap = Math.max(46, 92 - run * 2.4); }

    player.laneF += (player.lane - player.laneF) * Math.min(1, 0.28 * frame);
    if (player.jumpT >= 0) { player.jumpT += frame; if (player.jumpT > 40) player.jumpT = -1; }
    if (player.slideT >= 0) { player.slideT += frame; if (player.slideT > 30) player.slideT = -1; }
    if (player.shield > 0) player.shield -= dt;
    if (player.magnet > 0) player.magnet -= dt;
    if (player.jet > 0) { player.jet -= dt; if (player.jet < 0) player.jet = 0; }
    if (player.jet > 0) player.jumpT = -1;                       // airborne on jet, ignore jumps

    const pjy = player.jet > 0 ? -150 : playerJumpY();

    // coins (magnet widens lane tolerance & lifts to player)
    cns = cns.filter((c) => {
      c.p += adv;
      const tol = player.magnet > 0 ? 1.3 : 0.55;
      if (nearHit(c.p, c.lane, tol)) {
        coinsN += c.big ? 10 : 1; combo++; burst(proj(c.lane - 1, 1).x, PLAYER_Y + pjy, c.big ? '#ffe680' : '#ffd54a');
        blip(880 + Math.min(6, combo) * 40, 0.05, 'square', 0.08); hud(); return false;
      }
      return c.p < 1.12;
    });

    // power-ups
    pws = pws.filter((w) => {
      w.p += adv;
      if (nearHit(w.p, w.lane, 0.6)) {
        if (w.kind === 'hover') player.shield = 6500;
        else if (w.kind === 'magnet') player.magnet = 6500;
        else if (w.kind === 'jet') player.jet = 4200;
        blip(1000, 0.16, 'triangle', 0.14); toast(w.kind);
        burst(W / 2, PLAYER_Y, '#7cf0c0'); hud(); return false;
      }
      return w.p < 1.12;
    });

    // obstacles
    for (const o of obs) {
      o.p += adv;
      if (player.jet > 0) continue;                              // flying over everything
      if (!(o.p > 0.9 && o.p < 1.04 && Math.abs(o.lane - player.laneF) < 0.5)) continue;
      if (o.kind === 'hurdle' && (player.jumpT >= 8 || player.shield > 0)) continue;
      if (o.kind === 'sign' && (player.slideT >= 0 || player.shield > 0)) continue;
      if (player.shield > 0) { player.shield = 0; o.p = 2; shake = 10; blip(200, 0.18, 'sawtooth', 0.16); break; } // hoverboard absorbs one hit
      return gameOver();
    }
    obs = obs.filter((o) => o.p < 1.2);

    parts = parts.filter((pt) => { pt.x += pt.vx * frame; pt.y += pt.vy * frame; pt.vy += 0.15 * frame; pt.life -= frame; return pt.life > 0; });
    if (shake > 0) shake -= frame;
    hud();
  }
  function burst(x, y, col) { for (let i = 0; i < 10; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 4, life: 20 + Math.random() * 12, col }); }

  let toastTxt = '', toastT = 0;
  function toast(kind) { toastTxt = kind === 'hover' ? '🛹 Hoverboard!' : kind === 'magnet' ? '🧲 Coin Magnet!' : '🚀 Jetpack!'; toastT = 1400; }

  function scoreNow() { return Math.floor(dist / 12) + coinsN * 5; }
  function gameOver() {
    mode = 'dead'; shake = 16; blip(140, 0.3, 'sawtooth', 0.18);
    const sc = scoreNow();
    if (sc > best) { best = sc; localStorage.setItem(BEST_KEY, String(best)); }
    hud(); submitScore(sc);
  }

  // ── rendering ──
  function sky() {
    const cyc = (dist % 6000) / 6000;                            // day → dusk → night cycle
    let top, bot;
    if (cyc < 0.5) { top = '#3a6ea5'; bot = '#8fb8e0'; }          // day
    else if (cyc < 0.75) { top = '#6a3b6e'; bot = '#e08a5a'; }    // dusk
    else { top = '#0b1024'; bot = '#243056'; }                    // night
    const gr = ctx.createLinearGradient(0, 0, 0, HORIZON); gr.addColorStop(0, top); gr.addColorStop(1, bot);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, HORIZON + 2);
    const sunY = HORIZON - 40, sunX = W * 0.78;
    ctx.globalAlpha = cyc > 0.75 ? 0.9 : 1; ctx.fillStyle = cyc > 0.75 ? '#e8eeff' : '#fff2b0';
    ctx.beginPath(); ctx.arc(sunX, sunY, cyc > 0.75 ? 16 : 22, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    // parallax skyline
    ctx.fillStyle = 'rgba(20,26,44,.85)';
    const off = (dist * 0.05) % 40;
    for (let x = -off; x < W; x += 40) { const hh = 24 + ((x * 37) % 60); ctx.fillRect(x, HORIZON - hh, 30, hh); }
    // clouds
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    for (const cl of clouds) { ctx.beginPath(); ctx.ellipse(cl.x, cl.y, 26 * cl.s, 10 * cl.s, 0, 0, 7); ctx.fill(); }
  }
  function road() {
    ctx.fillStyle = '#39415a';
    const lFar = proj(-1.5, 0), rFar = proj(1.5, 0), lNear = proj(-1.5, 1), rNear = proj(1.5, 1);
    ctx.beginPath(); ctx.moveTo(lFar.x, lFar.y); ctx.lineTo(rFar.x, rFar.y); ctx.lineTo(rNear.x, H); ctx.lineTo(lNear.x, H); ctx.closePath(); ctx.fill();
    // side rails
    ctx.strokeStyle = '#5b6688'; ctx.lineWidth = 3;
    for (const e of [-1.5, 1.5]) { const a = proj(e, 0), b = proj(e, 1); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, H); ctx.stroke(); }
    // converging lane dividers (scrolling dashes via cross-ties)
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
    for (const e of [-0.5, 0.5]) { const a = proj(e, 0), b = proj(e, 1); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    const ties = ((dist * 0.02) % 1);
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    for (let k = 0; k < 12; k++) { const p = ((k + ties) / 12); const L = proj(-1.5, p), R = proj(1.5, p); ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(R.x, R.y); ctx.stroke(); }
  }
  function drawCoin(c) {
    const pr = proj(c.lane - 1, c.p);
    const r = (c.big ? 13 : 8) * pr.s;
    ctx.fillStyle = c.big ? '#ffe680' : '#ffd54a'; ctx.beginPath(); ctx.arc(pr.x, pr.y - 10 * pr.s, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#b8860b'; ctx.font = 'bold ' + Math.max(7, 12 * pr.s) + 'px system-ui'; ctx.textAlign = 'center'; ctx.fillText(c.big ? '★' : '$', pr.x, pr.y - 10 * pr.s + r * 0.4);
  }
  function drawPw(w) {
    const pr = proj(LANE[w.lane], w.p); const s = pr.s;
    ctx.save(); ctx.translate(pr.x, pr.y - 14 * s);
    ctx.fillStyle = 'rgba(124,240,192,.25)'; ctx.beginPath(); ctx.arc(0, 0, 20 * s, 0, 7); ctx.fill();
    ctx.font = Math.max(14, 34 * s) + 'px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(w.kind === 'hover' ? '🛹' : w.kind === 'magnet' ? '🧲' : '🚀', 0, 12 * s);
    ctx.restore();
  }
  function drawObs(o) {
    const pr = proj(LANE[o.lane], o.p), s = pr.s;
    if (o.kind === 'train') {
      const w = 92 * s, h = 150 * s, x = pr.x - w / 2, y = pr.y - h * 0.6;
      ctx.fillStyle = '#d84343'; rr(x, y, w, h, 12 * s);
      ctx.fillStyle = '#ffde8a'; ctx.fillRect(x + w * 0.16, y + h * 0.08, w * 0.68, h * 0.16);
      ctx.fillStyle = '#8c2b2b'; ctx.fillRect(x, y + h - 12 * s, w, 12 * s);
    } else if (o.kind === 'hurdle') {
      const w = 84 * s, h = 24 * s; ctx.fillStyle = '#f2a63b'; rr(pr.x - w / 2, pr.y - h, w, h, 6 * s);
      ctx.fillStyle = '#7a4d10'; ctx.fillRect(pr.x - w / 2 + 6 * s, pr.y - h / 2 - 2 * s, w - 12 * s, 4 * s);
    } else { // sign / overhead bar — slide under
      const w = 96 * s, bh = 14 * s; ctx.fillStyle = '#77839a'; ctx.fillRect(pr.x - w / 2, pr.y - 70 * s, w, bh);
      ctx.fillRect(pr.x - w / 2, pr.y - 70 * s, 8 * s, 70 * s); ctx.fillRect(pr.x + w / 2 - 8 * s, pr.y - 70 * s, 8 * s, 70 * s);
      ctx.fillStyle = '#ffcf4a'; ctx.font = 'bold ' + Math.max(8, 12 * s) + 'px system-ui'; ctx.textAlign = 'center'; ctx.fillText('DUCK', pr.x, pr.y - 60 * s);
    }
  }
  function drawPlayer() {
    const pr = proj(player.laneF - 1, 1), baseY = PLAYER_Y + (player.jet > 0 ? -150 : playerJumpY());
    const sliding = player.slideT >= 0, sc = 1;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(pr.x, PLAYER_Y + 16, 22, 8, 0, 0, 7); ctx.fill();
    // auras
    if (player.shield > 0) { ctx.strokeStyle = 'rgba(124,240,192,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(pr.x, baseY - 24, 34, 0, 7); ctx.stroke(); }
    if (player.magnet > 0) { ctx.strokeStyle = 'rgba(120,180,255,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(pr.x, baseY - 24, 44, 0, 7); ctx.stroke(); }
    ctx.save(); ctx.translate(pr.x, baseY);
    if (player.jet > 0) { ctx.fillStyle = '#ff9a3c'; ctx.beginPath(); ctx.moveTo(-8, 20); ctx.lineTo(0, 46); ctx.lineTo(8, 20); ctx.fill(); }
    ctx.fillStyle = '#4c8dff'; ctx.beginPath(); ctx.arc(0, sliding ? -12 : -30, 13 * sc, 0, 7); ctx.fill();
    ctx.fillStyle = '#2f6fd0'; rr(-14, sliding ? -6 : -18, 28, sliding ? 22 : 40, 8);
    ctx.fillStyle = '#ffcf9e'; ctx.beginPath(); ctx.arc(0, sliding ? -13 : -31, 9, 0, 7); ctx.fill();
    ctx.restore();
  }
  function drawOverlays() {
    if (toastT > 0 && mode === 'play') { ctx.fillStyle = 'rgba(124,240,192,.95)'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'center'; ctx.fillText(toastTxt, W / 2, 70); }
    if (mode !== 'play') {
      ctx.fillStyle = 'rgba(8,12,20,.7)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 34px system-ui';
      ctx.fillText(mode === 'ready' ? 'Subway Dash 3D' : 'You crashed!', W / 2, H / 2 - 90);
      if (mode === 'dead') {
        ctx.font = 'bold 22px system-ui'; ctx.fillText('Score ' + scoreNow() + '  ·  Coins ' + coinsN, W / 2, H / 2 - 52);
        ctx.fillStyle = '#ffd54a'; ctx.font = '15px system-ui';
        ctx.fillText('🏅 Best ' + best, W / 2, H / 2 - 26);
      }
      ctx.fillStyle = '#9fb4ff'; ctx.font = '18px system-ui';
      ctx.fillText(mode === 'ready' ? 'Tap / press Space to run' : 'Tap to run again', W / 2, H / 2 + 4);
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '12px system-ui';
      ctx.fillText('Scores are submitted to the global board automatically', W / 2, H / 2 + 30);
    }
  }
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2); if (r < 0) r = 0;
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); ctx.fill();
  }
  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.fillStyle = '#1a2130'; ctx.fillRect(-20, -20, W + 40, H + 40);
    sky(); road();
    // draw far → near for correct overlap
    const list = obs.concat(pws).sort((a, b) => a.p - b.p);
    for (const c of cns.slice().sort((a, b) => a.p - b.p)) drawCoin(c);
    for (const o of list) { if (o.kind && ['hover', 'magnet', 'jet'].includes(o.kind)) drawPw(o); else drawObs(o); }
    drawPlayer();
    // speed streaks at high velocity
    if (run > 10 && mode === 'play') { ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; for (let i = 0; i < 6; i++) { const yy = Math.random() * H; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(14, yy); ctx.moveTo(W, yy); ctx.lineTo(W - 14, yy); ctx.stroke(); } }
    ctx.restore();
    drawOverlays();
  }

  function hud() { $('score').textContent = scoreNow(); $('coins').textContent = coinsN; $('best').textContent = best; $('mult').textContent = '×' + mult; }

  // ── global leaderboard ──
  function lbUrl(path, q) { try { return path + '?' + q; } catch (e) { return path; } }
  function submitScore(sc) {
    try {
      const name = (localStorage.getItem(NAME_KEY) || 'Anon').slice(0, 20);
      fetch(lbUrl('/api/score', 'g=' + encodeURIComponent(LB_GAME) + '&n=' + encodeURIComponent(name) + '&s=' + sc), { cache: 'no-store', keepalive: true }).catch(() => {});
    } catch (e) { /* offline-safe */ }
  }
  function loadBoard() {
    fetch(lbUrl('/api/scores', 'g=' + encodeURIComponent(LB_GAME) + '&limit=8'), { cache: 'no-store' })
      .then((r) => r.json()).then((d) => {
        const arr = (d && d.items) || [];
        const ol = $('lboard'); ol.innerHTML = arr.map((x) => '<li><b>' + esc(x.n) + '</b> — ' + x.s + '</li>').join('');
        $('lbEmpty').style.display = arr.length ? 'none' : 'block';
        if (!arr.length) $('lbEmpty').textContent = 'Be the first to post a score!';
      }).catch(() => { $('lbEmpty').textContent = 'Leaderboard offline.'; });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  $('mute').addEventListener('click', () => { muted = !muted; localStorage.setItem('subway-mute', muted ? '1' : '0'); $('mute').textContent = muted ? '🔇' : '🔊'; if (!muted) blip(600, 0.08, 'triangle', 0.1); });

  // name entry once, then reuse for every future run
  (function () {
    if (!localStorage.getItem(NAME_KEY)) {
      const n = window.prompt('Your runner name for the global leaderboard:', '');
      if (n && n.trim()) localStorage.setItem(NAME_KEY, n.trim().slice(0, 20));
    }
    loadBoard(); hud();
  })();

  (function loop(ts) {
    const dt = Math.min(50, ts - last || 16.7); last = ts;
    if (toastT > 0) toastT -= dt;
    step(dt); draw(); requestAnimationFrame(loop);
  })(0);
})();
</script>
</body>
</html>
