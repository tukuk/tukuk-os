<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pong — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="The original arcade duel: drag your paddle, out-rally the CPU first to 7 points. Ball speeds up every hit.">
<link rel="canonical" href="https://tukuk.org/apps/pong">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.2rem; }
  header .back { font-size:.88rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:420px; margin:0 auto; padding:12px; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:10px; font-size:.82rem; }
  .hud .stat { flex:1; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.66rem; text-transform:uppercase; }
  canvas { display:block; width:100%; border-radius:10px; background:#0c0f16; touch-action:none; }
  #start { margin-top:12px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px; font-weight:700; cursor:pointer; font:inherit; }
  .hint { text-align:center; color:var(--muted); font-size:.78rem; margin-top:8px; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🏓 Pong</h1></header>
<main class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">You</span><b id="hYou">0</b></div>
    <div class="stat"><span class="lab">Rally</span><b id="hRally">0</b></div>
    <div class="stat"><span class="lab">CPU</span><b id="hCpu">0</b></div>
    <div class="stat"><span class="lab">Best</span><b id="hBest">0</b></div>
  </div>
  <canvas id="cvs" width="360" height="520"></canvas>
  <button id="start">Play</button>
  <p class="hint">Drag or move the mouse — first to 7 wins.</p>
</main>
<script>
(function () {
  'use strict';
  var c = document.getElementById('cvs'), x = c.getContext('2d');
  var W = c.width, H = c.height, PH = 70, PW = 10;
  var you = 0, cpu = 0, rally = 0, best = +(localStorage.getItem('tkpong-best') || 0);
  document.getElementById('hBest').textContent = best;
  var py = H - 110, cy = 90, ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 7 }, live = false, over = false;

  function serve(toYou) {
    ball.x = W / 2; ball.y = H / 2;
    ball.vy = (Math.random() * 2 - 1) * 2.4;
    ball.vx = (toYou ? -1 : 1) * (3 + Math.random());
    rally = 0;
  }
  function pointer(ev) {
    var r = c.getBoundingClientRect();
    var t = ev.touches ? ev.touches[0] : ev;
    py = (t.clientY - r.top) / r.height * H - PH / 2;
    py = Math.max(10, Math.min(H - PH - 10, py));
  }
  c.addEventListener('touchmove', function (e) { e.preventDefault(); pointer(e); }, { passive: false });
  c.addEventListener('mousemove', pointer);

  function step() {
    if (!live) return;
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.y < ball.r || ball.y > H - ball.r) ball.vy *= -1;
    // CPU paddle: chases with a small error margin
    var mid = cy + PH / 2;
    cy += Math.max(-4.2, Math.min(4.2, ball.y - mid)) * 0.72;
    cy = Math.max(10, Math.min(H - PH - 10, cy));
    function hitPad(px, pyy, goRight) {
      if (ball.x + ball.r > px && ball.x - ball.r < px + PW &&
          ball.y > pyy - ball.r && ball.y < pyy + PH + ball.r &&
          ((goRight && ball.vx < 0) || (!goRight && ball.vx > 0))) {
        ball.vx = -ball.vx * 1.045;
        ball.vx = Math.max(-7, Math.min(7, ball.vx));
        ball.vy += ((ball.y - (pyy + PH / 2)) / (PH / 2)) * 2.2;
        ball.x = goRight ? px + PW + ball.r : px - ball.r;
        rally++; document.getElementById('hRally').textContent = rally;
      }
    }
    hitPad(24, py, true); hitPad(W - 24 - PW, cy, false);
    if (ball.x < -20) { cpu++; point(false); }
    if (ball.x > W + 20) { you++; point(true); }
  }
  function point(youScored) {
    document.getElementById('hYou').textContent = you;
    document.getElementById('hCpu').textContent = cpu;
    if (you >= 7 || cpu >= 7) {
      live = false; over = true;
      if (you >= 7 && rally > best) { best = rally; localStorage.setItem('tkpong-best', best); }
      document.getElementById('hBest').textContent = best;
      document.getElementById('start').textContent = you >= 7 ? 'You win 🏆 — Play again' : 'CPU wins — Retry';
    } else serve(youScored);
  }
  function draw() {
    x.clearRect(0, 0, W, H);
    x.strokeStyle = 'rgba(255,255,255,.14)'; x.setLineDash([8, 10]);
    x.beginPath(); x.moveTo(W / 2, 0); x.lineTo(W / 2, H); x.stroke(); x.setLineDash([]);
    x.fillStyle = '#4cc2ff'; x.fillRect(24, py, PW, PH);
    x.fillStyle = '#ff6b6b'; x.fillRect(W - 24 - PW, cy, PW, PH);
    x.fillStyle = '#fff'; x.beginPath(); x.arc(ball.x, ball.y, ball.r, 0, 7); x.fill();
    x.fillStyle = 'rgba(255,255,255,.55)'; x.font = '700 30px system-ui'; x.textAlign = 'center';
    x.fillText(cpu, W - 70, 40); x.fillText(you, 70, 40);
  }
  document.getElementById('start').addEventListener('click', function () {
    you = 0; cpu = 0; rally = 0; live = true; over = false;
    document.getElementById('hYou').textContent = 0; document.getElementById('hCpu').textContent = 0;
    this.textContent = 'Playing…'; serve(true);
  });
  (function loop() { step(); draw(); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
