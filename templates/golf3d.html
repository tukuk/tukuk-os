<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d2416">
<title>Golf Mini 3D</title>
<style id="tk-theme">:root{--bg:#0d2416;--surface:#12331f;--text:#eafbe9;--accent:#ffd23f;}</style>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,'Segoe UI',Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .hidden{display:none!important}
  #themeProbe{position:absolute;width:0;height:0;opacity:0}
  #start,#over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:rgba(6,16,10,.86);backdrop-filter:blur(3px)}
  #start h1,#over h1{font-size:clamp(30px,9vw,58px);font-weight:900;letter-spacing:1px}
  #start h1 em{font-style:normal;color:var(--accent)}
  #start p,#over p{max-width:32em;line-height:1.5;opacity:.82;font-size:14px}
  #stats{font-size:clamp(16px,4.4vw,26px);font-weight:800;line-height:1.4}#stats b{color:var(--accent)}
  .cta{background:var(--accent);color:#241a00;border:none;font:inherit;font-weight:800;font-size:17px;padding:14px 30px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px rgba(255,210,63,.35)}
  .cta:active{transform:translateY(2px)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:30em}
  .chip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
  .badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.6px;font-weight:800;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);z-index:6}
  #tap{position:absolute;inset:0;z-index:4;cursor:pointer}
  #prompt{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);z-index:5;font-weight:900;font-size:clamp(16px,4.5vw,26px);color:var(--accent);text-shadow:0 2px 8px rgba(0,0,0,.7);pointer-events:none}
  #banner{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);z-index:5;font-weight:900;font-size:clamp(30px,11vw,80px);letter-spacing:2px;opacity:0;pointer-events:none;text-shadow:0 6px 24px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div id="app">
  <canvas id="screen"></canvas>
  <span id="themeProbe" style="color:var(--accent)"></span>
  <div class="badge">⛳ Golf Mini 3D</div>
  <div id="tap"></div>
  <div id="prompt" class="hidden"></div>
  <div id="banner"></div>
  <div id="start">
    <h1>GOLF <em>3D</em></h1>
    <p>Dua tap per put: <b>1</b> arah (ayunan kiri/kanan), <b>2</b> kuasa. Elak pasir &amp; air, pantul dinding, masukkan bola ke lubang secepat mungkin. 6 lubang — makin sedikit put makin tinggi mata.</p>
    <button id="play" class="cta">▶ MAIN</button>
    <div class="chips"><span class="chip">Tap = arah</span><span class="chip">Tap = kuasa</span><span class="chip">🚩 angin</span><span class="chip">Par 3</span></div>
  </div>
  <div id="over" class="hidden">
    <h1 id="overh">⛳ SELESAI</h1>
    <p id="stats"></p>
    <button id="again" class="cta">↻ Main Lagi</button>
  </div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('screen'),g=cv.getContext('2d');
var W=0,H=0,DPR=1;
var HOLES=[
  {hx:0.5,hy:0.82,wind:0,   block:null,        sand:[0.5,0.5,0.16], water:null},
  {hx:0.68,hy:0.78,wind:0.02,block:[0.42,0.5,0.16,0.06],sand:null,   water:null},
  {hx:0.34,hy:0.8, wind:-0.03,block:null,       sand:[0.5,0.55,0.15], water:[0.66,0.62,0.14]},
  {hx:0.5,hy:0.86,wind:0,   block:[0.5,0.55,0.4,0.05],sand:null,   water:null},
  {hx:0.72,hy:0.72,wind:0.03,block:[0.4,0.6,0.14,0.16],sand:[0.58,0.45,0.13],water:null},
  {hx:0.3,hy:0.84,wind:-0.02,block:[0.5,0.5,0.14,0.2],sand:null,   water:[0.42,0.68,0.13]}
];
var hole=0,strokes=0,total=0,pts=0,par=3;
var state='idle',marker=0,markerDir=1,aim=0,power=0;
var ball={x:0.5,y:0.1,vx:0,vy:0},trail=[],running=false,shake=0,lastPt=null,AUDIO=null;
function resize(){DPR=Math.min(window.devicePixelRatio||1,1.6);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);g.setTransform(DPR,0,0,DPR,0,0);}
function ac(){if(!AUDIO){try{AUDIO=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AUDIO&&AUDIO.state==='suspended')AUDIO.resume();return AUDIO;}
function tone(f,dur,type,vol){var a=ac();if(!a)return;var t=a.currentTime,o=a.createOscillator(),gn=a.createGain();o.type=type||'sine';o.frequency.value=f;gn.gain.setValueAtTime(vol||0.2,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+dur);}
function pop(v,freq,dur,type){var a=ac();if(!a)return;var t=a.currentTime,o=a.createOscillator(),gn=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*0.5,t+dur);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+dur);}
function cheer(){[660,880,990,1320].forEach(function(fr,i){setTimeout(function(){tone(fr,0.2,'triangle',0.2);},i*80);});}

function setupHole(){var hd=HOLES[hole];ball={x:0.5,y:0.08,vx:0,vy:0};trail=[];strokes=0;state='aim';marker=0;markerDir=1;prompt();}
function inRect(x,y,cx,cy,hw,hh){return x>cx-hw&&x<cx+hw&&y>cy-hh&&y<cy+hh;}
function inEll(x,y,cx,cy,r){return Math.hypot(x-cx,y-cy)<r;}
function putt(){
  strokes++;
  var a=(aim)*0.9; // -0.9..0.9 rad condong
  var sp=0.5+power*1.5;
  ball.vx=Math.sin(a)*sp;ball.vy=Math.cos(a)*sp;
  lastPt={x:ball.x,y:ball.y};
  state='roll';document.getElementById('prompt').classList.add('hidden');
  pop(0.2,300,0.12,'square');
}
function step(dt){
  if(state==='aim'||state==='power'){
    marker+=markerDir*dt*(state==='power'?1.5:1.2);
    if(marker>1){marker=1;markerDir=-1;}if(marker<-1){marker=-1;markerDir=1;}
    if(shake>0)shake=Math.max(0,shake-dt*30);
    return;
  }
  if(state!=='roll')return;
  var hd=HOLES[hole];
  var inS=hd.sand&&inEll(ball.x,ball.y,hd.sand[0],hd.sand[1],hd.sand[2]);
  var fr=inS?2.4:0.9;
  ball.vx+=hd.wind*dt;ball.vx*=(1-fr*dt);ball.vy*=(1-fr*dt);
  var px=ball.x,py=ball.y;
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  trail.push({x:ball.x,y:ball.y});if(trail.length>16)trail.shift();
  // dinding tepi & belakang
  if(ball.x<0.02){ball.x=0.02;ball.vx=-ball.vx*0.7;shake=5;pop(0.18,220,0.08,'square');}
  if(ball.x>0.98){ball.x=0.98;ball.vx=-ball.vx*0.7;shake=5;pop(0.18,220,0.08,'square');}
  if(ball.y>0.97){ball.y=0.97;ball.vy=-ball.vy*0.7;shake=5;}
  if(ball.y<0.03){ball.y=0.03;ball.vy=0;}
  // blok (pantul)
  if(hd.block&&inRect(ball.x,ball.y,hd.block[0],hd.block[1],hd.block[2],hd.block[3])){
    var ox=ball.x-hd.block[0],oy=ball.y-hd.block[1];
    if(Math.abs(ox)/hd.block[2]>Math.abs(oy)/hd.block[3]){ball.x=px;ball.vx=-ball.vx*0.7;}else{ball.y=py;ball.vy=-ball.vy*0.7;}
    shake=5;pop(0.18,200,0.08,'square');
  }
  // air (penalti)
  if(hd.water&&inEll(ball.x,ball.y,hd.water[0],hd.water[1],hd.water[2])){
    strokes++;ball.x=lastPt.x;ball.y=lastPt.y;ball.vx=0;ball.vy=0;
    tone(120,0.35,'sawtooth',0.25);shake=8;
    banner('AIR +1','#4aa3ff');finishStroke();return;
  }
  // lubang
  var dh=Math.hypot(ball.x-hd.hx,ball.y-hd.hy);
  if(dh<0.04&&Math.hypot(ball.vx,ball.vy)<1.9){return holed();}
  if(ball.y>hd.hy+0.02){ // lepas ke belakang lubang → brek
    ball.vy*=0.85;
  }
  // berhenti
  if(Math.hypot(ball.vx,ball.vy)<0.03){finishStroke();}
  if(shake>0)shake=Math.max(0,shake-dt*30);
}
function finishStroke(){ // bola berhenti, belum masuk
  if(strokes>=9){banner('LUBANG PENUH','#ff5a5a');holeComplete(9);}
  else {state='aim';marker=0;markerDir=1;prompt();}
}
function holed(){
  if(strokes===1)banner('HOLE-IN-ONE!','#7cff5a');
  else if(strokes===2)banner('BIRDIE!','#7cff5a');
  else if(strokes===3)banner('PAR','#ffd23f');
  else banner('BOGEY +'+(strokes-par),'#ff9a5a');
  cheer();pop(0.25,900,0.2,'triangle');
  holeComplete(strokes);
}
function holeComplete(sc){
  state='score';
  total+=sc;
  var hp=Math.max(0,(par+2-sc))*50;pts+=hp;
  setTimeout(nextHole,900);
  if(window.__tkScore)window.__tkScore(pts);
}
function nextHole(){
  hole++;
  if(hole>=HOLES.length)return finish();
  setupHole();
}
function finish(){
  running=false;state='idle';
  var rel=total-HOLES.length*par;
  var rtxt=rel<0?('<b>'+rel+'</b> bawah par'):(rel===0?'<b>par</b>':('+'+rel+' atas par'));
  document.getElementById('overh').textContent=rel<=0?'🏆 Mantap!':'⛳ Selesai';
  document.getElementById('stats').innerHTML='Mata: <b>'+pts+'</b><br>'+total+' put total · '+rtxt;
  document.getElementById('over').classList.remove('hidden');
  document.getElementById('prompt').classList.add('hidden');
  if(window.__tkScore)window.__tkScore(pts);
}
function banner(t,c){var el=document.getElementById('banner');el.textContent=t;el.style.color=c;el.style.transition='none';el.style.opacity='1';el.style.transform='translate(-50%,-50%) scale(1.2)';
  requestAnimationFrame(function(){el.style.transition='opacity 1.1s ease, transform 1.1s ease';el.style.opacity='0';el.style.transform='translate(-50%,-50%) scale(1)';});}
function prompt(){var el=document.getElementById('prompt');el.classList.remove('hidden');el.textContent=state==='aim'?'TAP: Arah':state==='power'?'TAP: Kuasa':'';}
function tap(){
  if(!running)return;
  if(state==='aim'){aim=marker;state='power';prompt();tone(520,0.07,'square',0.12);}
  else if(state==='power'){power=marker;putt();}
}

// ── render perspektif ──
function mapY(y){return H*(0.94-y*0.8);}
function halfW(y){return W*(0.44-(0.44-0.18)*y);}
function mapX(x,y){return W/2+(x-0.5)*2*halfW(y);}
function sc(y){return (1.1-y);}
function draw(){
  g.setTransform(DPR,0,0,DPR,0,0);
  if(shake>0)g.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  var sky=g.createLinearGradient(0,0,0,H*0.25);sky.addColorStop(0,'#5fa8ff');sky.addColorStop(1,'#bfe4ff');g.fillStyle=sky;g.fillRect(-20,-20,W+40,H*0.22);
  // padang perspektif
  var yB=mapY(0),yT=mapY(1),hbW=halfW(0)*1.05,hTW=halfW(1)*1.05;
  var gr=g.createLinearGradient(0,yT,0,yB);gr.addColorStop(0,'#2f7d3f');gr.addColorStop(1,'#46a85b');g.fillStyle=gr;
  g.beginPath();g.moveTo(W/2-hbW,yB);g.lineTo(W/2+hbW,yB);g.lineTo(W/2+hTW,yT);g.lineTo(W/2-hTW,yT);g.closePath();g.fill();
  var hd=HOLES[hole];
  // air
  if(hd.water){var wy=mapY(hd.water[1]),wx=mapX(hd.water[0],hd.water[1]),wr=hd.water[2]*halfW(hd.water[1])*2;
    g.fillStyle='#2f80c0';g.beginPath();g.ellipse(wx,wy,wr,wr*0.4,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.25)';g.beginPath();g.ellipse(wx,wy-wr*0.08,wr*0.7,wr*0.22,0,0,7);g.fill();}
  // pasir
  if(hd.sand){var sy2=mapY(hd.sand[1]),sx2=mapX(hd.sand[0],hd.sand[1]),sr=hd.sand[2]*halfW(hd.sand[1])*2;
    g.fillStyle='#e4cf94';g.beginPath();g.ellipse(sx2,sy2,sr,sr*0.42,0,0,7);g.fill();}
  // blok
  if(hd.block){var bc=hd.block,by2=mapY(bc[1]),bx2=mapX(bc[0],bc[1]),bw2=bc[2]*halfW(bc[1])*2,bh2=bc[3]*H*0.5;
    g.fillStyle='#8a5a2c';g.fillRect(bx2-bw2,by2-bh2,bw2*2,bh2*2);g.fillStyle='#a97440';g.fillRect(bx2-bw2,by2-bh2,bw2*2,bh2*0.7);}
  // lubang + bendera
  var hy=mapY(hd.hy),hx=mapX(hd.hx,hd.hy),hr=0.05*halfW(hd.hy)*2;
  g.fillStyle='#0c1a0f';g.beginPath();g.ellipse(hx,hy,hr,hr*0.45,0,0,7);g.fill();
  g.strokeStyle='#eee';g.lineWidth=2;g.beginPath();g.moveTo(hx,hy);g.lineTo(hx,hy-H*0.14);g.stroke();
  var wv=hd.wind*3;g.fillStyle='#ff3b3b';g.beginPath();g.moveTo(hx,hy-H*0.14);g.lineTo(hx+ (wv>=0?1:-1)*Math.max(8,Math.abs(wv)*40),hy-H*0.125);g.lineTo(hx,hy-H*0.1);g.closePath();g.fill();
  // trail
  for(var t=0;t<trail.length;t++){var tp=trail[t];g.fillStyle='rgba(255,255,255,'+(t/trail.length*0.25)+')';g.beginPath();g.arc(mapX(tp.x,tp.y),mapY(tp.y),1.5*sc(tp.y),0,7);g.fill();}
  // bola
  var bx3=mapX(ball.x,ball.y),by3=mapY(ball.y),br=6*sc(ball.y);
  g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(bx3,by3+br*0.5,br,br*0.4,0,0,7);g.fill();
  var bgd=g.createRadialGradient(bx3-br*0.3,by3-br*0.3,br*0.2,bx3,by3,br);bgd.addColorStop(0,'#fff');bgd.addColorStop(1,'#cfd6cc');g.fillStyle=bgd;g.beginPath();g.arc(bx3,by3,br,0,7);g.fill();
  // penanda arah/kuasa
  if(state==='aim'){var aa=aim*0.9;var len=H*0.16;var ex=mapX(ball.x,ball.y)+Math.sin(aa)*len,ey=mapY(ball.y)-Math.cos(aa)*len;
    g.strokeStyle='#ffd23f';g.lineWidth=3;g.setLineDash([6,6]);g.beginPath();g.moveTo(bx3,by3);g.lineTo(ex,ey);g.stroke();g.setLineDash([]);
    g.fillStyle='#ffd23f';g.beginPath();g.arc(ex,ey,4,0,7);g.fill();}
  if(state==='power'){var bw=Math.min(300,W*0.7),x0=W/2-bw/2,y0=H*0.9;g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x0,y0,bw,14);g.fillStyle=marker>0.7?'#ff5a5a':'#7cff5a';g.fillRect(x0,y0,bw*(0.5+marker*0.5),14);g.fillStyle='#fff';g.font='700 12px system-ui';g.textAlign='center';g.fillText('KUASA',W/2,y0-6);g.textAlign='left';}
  // HUD
  g.fillStyle='rgba(0,0,0,.45)';g.fillRect(8,8,Math.min(W-16,340),42);
  g.font='800 14px system-ui';g.fillStyle='#eafbe9';g.textAlign='left';
  g.fillText('Lubang '+(hole+1)+'/'+HOLES.length+'   Par '+par+'   Put '+strokes,16,26);
  g.fillStyle='#ffd23f';g.font='800 12px system-ui';g.fillText('Mata '+pts+'   ·   Total '+total,16,44);
}
var last=0;
function loop(t){if(!running){return;}var dt=Math.min(0.05,(t-last)/1000||0.016);last=t;step(dt);draw();requestAnimationFrame(loop);}
function play(){
  running=true;hole=0;total=0;pts=0;shake=0;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  setupHole();ac();last=performance.now();requestAnimationFrame(loop);
}
document.getElementById('play').addEventListener('click',function(e){e.stopPropagation();play();});
document.getElementById('again').addEventListener('click',function(e){e.stopPropagation();play();});
document.getElementById('tap').addEventListener('pointerdown',function(e){e.preventDefault();tap();});
window.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();tap();}});
resize();window.addEventListener('resize',resize);
})();
</script>
</body>
</html>
