<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FPS Strike 3D — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="A first-person 3D shooter built with a software raycaster — no libraries, runs offline. Clear the arena, drop the hostiles, reload and survive the waves.">
<link rel="canonical" href="https://tukuk.org/apps/fps3d">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.15rem; }
  header .back { font-size:.86rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:520px; margin:0 auto; padding:10px; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:8px; font-size:.8rem; }
  .hud .stat { flex:1; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.62rem; text-transform:uppercase; }
  #view { display:block; width:100%; border-radius:10px; background:#10151c; touch-action:none; cursor:crosshair; }
  .msg { min-height:1.1em; text-align:center; color:var(--muted); font-size:.82rem; margin-top:6px; }
  #start { margin-top:8px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px; font-weight:700; cursor:pointer; font:inherit; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>🔫 FPS Strike 3D</h1></header>
<div class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Health</span><b id="hp">100</b></div>
    <div class="stat"><span class="lab">Ammo</span><b id="ammo">30</b></div>
    <div class="stat"><span class="lab">Kills</span><b id="kills">0</b></div>
    <div class="stat"><span class="lab">Wave</span><b id="wave">1</b></div>
  </div>
  <canvas id="view" width="480" height="320"></canvas>
  <div class="msg" id="msg">WASD gerak · mouse/klik = sorok-look · SPASI klik = tembak · R reload</div>
  <button id="start">Mula / Deploy</button>
</div>
<script>
(() => {
  const W = 480, H = 320, cv = document.getElementById('view'), ctx = cv.getContext('2d');
  const MAP = [
    '1111111111111111',
    '10000000000000 1'.replace(/ /g, '0'),
    '10222000200022 1'.replace(/ /g, '0'),
    '1000000020000001',
    '1003300000033001',
    '1000000000000001',
    '1200011111000021',
    '1000010001000001',
    '1000010001000001',
    '1300000000000031',
    '1002220002220001',
    '1000000330000001',
    '1000000000000001',
    '1111111111111111'
  ].map((r) => r.split('').map(Number));
  const MW = MAP[0].length, MH = MAP.length;
  const WC = ['#8a8f99', '#6b7280', '#7c5a3a', '#5a6b7c'];
  let px, py, pa, enemies, zbuf, hp, ammo, mag, kills, wave, running = false, flash = 0, keys = {}, hurt = 0;
  const FOV = 0.66, MAXD = 24;

  function cell(x, y) { if (x < 0 || y < 0 || x >= MW || y >= MH) return 1; return MAP[y | 0][x | 0]; }
  function spawnWave() {
    enemies = [];
    const spots = [[2, 2], [13, 2], [7, 4], [3, 9], [12, 10], [7, 11], [13, 6], [2, 12]];
    const n = Math.min(spots.length, 3 + wave);
    for (let i = 0; i < n; i++) { const [sx, sy] = spots[i]; enemies.push({ x: sx + 0.5, y: sy + 0.5, hp: 1 + ((wave / 3) | 0), alive: true, t: 0 }); }
  }
  function reset() { px = 4.5; py = 5.5; pa = 0; hp = 100; mag = 30; ammo = 90; kills = 0; wave = 1; hurt = 0; spawnWave(); hud(); }
  function hud() { document.getElementById('hp').textContent = Math.max(0, hp | 0); document.getElementById('ammo').textContent = mag; document.getElementById('kills').textContent = kills; document.getElementById('wave').textContent = wave; }

  function losClear(x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0, dist = Math.hypot(dx, dy), steps = dist * 6;
    for (let i = 1; i < steps; i++) { const t = i / steps; if (cell(x0 + dx * t, y0 + dy * t)) return false; }
    return true;
  }
  function fire() {
    if (!running) return;
    if (mag <= 0) { if (ammo > 0) reload(); return; }
    mag--; flash = 6; hud();
    let best = null, bestD = MAXD;
    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = e.x - px, dy = e.y - py, d = Math.hypot(dx, dy);
      let da = Math.atan2(dy, dx) - pa; while (da > Math.PI) da -= 6.283; while (da < -Math.PI) da += 6.283;
      const half = Math.atan2(0.35, d);
      if (Math.abs(da) < half && d < bestD && losClear(px, py, e.x, e.y)) { best = e; bestD = d; }
    }
    if (best) { best.hp--; if (best.hp <= 0) { best.alive = false; kills++; hud(); if (enemies.every((e) => !e.alive)) { wave++; spawnWave(); msg('Arena bersih! Gelombang ' + wave); } } }
  }
  function reload() { const need = 30 - mag, have = Math.min(need, ammo); mag += have; ammo -= have; msg('Reload'); hud(); }

  function tryMove(nx, ny) {
    if (cell(nx + Math.sign(nx - px) * 0.2, py) === 0) px = nx;
    if (cell(px, ny + Math.sign(ny - py) * 0.2) === 0) py = ny;
  }
  function step() {
    const cs = Math.cos(pa), sn = Math.sin(pa), sp = 0.055, rot = 0.045;
    if (keys.a) pa -= rot; if (keys.d) pa += rot;
    if (keys.left) pa -= rot; if (keys.right) pa += rot;
    let mx = 0, my = 0;
    if (keys.w) { mx += cs; my += sn; } if (keys.s) { mx -= cs; my -= sn; }
    if (keys.fwd) { mx += cs; my += sn; } if (keys.bck) { mx -= cs; my -= sn; }
    const ml = Math.hypot(mx, my) || 1; tryMove(px + (mx / ml) * sp, py + (my / ml) * sp);
    for (const e of enemies) {
      if (!e.alive) continue; e.t++;
      const dx = px - e.x, dy = py - e.y, d = Math.hypot(dx, dy);
      if (d < 6 && losClear(e.x, e.y, px, py)) { e.x += (dx / d) * 0.018; e.y += (dy / d) * 0.018; }
      if (d < 0.9 && (e.t % 40) === 0) { hp -= 8; hurt = 8; hud(); if (hp <= 0) return over(); }
    }
    if (flash) flash--; if (hurt) hurt--;
  }

  function castColumn(col) {
    const rayX = (2 * col / W) - 1, rdX = Math.cos(pa) - rayX * FOV * Math.sin(pa), rdY = Math.sin(pa) + rayX * FOV * Math.cos(pa);
    let mapX = px | 0, mapY = py | 0, stepX, stepY, sdX, sdY, side = 0, hit = 0, guard = 0;
    const dDX = Math.abs(1 / (rdX || 1e-6)), dDY = Math.abs(1 / (rdY || 1e-6));
    if (rdX < 0) { stepX = -1; sdX = (px - mapX) * dDX; } else { stepX = 1; sdX = (mapX + 1 - px) * dDX; }
    if (rdY < 0) { stepY = -1; sdY = (py - mapY) * dDY; } else { stepY = 1; sdY = (mapY + 1 - py) * dDY; }
    while (!hit && guard++ < 96) { if (sdX < sdY) { sdX += dDX; mapX += stepX; side = 0; } else { sdY += dDY; mapY += stepY; side = 1; } if (mapX < 0 || mapY < 0 || mapX >= MW || mapY >= MH) { hit = 1; break; } if (MAP[mapY][mapX]) hit = MAP[mapY][mapX]; }
    const perp = side === 0 ? (sdX - dDX) : (sdY - dDY);
    return { dist: Math.max(0.05, perp), side, type: hit || 1 };
  }
  function draw() {
    ctx.fillStyle = '#0c1017'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#3a2f22'; ctx.fillRect(0, H / 2, W, H / 2);
    zbuf = new Float32Array(W);
    for (let col = 0; col < W; col++) {
      const r = castColumn(col); zbuf[col] = r.dist;
      const lh = Math.min(H, (H / r.dist) | 0), top = (H - lh) / 2;
      const base = WC[(r.type - 1) % WC.length];
      const shade = Math.max(0.28, Math.min(1, 2.4 / r.dist)) * (r.side ? 0.72 : 1);
      ctx.fillStyle = tint(base, shade); ctx.fillRect(col, top, 1, lh);
    }
    drawSprites();
    if (flash) { ctx.fillStyle = 'rgba(255,220,120,.18)'; ctx.fillRect(0, 0, W, H); }
    if (hurt) { ctx.fillStyle = 'rgba(200,0,0,' + (hurt / 12) + ')'; ctx.fillRect(0, 0, W, H); }
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(W / 2 - 8, H / 2); ctx.lineTo(W / 2 - 2, H / 2); ctx.moveTo(W / 2 + 2, H / 2); ctx.lineTo(W / 2 + 8, H / 2);
    ctx.moveTo(W / 2, H / 2 - 8); ctx.lineTo(W / 2, H / 2 - 2); ctx.moveTo(W / 2, H / 2 + 2); ctx.lineTo(W / 2, H / 2 + 8); ctx.stroke();
    ctx.fillStyle = mag === 0 ? '#ff5252' : '#e6e9ef'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'right';
    ctx.fillText(mag + ' / ' + ammo, W - 10, H - 12); ctx.textAlign = 'left';
  }
  function tint(hex, s) { const n = parseInt(hex.slice(1), 16); const r = ((n >> 16) & 255) * s, g = ((n >> 8) & 255) * s, b = (n & 255) * s; return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')'; }
  function drawSprites() {
    const dirX = Math.cos(pa), dirY = Math.sin(pa), planeX = -FOV * dirY, planeY = FOV * dirX;
    const invDet = 1 / (planeX * dirY - dirX * planeY);
    const list = enemies.filter((e) => e.alive).map((e) => ({ e, d: (e.x - px) ** 2 + (e.y - py) ** 2 })).sort((a, b) => b.d - a.d);
    for (const it of list) {
      const e = it.e, sx = e.x - px, sy = e.y - py;
      const tX = invDet * (dirY * sx - dirX * sy);
      const tY = invDet * (-planeY * sx + planeX * sy);
      if (tY <= 0.15) continue;
      const screenX = (W / 2) * (1 + tX / tY), size = Math.abs(H / tY), top = H / 2 - size / 2, w = size * 0.5, x = screenX - w / 2;
      const cc = Math.max(0, Math.min(W - 1, Math.round(screenX)));
      if (tY >= zbuf[cc] || screenX < -size || screenX > W + size) continue;
      const sh = Math.max(0.4, Math.min(1, 3 / tY));
      ctx.save(); ctx.beginPath(); ctx.rect(Math.max(0, x), 0, Math.min(W, x + w) - Math.max(0, x), H); ctx.clip();
      ctx.fillStyle = tint('#2b2f38', sh); ctx.fillRect(x + w * 0.28, top + size * 0.36, w * 0.44, size * 0.42);
      ctx.fillStyle = tint('#c0392b', sh); ctx.beginPath(); ctx.arc(x + w / 2, top + size * 0.28, size * 0.11, 0, 6.283); ctx.fill();
      ctx.fillStyle = tint('#3a3f4a', sh); ctx.fillRect(x + w * 0.32, top + size * 0.78, w * 0.13, size * 0.2); ctx.fillRect(x + w * 0.55, top + size * 0.78, w * 0.13, size * 0.2);
      ctx.fillStyle = tint('#111417', sh); ctx.fillRect(x + w * 0.55, top + size * 0.5, w * 0.4, size * 0.06);
      ctx.restore();
    }
  }

  function over() { running = false; if (window.__tkScore) window.__tkScore(kills); draw(); msg('K.O. — ' + kills + ' kill. Tekan Mula untuk cuba lagi.'); document.getElementById('start').textContent = 'Mula Semula'; }
  function msg(t) { document.getElementById('msg').textContent = t; }
  function loop() { if (!running) return; step(); if (running) draw(); requestAnimationFrame(loop); }
  function start() { if (running) { fire(); return; } reset(); running = true; msg('Bertahan! Bersihkan arena.'); document.getElementById('start').textContent = 'Tembak'; requestAnimationFrame(loop); }

  document.getElementById('start').addEventListener('click', start);
  cv.addEventListener('click', () => { if (running && cv.requestPointerLock) cv.requestPointerLock(); });
  document.addEventListener('mousemove', (e) => { if (document.pointerLockElement === cv && running) pa += e.movementX * 0.0026; });
  const KEY = { KeyA: 'a', KeyD: 'd', KeyW: 'w', KeyS: 's', ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'fwd', ArrowDown: 'bck' };
  window.addEventListener('keydown', (e) => { if (KEY[e.code]) keys[KEY[e.code]] = 1; if (e.code === 'Space') { e.preventDefault(); if (running) fire(); else start(); } if (e.code === 'KeyR') reload(); });
  window.addEventListener('keyup', (e) => { if (KEY[e.code]) keys[KEY[e.code]] = 0; });
  let lt = null;
  cv.addEventListener('touchstart', (e) => { lt = e.touches[0]; });
  cv.addEventListener('touchmove', (e) => { if (!lt || !running) return; pa += (e.touches[0].clientX - lt.clientX) * 0.008; lt = e.touches[0]; keys.fwd = 1; e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchend', () => { lt = null; keys.fwd = 0; if (running) fire(); });
  reset(); draw();
})();
</script>
</body>
</html>
