<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Penalty Shootout 3D — Tukuk Games — Tukuk-OS</title>
<meta name="description" content="A perspective 3D penalty shootout — no libraries, runs offline. Time your aim, load the power and beat the diving keeper. Beat your best streak.">
<link rel="canonical" href="https://tukuk.org/apps/soccer3d">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.15rem; }
  header .back { font-size:.86rem; color:var(--muted); text-decoration:none; }
  header .back:hover { color:var(--accent); }
  .wrap { max-width:520px; margin:0 auto; padding:10px; }
  .hud { display:flex; gap:8px; justify-content:space-between; margin-bottom:8px; font-size:.8rem; }
  .hud .stat { flex:1; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .hud .lab { display:block; color:var(--muted); font-size:.62rem; text-transform:uppercase; }
  canvas { display:block; width:100%; border-radius:10px; background:#0b3d1f; touch-action:none; }
  .msg { min-height:1.2em; text-align:center; font-weight:700; font-size:1rem; margin-top:8px; color:var(--accent); }
  #start { margin-top:6px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:14px; font-weight:700; cursor:pointer; font:inherit; font-size:1.05rem; }
</style>
</head>
<body>
<header><a class="back" href="/store">← Store</a><h1>⚽ Penalty Shootout 3D</h1></header>
<div class="wrap">
  <div class="hud">
    <div class="stat"><span class="lab">Gol</span><b id="goal">0</b></div>
    <div class="stat"><span class="lab">Baki</span><b id="left">5</b></div>
    <div class="stat"><span class="lab">Rekod</span><b id="best">0</b></div>
  </div>
  <canvas id="cv" width="440" height="360"></canvas>
  <div class="msg" id="msg">Tekan untuk mula</div>
  <button id="start">Tendang!</button>
</div>
<script>
(() => {
  const W = 440, H = 360, cv = document.getElementById('cv'), g = cv.getContext('2d');
  const gy = 118, gx0 = 118, gx1 = 322, gmid = (gx0 + gx1) / 2, goalHalf = (gx1 - gx0) / 2, barY = 92;
  let aim = 0, aimDir = 1, power = 0, powerDir = 1, phase = 'idle', shot = null, goals = 0, taken = 0, best = 0, keeper = 0, keeperDir = 0, tick = 0;

  function reset() { aim = 0; power = 0; shot = null; goals = 0; taken = 0; phase = 'aim'; msg('Gerakkan sasaran — TAP untuk kunci'); }
  function endRound() { if (taken >= 5) { phase = 'over'; if (goals > best) best = goals; if (window.__tkScore) window.__tkScore(goals * 100); hud(); msg('Selesai! ' + goals + '/5 gol. Tekan Mula.'); document.getElementById('start').textContent = 'Main Semula'; } }

  function tap() {
    if (phase === 'idle' || phase === 'over') { reset(); hud(); return; }
    if (phase === 'aim') { phase = 'power'; msg('Isi kuasa — TAP untuk tendang'); return; }
    if (phase === 'power') {
      const p = power, tx = gmid + aim * goalHalf;
      keeperDir = [-0.7, 0, 0.7][(Math.random() * 3) | 0];
      const zone = aim < -0.34 ? -1 : aim > 0.34 ? 1 : 0;
      const kzone = keeperDir < -0.34 ? -1 : keeperDir > 0.34 ? 1 : 0;
      const high = p > 0.92, weak = p < 0.14;
      let saved = !high && !weak && zone === kzone && Math.abs(aim) < 0.72;
      const result = high ? 'high' : weak ? 'weak' : saved ? 'save' : 'goal';
      shot = { x: W / 2, y: H - 40, t: 0, tx: tx, ty: high ? barY - 24 : (gy + 8), result, dur: 26 };
      phase = 'fly'; taken++; return;
    }
  }
  function step() {
    tick++;
    if (phase === 'aim') { aim += aimDir * 0.028; if (aim > 1) { aim = 1; aimDir = -1; } if (aim < -1) { aim = -1; aimDir = 1; } }
    else if (phase === 'power') { power += powerDir * 0.03; if (power > 1) { power = 1; powerDir = -1; } if (power < 0) { power = 0; powerDir = 1; } }
    else if (phase === 'fly') { shot.t++; if (shot.t >= shot.dur) { if (shot.result === 'goal') goals++; hud(); msg(shot.result === 'goal' ? 'GOL! 🔥' : shot.result === 'save' ? 'SAVED! 🧤' : shot.result === 'high' ? 'Terlalu tinggi!' : 'Kurang kuasa!'); endRound(); if (phase !== 'over') { phase = 'aim'; shot = null; } } }
  }
  function draw() {
    g.fillStyle = '#0b3d1f'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? '#0a381c' : '#0d4423'; g.fillRect(0, gy + i * 42, W, 42); }
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(gmid, H); g.lineTo(gmid, gy); g.stroke();
    g.beginPath(); g.moveTo(70, H); g.lineTo(gx0, gy + 26); g.lineTo(gx1, gy + 26); g.lineTo(W - 70, H); g.stroke();
    g.beginPath(); g.moveTo(20, gy + 60); g.lineTo(W - 20, gy + 60); g.stroke();
    // goal net (perspective box)
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(gx0, barY, gx1 - gx0, gy - barY);
    g.strokeStyle = 'rgba(255,255,255,.35)'; for (let xx = gx0; xx <= gx1; xx += 14) { g.beginPath(); g.moveTo(xx, barY); g.lineTo(xx, gy); g.stroke(); } for (let yy = barY; yy <= gy; yy += 14) { g.beginPath(); g.moveTo(gx0, yy); g.lineTo(gx1, yy); g.stroke(); }
    g.strokeStyle = '#fff'; g.lineWidth = 4; g.strokeRect(gx0, barY, gx1 - gx0, gy - barY);
    // keeper
    const kx = gmid + keeperDir * goalHalf * (phase === 'fly' ? Math.min(1, shot ? shot.t / 12 : 0) : 0.35 * Math.sin(tick * 0.05));
    g.fillStyle = '#f1c40f'; g.fillRect(kx - 12, gy - 40, 24, 40); g.beginPath(); g.arc(kx, gy - 46, 9, 0, 6.283); g.fill();
    g.fillStyle = '#2c3e50'; g.fillRect(kx - 22, gy - 34, 6, 26); g.fillRect(kx + 16, gy - 34, 6, 26);
    // aim marker / power
    if (phase === 'aim' || phase === 'fly') { const mx = gmid + aim * goalHalf; g.strokeStyle = '#ff5252'; g.lineWidth = 2; g.beginPath(); g.moveTo(mx, barY - 6); g.lineTo(mx, gy); g.stroke(); g.beginPath(); g.arc(mx, (barY + gy) / 2, 8, 0, 6.283); g.stroke(); }
    if (phase === 'power') { const mx = gmid + aim * goalHalf; g.strokeStyle = '#ff5252'; g.lineWidth = 2; g.beginPath(); g.moveTo(mx, barY); g.lineTo(mx, gy); g.stroke(); g.fillStyle = '#222'; g.fillRect(20, H - 22, W - 40, 12); g.fillStyle = power > 0.92 ? '#ff5252' : '#4cd964'; g.fillRect(20, H - 22, (W - 40) * power, 12); }
    // ball
    let bx = W / 2, by = H - 40, r = 13;
    if (phase === 'fly' && shot) { const p = shot.t / shot.dur; bx = W / 2 + (shot.tx - W / 2) * p; by = H - 40 - (H - 40 - shot.ty) * p + Math.sin(p * Math.PI) * -30; r = 13 - 8 * p; }
    g.fillStyle = '#fff'; g.beginPath(); g.arc(bx, by, r, 0, 6.283); g.fill(); g.fillStyle = '#111'; for (let a = 0; a < 5; a++) { const ang = a * 1.256 + tick * 0.1; g.fillRect(bx + Math.cos(ang) * r * 0.5 - 1.5, by + Math.sin(ang) * r * 0.5 - 1.5, 3, 3); }
    if (phase === 'over') { g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, W, H); g.fillStyle = '#fff'; g.font = 'bold 26px system-ui'; g.textAlign = 'center'; g.fillText(goals + ' / 5 Gol', W / 2, H / 2); g.textAlign = 'left'; }
  }
  function hud() { document.getElementById('goal').textContent = goals; document.getElementById('left').textContent = Math.max(0, 5 - taken); document.getElementById('best').textContent = best; }
  function msg(t) { document.getElementById('msg').textContent = t; }
  function loop() { step(); draw(); requestAnimationFrame(loop); }

  document.getElementById('start').addEventListener('click', tap);
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); tap(); });
  window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); tap(); } });
  hud(); loop();
})();
</script>
</body>
</html>
